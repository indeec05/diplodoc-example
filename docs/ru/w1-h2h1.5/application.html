                <script type="application/javascript">
                   window.STATIC_CONTENT = false
                   window.__DATA__ = {"data":{"meta":{"metadata":[{"name":"generator","content":"Diplodoc Platform v4.57.7"}]},"assets":[],"headings":[{"title":"Справочник","href":"docs/ru/w1-h2h1.5/application.html#справочник","level":2,"items":[{"title":"Дополнительные параметры инвойса","href":"docs/ru/w1-h2h1.5/application.html#дополнительные-параметры-инвойса","level":3},{"title":"Статусы инвойса","href":"docs/ru/w1-h2h1.5/application.html#статусы-инвойса","level":3},{"title":"Статусы платежа","href":"docs/ru/w1-h2h1.5/application.html#статусы-платежа","level":3},{"title":"Поля платежных инструментов","href":"docs/ru/w1-h2h1.5/application.html#поля-платежных-инструментов","level":3},{"title":"Карточные терминалы","href":"docs/ru/w1-h2h1.5/application.html#карточные-терминалы","level":3},{"title":"Типы доп. авторизации","href":"docs/ru/w1-h2h1.5/application.html#типы-доп.-авторизации","level":3},{"title":"Типы подтверждения операции","href":"docs/ru/w1-h2h1.5/application.html#типы-подтверждения-операции","level":3},{"title":"Карта состояний возврата","href":"docs/ru/w1-h2h1.5/application.html#карта-состояний-возврата","level":3},{"title":"Возможные коды ошибок","href":"docs/ru/w1-h2h1.5/application.html#возможные-коды-ошибок","level":3}]}],"title":"Приложения","includes":[],"html":"<h2 id=\"справочник\"><a href=\"docs/ru/w1-h2h1.5/application.html#справочник\" class=\"yfm-anchor\" aria-hidden=\"true\"><span class=\"visually-hidden\" data-no-index=\"true\">Справочник</span></a>Справочник</h2>\n<h3 id=\"дополнительные-параметры-инвойса\"><a href=\"docs/ru/w1-h2h1.5/application.html#дополнительные-параметры-инвойса\" class=\"yfm-anchor\" aria-hidden=\"true\"><span class=\"visually-hidden\" data-no-index=\"true\">Дополнительные параметры инвойса</span></a>Дополнительные параметры инвойса</h3>\n<table>\n<thead>\n<tr>\n<th style=\"text-align:left\">Поле</th>\n<th style=\"text-align:left\">Описание</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td style=\"text-align:left\">WMI_AUTO_ACCEPT</td>\n<td style=\"text-align:left\"></td>\n</tr>\n<tr>\n<td style=\"text-align:left\">WMI_SUCCESS_URL WMI_FAIL_URL</td>\n<td style=\"text-align:left\">Адреса (URL) страниц интернет-магазина, на которые будет отправлен покупатель после успешной или неуспешной оплаты.</td>\n</tr>\n<tr>\n<td style=\"text-align:left\">WMI_EXPIRED_DATE</td>\n<td style=\"text-align:left\">Срок истечения оплаты. Дата указывается в западно-европейском часовом поясе (UTC+0) и должна быть больше текущей (ISO 8601), например: 2013-10-29T11:39:26.\u000b<strong>Обратите внимание: срок действия счета не может превышать 30 дней с момента выставления!</strong></td>\n</tr>\n<tr>\n<td style=\"text-align:left\">WMI_PTENABLED WMI_PTDISABLED</td>\n<td style=\"text-align:left\">С помощью этих параметров можно управлять доступными способами оплаты. Подробнее в разделе «Выбор доступных способов оплаты».</td>\n</tr>\n<tr>\n<td style=\"text-align:left\">WMI_RECIPIENT_LOGIN</td>\n<td style=\"text-align:left\">Логин плательщика по умолчанию. Значение данного параметра будет автоматически подставляться в поле логина при авторизации. Возможные форматы: электронная почта, номер телефона в международном формате</td>\n</tr>\n<tr>\n<td style=\"text-align:left\">WMI_CUSTOMER_PHONE</td>\n<td style=\"text-align:left\">Номер мобильного телефона плательщика в международном формате. Например, +71234567890. Значение этого поля будет использоваться в следующих целях: автоматически подставляться в формы некоторых способов оплаты; использоваться для определения страны плательщика; использоваться для поиска счетов клиента в банках и системах электронных денег.</td>\n</tr>\n<tr>\n<td style=\"text-align:left\">WMI_CUSTOMER_FIRSTNAME WMI_CUSTOMER_LASTNAME WMI_CUSTOMER_EMAIL</td>\n<td style=\"text-align:left\">Имя, фамилия и e-mail плательщика. Значения данных параметров будут автоматически подставляться в формы некоторых способов оплаты.</td>\n</tr>\n<tr>\n<td style=\"text-align:left\">WMI_CULTURE_ID</td>\n<td style=\"text-align:left\">Язык интерфейса определяется автоматически, но можно задать его: ru-RU — русский; en-US — английский.</td>\n</tr>\n<tr>\n<td style=\"text-align:left\">WMI_AUTO_LOCATION</td>\n<td style=\"text-align:left\">Позволяет показывать пользователю способы оплаты, соответствующие его стране нахождения. 0 — отображаются способы без привязки к стране пользователя; 1 — страна пользователя и отображение способов определяется по IP.</td>\n</tr>\n<tr>\n<td style=\"text-align:left\">WMI_PSP_MERCHANT_ID</td>\n<td style=\"text-align:left\">Идентификатор сабмерчанта (для агрегаторов).</td>\n</tr>\n<tr>\n<td style=\"text-align:left\">WMI_AUTO_ADJUST_AMOUNT</td>\n<td style=\"text-align:left\">Позволяет принимать всю поступившую сумму как достаточную для оплаты инвойса. 1 - отметить инвойс как оплаченный при поступлении любой суммы 0 - ждать поступления полной суммы инвойса</td>\n</tr>\n<tr>\n<td style=\"text-align:left\">WMI_PAYMENT_NO</td>\n<td style=\"text-align:left\">Идентификатор заказа в системе учета интернет-магазина. Значение данного параметра должно быть уникальным для каждого заказа.</td>\n</tr>\n</tbody>\n</table>\n<h3 id=\"статусы-инвойса\"><a href=\"docs/ru/w1-h2h1.5/application.html#статусы-инвойса\" class=\"yfm-anchor\" aria-hidden=\"true\"><span class=\"visually-hidden\" data-no-index=\"true\">Статусы инвойса</span></a>Статусы инвойса</h3>\n<table>\n<thead>\n<tr>\n<th style=\"text-align:left\">Accepted</th>\n<th style=\"text-align:left\">Оплачен</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td style=\"text-align:left\">Canceled</td>\n<td style=\"text-align:left\">Отменен</td>\n</tr>\n<tr>\n<td style=\"text-align:left\">Created</td>\n<td style=\"text-align:left\">Создан</td>\n</tr>\n<tr>\n<td style=\"text-align:left\">Expired</td>\n<td style=\"text-align:left\">Вышел срок действия</td>\n</tr>\n<tr>\n<td style=\"text-align:left\">Processing</td>\n<td style=\"text-align:left\">В процессе подтверждения</td>\n</tr>\n<tr>\n<td style=\"text-align:left\">Received</td>\n<td style=\"text-align:left\">Получен, ожидает принятия</td>\n</tr>\n<tr>\n<td style=\"text-align:left\">Rejected</td>\n<td style=\"text-align:left\">Отвергнут</td>\n</tr>\n<tr>\n<td style=\"text-align:left\">Accepting</td>\n<td style=\"text-align:left\">В процессе зачисления</td>\n</tr>\n<tr>\n<td style=\"text-align:left\">Canceling</td>\n<td style=\"text-align:left\">В процессе отмены</td>\n</tr>\n</tbody>\n</table>\n<h3 id=\"статусы-платежа\"><a href=\"docs/ru/w1-h2h1.5/application.html#статусы-платежа\" class=\"yfm-anchor\" aria-hidden=\"true\"><span class=\"visually-hidden\" data-no-index=\"true\">Статусы платежа</span></a>Статусы платежа</h3>\n<table>\n<thead>\n<tr>\n<th style=\"text-align:left\">Created</th>\n<th style=\"text-align:left\">Создан</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td style=\"text-align:left\">CreateError</td>\n<td style=\"text-align:left\">Произошла ошибка при создании платежа</td>\n</tr>\n<tr>\n<td style=\"text-align:left\">Checked</td>\n<td style=\"text-align:left\">Платеж проверен</td>\n</tr>\n<tr>\n<td style=\"text-align:left\">CheckError</td>\n<td style=\"text-align:left\">Произошла ошибка при проверке платежа</td>\n</tr>\n<tr>\n<td style=\"text-align:left\">AuthRequired</td>\n<td style=\"text-align:left\">Требуется дополнительная авторизация</td>\n</tr>\n<tr>\n<td style=\"text-align:left\">Processing</td>\n<td style=\"text-align:left\">Обрабатывается</td>\n</tr>\n<tr>\n<td style=\"text-align:left\">ProcessError</td>\n<td style=\"text-align:left\">Произошла ошибка при обработке платежа</td>\n</tr>\n<tr>\n<td style=\"text-align:left\">Preauthorized</td>\n<td style=\"text-align:left\">Предавторизован (средства заблокированы на карте клиента)</td>\n</tr>\n<tr>\n<td style=\"text-align:left\">Paid</td>\n<td style=\"text-align:left\">Оплачен</td>\n</tr>\n<tr>\n<td style=\"text-align:left\">Canceled</td>\n<td style=\"text-align:left\">Платеж отменен</td>\n</tr>\n<tr>\n<td style=\"text-align:left\">Error</td>\n<td style=\"text-align:left\">Произошла ошибка</td>\n</tr>\n</tbody>\n</table>\n<h3 id=\"поля-платежных-инструментов\"><a href=\"docs/ru/w1-h2h1.5/application.html#поля-платежных-инструментов\" class=\"yfm-anchor\" aria-hidden=\"true\"><span class=\"visually-hidden\" data-no-index=\"true\">Поля платежных инструментов</span></a>Поля платежных инструментов</h3>\n<table>\n<thead>\n<tr>\n<th style=\"text-align:left\">Поле</th>\n<th style=\"text-align:left\">Описание</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td style=\"text-align:left\"><strong>Общие поля, содержащие информацию о плательщике</strong></td>\n<td style=\"text-align:left\"></td>\n</tr>\n<tr>\n<td style=\"text-align:left\">UserInfoEmail</td>\n<td style=\"text-align:left\">Email плательщика</td>\n</tr>\n<tr>\n<td style=\"text-align:left\">UserPhoneNumber</td>\n<td style=\"text-align:left\">Номер телефона плательщика</td>\n</tr>\n<tr>\n<td style=\"text-align:left\">UserInfoFirstName</td>\n<td style=\"text-align:left\">Имя плательщика</td>\n</tr>\n<tr>\n<td style=\"text-align:left\">UserInfoLastName</td>\n<td style=\"text-align:left\">Фамилия плательщика</td>\n</tr>\n<tr>\n<td style=\"text-align:left\">UserInfoMiddleName</td>\n<td style=\"text-align:left\">Отчество плательщика</td>\n</tr>\n<tr>\n<td style=\"text-align:left\">UserInfoIP</td>\n<td style=\"text-align:left\">IP адрес плательщика</td>\n</tr>\n<tr>\n<td style=\"text-align:left\"><strong>Поля используемые при оплате банковской картой</strong></td>\n<td style=\"text-align:left\"></td>\n</tr>\n<tr>\n<td style=\"text-align:left\">CreditCardNumber</td>\n<td style=\"text-align:left\">PAN</td>\n</tr>\n<tr>\n<td style=\"text-align:left\">CreditCardHolder</td>\n<td style=\"text-align:left\">Имя держателя карты</td>\n</tr>\n<tr>\n<td style=\"text-align:left\">CreditCardExpireDate</td>\n<td style=\"text-align:left\">Срок действия карты</td>\n</tr>\n<tr>\n<td style=\"text-align:left\">CreditCardSecurityCode</td>\n<td style=\"text-align:left\">CVV</td>\n</tr>\n<tr>\n<td style=\"text-align:left\">CreditCardIssuerName</td>\n<td style=\"text-align:left\"></td>\n</tr>\n<tr>\n<td style=\"text-align:left\"><strong>Поля используемые при оплате, ранее привязанной, банковской картой</strong></td>\n<td style=\"text-align:left\"></td>\n</tr>\n<tr>\n<td style=\"text-align:left\">RecurrentCreditCardAuthIP</td>\n<td style=\"text-align:left\">IP адрес плательщика</td>\n</tr>\n<tr>\n<td style=\"text-align:left\">RecurrentCreditCardEmail</td>\n<td style=\"text-align:left\">Email плательщика</td>\n</tr>\n<tr>\n<td style=\"text-align:left\">RecurrentCreditCardAuthSecurityCode</td>\n<td style=\"text-align:left\">CVV</td>\n</tr>\n<tr>\n<td style=\"text-align:left\"><strong>Поля используемые при мобильной коммерции</strong></td>\n<td style=\"text-align:left\"></td>\n</tr>\n<tr>\n<td style=\"text-align:left\">MobileCommercePhoneNumber</td>\n<td style=\"text-align:left\">Номер телефона</td>\n</tr>\n<tr>\n<td style=\"text-align:left\">ConfirmationCode</td>\n<td style=\"text-align:left\">Код подтверждения</td>\n</tr>\n</tbody>\n</table>\n<h3 id=\"карточные-терминалы\"><a href=\"docs/ru/w1-h2h1.5/application.html#карточные-терминалы\" class=\"yfm-anchor\" aria-hidden=\"true\"><span class=\"visually-hidden\" data-no-index=\"true\">Карточные терминалы</span></a>Карточные терминалы</h3>\n<table>\n<thead>\n<tr>\n<th style=\"text-align:left\">Non3Ds</th>\n<th style=\"text-align:left\"></th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td style=\"text-align:left\">Use3Ds</td>\n<td style=\"text-align:left\"></td>\n</tr>\n</tbody>\n</table>\n<h3 id=\"типы-доп.-авторизации\"><a href=\"docs/ru/w1-h2h1.5/application.html#типы-доп.-авторизации\" class=\"yfm-anchor\" aria-hidden=\"true\"><span class=\"visually-hidden\" data-no-index=\"true\">Типы доп. авторизации</span></a>Типы доп. авторизации</h3>\n<table>\n<thead>\n<tr>\n<th style=\"text-align:left\">None</th>\n<th style=\"text-align:left\">Не требуется</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td style=\"text-align:left\">Redirect</td>\n<td style=\"text-align:left\">Необходимо оправить данные HttpForm указанным методом.</td>\n</tr>\n<tr>\n<td style=\"text-align:left\">PayerConfirmation</td>\n<td style=\"text-align:left\">Ожидается действие пользователя, например отправка смс.</td>\n</tr>\n</tbody>\n</table>\n<h3 id=\"типы-подтверждения-операции\"><a href=\"docs/ru/w1-h2h1.5/application.html#типы-подтверждения-операции\" class=\"yfm-anchor\" aria-hidden=\"true\"><span class=\"visually-hidden\" data-no-index=\"true\">Типы подтверждения операции</span></a>Типы подтверждения операции</h3>\n<table>\n<thead>\n<tr>\n<th style=\"text-align:left\">None</th>\n<th style=\"text-align:left\">Не требуется</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td style=\"text-align:left\">EnterOtp</td>\n<td style=\"text-align:left\">Требуется ввод кода подтверждения.</td>\n</tr>\n<tr>\n<td style=\"text-align:left\">SmsUssd</td>\n<td style=\"text-align:left\">Ожидается действие пользователя, например отправка смс.</td>\n</tr>\n</tbody>\n</table>\n<h3 id=\"карта-состояний-возврата\"><a href=\"docs/ru/w1-h2h1.5/application.html#карта-состояний-возврата\" class=\"yfm-anchor\" aria-hidden=\"true\"><span class=\"visually-hidden\" data-no-index=\"true\">Карта состояний возврата</span></a>Карта состояний возврата</h3>\n<table>\n<thead>\n<tr>\n<th style=\"text-align:left\">StateId</th>\n<th style=\"text-align:left\">Description</th>\n<th style=\"text-align:left\">Next stateId</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td style=\"text-align:left\">Created</td>\n<td style=\"text-align:left\">Создан</td>\n<td style=\"text-align:left\">Accepted     Expired      ProcessError Processing   Rejected</td>\n</tr>\n<tr>\n<td style=\"text-align:left\">Processing</td>\n<td style=\"text-align:left\">Обрабатывается</td>\n<td style=\"text-align:left\">Accepted     Expired      ProcessError Rejected</td>\n</tr>\n<tr>\n<td style=\"text-align:left\">ProcessError</td>\n<td style=\"text-align:left\">Ошибка при обработке</td>\n<td style=\"text-align:left\"></td>\n</tr>\n<tr>\n<td style=\"text-align:left\">Rejected</td>\n<td style=\"text-align:left\">Отменен</td>\n<td style=\"text-align:left\"></td>\n</tr>\n<tr>\n<td style=\"text-align:left\">Accepted</td>\n<td style=\"text-align:left\">Успешный возврат</td>\n<td style=\"text-align:left\"></td>\n</tr>\n<tr>\n<td style=\"text-align:left\">Expired</td>\n<td style=\"text-align:left\">Вышел срок действия</td>\n<td style=\"text-align:left\"></td>\n</tr>\n</tbody>\n</table>\n<h3 id=\"возможные-коды-ошибок\"><a href=\"docs/ru/w1-h2h1.5/application.html#возможные-коды-ошибок\" class=\"yfm-anchor\" aria-hidden=\"true\"><span class=\"visually-hidden\" data-no-index=\"true\">Возможные коды ошибок</span></a>Возможные коды ошибок</h3>\n<p>Это не полный перечень возможных ошибок а лишь часто встречающиеся.</p>\n<table>\n<thead>\n<tr>\n<th style=\"text-align:left\">Код ошибки</th>\n<th style=\"text-align:left\">Описание</th>\n<th style=\"text-align:left\">Комментарий</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td style=\"text-align:left\">INTERNAL_SERVER_ERROR</td>\n<td style=\"text-align:left\">Внутренняя ошибка сервера.</td>\n<td style=\"text-align:left\">При возникновении ошибки данного типа подробности нужно уточнять у технической поддержки WalletOne</td>\n</tr>\n<tr>\n<td style=\"text-align:left\">SERVER_ERROR</td>\n<td style=\"text-align:left\">Внешняя ошибка</td>\n<td style=\"text-align:left\">Возникает при взаимодействии с платежным шлюзом. Пример - сетевая ошибка</td>\n</tr>\n<tr>\n<td style=\"text-align:left\">ARGUMENT_ERROR</td>\n<td style=\"text-align:left\">Неверные параметры запроса</td>\n<td style=\"text-align:left\">Пример - выбранный способ оплаты требует наличия Email, который не был передан.</td>\n</tr>\n<tr>\n<td style=\"text-align:left\">ERROR_OF_PAYMENT_TOOL</td>\n<td style=\"text-align:left\">Ошибка платежного инструмента</td>\n<td style=\"text-align:left\">Пример - неверный номер карты или номер телефона.</td>\n</tr>\n<tr>\n<td style=\"text-align:left\">SUSPECTED_FRAUD</td>\n<td style=\"text-align:left\">Подозрение на мошеничество</td>\n<td style=\"text-align:left\"></td>\n</tr>\n<tr>\n<td style=\"text-align:left\">INSUFFICIENT_BALANCE_ERROR</td>\n<td style=\"text-align:left\">Недостаточно средств</td>\n<td style=\"text-align:left\">На балансе плательщика отсутствует достаточное количество средств для оплаты счета</td>\n</tr>\n<tr>\n<td style=\"text-align:left\">OPERATION_LIMIT_EXCEED</td>\n<td style=\"text-align:left\">Лимит операции</td>\n<td style=\"text-align:left\">Может возникать при превышении допустимого количества операций, суммы операций либо некоторых внутренних ограничений.</td>\n</tr>\n<tr>\n<td style=\"text-align:left\">AUTHORIZATION_ERROR</td>\n<td style=\"text-align:left\">Ошибка авторизации</td>\n<td style=\"text-align:left\"></td>\n</tr>\n</tbody>\n</table>\n<p>[^1]:  Во избежание разночтений для инвойсов намеренно не используется прямой перевод на русский язык в слово “счет”. В терминологии Wallet One и других платежных систем счетом (<em>account</em>) называют сущность, связанную с учетом остатка и отражением финансовых транзакций.</p>\n","leading":false},"router":{"pathname":"docs/ru/w1-h2h1.5/application","depth":4},"lang":"ru","langs":["ru"]};
