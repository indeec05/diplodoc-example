                <script type="application/javascript">
                   window.STATIC_CONTENT = false
                   window.__DATA__ = {"data":{"meta":{"metadata":[{"name":"generator","content":"Diplodoc Platform v4.57.7"}]},"assets":[],"headings":[{"title":"Общие определения","href":"docs/ru/w1-h2h1.5/intro.html#общие-определения","level":2}],"title":"Введение","includes":[],"html":"<p>Данный документ предоставляет описание протокола, предназначенного для host-2-host интеграции интернет магазинов с сервисом <a href=\"https://www.walletone.com/ru/merchant/\" target=\"_blank\" rel=\"noreferrer noopener\">Wallet One Checkout (“Единая касса”)</a>. Интеграция посредством H2H протокола, позволяет осуществлять прием платежей без перехода плательщика на платежные страницы Wallet One, что в свою очередь позволяет более гибко управлять процессом оплаты, а также производить интеграцию в различные устройства, где по каким-либо причинам, невозможно использование традиционной платежной страницы. В документации приведены общие правила составления запросов и разбора ответов, описание всех методов, а также примеры реальных ситуаций, в которых может быть использовано API.</p>\n<h1>Термины и определения</h1>\n<h2 id=\"общие-определения\"><a href=\"docs/ru/w1-h2h1.5/intro.html#общие-определения\" class=\"yfm-anchor\" aria-hidden=\"true\"><span class=\"visually-hidden\" data-no-index=\"true\">Общие определения</span></a>Общие определения</h2>\n<p><strong>Мерчант</strong> - предприятие подключенное к системе Wallet One Checkout, осуществляющее прием платежей в свою пользу (ТСП), либо в пользу третьих лиц (Агрегатор).</p>\n<p><strong>Инвойс (Invoice)[^1]</strong> - сущность, формируемая в учетной системе Wallet One с целью сохранения свойств “заказа”, таких как уникальный идентификатор заказа в системе учета интернет магазина, описание товара/услуги, стоимость, срок оплаты и прочие настройки, влияющие на процесс оплаты.</p>\n<p><strong>Платеж (Payment) -</strong> сущность, формируемая в учетной системе Wallet One для сохранения уникальных свойств каждой попытки оплаты, включая ее статус (ожидает оплаты, успех, ошибка).</p>\n<p><strong>Способ оплаты -</strong> набор процедур по авторизации платежа, объединенный общим сценарием и, как правило, брендом, известным плательщику. Каждому способу оплаты Wallet One присваивается буквенный код из собственного справочника, который в дальнейшем используется при обращениях к API.</p>\n<p>Примеры способов оплаты:</p>\n<ul>\n<li>CreditCardRUB - банковские карты,</li>\n<li>WalletOneRUB - Единый кошелек,</li>\n<li>CashTerminalRUB - платежные терминалы,</li>\n<li>другие.</li>\n</ul>\n<p>Актуальный справочник способов оплаты публикуется на странице <a href=\"https://www.walletone.com/ru/merchant/documentation/#step4\" target=\"_blank\" rel=\"noreferrer noopener\">документации</a>. Обратите внимание, не все способы оплаты поддерживают работу по протоколу Host-2-Host.</p>\n<p><strong>Платежный инструмент</strong> - конкретный счет/учетная запись, в рамках способа оплаты, используемого плательщиком. Например - банковская карта 4111 1111 1111 1111, или номер телефон <em>+7 (912) 345-67-89</em>.</p>\n<p><strong>Авторизация платежа -</strong> набор действий, совершаемых платформой Wallet One с целью списания денежных средств с платежного инструмента и учета их на счету получателя.</p>\n","leading":false},"router":{"pathname":"docs/ru/w1-h2h1.5/intro","depth":4},"lang":"ru","langs":["ru"]};
