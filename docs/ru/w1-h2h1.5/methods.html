href":"docs/ru/w1-h2h1.5/methods.html#оплата-банковской-картой","level":2,"items":[{"title":"Рекуррентные платежи","href":"docs/ru/w1-h2h1.5/methods.html#рекуррентные-платежи","level":3,"items":[{"title":"Привязка платежного инструмента","href":"docs/ru/w1-h2h1.5/methods.html#привязка-платежного-инструмента","level":4},{"title":"Оплата с привязанного платежного инструмента","href":"docs/ru/w1-h2h1.5/methods.html#оплата-с-привязанного-платежного-инструмента","level":4}]},{"title":"Пред-авторизация платежа","href":"docs/ru/w1-h2h1.5/methods.html#пред-авторизация-платежа","level":3,"items":[{"title":"Отложенная оплата (списание денежных средств)","href":"docs/ru/w1-h2h1.5/methods.html#отложенная-оплата-(списание-денежных-средств)","level":4},{"title":"Отложенная оплата (отмена списания денежных средств)","href":"docs/ru/w1-h2h1.5/methods.html#отложенная-оплата-(отмена-списания-денежных-средств)","level":4}]}]},{"title":"Оплата мобильной коммерцией","href":"docs/ru/w1-h2h1.5/methods.html#оплата-мобильной-коммерцией","level":2},{"title":"Оплата Viber кошельком","href":"docs/ru/w1-h2h1.5/methods.html#оплата-viber-кошельком","level":2},{"title":"Оплата Qiwi кошельком","href":"docs/ru/w1-h2h1.5/methods.html#оплата-qiwi-кошельком","level":2},{"title":"Оплата с помощью Яндекс денег","href":"docs/ru/w1-h2h1.5/methods.html#оплата-с-помощью-яндекс-денег","level":2},{"title":"Оплата через Альфа-Клик","href":"docs/ru/w1-h2h1.5/methods.html#оплата-через-альфа-клик","level":2},{"title":"Оплата через банк-клиент Промсвязьбанк","href":"docs/ru/w1-h2h1.5/methods.html#оплата-через-банк-клиент-промсвязьбанк","level":2},{"title":"Возвраты по принятым платежам","href":"docs/ru/w1-h2h1.5/methods.html#возвраты-по-принятым-платежам","level":2}],"title":"Описание методов API","includes":[],"html":"<h2 id=\"получение-списка-способов-оплаты\"><a href=\"docs/ru/w1-h2h1.5/methods.html#получение-списка-способов-оплаты\" class=\"yfm-anchor\" aria-hidden=\"true\"><span class=\"visually-hidden\" data-no-index=\"true\">Получение списка способов оплаты</span></a>Получение списка способов оплаты</h2>\n<p>Метод возвращает доступные на данный момент для интернет магазина способы оплаты.</p>\n<table>\n<thead>\n<tr>\n<th style=\"text-align:left\">GET {baseUrl}/paymentTypes/</th>\n</tr>\n</thead>\n</table>\n<ul>\n<li>currencyId, является необязательным параметром и служит для фильтрации способов оплаты по валюте.</li>\n</ul>\n<p>Пример запроса:</p>\n<table>\n<thead>\n<tr>\n<th style=\"text-align:left\">GET {baseUrl}/paymentTypes/643</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td style=\"text-align:left\">Content-Type: application/json; charset=utf-8 X-Wallet-Signature: 0J7Qv9C70LDRgtCwINC30LDQutCw0LfQsA== X-Wallet-Timestamp: 2015-01-07T21:45:33 X-Wallet-UserId: 119973638979</td>\n</tr>\n</tbody>\n</table>\n<p>Если запрос был обработан без ошибок, API отвечает кодом 200 OK, и возвращает объект содержащий коллекцию доступных способов оплаты:</p>\n<p>Пример ответа:</p>\n<table>\n<thead>\n<tr>\n<th style=\"text-align:left\">HTTP/1.1 200 OK</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td style=\"text-align:left\">{\u000b    \"PaymentTypes\":[\u000b        {\"PaymentTypeId\":\"CreiditCardRub\"},\u000b        {\"PaymentTypeId\":\"CreditCardRUB\"},\u000b        {\"PaymentTypeId\":\"CreditCardAZN\"},\u000b        {\"PaymentTypeId\":\"YandexMoneyRUB\"},\u000b        {\"PaymentTypeId\":\"QiwiWalletRUB\"},\u000b        {\"PaymentTypeId\":\"MtsRUB\"} \u000b    ]\u000b}</td>\n</tr>\n</tbody>\n</table>\n<h2 id=\"создание-инвойса\"><a href=\"docs/ru/w1-h2h1.5/methods.html#создание-инвойса\" class=\"yfm-anchor\" aria-hidden=\"true\"><span class=\"visually-hidden\" data-no-index=\"true\">Создание инвойса</span></a>Создание инвойса</h2>\n<p>Метод создает инвойс с переданными параметрами и резервирует идентификатор платежа.</p>\n<table>\n<thead>\n<tr>\n<th style=\"text-align:left\">POST {baseUrl}/invoices</th>\n</tr>\n</thead>\n</table>\n<p>В теле запроса необходимо передать объект содержащий информацию о сумме заказа и способе оплаты.</p>\n<p>Пример запроса:</p>\n<table>\n<thead>\n<tr>\n<th style=\"text-align:left\">POST {baseUrl}/invoices</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td style=\"text-align:left\">Content-Type: application/json; charset=utf-8 X-Wallet-Signature: 0J7Qv9C70LDRgtCwINC30LDQutCw0LfQsA== X-Wallet-Timestamp: 2015-01-07T21:45:33 X-Wallet-UserId: 119973638979</td>\n</tr>\n<tr>\n<td style=\"text-align:left\">{     \"OrderId\":\"GQYOE-MJNPO-49623\",     \"Amount\":2.91,     \"CurrencyId\":643,     \"PaymentTypeId\":\"MtsRUB\",     \"OrderItems\": [         {             \"Title\": \"Position 1\",             \"Quantity\": 3.000,             \"UnitPrice\": 150.00,             \"SubTotal\": 450.00,             \"TaxType\": \"tax_ru_1\",             \"Tax\": 10.00         },         {             \"Title\": \"Position 2\",             \"Quantity\": 1.000,             \"UnitPrice\": 70.00,             \"SubTotal\": 70.00,             \"TaxType\": \"tax_ru_1\",             \"Tax\": 10.00         }     ],     \"Description\": \"Invoice description\",     \"InvoiceAdditionalParams\": {     } }</td>\n</tr>\n</tbody>\n</table>\n<ul>\n<li>OrderId - уникальный идентификатор заказа на стороне интернет магазина,</li>\n<li>PaymentTypeId - идентификатор способа оплаты,</li>\n<li>OrderItems -  массив товаров, содержащий данные для чека, является обязательным при использовании ККТ,</li>\n<li>InvoiceAdditionalParams - необязательный объект, описывающий дополнительные параметры заказа, полный перечень возможных параметров представлен в справочнике <a href=\"#дополнительные-параметры-инвойса\">Дополнительные параметры инвойса</a>.</li>\n</ul>\n<table>\n<thead>\n<tr>\n<th style=\"text-align:left\">Обратите внимание: при передаче массива OrderItems необходимо дополнительно передать один из параметров WMI_CUSTOMER_PHONE или WMI_CUSTOMER_EMAIL в InvoiceAdditionalParams</th>\n</tr>\n</thead>\n</table>\n<p>Если запрос был обработан без ошибок, API отвечает кодом 200 OK, и возвращает объект содержащий данные о созданном инвойсе и зарезервированном платеже.</p>\n<table>\n<thead>\n<tr>\n<th style=\"text-align:left\">Обратите внимание: в поле OrderId не допускается использование следующих символов: \":\", \"/\", \"?\", \"#\", \"@\" , \";\"</th>\n</tr>\n</thead>\n</table>\n<p>Пример ответа:</p>\n<table>\n<thead>\n<tr>\n<th style=\"text-align:left\">HTTP/1.1 200 OK</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td style=\"text-align:left\">{\u000b    \"Invoice\": {\u000b        \"InvoiceId\":341234567891\u000b        \"Amount\":2.19,\u000b        \"CurrencyId\":643,\u000b        \"InvoiceStateId\":\"Created\",\u000b        \"CreateDate\":\"2014-06-10T09:54:05.033\",\u000b        \"UpdateDate\":\"2014-06-10T09:54:05.033\",\u000b        \"Payment\": {\u000b            \"PaymentId\":123456,\u000b            \"PaymentCode\":\"341234567891,\u000b            \"PaymentCodeType\":\"InvoiceId\"\u000b            \"CreateDate\":\"2014-06-10T09:54:05.033\",\u000b            \"UpdateDate\":\"2014-06-10T09:54:05.033\",\u000b            \"PaymentStateId\":\"Created\"\u000b            \"PaymentTypeId\":\"MtsRUB\",\u000b        }\u000b    }\u000b    \"CanSaveAsExternalAccount\":\"false\"     \"PayerCommissionAmounts\": {\u000b        \"MinCommissionAmount\":0.1,\u000b        \"MaxCommissionAmount\":1.0,\u000b        }\u000b    \"InvoiceUrl\":\"http://.../Index?i=341234567891&amp;m=119973638979\" }</td>\n</tr>\n<tr>\n<td style=\"text-align:left\"></td>\n</tr>\n</tbody>\n</table>\n<ul>\n<li>InvoiceStateId - статус инвойса, полный перечень возможных статусов инвойса, представлен в справочнике <a href=\"#статусы-инвойса\">Статусы инвойса</a>,</li>\n<li>PaymentStateId - статус платежа, полный перечень возможных статусов платежа, представлен в справочнике <a href=\"#статусы-платежа\">Статусы платежа</a>,</li>\n<li>CanSaveAsExternalAccount - флаг, характеризующий возможность сохранения и последующего использования платежного инструмента плательщика, <a href=\"#рекуррентные-платежи\">подробнее</a>.</li>\n<li>PayerCommissionAmounts - объект, отображающий минимальную и максимальную комиссию, которая может быть удержана с плательщика</li>\n<li>InvoiceUrl - ссылка на которую можно перенаправить пользователя для выбора способа и дальнейшей оплаты счета в браузере.</li>\n</ul>\n<h2 id=\"получение-информации-по-инвойсу\"><a href=\"docs/ru/w1-h2h1.5/methods.html#получение-информации-по-инвойсу\" class=\"yfm-anchor\" aria-hidden=\"true\"><span class=\"visually-hidden\" data-no-index=\"true\">Получение информации по инвойсу</span></a>Получение информации по инвойсу</h2>\n<p>Метод возвращает информацию о ранее созданном инвойсе.</p>\n<table>\n<thead>\n<tr>\n<th style=\"text-align:left\">GET {baseUrl}/invoices/{orderId}/</th>\n</tr>\n</thead>\n</table>\n<ul>\n<li>orderId - идентификатор заказа на стороне магазина.</li>\n</ul>\n<p>Пример запроса:</p>\n<table>\n<thead>\n<tr>\n<th style=\"text-align:left\">GET {baseUrl}/invoices/GQYOE-MJNPO-49623/</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td style=\"text-align:left\">Content-Type: application/json; charset=utf-8 X-Wallet-Signature: 0J7Qv9C70LDRgtCwINC30LDQutCw0LfQsA== X-Wallet-Timestamp: 2015-01-07T21:45:33 X-Wallet-UserId: 119973638979</td>\n</tr>\n</tbody>\n</table>\n<p>Если запрос был обработан без ошибок, API отвечает кодом 200 OK, и возвращает объект содержащий информацию об инвойсе и сумме платежей.</p>\n<p>Пример ответа:</p>\n<table>\n<thead>\n<tr>\n<th style=\"text-align:left\">HTTP/1.1 200 OK</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td style=\"text-align:left\">{      \"Invoice\": {         \"InvoiceId\":341234567891,         \"Amount\":30,         \"CurrencyId\":643,         \"InvoiceStateId\":\"Accepted\",         \"CreateDate\":\"2014-06-10T09:54:05.033\",         \"UpdateDate\":\"2014-07-10T09:55:05.033\"             },     \"TotalPaidAmount\": 30 }</td>\n</tr>\n</tbody>\n</table>\n<h2 id=\"получение-списка-платежей-по-инвойсу\"><a href=\"docs/ru/w1-h2h1.5/methods.html#получение-списка-платежей-по-инвойсу\" class=\"yfm-anchor\" aria-hidden=\"true\"><span class=\"visually-hidden\" data-no-index=\"true\">Получение списка платежей по инвойсу</span></a>Получение списка платежей по инвойсу</h2>\n<p>Метод возвращает список платежей по инвойсу.</p>\n<table>\n<thead>\n<tr>\n<th style=\"text-align:left\">GET {baseUrl}/invoices/{orderId}/payments</th>\n</tr>\n</thead>\n</table>\n<ul>\n<li>orderId - идентификатор заказа на стороне магазина.</li>\n</ul>\n<p>Пример запроса:</p>\n<table>\n<thead>\n<tr>\n<th style=\"text-align:left\">GET {baseUrl}/invoices/GQYOE-MJNPO-49623/payments</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td style=\"text-align:left\">Content-Type: application/json; charset=utf-8 X-Wallet-Signature: 0J7Qv9C70LDRgtCwINC30LDQutCw0LfQsA== X-Wallet-Timestamp: 2015-01-07T21:45:33 X-Wallet-UserId: 119973638979</td>\n</tr>\n</tbody>\n</table>\n<p>Если запрос был обработан без ошибок, API отвечает кодом 200 OK, и возвращает коллекцию объектов, содержащих информацию о платеже.</p>\n<p>Пример ответа:</p>\n<table>\n<thead>\n<tr>\n<th style=\"text-align:left\">HTTP/1.1 200 OK</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td style=\"text-align:left\">[\u000b    {\u000b        \"PaymentId\":123456,\u000b        \"Amount\":15.50,\u000b        \"CurrencyId\":643,\u000b        \"PaymentTypeId\": \"CreditCardRUB\",\u000b        \"Date\":\"2014-06-10T09:55:05.033\",\u000b        \"PaymentStateId\":\"Paid\",\u000b        \"SuspenseAmount\": 0\u000b    },\u000b    {\u000b        \"PaymentId\":123457,\u000b        \"Amount\":15,\u000b        \"CurrencyId\":643,\u000b        \"PaymentTypeId\": \"CashTerminalRUB\",\u000b        \"Date\":\"2014-07-10T09:55:05.033\",\u000b        \"PaymentStateId\":\"Paid\",\u000b        \"SuspenseAmount\": 0.5\u000b    }\u000b]</td>\n</tr>\n</tbody>\n</table>\n<ul>\n<li>SuspenseAmount - сумма переплаты по платежу.</li>\n</ul>\n<h2 id=\"зачисление-инвойса\"><a href=\"docs/ru/w1-h2h1.5/methods.html#зачисление-инвойса\" class=\"yfm-anchor\" aria-hidden=\"true\"><span class=\"visually-hidden\" data-no-index=\"true\">Зачисление инвойса</span></a>Зачисление инвойса</h2>\n<table>\n<thead>\n<tr>\n<th style=\"text-align:left\">Обратите внимание: Данный метод используется только если при создании инвойса был передан параметр WMI_AUTO_ACCEPT со значением 0. Требуется согласование с менеджером и наличие определенных настроек на интернет магазине.</th>\n</tr>\n</thead>\n</table>\n<p>Метод подтверждает списание денежных средств с инструмента плательщика и переводит инвойс в конечный статус.</p>\n<table>\n<thead>\n<tr>\n<th style=\"text-align:left\">POST {baseUrl}/invoices/{orderId}/accept</th>\n</tr>\n</thead>\n</table>\n<ul>\n<li>orderId - идентификатор заказа на стороне магазина.</li>\n</ul>\n<p>В случае поддержки частичного зачисления предавторизации возможна передача параметра Amount - новой суммы счёта. При передаче Amount сумма счёта будет изменена на переданную, а сумма платежа скорректирована исходя из новой суммы счёта и размера комиссий.</p>\n<p>Пример запроса:</p>\n<table>\n<thead>\n<tr>\n<th style=\"text-align:left\">POST {baseUrl}/invoices/GQYOE-MJNPO-49623/accept</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td style=\"text-align:left\">Content-Type: application/json; charset=utf-8 X-Wallet-Signature: 0J7Qv9C70LDRgtCwINC30LDQutCw0LfQsA== X-Wallet-Timestamp: 2015-01-07T21:45:33 X-Wallet-UserId: 119973638979</td>\n</tr>\n</tbody>\n</table>\n<p>Если запрос был обработан без ошибок, API отвечает кодом 200 OK, и возвращает объект содержащий информацию об инвойсе и созданных платежах.</p>\n<p>Пример ответа:</p>\n<table>\n<thead>\n<tr>\n<th style=\"text-align:left\">HTTP/1.1 200 OK</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td style=\"text-align:left\">{      \"Invoice\": {         \"InvoiceId\":341234567891,         \"Amount\":10,         \"CurrencyId\":643,         \"InvoiceStateId\":\"Accepted\",         \"CreateDate\":\"2014-06-10T09:54:05.033\",         \"UpdateDate\":\"2014-07-10T09:55:05.033\"             },     \"Payments\" : [         {             \"PaymentId\":123456,             \"Amount\":10,             \"CurrencyId\":643,             \"PaymentTypeId\": \"CreditCardRUB\",             \"Date\":\"2014-06-10T09:55:05.033\",             \"SuspenseAmount\": 0         }     ],     \"TotalPaidAmount\":10 }</td>\n</tr>\n</tbody>\n</table>\n<h2 id=\"отмена-инвойса\"><a href=\"docs/ru/w1-h2h1.5/methods.html#отмена-инвойса\" class=\"yfm-anchor\" aria-hidden=\"true\"><span class=\"visually-hidden\" data-no-index=\"true\">Отмена инвойса</span></a>Отмена инвойса</h2>\n<table>\n<thead>\n<tr>\n<th style=\"text-align:left\">Обратите внимание: Данный метод используется только если при создании инвойса был передан параметр WMI_AUTO_ACCEPT со значением 0. Требуется согласование с менеджером и наличие определенных настроек на интернет магазине.</th>\n</tr>\n</thead>\n</table>\n<p>Метод отменяет списание средств с платежного инструмента плательщика и переводит инвойс в конечный статус.</p>\n<table>\n<thead>\n<tr>\n<th style=\"text-align:left\">POST {baseUrl}/invoices/{orderId}/reject</th>\n</tr>\n</thead>\n</table>\n<ul>\n<li>orderId - идентификатор заказа на стороне магазина.</li>\n</ul>\n<p>Пример запроса:</p>\n<table>\n<thead>\n<tr>\n<th style=\"text-align:left\">POST {baseUrl}/invoices/GQYOE-MJNPO-49623/reject</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td style=\"text-align:left\">Content-Type: application/json; charset=utf-8 X-Wallet-Signature: 0J7Qv9C70LDRgtCwINC30LDQutCw0LfQsA== X-Wallet-Timestamp: 2015-01-07T21:45:33 X-Wallet-UserId: 119973638979</td>\n</tr>\n</tbody>\n</table>\n<p>Если запрос был обработан без ошибок, API отвечает кодом 200 OK, и возвращает объект содержащий информацию об инвойсе и созданных платежах.</p>\n<p>Пример ответа:</p>\n<table>\n<thead>\n<tr>\n<th style=\"text-align:left\">HTTP/1.1 200 OK</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td style=\"text-align:left\">{      \"Invoice\": {         \"InvoiceId\":341234567891,         \"Amount\":30,         \"CurrencyId\":643,         \"InvoiceStateId\":\"Accepted\",         \"CreateDate\":\"2014-06-10T09:54:05.033\",         \"UpdateDate\":\"2014-07-10T09:55:05.033\"             },     \"Payments\" : [         {             \"PaymentId\":123456,             \"Amount\":30,             \"CurrencyId\":643,             \"PaymentTypeId\": \"CreditCardRUB\",             \"Date\":\"2014-06-10T09:55:05.033\",             \"SuspenseAmount\": 0         }     ],     \"TotalPaidAmount\":30 }</td>\n</tr>\n</tbody>\n</table>\n<h2 id=\"проведение-платежа\"><a href=\"docs/ru/w1-h2h1.5/methods.html#проведение-платежа\" class=\"yfm-anchor\" aria-hidden=\"true\"><span class=\"visually-hidden\" data-no-index=\"true\">Проведение платежа</span></a>Проведение платежа</h2>\n<p>Метод инициирует процесс проведения платежа.</p>\n<table>\n<thead>\n<tr>\n<th style=\"text-align:left\">POST {baseUrl}/payments/{paymentId}/process</th>\n</tr>\n</thead>\n</table>\n<ul>\n<li>paymentId - идентификатор платежа, полученный при вызове метода <a href=\"#создание-инвойса\">Создание инвойса</a>.</li>\n</ul>\n<p>Пример запроса:</p>\n<table>\n<thead>\n<tr>\n<th style=\"text-align:left\">POST {baseUrl}/payments/123456/process</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td style=\"text-align:left\">Content-Type: application/json; charset=utf-8 X-Wallet-Signature: 0J7Qv9C70LDRgtCwINC30LDQutCw0LfQsA== X-Wallet-Timestamp: 2015-01-07T21:45:33 X-Wallet-UserId: 119973638979</td>\n</tr>\n<tr>\n<td style=\"text-align:left\">{\u000b    \"AuthData\": {          \"CreditCardNumber\":\"4200000000000000\",\u000b        \"CreditCardHolder\":\"IVAN BUNSHA\",\u000b        \"CreditCardExpireDate\":\"03.2014\",\u000b        \"CreditCardSecurityCode\":\"123\",\u000b        \"UserInfoIP\": \"81.65.247.46\",\u000b        \"UserInfoEmail\": \"BUNSHA@testemail.com\"\u000b    },\u000b    \"SaveAuthData\":\"true\",         \"CustomerId\":\"testUser123987\",            \"CreditCardTerminal\":\"Non3Ds\"                                                                  }</td>\n</tr>\n</tbody>\n</table>\n<ul>\n<li>AuthData - объект, содержащий данные о плательщике и данные платежного инструмента, список возможных полей варьируется от способа оплаты. С полным перечнем возможных полей можно ознакомится в справочнике <a href=\"#поля-платежных-инструментов\">Поля платежных инструментов</a>,</li>\n<li>SaveAuthData - флаг означающий необходимость сохранения данных платежного инструмента, учитывается только при оплате банковской картой,</li>\n<li>CustomerId - идентификатор плательщика на стороне интернет магазина,</li>\n<li>ExternalAccountId - идентификатор ранее сохраненного платежного инструмента, используется при оплате с ранее привязанного платежного инструмента,</li>\n<li>UseSavedAuthData - флаг означающий, нужно ли использовать ранее сохраненный платежный инструмент, будет использован дефолтный,</li>\n<li>CreditCardTerminal - используемый терминал, используется только при оплате с банковской карты, список возможных значений представлен в справочнике <a href=\"#карточные-терминалы\">Карточные терминалы</a>.</li>\n</ul>\n<table>\n<thead>\n<tr>\n<th style=\"text-align:left\">Обратите внимание:  при передачи флага SaveAuthData со значение “True” передача CustomerId является обязательным условием, в противном случае будет сгенерирована ошибка, при использовании ранее привязанного платежного инструмента, передача параметра CustomerId является обязательным условием, в противном случае значения параметров ExternalAccountId и UseSavedAuthData будут игнорироваться, параметры ExternalAccountId и UseSavedAuthData являются взаимоисключающими и при передаче обоих будет учитываться только ExternalAccountId.</th>\n</tr>\n</thead>\n</table>\n<p>Если запрос был обработан без ошибок, API отвечает кодом 200 OK, и возвращает объект содержащий информацию о платеже и требуемой дополнительной авторизации.</p>\n<p>Пример ответа:</p>\n<table>\n<thead>\n<tr>\n<th style=\"text-align:left\">HTTP/1.1 200 OK</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td style=\"text-align:left\">{\u000b    \"Payment\": {\u000b        \"PaymentId\":123456,\u000b        \"Amount\":2.91,\u000b        \"CurrencyId\":643,\u000b        \"CreateDate\":\"2014-06-10T09:54:05.033\",\u000b        \"UpdateDate\":\"2014-06-10T09:54:05.033\",\u000b        \"PaymentStateId\":\"AuthRequired\",\u000b        \"PaymentTypeId\":\"CreditCardRUB\",\u000b        \"PaymentCode\":\"123456789123\",\u000b        \"PaymentCodeType\":\"UserId\",\u000b        \"ExternalAccountId\":245498     },\u000b    \"Authorization\": {\u000b        \"AuthType\":\"Redirect\",         \"PayerConfirmationType\":\"None\",         \"HttpForm\": {\u000b            \"Action\":\"http://superbank.com/auth.php\",\u000b            \"Method\":\"POST\",\u000b            \"Params\":{\u000b                \"PaReq\":\"Nkshk\\uehnkf7LsKNSFEPwqnf[98u23f\",\u000b                \"MD\":\"123456\"\u000b            }\u000b        }\u000b    }\u000b}</td>\n</tr>\n</tbody>\n</table>\n<ul>\n<li>Authorization - объект, возвращаемый в случае если требуется дополнительная авторизация, например прохождение 3Ds,</li>\n<li>AuthType - тип доп. авторизации, с полным перечнем возможных значение можно ознакомиться в справочнике <a href=\"#типы-доп.-авторизации\">Типы доп. авторизации</a>,</li>\n<li>PayerConfirmationType - тип подтверждения, с полным перечнем возможных значение можно ознакомиться в справочнике <a href=\"#типы-доп.-авторизации\">Типы доп. авторизации</a></li>\n</ul>\n<table>\n<thead>\n<tr>\n<th style=\"text-align:left\">Обратите внимание: При наличии параметров в Authorization.HttpForm.Params их нужно также передавать на Authorization.HttpForm.Action</th>\n</tr>\n</thead>\n</table>\n<h2 id=\"получение-информации-по-платежу\"><a href=\"docs/ru/w1-h2h1.5/methods.html#получение-информации-по-платежу\" class=\"yfm-anchor\" aria-hidden=\"true\"><span class=\"visually-hidden\" data-no-index=\"true\">Получение информации по платежу</span></a>Получение информации по платежу</h2>\n<p>Метод возвращает информацию по платежу.</p>\n<table>\n<thead>\n<tr>\n<th style=\"text-align:left\">GET {baseUrl}/payments/</th>\n</tr>\n</thead>\n</table>\n<ul>\n<li>paymentId - идентификатор платежа, полученный при вызове метода <a href=\"#создание-инвойса\">Создание инвойса</a>.</li>\n</ul>\n<p>Пример запроса:</p>\n<table>\n<thead>\n<tr>\n<th style=\"text-align:left\">GET {baseUrl}/payments/123456</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td style=\"text-align:left\">Content-Type: application/json; charset=utf-8 X-Wallet-Signature: 0J7Qv9C70LDRgtCwINC30LDQutCw0LfQsA== X-Wallet-Timestamp: 2015-01-07T21:45:33 X-Wallet-UserId: 119973638979</td>\n</tr>\n</tbody>\n</table>\n<p>Если запрос был обработан без ошибок, API отвечает кодом 200 OK, и возвращает объект содержащий информацию о платеже.</p>\n<p>Пример ответа:</p>\n<table>\n<thead>\n<tr>\n<th style=\"text-align:left\">HTTP/1.1 200 OK</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td style=\"text-align:left\">{\u000b    \"PaymentId\":123456,     \"PaymentCode\":\"345676557987\",     \"PaymentCodeType\":\"invoiceId\",     \"PaymentTypeId\": \"CreditCardRUB\",\u000b    \"Amount\":15.50,\u000b    \"CurrencyId\":643,\u000b    \"CreateDate\":\"2014-06-10T09:55:05.033\",     \"UpdateDate\":\"2014-06-10T09:55:05.033\",\u000b    \"PaymentStateId\":\"Paid\",     \"ExternalAccountId\":1000578,     \"MsterField\":\"411111******1111\",     \"ErrorMessage\":\"\"\u000b}</td>\n</tr>\n</tbody>\n</table>\n<p>Любой успешный запрос, обязательно содержит следующие поля:</p>\n<ul>\n<li>PaymentId,</li>\n<li>PaymentCode,</li>\n<li>PaymentCodeType,</li>\n<li>CreateDate,</li>\n<li>UpdateDate,</li>\n<li>PaymentStateId</li>\n</ul>\n<h2 id=\"создание-запроса-на-осуществление-возврата\"><a href=\"docs/ru/w1-h2h1.5/methods.html#создание-запроса-на-осуществление-возврата\" class=\"yfm-anchor\" aria-hidden=\"true\"><span class=\"visually-hidden\" data-no-index=\"true\">Создание запроса на осуществление возврата</span></a>Создание запроса на осуществление возврата</h2>\n<p>Метод создает заявку на возврат средств по ранее проведенному платежу.</p>\n<table>\n<thead>\n<tr>\n<th style=\"text-align:left\">POST {baseUrl}/payments/{paymentId}/refunds/create</th>\n</tr>\n</thead>\n</table>\n<ul>\n<li>paymentId - идентификатор платежа, полученный при вызове метода <a href=\"#создание-инвойса\">Создание инвойса</a>.</li>\n</ul>\n<p>Пример запроса:</p>\n<table>\n<thead>\n<tr>\n<th style=\"text-align:left\">POST {baseUrl}/payments/123456/refunds/create</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td style=\"text-align:left\">Content-Type: application/json; charset=utf-8 X-Wallet-Signature: 0J7Qv9C70LDRgtCwINC30LDQutCw0LfQsA== X-Wallet-Timestamp: 2015-01-07T21:45:33 X-Wallet-UserId: 119973638979</td>\n</tr>\n<tr>\n<td style=\"text-align:left\"></td>\n</tr>\n</tbody>\n</table>\n<p>Параметр Amount опционален, используется для частичных отмен.</p>\n<p>Если запрос был обработан без ошибок, API отвечает кодом 200 OK, и возвращает объект содержащий информацию о возврате.</p>\n<p>Пример ответа:</p>\n<table>\n<thead>\n<tr>\n<th style=\"text-align:left\">HTTP/1.1 200 OK</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td style=\"text-align:left\"></td>\n</tr>\n</tbody>\n</table>\n<ul>\n<li>StateId - состояние созданного возврата, с полным перечнем возможных значение можно ознакомиться в справочнике <a href=\"#карта-состояний-возврата\">Карта состояний возврата</a>.</li>\n</ul>\n<h2 id=\"получение-информации-о-возврате\"><a href=\"docs/ru/w1-h2h1.5/methods.html#получение-информации-о-возврате\" class=\"yfm-anchor\" aria-hidden=\"true\"><span class=\"visually-hidden\" data-no-index=\"true\">Получение информации о возврате</span></a>Получение информации о возврате</h2>\n<p>Метод возвращает информацию о конкретном возврате.</p>\n<table>\n<thead>\n<tr>\n<th style=\"text-align:left\">GET {baseUrl}/payments/{paymentId}/refunds/</th>\n</tr>\n</thead>\n</table>\n<ul>\n<li>paymentId - идентификатор платежа, полученный при вызове метода <a href=\"#создание-инвойса\">Создание инвойса</a>,</li>\n<li>refundId - идентификатор возврата, полученный при вызове метода <a href=\"#создание-запроса-на-осуществление-возврата\">Создание запроса на осуществление возврата</a>.</li>\n</ul>\n<p>Пример запроса:</p>\n<table>\n<thead>\n<tr>\n<th style=\"text-align:left\">GET {baseUrl}/payments/123456/refunds/10000</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td style=\"text-align:left\">Content-Type: application/json; charset=utf-8 X-Wallet-Signature: 0J7Qv9C70LDRgtCwINC30LDQutCw0LfQsA== X-Wallet-Timestamp: 2015-01-07T21:45:33 X-Wallet-UserId: 119973638979</td>\n</tr>\n</tbody>\n</table>\n<p>Если запрос был обработан без ошибок, API отвечает кодом 200 OK, и возвращает объект содержащий информацию о возврате.</p>\n<p>Пример ответа:</p>\n<table>\n<thead>\n<tr>\n<th style=\"text-align:left\">HTTP/1.1 200 OK</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td style=\"text-align:left\"></td>\n</tr>\n</tbody>\n</table>\n<h2 id=\"получение-информации-о-произведенных-возвратах\"><a href=\"docs/ru/w1-h2h1.5/methods.html#получение-информации-о-произведенных-возвратах\" class=\"yfm-anchor\" aria-hidden=\"true\"><span class=\"visually-hidden\" data-no-index=\"true\">Получение информации о произведенных возвратах</span></a>Получение информации о произведенных возвратах</h2>\n<p>Метод возвращает информацию о всех возвратах созданных по платежу.</p>\n<table>\n<thead>\n<tr>\n<th style=\"text-align:left\">GET {baseUrl}/payments/{paymentId}/refunds</th>\n</tr>\n</thead>\n</table>\n<ul>\n<li>paymentId - идентификатор платежа, полученный при вызове метода <a href=\"#создание-инвойса\">Создание инвойса</a>.</li>\n</ul>\n<p>Пример запроса:</p>\n<table>\n<thead>\n<tr>\n<th style=\"text-align:left\">GET {baseUrl}/payments/123456/refunds</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td style=\"text-align:left\">Content-Type: application/json; charset=utf-8 X-Wallet-Signature: 0J7Qv9C70LDRgtCwINC30LDQutCw0LfQsA== X-Wallet-Timestamp: 2015-01-07T21:45:33 X-Wallet-UserId: 119973638979</td>\n</tr>\n</tbody>\n</table>\n<p>Если запрос был обработан без ошибок, API отвечает кодом 200 OK, и возвращает массив объектов.</p>\n<p>Пример ответа:</p>\n<table>\n<thead>\n<tr>\n<th style=\"text-align:left\">HTTP/1.1 200 OK</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td style=\"text-align:left\">[\u000b    {\u000b        \"RefundId\":10000,\u000b        \"CreateDate\":\"2016-04-22T09:54:05.033\",\u000b        \"UpdateDate\":\"2016-04-22T09:54:05.033\",\u000b        \"Amount\":5.56,\u000b        \"CurrencyId\":643,\u000b        \"Description\":\"Описание/причина\",\u000b        \"StateId\":\"ProcessError\"\u000b    },\u000b    {\u000b        \"RefundId\":10001,\u000b        \"CreateDate\":\"2016-04-23T09:54:05.033\",\u000b        \"UpdateDate\":\"2016-04-23T09:54:05.033\",\u000b        \"Amount\":5.56,\u000b        \"CurrencyId\":643,\u000b        \"Description\":\"Описание/причина\",\u000b        \"StateId\":\"Processing\"\u000b    }\u000b]</td>\n</tr>\n</tbody>\n</table>\n<h2 id=\"получение-списка-платежных-инструментов\"><a href=\"docs/ru/w1-h2h1.5/methods.html#получение-списка-платежных-инструментов\" class=\"yfm-anchor\" aria-hidden=\"true\"><span class=\"visually-hidden\" data-no-index=\"true\">Получение списка платежных инструментов</span></a>Получение списка платежных инструментов</h2>\n<p>Метод возвращает список платежных инструментов по конкретному покупателю.</p>\n<table>\n<thead>\n<tr>\n<th style=\"text-align:left\">GET {baseUrl}/externalaccounts</th>\n</tr>\n</thead>\n</table>\n<p>Пример запроса:</p>\n<table>\n<thead>\n<tr>\n<th style=\"text-align:left\">GET {baseUrl}/externalaccounts</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td style=\"text-align:left\">Content-Type: application/json; charset=utf-8 X-Wallet-Signature: 0J7Qv9C70LDRgtCwINC30LDQutCw0LfQsA== X-Wallet-Timestamp: 2015-01-07T21:45:33 X-Wallet-UserId: 119973638979 X-Wallet-CustomerId: RTC5698365</td>\n</tr>\n</tbody>\n</table>\n<ul>\n<li>X-Wallet-CustomerId - идентификатор покупателя на стороне интернет магазина, является обязательным заголовком.</li>\n</ul>\n<p>Если запрос был обработан без ошибок, API отвечает кодом 200 OK, и возвращает коллекцию привязанных платежных инструментов.</p>\n<p>Пример ответа:</p>\n<table>\n<thead>\n<tr>\n<th style=\"text-align:left\">HTTP/1.1 200 OK</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td style=\"text-align:left\">[\u000b    {\u000b        \"ExternalAccountId\":123456,\u000b        \"PaymentTypeId\": \"CreditCardRUB\",\u000b        \"CurrencyId\":643,\u000b        \"Title\":\"Моя карта\",\u000b        \"MasterField\":\"411111******11\",         \"IsDefault\":\"true\"\u000b    },\u000b    {\u000b        \"ExternalAccountId\":1234546,\u000b        \"PaymentTypeId\": \"CreditCardRUB\",\u000b        \"CurrencyId\":643,\u000b        \"Title\":\"Моя карта 2\",\u000b        \"MasterField\":\"411111******12\",         \"IsDefault\":\"false\"\u000b    },\u000b]</td>\n</tr>\n</tbody>\n</table>\n<h2 id=\"обновление-платежного-инструмента\"><a href=\"docs/ru/w1-h2h1.5/methods.html#обновление-платежного-инструмента\" class=\"yfm-anchor\" aria-hidden=\"true\"><span class=\"visually-hidden\" data-no-index=\"true\">Обновление платежного инструмента</span></a>Обновление платежного инструмента</h2>\n<p>Метод используется для обновления данных сохраненного платежного инструмента.</p>\n<table>\n<thead>\n<tr>\n<th style=\"text-align:left\">PUT {baseUrl}/externalaccounts/</th>\n</tr>\n</thead>\n</table>\n<ul>\n<li>externalAccountId - идентификатор платежного инструмента, полученный при <a href=\"#проведение-платежа\">проведении платежа</a>.</li>\n</ul>\n<p>Пример запроса:</p>\n<table>\n<thead>\n<tr>\n<th style=\"text-align:left\">PUT {baseUrl}/externalaccounts/</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td style=\"text-align:left\">Content-Type: application/json; charset=utf-8 X-Wallet-Signature: 0J7Qv9C70LDRgtCwINC30LDQutCw0LfQsA== X-Wallet-Timestamp: 2015-01-07T21:45:33 X-Wallet-UserId: 119973638979 X-Wallet-CustomerId: RTC5698365</td>\n</tr>\n<tr>\n<td style=\"text-align:left\"></td>\n</tr>\n</tbody>\n</table>\n<ul>\n<li>X-Wallet-CustomerId - идентификатор покупателя на стороне интернет магазина, является обязательным заголовком.</li>\n</ul>\n<p>Если запрос был обработан без ошибок, API отвечает кодом 200 OK.</p>\n<h2 id=\"удаление-платежного-инструмента\"><a href=\"docs/ru/w1-h2h1.5/methods.html#удаление-платежного-инструмента\" class=\"yfm-anchor\" aria-hidden=\"true\"><span class=\"visually-hidden\" data-no-index=\"true\">Удаление платежного инструмента</span></a>Удаление платежного инструмента</h2>\n<p>Метод используется для удаления ранее сохраненного платежного инструмента.</p>\n<table>\n<thead>\n<tr>\n<th style=\"text-align:left\">DELETE {baseUrl}/externalaccounts/</th>\n</tr>\n</thead>\n</table>\n<p>Пример запроса:</p>\n<table>\n<thead>\n<tr>\n<th style=\"text-align:left\">DELETE {baseUrl}/externalaccounts/</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td style=\"text-align:left\">Content-Type: application/json; charset=utf-8 X-Wallet-Signature: 0J7Qv9C70LDRgtCwINC30LDQutCw0LfQsA== X-Wallet-Timestamp: 2015-01-07T21:45:33 X-Wallet-UserId: 119973638979 X-Wallet-CustomerId: RTC5698365</td>\n</tr>\n</tbody>\n</table>\n<ul>\n<li>X-Wallet-CustomerId - идентификатор покупателя на стороне интернет магазина, является обязательным заголовком.</li>\n</ul>\n<p>Если запрос был обработан без ошибок, API отвечает кодом 200 OK.</p>\n<h1></h1>\n<h1></h1>\n<h1>Сценарии использования</h1>\n<h2 id=\"оплата-банковской-картой\"><a href=\"docs/ru/w1-h2h1.5/methods.html#оплата-банковской-картой\" class=\"yfm-anchor\" aria-hidden=\"true\"><span class=\"visually-hidden\" data-no-index=\"true\">Оплата банковской картой</span></a>Оплата банковской картой</h2>\n<p>Оплата банковской картой возможна несколькими сценариями, каждый из которых состоит из нескольких шагов, общим и обязательным шагом является создание инвойса. В зависимости от сценария, параметры на данном шаге могут меняться, эти изменения, если они требуются, будут указаны в начале описания каждого из сценариев.</p>\n<p>Для создания инвойса понадобится метод “<a href=\"#создание-инвойса\">Создание инвойса</a>”:</p>\n<table>\n<thead>\n<tr>\n<th style=\"text-align:left\">POST {baseUrl}/invoices</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td style=\"text-align:left\">Content-Type: application/json; charset=utf-8 X-Wallet-Signature: 0J7Qv9C70LDRgtCwINC30LDQutCw0LfQsA== X-Wallet-Timestamp: 2016-08-04T07:43:47 X-Wallet-UserId: 119973638979</td>\n</tr>\n<tr>\n<td style=\"text-align:left\">{     \"OrderId\":\"GQYOE-MJNPO-49623\",     \"Amount\":5.30,     \"CurrencyId\":643,     \"PaymentTypeId\":\"CreditCardRub\",     \"InvoiceAdditionalParams\": {         \"WMI_SUCCESS_URL\":\"https://mushop.com/success.html\",         \"WMI_FAIL_URL\":\"https://mushop.com/fail.html\"     } }</td>\n</tr>\n</tbody>\n</table>\n<p>Для того чтобы инвойс можно было оплатить именно картами, в значении поля PaymentTypeId необходимо передать один из карточных способов.</p>\n<p>Ответ:</p>\n<table>\n<thead>\n<tr>\n<th style=\"text-align:left\">HTTP/1.1 200 OK</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td style=\"text-align:left\">X-Wallet-Timestamp: 2016-08-04T07:43:50\u000bX-Wallet-Signature: 1SVVi80EB1FRp8tvPaGqRQ==</td>\n</tr>\n<tr>\n<td style=\"text-align:left\">{\u000b    \"Invoice\":\u000b    {\u000b        \"InvoiceId\":337450307479,\u000b        \"Amount\":10.0000,\u000b        \"CurrencyId\":643,\u000b        \"InvoiceStateId\":\"Created\",\u000b        \"CreateDate\":\"2016-08-04T07:43:47\",\u000b        \"UpdateDate\":\"2016-08-04T07:43:47\",\u000b        \"Payment\":\u000b        {\u000b            \"PaymentId\":92180411,\u000b            \"PaymentCode\":\"337450307479\",\u000b            \"PaymentCodeType\":\"InvoiceId\",\u000b            \"CreateDate\":\"2016-08-04T07:43:47.05\",\u000b            \"UpdateDate\":\"2016-08-04T07:43:47.05\",\u000b            \"PaymentStateId\":\"Created\",\u000b            \"PaymentTypeId\":\"CreditCardRub\"\u000b        }\u000b    },\u000b    \"CanSaveAsExternalAccount\":\"true\",\u000b    \"PayerCommissionAmounts\": {\u000b        \"MinCommissionAmount\": 0.0,\u000b        \"MaxCommissionAmount\": 0.0\u000b    },\u000b    \"InvoiceUrl\": \"http://wl.walletone.com/checkout/checkout/Index/?i=337450307479&amp;m=119973638979\"\u000b}</td>\n</tr>\n</tbody>\n</table>\n<p>Значение параметра CanSaveAsExternalAccount указывает на то, что возможна привязка платежного инструмента. Для оплаты инвойса необходимо отправить запрос содержащий данные платежного инструмента:</p>\n<table>\n<thead>\n<tr>\n<th style=\"text-align:left\">POST {baseUrl}/payments/123456/process</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td style=\"text-align:left\">Content-Type: application/json; charset=utf-8 X-Wallet-Signature: 0J7Qv9C70LDRgtCwINC30LDQutCw0LfQsA== X-Wallet-Timestamp: 2016-08-04T05:34:53 X-Wallet-UserId: 119973638979</td>\n</tr>\n<tr>\n<td style=\"text-align:left\">{\u000b    \"AuthData\":\u000b    {\u000b        \"CreditCardNumber\":\"4111111111111111\",\u000b        \"CreditCardHolder\":\"IVAN BUNSHA\",\u000b        \"CreditCardExpireDate\":\"10.2016\",\u000b        \"CreditCardSecurityCode\":\"356\"\u000b    }\u000b}</td>\n</tr>\n</tbody>\n</table>\n<p>Ответ:</p>\n<table>\n<thead>\n<tr>\n<th style=\"text-align:left\">HTTP/1.1 200 OK</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td style=\"text-align:left\">X-Wallet-Timestamp: 2016-08-04T07:44:29\u000bX-Wallet-Signature: H49Q9kk/OxXCGHMNHNfc3g==</td>\n</tr>\n<tr>\n<td style=\"text-align:left\">{\u000b    \"Payment\":\u000b    {\u000b        \"PaymentId\":92180411,\u000b        \"Amount\":10.0000,\u000b        \"CurrencyId\":643,\u000b        \"PaymentCode\":\"337450307479\",\u000b        \"PaymentCodeType\":\"InvoiceId\",\u000b        \"CreateDate\":\"2016-08-04T07:43:47.05\",\u000b        \"UpdateDate\":\"2016-08-04T07:43:47.05\",\u000b        \"PaymentStateId\":\"AuthRequired\",\u000b        \"PaymentTypeId\":\"CreditCardRub\"\u000b    },\u000b    \"Authorization\":\u000b    {\u000b        \"AuthType\":\"Redirect\",\u000b        \"PayerConfirmationType\":\"None\",\u000b        \"HttpForm\":\u000b        {\u000b            \"Action\":\"http://superbank.com/auth.php\",\u000b            \"Method\":\"POST\",\u000b            \"Params\":\u000b            {\u000b                \"MD\":\"768862101\",\u000b                \"PaReq\":\"Nkshk\\uehnkf7LsKNSFEPwqnf[98u23f\",\u000b              \"TermUrl\":\"https://wl.walletone.com/checkout/refill/Uniteller/CreditCardRub/UnitellerRUB/92180411/State3Ds\"\u000b            }\u000b        }\u000b    }\u000b}</td>\n</tr>\n</tbody>\n</table>\n<p>Ответ содержит объект Authorization, указывающий на то, что требуется доп. авторизация. Значение поля AuthType отражает требуемое действие, конкретно в данном примере указано, что необходимо произвести перенаправление пользователя способом указанным в поле HttpForm.Method с параметрами из HttpForm.Params на урл HttpForm.Action:</p>\n<table>\n<thead>\n<tr>\n<th style=\"text-align:left\">&lt;html&gt;\u000b    &lt;form id=\"checkoutOrderData\" class=\"-visor-no-click\" method=\"POST\" action=\"http://superbank.com/auth.php\" &gt;\u000b        &lt;input type=\"hidden\" name=\"MD\" value=\"768862101\" /&gt;\u000b        &lt;input type=\"hidden\" name=\"PaReq\" value=\"Nkshk\\uehnkf7LsKNSFEPwqnf[98u23f\" /&gt;\u000b        &lt;input type=\"hidden\" name=\"TermUrl\" value=\"https://wl.walletone.com/checkout/refill/Uniteller/CreditCardRub/UnitellerRUB/92180411/State3Ds\" /&gt;\u000b        &lt;input type=\"submit\" style=\"display:none\" value=\"\" /&gt;\u000b    &lt;/form&gt;\u000b    &lt;script type=\"text/javascript\"&gt;document.getElementById('checkoutOrderData').submit()&lt;/script&gt;\u000b&lt;/html&gt;</th>\n</tr>\n</thead>\n</table>\n<p>После отправки формы пользователь перейдет на страницу банка для ввода 3ds. В зависимости от успешности проведения платежа пользователь перейдет на переданные, при создании инвойса, страницы WMI_SUCCESS_URL, WMI_FAIL_URL, если они не были указаны то на страницы заглушки.</p>\n<h3 id=\"рекуррентные-платежи\"><a href=\"docs/ru/w1-h2h1.5/methods.html#рекуррентные-платежи\" class=\"yfm-anchor\" aria-hidden=\"true\"><span class=\"visually-hidden\" data-no-index=\"true\">Рекуррентные платежи</span></a>Рекуррентные платежи</h3>\n<p>Рекуррентные платежи позволяют интернет-магазину производить списание средств с банковских карт своих плательщиков без повторного запроса ввода реквизитов карты.</p>\n<p>Для возможности проведения рекуррентного платежа необходимо вначале сохранить и привязать платежный инструмент, это происходит в момент оплаты счета при передаче соответствующих параметров.</p>\n<p>Представленное API также содержит дополнительные методы по работе с привязанными платежными инструментами:</p>\n<ul>\n<li><a href=\"#получение-списка-платежных-инструментов\">Получение списка платежных инструментов</a>,</li>\n<li><a href=\"#обновление-платежного-инструмента\">Обновление платежного инструмента</a>,</li>\n<li><a href=\"#удаление-платежного-инструмента\">Удаление платежного инструмента</a>.</li>\n</ul>\n<h4 id=\"привязка-платежного-инструмента\"><a href=\"docs/ru/w1-h2h1.5/methods.html#привязка-платежного-инструмента\" class=\"yfm-anchor\" aria-hidden=\"true\"><span class=\"visually-hidden\" data-no-index=\"true\">Привязка платежного инструмента</span></a>Привязка платежного инструмента</h4>\n<p>Привязка платежных инструментов возможна только если при <a href=\"#создание-инвойса\">создании инвойса</a> в ответе вернулся параметр CanSaveAsExternalAccount со значение true. Для осуществления привязки, при вызове метода <a href=\"#проведение-платежа\">проведения платежа</a> необходимо передать идентификатор плательщика на стороне интернет магазина (CustomerId) и поле SaveAuthData со значением “True”:</p>\n<table>\n<thead>\n<tr>\n<th style=\"text-align:left\">POST {baseUrl}/payments/123456/process</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td style=\"text-align:left\">Content-Type: application/json; charset=utf-8 X-Wallet-Signature: 0J7Qv9C70LDRgtCwINC30LDQutCw0LfQsA== X-Wallet-Timestamp: 2016-08-04T05:34:53 X-Wallet-UserId: 119973638979</td>\n</tr>\n<tr>\n<td style=\"text-align:left\">{\u000b    \"AuthData\":\u000b    {\u000b        \"CreditCardNumber\":\"4111111111111111\",\u000b        \"CreditCardHolder\":\"IVAN BUNSHA\",\u000b        \"CreditCardExpireDate\":\"10.2016\",\u000b        \"CreditCardSecurityCode\":\"356\",         \"UserInfoIP\": \"81.65.247.46\",\u000b        \"UserInfoEmail\": \"BUNSHA@testemail.com\"\u000b    },     \"CustomerId\":\"MT-8965-RT\",     \"SaveAuthData\":\"true\"\u000b}</td>\n</tr>\n</tbody>\n</table>\n<p>В примере дополнительно передаются данные плательщика через поля UserInfo.</p>\n<p>Ответ:</p>\n<table>\n<thead>\n<tr>\n<th style=\"text-align:left\">HTTP/1.1 200 OK</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td style=\"text-align:left\">X-Wallet-Timestamp: 2016-08-04T07:44:29\u000bX-Wallet-Signature: H49Q9kk/OxXCGHMNHNfc3g==</td>\n</tr>\n<tr>\n<td style=\"text-align:left\">{\u000b    \"Payment\":\u000b    {\u000b        \"PaymentId\":92180411,\u000b        \"Amount\":10.0000,\u000b        \"CurrencyId\":643,\u000b        \"PaymentCode\":\"337450307479\",\u000b        \"PaymentCodeType\":\"InvoiceId\",\u000b        \"CreateDate\":\"2016-08-04T07:43:47.05\",\u000b        \"UpdateDate\":\"2016-08-04T07:43:47.05\",\u000b        \"PaymentStateId\":\"AuthRequired\",\u000b        \"PaymentTypeId\":\"CreditCardRub\",         \"ExternalAccountId\":245498\u000b    },\u000b    \"Authorization\":\u000b    {\u000b        \"AuthType\":\"Redirect\",\u000b        \"PayerConfirmationType\":\"None\",\u000b        \"HttpForm\":\u000b        {\u000b            \"Action\":\"http://superbank.com/auth.php\",\u000b            \"Method\":\"POST\",\u000b            \"Params\":\u000b            {\u000b                \"MD\":\"768862101\",\u000b                \"PaReq\":\"Nkshk\\uehnkf7LsKNSFEPwqnf[98u23f\",\u000b              \"TermUrl\":\"https://wl.walletone.com/checkout/refill/Uniteller/CreditCardRub/UnitellerRUB/92180411/State3Ds\"\u000b            }\u000b        }\u000b    }\u000b}</td>\n</tr>\n</tbody>\n</table>\n<p>Ответ практически не отличается от ответа представленного выше, так что шаг доп авторизации будет опущен.</p>\n<p>Важным отличием является дополнительное поле ExternalAccountId в объекте Payment, оно содержит идентификатор привязки используемый при оплате с привязанного инструмента.</p>\n<table>\n<thead>\n<tr>\n<th style=\"text-align:left\">Важно, только после успешной оплаты данный идентификатор можно будет использовать для оплаты с привязанной карты.</th>\n</tr>\n</thead>\n</table>\n<h4 id=\"оплата-с-привязанного-платежного-инструмента\"><a href=\"docs/ru/w1-h2h1.5/methods.html#оплата-с-привязанного-платежного-инструмента\" class=\"yfm-anchor\" aria-hidden=\"true\"><span class=\"visually-hidden\" data-no-index=\"true\">Оплата с привязанного платежного инструмента</span></a>Оплата с привязанного платежного инструмента</h4>\n<p>Для оплаты с ранее привязанной карты необходимо в запрос проведения платежа передать идентификатор ExternalAccountId или же поле UseSavedAuthData со значение true. Если будут переданы оба поля, поле UseSavedAuthData будет игнорироваться.</p>\n<table>\n<thead>\n<tr>\n<th style=\"text-align:left\">POST {baseUrl}/payments/123456/process</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td style=\"text-align:left\">Content-Type: application/json; charset=utf-8 X-Wallet-Signature: 0J7Qv9C70LDRgtCwINC30LDQutCw0LfQsA== X-Wallet-Timestamp: 2016-08-04T05:34:53 X-Wallet-UserId: 119973638979</td>\n</tr>\n<tr>\n<td style=\"text-align:left\">{     \"ExternalAccountId\":245498,\u000b    \"AuthData\":\u000b    {\u000b        \"RecurrentCreditCardAuthSecurityCode\":\"356\",         \"RecurrentCreditCardAuthIP\": \"81.65.247.46\",\u000b        \"RecurrentCreditCardEmail\": \"BUNSHA@testemail.com\"\u000b    },     \"CustomerId\":\"MT-8965-RT\"\u000b}</td>\n</tr>\n</tbody>\n</table>\n<p>Ответ:</p>\n<table>\n<thead>\n<tr>\n<th style=\"text-align:left\">HTTP/1.1 200 OK</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td style=\"text-align:left\">X-Wallet-Timestamp: 2016-08-04T07:44:29\u000bX-Wallet-Signature: H49Q9kk/OxXCGHMNHNfc3g==</td>\n</tr>\n<tr>\n<td style=\"text-align:left\">{\u000b    \"Payment\":\u000b    {\u000b        \"PaymentId\":92180411,\u000b        \"Amount\":10.0000,\u000b        \"CurrencyId\":643,\u000b        \"PaymentCode\":\"337450307479\",\u000b        \"PaymentCodeType\":\"InvoiceId\",\u000b        \"CreateDate\":\"2016-08-04T07:43:47.05\",\u000b        \"UpdateDate\":\"2016-08-04T07:43:47.05\",\u000b        \"PaymentStateId\":\"AuthRequired\",\u000b        \"PaymentTypeId\":\"CreditCardRub\",         \"ExternalAccountId\":245498\u000b    }\u000b}</td>\n</tr>\n</tbody>\n</table>\n<p>В зависимости от платежного шлюза, ответ может содержать объект Authorization, что необходимо делать в таком случае описано выше.</p>\n<h3 id=\"пред-авторизация-платежа\"><a href=\"docs/ru/w1-h2h1.5/methods.html#пред-авторизация-платежа\" class=\"yfm-anchor\" aria-hidden=\"true\"><span class=\"visually-hidden\" data-no-index=\"true\">Пред-авторизация платежа</span></a>Пред-авторизация платежа</h3>\n<p>Пред-авторизация платежа позволяет интернет магазину самому принимать решение о списание денежных средств с платежного инструмента пользователя, что позволяет избежать дополнительных расходов в случае отказа от услуги или невозможности ее предоставления по каким либо причинам. Другими словами в момент оплаты счета средства на карте пользователя не списываются, а холдируются.</p>\n<p>Данный сценарии не сильно отличается от сценариев оплаты банковской картой описанных выше, за исключением того, что на стадии <a href=\"#создание-инвойса\">создания инвойса</a> необходимо передать дополнительные параметры WMI_AUTO_ACCEPT со значением 0 и единственный WMI_PTENABLED, поддерживающий предавторизацию. После завершения оплаты потребуется подтвердить или отменить списание средств.</p>\n<table>\n<thead>\n<tr>\n<th style=\"text-align:left\">Важно, счет будет автоматически отменен через установленный промежуток времени, данный временной промежуток устанавливается на мерчанте.</th>\n</tr>\n</thead>\n</table>\n<h4 id=\"отложенная-оплата-(списание-денежных-средств)\"><a href=\"docs/ru/w1-h2h1.5/methods.html#отложенная-оплата-(списание-денежных-средств)\" class=\"yfm-anchor\" aria-hidden=\"true\"><span class=\"visually-hidden\" data-no-index=\"true\">Отложенная оплата (списание денежных средств)</span></a>Отложенная оплата (списание денежных средств)</h4>\n<p>Для подтверждения списания необходимо вызвать метод <a href=\"#зачисление-инвойса\">зачисление инвойса</a>:</p>\n<table>\n<thead>\n<tr>\n<th style=\"text-align:left\">POST {baseUrl}/invoices/GQYOE-MJNPO-49623/accept</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td style=\"text-align:left\">Content-Type: application/json; charset=utf-8 X-Wallet-Signature: 0J7Qv9C70LDRgtCwINC30LDQutCw0LfQsA== X-Wallet-Timestamp: 2015-01-07T21:45:33 X-Wallet-UserId: 119973638979</td>\n</tr>\n</tbody>\n</table>\n<p>Ответ:</p>\n<table>\n<thead>\n<tr>\n<th style=\"text-align:left\">HTTP/1.1 200 OK</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td style=\"text-align:left\">X-Wallet-Timestamp: 2016-08-04T07:44:29\u000bX-Wallet-Signature: H49Q9kk/OxXCGHMNHNfc3g==</td>\n</tr>\n<tr>\n<td style=\"text-align:left\">{ \u000b    \"Invoice\": {\u000b        \"InvoiceId\":341234567891,\u000b        \"Amount\":30,\u000b        \"CurrencyId\":643,\u000b        \"InvoiceStateId\":\"Accepting\",\u000b        \"CreateDate\":\"2014-06-10T09:54:05.033\",\u000b        \"UpdateDate\":\"2014-07-10T09:55:05.033\"        \u000b    },\u000b    \"Payments\" : [\u000b        {\u000b            \"PaymentId\":123456,\u000b            \"Amount\":30,\u000b            \"CurrencyId\":643,\u000b            \"PaymentTypeId\": \"CreditCardRUB\",\u000b            \"Date\":\"2014-06-10T09:55:05.033\",\u000b            \"SuspenseAmount\": 0\u000b        }\u000b    ]\u000b}</td>\n</tr>\n</tbody>\n</table>\n<h4 id=\"отложенная-оплата-(отмена-списания-денежных-средств)\"><a href=\"docs/ru/w1-h2h1.5/methods.html#отложенная-оплата-(отмена-списания-денежных-средств)\" class=\"yfm-anchor\" aria-hidden=\"true\"><span class=\"visually-hidden\" data-no-index=\"true\">Отложенная оплата (отмена списания денежных средств)</span></a>Отложенная оплата (отмена списания денежных средств)</h4>\n<p>Для отмены списания денежных средств необходимо вызвать метод <a href=\"https://docs.google.com/document/d/18XAlBRPlW_7oXF0eqg39GiZKy6-OyeUylM6R0ZmZKsY/edit#heading=h.qmqr8clqkfm1\" target=\"_blank\" rel=\"noreferrer noopener\">отмена инвойса</a>:</p>\n<table>\n<thead>\n<tr>\n<th style=\"text-align:left\">POST {baseUrl}/invoices/GQYOE-MJNPO-49623/reject</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td style=\"text-align:left\">Content-Type: application/json; charset=utf-8 X-Wallet-Signature: 0J7Qv9C70LDRgtCwINC30LDQutCw0LfQsA== X-Wallet-Timestamp: 2015-01-07T21:45:33 X-Wallet-UserId: 119973638979</td>\n</tr>\n</tbody>\n</table>\n<p>Ответ:</p>\n<table>\n<thead>\n<tr>\n<th style=\"text-align:left\">HTTP/1.1 200 OK</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td style=\"text-align:left\">X-Wallet-Timestamp: 2016-08-04T07:44:29\u000bX-Wallet-Signature: H49Q9kk/OxXCGHMNHNfc3g==</td>\n</tr>\n<tr>\n<td style=\"text-align:left\">{ \u000b    \"Invoice\": {\u000b        \"InvoiceId\":341234567891,\u000b        \"Amount\":30,\u000b        \"CurrencyId\":643,\u000b        \"InvoiceStateId\":\"Canceling\",\u000b        \"CreateDate\":\"2014-06-10T09:54:05.033\",\u000b        \"UpdateDate\":\"2014-07-10T09:55:05.033\"        \u000b    },\u000b    \"Payments\" : [\u000b        {\u000b            \"PaymentId\":123456,\u000b            \"Amount\":30,\u000b            \"CurrencyId\":643,\u000b            \"PaymentTypeId\": \"CreditCardRUB\",\u000b            \"Date\":\"2014-06-10T09:55:05.033\",\u000b            \"SuspenseAmount\": 0\u000b        }\u000b    ]\u000b}</td>\n</tr>\n</tbody>\n</table>\n<h2 id=\"оплата-мобильной-коммерцией\"><a href=\"docs/ru/w1-h2h1.5/methods.html#оплата-мобильной-коммерцией\" class=\"yfm-anchor\" aria-hidden=\"true\"><span class=\"visually-hidden\" data-no-index=\"true\">Оплата мобильной коммерцией</span></a>Оплата мобильной коммерцией</h2>\n<p>Процесс оплаты с мобильного телефона аналогичен процессу оплаты с банковской карты - он также включает шаги создания инвойса и проведения платежа, только сценарий тут один.<br />\nДля создания инвойса понадобится метод “<a href=\"#создание-инвойса\">Создание инвойса</a>”:</p>\n<table>\n<thead>\n<tr>\n<th style=\"text-align:left\">POST {baseUrl}/invoices</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td style=\"text-align:left\">Content-Type: application/json; charset=utf-8 X-Wallet-Signature: 0J7Qv9C70LDRgtCwINC30LDQutCw0LfQsA== X-Wallet-Timestamp: 2016-08-04T07:43:47 X-Wallet-UserId: 119973638979</td>\n</tr>\n<tr>\n<td style=\"text-align:left\">{     \"OrderId\":\"GQYOE-MJNPO-49623\",     \"Amount\":5.30,     \"CurrencyId\":643,     \"PaymentTypeId\":\"MegafonRUB\",     \"InvoiceAdditionalParams\": {         \"WMI_SUCCESS_URL\":\"https://mushop.com/success.html\",         \"WMI_FAIL_URL\":\"https://mushop.com/fail.html\"     } }</td>\n</tr>\n</tbody>\n</table>\n<p>В значении поля PaymentTypeId необходимо передать один из способов мобильной коммерции, в примере используется MegafonRUB.</p>\n<p>Ответ:</p>\n<table>\n<thead>\n<tr>\n<th style=\"text-align:left\">HTTP/1.1 200 OK</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td style=\"text-align:left\">X-Wallet-Timestamp: 2016-08-04T07:43:50\u000bX-Wallet-Signature: 1SVVi80EB1FRp8tvPaGqRQ==</td>\n</tr>\n<tr>\n<td style=\"text-align:left\">{\u000b    \"Invoice\":\u000b    {\u000b        \"InvoiceId\":337450307479,\u000b        \"Amount\":10.0000,\u000b        \"CurrencyId\":643,\u000b        \"InvoiceStateId\":\"Created\",\u000b        \"CreateDate\":\"2016-08-04T07:43:47\",\u000b        \"UpdateDate\":\"2016-08-04T07:43:47\",\u000b        \"Payment\":\u000b        {\u000b            \"PaymentId\":92180411,\u000b            \"PaymentCode\":\"337450307479\",\u000b            \"PaymentCodeType\":\"InvoiceId\",\u000b            \"CreateDate\":\"2016-08-04T07:43:47.05\",\u000b            \"UpdateDate\":\"2016-08-04T07:43:47.05\",\u000b            \"PaymentStateId\":\"Created\",\u000b            \"PaymentTypeId\":\"MegafonRUB\"\u000b        }\u000b    },\u000b    \"CanSaveAsExternalAccount\":\"false\",\u000b    \"PayerCommissionAmounts\": {\u000b        \"MinCommissionAmount\": 0.0,\u000b        \"MaxCommissionAmount\": 0.0\u000b    },\u000b    \"InvoiceUrl\": \"http://wl.walletone.com/checkout/checkout/Index/?i=337450307479&amp;m=119973638979\"\u000b}</td>\n</tr>\n</tbody>\n</table>\n<p>Для оплаты инвойса необходимо отправить запрос содержащий данные платежного инструмента:</p>\n<table>\n<thead>\n<tr>\n<th style=\"text-align:left\">POST {baseUrl}/payments/123456/process</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td style=\"text-align:left\">Content-Type: application/json; charset=utf-8 X-Wallet-Signature: 0J7Qv9C70LDRgtCwINC30LDQutCw0LfQsA== X-Wallet-Timestamp: 2016-08-04T05:34:53 X-Wallet-UserId: 119973638979</td>\n</tr>\n<tr>\n<td style=\"text-align:left\">{\u000b    \"AuthData\":\u000b    {\u000b        \"MobileCommercePhoneNumber\":\"9368956698\",         \"UserInfoIP\":\"123.123.123.123\"\u000b    }\u000b}</td>\n</tr>\n</tbody>\n</table>\n<p>Ответ:</p>\n<table>\n<thead>\n<tr>\n<th style=\"text-align:left\">HTTP/1.1 200 OK</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td style=\"text-align:left\">X-Wallet-Timestamp: 2016-08-04T07:44:29\u000bX-Wallet-Signature: H49Q9kk/OxXCGHMNHNfc3g==</td>\n</tr>\n<tr>\n<td style=\"text-align:left\">{\u000b    \"Payment\":\u000b    {\u000b        \"PaymentId\":123456,\u000b        \"Amount\":15.0000,\u000b        \"CurrencyId\":643,\u000b        \"PaymentCode\":\"337450307479\",\u000b        \"PaymentCodeType\":\"InvoiceId\",\u000b        \"CreateDate\":\"2016-08-05T07:28:56.593\",\u000b        \"UpdateDate\":\"2016-08-05T07:28:56.593\",\u000b        \"PaymentStateId\":\"AuthRequired\",\u000b        \"PaymentTypeId\":\"MtsRUB\"\u000b    },\u000b    \"Authorization\":\u000b    {\u000b        \"AuthType\":\"PayerConfirmation\",\u000b        \"PayerConfirmationType\":\"SmsUssd\"\u000b    }\u000b}</td>\n</tr>\n</tbody>\n</table>\n<p>Ответ содержит объект Authorization, с значением поля AuthType равным PayerConfirmation и полем  PayerConfirmationType со значением SmsUssd это означает что от пользователя требуется дополнительное действие, в данном случае ответ на присланную смс.</p>\n<h2 id=\"оплата-viber-кошельком\"><a href=\"docs/ru/w1-h2h1.5/methods.html#оплата-viber-кошельком\" class=\"yfm-anchor\" aria-hidden=\"true\"><span class=\"visually-hidden\" data-no-index=\"true\">Оплата Viber кошельком</span></a>Оплата Viber кошельком</h2>\n<p>Процесс оплаты в кошельке Viber аналогичен процессу оплаты с банковской карты - он также включает шаги создания инвойса и проведения платежа.<br />\nДля создания инвойса понадобится метод “<a href=\"https://docs.google.com/document/d/1jXNREvEQ6IUr5W5sdT7ZBy-VhhkgyE5EtVU0LjqtqOg/edit#heading=h.psz7i7txu81z\" target=\"_blank\" rel=\"noreferrer noopener\">Создание инвойса</a>” c указанием \"PaymentTypeId\":\"ViberRUB\":</p>\n<table>\n<thead>\n<tr>\n<th style=\"text-align:left\">POST {baseUrl}/invoices Content-Type: application/json; charset=utf-8 X-Wallet-Signature: 0J7Qv9C70LDRgtCwINC30LDQutCw0LfQsA== X-Wallet-Timestamp: 2015-01-07T21:45:33 X-Wallet-UserId: 119973638979</th>\n</tr>\n</thead>\n</table>\n<p>Ответ:</p>\n<table>\n<thead>\n<tr>\n<th style=\"text-align:left\">HTTP/1.1 200 OK</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td style=\"text-align:left\">X-Wallet-Timestamp: 2016-08-04T07:43:50\u000bX-Wallet-Signature: 1SVVi80EB1FRp8tvPaGqRQ==</td>\n</tr>\n<tr>\n<td style=\"text-align:left\">{     \"Invoice\": {         \"InvoiceId\":341234567891,         \"Amount\":2.19,         \"CurrencyId\":643,         \"InvoiceStateId\":\"Created\",         \"CreateDate\":\"2014-06-10T09:54:05.033\",         \"UpdateDate\":\"2014-06-10T09:54:05.033\",         \"Payment\": {             \"PaymentId\":123456,             \"PaymentCode\":\"341234567891,             \"PaymentCodeType\":\"InvoiceId\"             \"CreateDate\":\"2014-06-10T09:54:05.033\",             \"UpdateDate\":\"2014-06-10T09:54:05.033\",             \"PaymentStateId\":\"Created\",             \"PaymentTypeId\":\"ViberRUB\"         }         \t      },        \"CanSaveAsExternalAccount\":\"false\" }</td>\n</tr>\n</tbody>\n</table>\n<p>Для отправки инвойса на оплату в Viber необходимо отправить запрос содержащий данные платежного инструмента:</p>\n<table>\n<thead>\n<tr>\n<th style=\"text-align:left\">POST {baseUrl}/payments/{paymentId}/process Content-type: application/json; charset=utf-8 X-Wallet-Signature: 0J7Qv9C70LDRgtCwINC30LDQutCw0LfQsA== X-Wallet-Timestamp: 2015-01-07T21:45:33 X-Wallet-UserId: 119973638979 {     \"AuthData\": {         \"PhoneNumber\":\"79228807051\",         -- optional         \"NotificationLanguage\":\"ru-RU\",      -- optional         \"SchemeType\":\"web\",                  -- optional     } }</th>\n</tr>\n</thead>\n</table>\n<p><strong>Описание параметров</strong></p>\n<table>\n<thead>\n<tr>\n<th>Параметр</th>\n<th>Описание параметра ответа</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>PhoneNumber</td>\n<td>Поддерживается 2 режима работы:  Передан номер телефона клиента зарегистрированного в Viber: в этом случае пользователю будет направлено сервисное сообщение в Viber.  Параметр не передан: в этом случае в ответе на запрос будет сформирована ссылка на которую необходимо переадресовать пользователя для оплаты инвойса.</td>\n</tr>\n<tr>\n<td>NotificationLanguage</td>\n<td>Язык получаемого пользователем сервисного сообщения. Имеет смысл указывать только если передан номер телефона получателя сообщения. Поддерживаемые значения: ru-RU; en-US.</td>\n</tr>\n<tr>\n<td>SchemeType</td>\n<td>Задает схему для ссылки, которая будет возвращена в ответе при отсутствии параметра “PhoneNumber” в запросе. Поддерживаемые значения: web - значение по умолчанию, в ответе будет стандартный http URL который можно открыть в любом браузере; mobile - в ответе будет deeplink для мобильной платформы.</td>\n</tr>\n</tbody>\n</table>\n<p><strong>Используемый шаблон сервисного сообщения в Viber</strong></p>\n<table>\n<thead>\n<tr>\n<th></th>\n<th>Пример</th>\n<th>RU</th>\n<th>EN</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td><strong>Текст на кнопке</strong></td>\n<td>Оплатить 100 руб.</td>\n<td>Оплатить $</td>\n<td>Pay $</td>\n</tr>\n<tr>\n<td><strong>Текст сообщения</strong></td>\n<td>Вам выставлен счет. Получатель средств: Интернет-магазин Ozon.ru. Описание покупки: оплата заказа №1232.</td>\n<td>Вам выставлен счет. Получатель средств: ${MerchantName}. Описание покупки: ${OrderDescription}.</td>\n<td>You've received an invoice. Merchant: ${MerchantName}. Description of purchase: ${OrderDescription}.</td>\n</tr>\n<tr>\n<td><strong>Изображение</strong></td>\n<td>&lt;Не передается, или, в зависимости от настройки мерчанта, передается нормализованного лого мерчанта указанное в его настройках&gt;</td>\n<td></td>\n<td></td>\n</tr>\n</tbody>\n</table>\n<p>Ответ для режима 1 (отправка сервисного сообщения в Viber):</p>\n<table>\n<thead>\n<tr>\n<th style=\"text-align:left\">HTTP/1.1 200 OK</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td style=\"text-align:left\">X-Wallet-Timestamp: 2016-08-04T07:44:29\u000bX-Wallet-Signature: H49Q9kk/OxXCGHMNHNfc3g==</td>\n</tr>\n<tr>\n<td style=\"text-align:left\">{     \"Payment\": {         \"PaymentId\":64115070,         \"Amount\":2.19,         \"CurrencyId\":643,         \"PaymentCode\":\"345775450837\",         \"PaymentCodeType\":\"InvoiceId\",         \"CreateDate\":\"2015-10-29T21:00:04\",         \"UpdateDate\":\"2015-10-29T21:00:04\",         \"PaymentStateId\":\"AuthRequired\",         \"PaymentTypeId\":\"ViberRUB\",         \"ExternalAccountId\":null     },     \"Authorization\": {         \"AuthType\":\"PayerConfirmation\"     } }</td>\n</tr>\n</tbody>\n</table>\n<p>Ответ для режима 2 (получение ссылки на оплату для переадресации пользователя):</p>\n<table>\n<thead>\n<tr>\n<th style=\"text-align:left\">HTTP/1.1 200 OK</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td style=\"text-align:left\">X-Wallet-Timestamp: 2016-08-04T07:44:29\u000bX-Wallet-Signature: H49Q9kk/OxXCGHMNHNfc3g==</td>\n</tr>\n<tr>\n<td style=\"text-align:left\">{     \"Payment\": {         \"PaymentId\":64115070,         \"Amount\":2.19,         \"CurrencyId\":643,         \"PaymentCode\":\"345775450837\",         \"PaymentCodeType\":\"InvoiceId\",         \"CreateDate\":\"2015-10-29T21:00:04\",         \"UpdateDate\":\"2015-10-29T21:00:04\",         \"PaymentStateId\":\"AuthRequired\",         \"PaymentTypeId\":\"ViberRUB\",         \"ExternalAccountId\":null     },     \"Authorization\": {         \"AuthType\":\"Redirect\",         \"HttpForm\": {                    \t              \"Action\":\"https://wallet.integration.viber.com /pay?invoiceid=12f74e25-0221-4645-a79c-e6b5e277fced\",             \"Method\":\"GET\"         }     } }</td>\n</tr>\n</tbody>\n</table>\n<p>Режим 2 имеет смысл использовать для случаев когда пользователь интернет магазина использует мобильное устройство, но это не запрещает использовать режим 1</p>\n<h2 id=\"оплата-qiwi-кошельком\"><a href=\"docs/ru/w1-h2h1.5/methods.html#оплата-qiwi-кошельком\" class=\"yfm-anchor\" aria-hidden=\"true\"><span class=\"visually-hidden\" data-no-index=\"true\">Оплата Qiwi кошельком</span></a>Оплата Qiwi кошельком</h2>\n<p>Процесс оплаты с qiwi кошелька аналогичен процессам оплаты, описанным выше - он также включает шаги создания инвойса и проведения платежа. Для создания инвойса понадобится метод “<a href=\"https://docs.google.com/document/d/1jXNREvEQ6IUr5W5sdT7ZBy-VhhkgyE5EtVU0LjqtqOg/edit#heading=h.psz7i7txu81z\" target=\"_blank\" rel=\"noreferrer noopener\">Создание инвойса</a>” c указанием \"PaymentTypeId\":\"QiwiWalletRUB\":</p>\n<table>\n<thead>\ м оплаты, описанным выше - он также включает шаги создания инвойса и проведения платежа. Для создания инвойса понадобится метод “<a href=\"https://docs.google.com/document/d/1jXNREvEQ6IUr5W5sdT7ZBy-VhhkgyE5EtVU0LjqtqOg/edit#heading=h.psz7i7txu81z\" target=\"_blank\" rel=\"noreferrer noopener\">Создание инвойса</a>” c указанием \"PaymentTypeId\":\"PsbRetailRUB\":</p>\n<table>\n<thead>\n<tr>\n<th style=\"text-align:left\">POST {baseUrl}/invoices Content-Type: application/json; charset=utf-8 X-Wallet-Signature: 0J7Qv9C70LDRgtCwINC30LDQutCw0LfQsA== X-Wallet-Timestamp: 2015-01-07T21:45:33 X-Wallet-UserId: 119973638979</th>\n</tr>\n</thead>\n</table>\n<p>Ответ:</p>\n<table>\n<thead>\n<tr>\n<th style=\"text-align:left\">HTTP/1.1 200 OK</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td style=\"text-align:left\">X-Wallet-Timestamp: 2016-08-04T07:43:50\u000bX-Wallet-Signature: 1SVVi80EB1FRp8tvPaGqRQ==</td>\n</tr>\n<tr>\n<td style=\"text-align:left\">{     \"Invoice\": {         \"InvoiceId\":341234567891,         \"Amount\":2.19,         \"CurrencyId\":643,         \"InvoiceStateId\":\"Created\",         \"CreateDate\":\"2014-06-10T09:54:05.033\",         \"UpdateDate\":\"2014-06-10T09:54:05.033\",         \"Payment\": {             \"PaymentId\":123456,             \"PaymentCode\":\"341234567891,             \"PaymentCodeType\":\"InvoiceId\"             \"CreateDate\":\"2017-09-13T07:13:23.983\",             \"UpdateDate\":\"2017-09-13T07:13:23.983\",             \"PaymentStateId\":\"Created\",             \"PaymentTypeId\":\"PsbRetailRUB\"         }         \t      },\u000b    \"CanSaveAsExternalAccount\": false,\u000b    \"PayerCommissionAmounts\": {\u000b        \"MinCommissionAmount\": 0.0,\u000b        \"MaxCommissionAmount\": 0.0\u000b    },\u000b    \"InvoiceUrl\": \"http://wl.walletone.com/checkout/checkout/Index/?i=341234567891&amp;m=119973638979\" }</td>\n</tr>\n</tbody>\n</table>\n<p>Для оплаты инвойса необходимо отправить запрос содержащий пустой объект:</p>\n<table>\n<thead>\n<tr>\n<th style=\"text-align:left\">POST {baseUrl}/payments/123456/process</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td style=\"text-align:left\">Content-Type: application/json; charset=utf-8 X-Wallet-Signature: 0J7Qv9C70LDRgtCwINC30LDQutCw0LfQsA== X-Wallet-Timestamp: 2016-08-04T05:34:53 X-Wallet-UserId: 119973638979</td>\n</tr>\n<tr>\n<td style=\"text-align:left\">{}</td>\n</tr>\n</tbody>\n</table>\n<p>Ответ:</p>\n<table>\n<thead>\n<tr>\n<th style=\"text-align:left\">HTTP/1.1 200 OK</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td style=\"text-align:left\">X-Wallet-Timestamp: 2016-08-04T07:44:29\u000bX-Wallet-Signature: H49Q9kk/OxXCGHMNHNfc3g==</td>\n</tr>\n<tr>\n<td style=\"text-align:left\">{\u000b    \"Payment\": {\u000b        \"MasterField\": \"79368956698\",\u000b        \"PaymentId\": 123456,\u000b        \"Amount\": 2.19,\u000b        \"CurrencyId\": 643,\u000b        \"PaymentCode\": \"340579408612\",\u000b        \"PaymentCodeType\": \"InvoiceId\",\u000b        \"CreateDate\": \"2017-09-13T07:13:23.983\",\u000b        \"UpdateDate\": \"2017-09-13T07:13:23.983\",\u000b        \"PaymentStateId\": \"Processing\",\u000b        \"PaymentTypeId\": \"PsbRetailRUB\"\u000b    },\u000b    \"Authorization\": {\u000b        \"AuthType\": \"Redirect\",\u000b        \"HttpForm\": { \"Action\":\"https://wl.walletone.com/checkout/Process/123456/Index\",\u000b            \"Method\": \"GET\"\u000b    }\u000b  }\u000b}</td>\n</tr>\n</tbody>\n</table>\n<p>Ответ содержит объект Authorization, указывающий на то, что требуется доп. авторизация. Значение поля AuthType отражает требуемое действие, а именно необходимо произвести перенаправление пользователя способом указанным в поле HttpForm.Method на урл HttpForm.Action.</p>\n<h2 id=\"возвраты-по-принятым-платежам\"><a href=\"docs/ru/w1-h2h1.5/methods.html#возвраты-по-принятым-платежам\" class=\"yfm-anchor\" aria-hidden=\"true\"><span class=\"visually-hidden\" data-no-index=\"true\">Возвраты по принятым платежам</span></a>Возвраты по принятым платежам</h2>\n<p>Данное API позволяет интернет магазинам осуществлять возвраты, по ранее оплаченным платежам. Чтобы осуществить возврат по конкретному платежу, данный платеж должен находиться в статусе Paid и шлюз, через который прошел платеж, должен поддерживать данный функционал, на данный момент не все шлюзы поддерживают возвраты.</p>\n<p>Возвраты - асинхронная операция и состоит из двух этапов:</p>\n<ul>\n<li>создание запроса на осуществление возврата по указанному платежу,</li>\n<li>получение статуса запроса на осуществление возврата по указанному платежу.</li>\n</ul>\n<p>В процессе обработки запроса на возврат по платежу, Refund изменяет свой статус до получения конечного, при этом могут возникнуть ошибки и по инициативе интернет магазина запрос можно повторить.</p>\n<p>Не допускается повторная отправка запроса, если по указанному платежу ранее был создан Refund и он находится в следующих статусах (Created, Updated, Processing,  Accepted). В случае отправки запроса будет возвращена ошибка.</p>\n<p>Для работы с возвратами в API предусмотрены 3 метода:</p>\n<ul>\n<li><a href=\"#создание-запроса-на-осуществление-возврата\">cоздание запроса на осуществление возврата</a>,</li>\n<li><a href=\"#получение-информации-о-возврате\">получение информации о возврате</a>,</li>\n<li><a href=\"#получение-информации-о-произведенных-возвратах\">получение информации о произведенных возвратах</a>.</li>\n</ul>\n","leading":false},"router":{"pathname":"docs/ru/w1-h2h1.5/methods","depth":4},"lang":"ru","langs":["ru"]};
