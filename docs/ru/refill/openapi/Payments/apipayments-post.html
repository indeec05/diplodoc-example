                   window.STATIC_CONTENT = false
                   window.__DATA__ = {"data":{"meta":{"metadata":[{"name":"generator","content":"Diplodoc Platform v4.57.7"}],"style":["_assets/cut-extension.css"],"script":["_assets/cut-extension.js"]},"assets":[],"headings":[{"title":"Request","href":"docs/ru/refill/openapi/Payments/apipayments-post.html#request","level":2,"items":[{"title":"Body","href":"docs/ru/refill/openapi/Payments/apipayments-post.html#body","level":3},{"title":"Amount","href":"docs/ru/refill/openapi/Payments/apipayments-post.html#amount","level":3},{"title":"AuthData","href":"docs/ru/refill/openapi/Payments/apipayments-post.html#authdata","level":3},{"title":"Redirect","href":"docs/ru/refill/openapi/Payments/apipayments-post.html#redirect","level":3},{"title":"CardData","href":"docs/ru/refill/openapi/Payments/apipayments-post.html#carddata","level":3}]},{"title":"Responses","href":"docs/ru/refill/openapi/Payments/apipayments-post.html#responses","level":2},{"title":"200 OK","href":"docs/ru/refill/openapi/Payments/apipayments-post.html#200-ok","level":2,"items":[{"title":"Body","href":"docs/ru/refill/openapi/Payments/apipayments-post.html#body1","level":3},{"title":"PaymentState","href":"docs/ru/refill/openapi/Payments/apipayments-post.html#paymentstate","level":3},{"title":"Confirmation","href":"docs/ru/refill/openapi/Payments/apipayments-post.html#confirmation","level":3},{"title":"HttpAction","href":"docs/ru/refill/openapi/Payments/apipayments-post.html#httpaction","level":3}]},{"title":"400 Bad Request","href":"docs/ru/refill/openapi/Payments/apipayments-post.html#400-bad-request","level":2,"items":[{"title":"Body","href":"docs/ru/refill/openapi/Payments/apipayments-post.html#body2","level":3}]},{"title":"409 Conflict","href":"docs/ru/refill/openapi/Payments/apipayments-post.html#409-conflict","level":2,"items":[{"title":"Body","href":"docs/ru/refill/openapi/Payments/apipayments-post.html#body3","level":3}]}],"title":"","includes":[],"html":"<div class=\"openapi\">\n<h1>Создать платеж.</h1>\n<p>Метод осуществляет проведение агентского платежа.</p>\n<p>Процесс провдения одностадийного платежа состоит из следующих шагов:</p>\n<ol>\n<li>Сформировать запрос на оплату</li>\n<li>Обработать ответ на запрос, выполнить необходимые действия для подтверждения платежа</li>\n<li>Обработать каллбек, о статусе операции, либо переопросить статус</li>\n</ol>\n<p><strong>Структура запроса отличиается от выбора платёжного инструмента:</strong></p>\n<table>\n<thead>\n<tr>\n<th>Способ оплаты paymentTool</th>\n<th>Значение параметра auth</th>\n<th>Описание</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>card</td>\n<td>card/token</td>\n<td>Транслируется номер банковской карты, CVC, срок действия карты. При оплате с последующей привязкой платёжного инструмента используется параметр token, в формате: token:\"partnerBindId:string\"</td>\n</tr>\n<tr>\n<td>mobile</td>\n<td>phone</td>\n<td>Транслируется номер телефона</td>\n</tr>\n<tr>\n<td>c2b_sbp</td>\n<td>-/token</td>\n<td>Для способа оплаты СБП не требуется передача платёжного инструмента, поэтому транслируется пустой объект \"auth\": {} При оплате с последующей привязкой платёжного инструмента используется параметр token, в формате: token:\"partnerBindId:string\"</td>\n</tr>\n<tr>\n<td>sberpay</td>\n<td>phone</td>\n<td>Транслируется номер телефона в качестве логина</td>\n</tr>\n<tr>\n<td>yoo_money</td>\n<td>phone</td>\n<td>Для этого способа олаты используется номер телефона в качестве логина</td>\n</tr>\n<tr>\n<td>tinkoff_invoicing</td>\n<td>phone</td>\n<td>Для этого способа олаты используется номер телефона в качестве логина</td>\n</tr>\n</tbody>\n</table>\n<p><strong>Двустадийная оплата</strong></p>\n<p>Пред-авторизация платежа позволяет интернет магазину самому принимать решение о списание денежных средств с платежного инструмента пользователя, что позволяет избежать дополнительных расходов в случае отказа от услуги или невозможности ее предоставления по каким либо причинам. Другими словами в момент оплаты счета средства на карте пользователя не списываются, а холдируются.</p>\n<p>Данный сценарии не сильно отличается от сценариев оплаты платёжным инструментом описанных, выше:</p>\n<p>В запросе <strong>/api/payments</strong> необходимо передать параметр <strong>WithHold</strong> со значением <strong>true</strong>. При успешном выполнении операции денежные средства будут захолдированы на платёжном инструменте клиента.</p>\n<p>После успешного выполнения операции <strong>/api/payments</strong>, в зависимости от условия выполнения заказа, необходимо:</p>\n<ol>\n<li>либо выполнить метод <strong>/api/payments/{partnerPaymentId}/accept</strong>, в данном случае операция примет конечный успешный статус, произойдёт списание с платёжного инструмента.</li>\n<li>либо метод метод <strong>/api/payments/{partnerPaymentId}/reject</strong>, в данном случае будет произведено расхолдирование денежных средств на платёжном инструменте</li>\n</ol>\n<p><strong>Обработка каллбека</strong></p>\n<p>По факту успешного выполнения операции будет сформирован ассинхронный каллбек на CallbackUrl, установленный в рамках партнёра.</p>\n<p>В поле type транслируется одно из значений - <strong>\"payment\", \"refund\", \"bind\"</strong><br />\nВ зависимости от этого значения структура каллбека будет отличаться:</p>\n<p>Структура каллбека с типом <strong>payment</strong></p>\n\n    <div class=\"yfm-clipboard\">\n        <pre><code class=\"hljs json\"><span class=\"hljs-attr\">\"type\"</span><span class=\"hljs-punctuation\">:</span> <span class=\"hljs-string\">\"payment\"</span><span class=\"hljs-punctuation\">,</span>\n  <span class=\"hljs-attr\">\"payment\"</span><span class=\"hljs-punctuation\">:</span> <span class=\"hljs-punctuation\">{</span>\n    <span class=\"hljs-attr\">\"paymentId\"</span><span class=\"hljs-punctuation\">:</span> <span class=\"hljs-string\">\"string\"</span><span class=\"hljs-punctuation\">,</span>\n    <span class=\"hljs-attr\">\"partnerPaymentId\"</span><span class=\"hljs-punctuation\">:</span> <span class=\"hljs-string\">\"string\"</span><span class=\"hljs-punctuation\">,</span>\n    <span class=\"hljs-attr\">\"paymentState\"</span><span class=\"hljs-punctuation\">:</span> <span class=\"hljs-string\">\"string\"</span><span class=\"hljs-punctuation\">,</span>\n    <span class=\"hljs-attr\">\"stateDescription\"</span><span class=\"hljs-punctuation\">:</span> <span class=\"hljs-string\">\"string\"</span><span class=\"hljs-punctuation\">,</span>\n    <span class=\"hljs-attr\">\"paid\"</span><span class=\"hljs-punctuation\">:</span> <span class=\"hljs-number\">0</span>\n  <span class=\"hljs-punctuation\">}</span>\n</code></pre>\n\n        <button class=\"yfm-clipboard-button\">\n            <svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"152\">\n                <path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"></path>\n                <path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\">\n                    <animate id=\"visibileAnimation-152\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin></animate>\n                    <animate id=\"hideAnimation-152\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-152.end+1\" fill=\"freeze\"></animate>\n                </path>\n            </svg>\n        </button>\n    </div>\n<p>Структура каллбека с типом <strong>refund</strong></p>\n\n    <div class=\"yfm-clipboard\">\n        <pre><code class=\"hljs json\"> <span class=\"hljs-attr\">\"refund\"</span><span class=\"hljs-punctuation\">:</span> <span class=\"hljs-punctuation\">{</span>\n    <span class=\"hljs-attr\">\"refundId\"</span><span class=\"hljs-punctuation\">:</span> <span class=\"hljs-string\">\"string\"</span><span class=\"hljs-punctuation\">,</span>\n    <span class=\"hljs-attr\">\"partnerRefundId\"</span><span class=\"hljs-punctuation\">:</span> <span class=\"hljs-string\">\"string\"</span><span class=\"hljs-punctuation\">,</span>\n    <span class=\"hljs-attr\">\"paymentId\"</span><span class=\"hljs-punctuation\">:</span> <span class=\"hljs-string\">\"string\"</span><span class=\"hljs-punctuation\">,</span>\n    <span class=\"hljs-attr\">\"partnerPaymentId\"</span><span class=\"hljs-punctuation\">:</span> <span class=\"hljs-string\">\"string\"</span><span class=\"hljs-punctuation\">,</span>\n    <span class=\"hljs-attr\">\"refundNumber\"</span><span class=\"hljs-punctuation\">:</span> <span class=\"hljs-number\">0</span><span class=\"hljs-punctuation\">,</span>\n    <span class=\"hljs-attr\">\"refundState\"</span><span class=\"hljs-punctuation\">:</span> <span class=\"hljs-string\">\"string\"</span><span class=\"hljs-punctuation\">,</span>\n    <span class=\"hljs-attr\">\"stateDescription\"</span><span class=\"hljs-punctuation\">:</span> <span class=\"hljs-string\">\"string\"</span><span class=\"hljs-punctuation\">,</span>\n    <span class=\"hljs-attr\">\"refunded\"</span><span class=\"hljs-punctuation\">:</span> <span class=\"hljs-number\">0</span>\n  <span class=\"hljs-punctuation\">}</span>\n</code></pre>\n\n        <button class=\"yfm-clipboard-button\">\n            <svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"156\">\n                <path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"></path>\n                <path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\">\n                    <animate id=\"visibileAnimation-156\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin></animate>\n                    <animate id=\"hideAnimation-156\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-156.end+1\" fill=\"freeze\"></animate>\n                </path>\n            </svg>\n        </button>\n    </div>\n<p>Структура каллбека для запросов <em>Bind</em>:</p>\n\n    <div class=\"yfm-clipboard\">\n        <pre><code class=\"hljs json\">    <span class=\"hljs-attr\">\"bind\"</span><span class=\"hljs-punctuation\">:</span> <span class=\"hljs-punctuation\">{</span>\n    <span class=\"hljs-attr\">\"bindId\"</span><span class=\"hljs-punctuation\">:</span> <span class=\"hljs-string\">\"string\"</span><span class=\"hljs-punctuation\">,</span>\n    <span class=\"hljs-attr\">\"partnerBindId\"</span><span class=\"hljs-punctuation\">:</span> <span class=\"hljs-string\">\"string\"</span><span class=\"hljs-punctuation\">,</span>\n    <span class=\"hljs-attr\">\"isActive\"</span><span class=\"hljs-punctuation\">:</span> <span class=\"hljs-literal\"><span class=\"hljs-keyword\">true</span></span>\n  <span class=\"hljs-punctuation\">}</span>\n<span class=\"hljs-punctuation\">}</span>\n</code></pre>\n\n        <button class=\"yfm-clipboard-button\">\n            <svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"160\">\n                <path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"></path>\n                <path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\">\n                    <animate id=\"visibileAnimation-160\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin></animate>\n                    <animate id=\"hideAnimation-160\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-160.end+1\" fill=\"freeze\"></animate>\n                </path>\n            </svg>\n        </button>\n    </div>\n<p><strong>Пример скрипта Python, формирующего запрос, и направляющего на страницу с вводом 3DS кода:</strong></p>\n\n    <div class=\"yfm-clipboard\">\n        <pre><code class=\"hljs python\"><span class=\"hljs-keyword\">import</span> requests\n<span class=\"hljs-keyword\">import</span> uuid\n<span class=\"hljs-keyword\">import</span> webbrowser\n<span class=\"hljs-keyword\">from</span> urllib.parse <span class=\"hljs-keyword\">import</span> urlencode\n\n<span class=\"hljs-comment\"># Функция для отправки POST-запроса и обработки ответа</span>\n<span class=\"hljs-keyword\">def</span> <span class=\"hljs-title function_\">create_payment_request</span>():\n    <span class=\"hljs-comment\"># URL для отправки запроса</span>\n    url = <span class=\"hljs-string\">\"http://10.203.148.11:5012/api/payments\"</span>\n    \n    <span class=\"hljs-comment\"># Заголовки запроса</span>\n    headers = {\n        <span class=\"hljs-string\">\"Content-Type\"</span>: <span class=\"hljs-string\">\"application/json\"</span>,\n        <span class=\"hljs-string\">\"Accept\"</span>: <span class=\"hljs-string\">\"application/json\"</span>,\n        <span class=\"hljs-string\">\"ApiKey\"</span>: <span class=\"hljs-string\">\"testpartner.3YrQlwYnTcZUljVIi9FsxjuJiocj4Fyf\"</span>\n    }\n    \n    <span class=\"hljs-comment\"># Генерация уникального GUID для partnerPaymentId</span>\n    partner_payment_id = <span class=\"hljs-built_in\">str</span>(uuid.uuid4())\n    \n    <span class=\"hljs-comment\"># Тело запроса</span>\n    payload = {\n        <span class=\"hljs-string\">\"amount\"</span>: {\n            <span class=\"hljs-string\">\"currency\"</span>: <span class=\"hljs-number\">643</span>,\n            <span class=\"hljs-string\">\"value\"</span>: <span class=\"hljs-number\">10</span>\n        },\n        <span class=\"hljs-string\">\"auth\"</span>: {\n            <span class=\"hljs-string\">\"card\"</span>: {\n                <span class=\"hljs-string\">\"cvv\"</span>: <span class=\"hljs-string\">\"123\"</span>,\n                <span class=\"hljs-string\">\"expireMonth\"</span>: <span class=\"hljs-string\">\"12\"</span>,\n                <span class=\"hljs-string\">\"expireYear\"</span>: <span class=\"hljs-string\">\"2026\"</span>,\n                <span class=\"hljs-string\">\"holder\"</span>: <span class=\"hljs-string\">\"INSTANT CARD\"</span>,\n                <span class=\"hljs-string\">\"pan\"</span>: <span class=\"hljs-string\">\"2201382000000047\"</span>\n            }\n        },\n        <span class=\"hljs-string\">\"partnerMerchantId\"</span>: <span class=\"hljs-string\">\"Тест мерч\"</span>,\n        <span class=\"hljs-string\">\"partnerPaymentId\"</span>: partner_payment_id,\n        <span class=\"hljs-string\">\"paymentTool\"</span>: <span class=\"hljs-string\">\"card\"</span>,\n        <span class=\"hljs-string\">\"redirect\"</span>: {\n            <span class=\"hljs-string\">\"failUrl\"</span>: <span class=\"hljs-string\">\"http://localhost:8000/1\"</span>,\n            <span class=\"hljs-string\">\"successUrl\"</span>: <span class=\"hljs-string\">\"http://localhost:8000/2\"</span>\n        },\n        <span class=\"hljs-string\">\"description\"</span>: <span class=\"hljs-string\">\"123\"</span>\n    }\n    \n    <span class=\"hljs-comment\"># Отправка POST-запроса</span>\n    response = requests.post(url, json=payload, headers=headers)\n    \n    <span class=\"hljs-comment\"># Проверка статуса ответа</span>\n    <span class=\"hljs-keyword\">if</span> response.status_code == <span class=\"hljs-number\">200</span>:\n        <span class=\"hljs-comment\"># Парсинг JSON-ответа</span>\n        response_data = response.json()\n        \n        <span class=\"hljs-comment\"># Извлечение данных из ответа</span>\n        payment_id = response_data.get(<span class=\"hljs-string\">\"paymentId\"</span>)\n        partner_payment_id = response_data.get(<span class=\"hljs-string\">\"partnerPaymentId\"</span>)\n        con
