                   window.STATIC_CONTENT = false
                   window.__DATA__ = {"data":{"meta":{"metadata":[{"name":"generator","content":"Diplodoc Platform v4.57.7"}],"style":["_assets/cut-extension.css"],"script":["_assets/cut-extension.js"]},"assets":[],"headings":[{"title":"Request","href":"docs/ru/refill/openapi/Refunds/apirefunds-post.html#request","level":2,"items":[{"title":"Body","href":"docs/ru/refill/openapi/Refunds/apirefunds-post.html#body","level":3}]},{"title":"Responses","href":"docs/ru/refill/openapi/Refunds/apirefunds-post.html#responses","level":2},{"title":"200 OK","href":"docs/ru/refill/openapi/Refunds/apirefunds-post.html#200-ok","level":2,"items":[{"title":"Body","href":"docs/ru/refill/openapi/Refunds/apirefunds-post.html#body1","level":3},{"title":"OperationState","href":"docs/ru/refill/openapi/Refunds/apirefunds-post.html#operationstate","level":3}]},{"title":"400 Bad Request","href":"docs/ru/refill/openapi/Refunds/apirefunds-post.html#400-bad-request","level":2,"items":[{"title":"Body","href":"docs/ru/refill/openapi/Refunds/apirefunds-post.html#body2","level":3}]},{"title":"404 Not Found","href":"docs/ru/refill/openapi/Refunds/apirefunds-post.html#404-not-found","level":2,"items":[{"title":"Body","href":"docs/ru/refill/openapi/Refunds/apirefunds-post.html#body3","level":3}]},{"title":"409 Conflict","href":"docs/ru/refill/openapi/Refunds/apirefunds-post.html#409-conflict","level":2}],"title":"","includes":[],"html":"<div class=\"openapi\">\n<h1>Создать возврат.</h1>\n<p>Метод осуществляет нативный возврат операции.<br />\nДанное API позволяет интернет магазинам осуществлять возвраты, по ранее оплаченным платежам. Чтобы осуществить возврат по конкретному платежу, данный платеж должен находиться в статусе Paid и шлюз, через который прошел платеж, должен поддерживать данный функционал, на данный момент не все шлюзы поддерживают возвраты.</p>\n<p>Возвраты - асинхронная операция и состоит из двух этапов:</p>\n<ol>\n<li>создание запроса на осуществление возврата по указанному платежу,</li>\n<li>получение статуса запроса на осуществление возврата по указанному платежу, либо обработка ассинхронного каллбека</li>\n</ol>\n<p>В процессе обработки запроса на возврат по платежу, Refund изменяет свой статус до получения конечного, при этом могут возникнуть ошибки и по инициативе интернет магазина запрос можно повторить.</p>\n<p>Возвраты могут принимать слудующие статусы:</p>\n<table>\n<thead>\n<tr>\n<th>Статус</th>\n<th>Описание</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>None 0</td>\n<td>Запрос принят, возврат создан, обработка пока не началась, статус не известен</td>\n</tr>\n<tr>\n<td>Processing 1</td>\n<td>В процессе отмены</td>\n</tr>\n<tr>\n<td>Success 2</td>\n<td>Отмена успешно выполнена</td>\n</tr>\n<tr>\n<td>Error 4</td>\n<td>Ошибка в процессе отмены</td>\n</tr>\n</tbody>\n</table>\n<p>Не допускается повторная отправка запроса, если по указанному платежу ранее был создан Refund и он находится в следующих статусах (None, Processing, Success). В случае отправки запроса будет возвращена ошибка.</p>\n<p>Для осуществления частичных возвратов нужно передать значение ammount с нужной суммой, меньшей суммы основного платежа</p>\n<h2 id=\"request\"><a href=\"docs/ru/refill/openapi/Refunds/apirefunds-post.html#request\" class=\"yfm-anchor\" aria-hidden=\"true\"><span class=\"visually-hidden\" data-no-index=\"true\">Request</span></a>Request</h2>\n<div class=\"openapi__requests\">\n<div class=\"openapi__request__wrapper\" style=\"--method:var(--dc-openapi-methods-post);margin-bottom:12px\">\n<div class=\"openapi__request\">\n<p class=\"openapi__method\">POST</p>\n\n    <div class=\"yfm-clipboard\">\n        <pre><code class=\"hljs text\">http://10.203.148.11:5012/api/refunds\n</code></pre>\n\n        <button class=\"yfm-clipboard-button\">\n            <svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"89\">\n                <path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2
