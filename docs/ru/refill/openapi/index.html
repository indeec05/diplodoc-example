                <script type="application/javascript">
                   window.STATIC_CONTENT = false
                   window.__DATA__ = {"data":{"meta":{"metadata":[{"name":"generator","content":"Diplodoc Platform v4.57.7"}],"style":["_assets/cut-extension.css"],"script":["_assets/cut-extension.js"]},"assets":[],"headings":[{"title":"Sections","href":"docs/ru/refill/openapi/index.html#sections","level":2},{"title":"Specification","href":"docs/ru/refill/openapi/index.html#specification","level":2}],"title":"WalletOne.Refill.Partner.Api","includes":[],"html":"<p><samp>version: 3.0.0</samp></p>\n<p><strong>Общее описание</strong></p>\n<p>Данный документ представляет собой описание протокола, предназначенного для интеграции партнёра с системой Refill Service.<br />\nОбщее описание проекта:</p>\n<p>Refill service является компонентом, взаимодействия внешних и внутренних партнёрских приложений с сервисами для проведения платежей, через сторонних агентов</p>\n<p>Основные функции данного компонента:</p>\n<ul>\n<li>унификация различных агентских протоколов, в рамках единого партнёрсокго протокола</li>\n<li>проведения операций списания денежных средств с платёжных инструментов, путём интеграционного взаимодействия с платёжными агентами.</li>\n<li>взаимодействие с другими компонентами ГК Wallet One для осуществление процесса проведения платежей</li>\n<li>формирования реестров. для отражения данных операций в виде банковских транзакций.</li>\n</ul>\n<p><strong>Авторизация запросов</strong></p>\n<p>Авторизация платежа осуществляется при помощи параметра ApiKey</p>\n<p><strong>Обработка ошибок</strong></p>\n<p>Ошибки возвращаются в HTTP-статусе кодом 4xx и 5xx, согласно RFC 2616. В ответе может содержаться объект detail, содержащий дополнительную информацию об ошибке.<br />\nПример структуры ошибки:</p>\n\n    <div class=\"yfm-clipboard\">\n        <pre><code class=\"hljs json\"><span class=\"hljs-punctuation\">{</span>\n    <span class=\"hljs-attr\">\"title\"</span><span class=\"hljs-punctuation\">:</span> <span class=\"hljs-string\">\"refill partner api error\"</span><span class=\"hljs-punctuation\">,</span>\n    <span class=\"hljs-attr\">\"status\"</span><span class=\"hljs-punctuation\">:</span> <span class=\"hljs-number\">409</span><span class=\"hljs-punctuation\">,</span>\n    <span class=\"hljs-attr\">\"detail\"</span><span class=\"hljs-punctuation\">:</span> <span class=\"hljs-string\">\"error Response status code does not indicate success: 409 (Conflict)., content: {\\\"title\\\":\\\"refill api error\\\",\\\"status\\\":409,\\\"detail\\\":\\\"payment duplicate paymentId: 12c726dc-d99b-4e63-875a-9578ac4549ea, partnerId: 60d06446-41fa-43b9-aa70-cd20ccf158e5, partnerPaymentId: 1124124124124124124124111121231231112111311111111111111111121512151511111141111111111111111\\\",\\\"instance\\\":\\\"POST /api/payments\\\",\\\"error\\\":\\\"payment_duplicate\\\",\\\"paymentId\\\":\\\"12c726dc-d99b-4e63-875a-9578ac4549ea\\\",\\\"partnerId\\\":\\\"60d06446-41fa-43b9-aa70-cd20ccf158e5\\\",\\\"partnerPaymentId\\\":\\\"1124124124124124124124111121231231112111311111111111111111121512151511111141111111111111111\\\"}\"</span><span class=\"hljs-punctuation\">,</span>\n    <span class=\"hljs-attr\">\"instance\"</span><span class=\"hljs-punctuation\">:</span> <span class=\"hljs-string\">\"POST /api/payments\"</span>\n<span class=\"hljs-punctuation\">}</span>\n</code></pre>\n\n        <button class=\"yfm-clipboard-button\">\n            <svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"49\">\n                <path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"></path>\n                <path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\">\n                    <animate id=\"visibileAnimation-49\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin></animate>\n                    <animate id=\"hideAnimation-49\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-49.end+1\" fill=\"freeze\"></animate>\n                </path>\n            </svg>\n        </button>\n    </div>\n<h2 id=\"sections\"><a href=\"docs/ru/refill/openapi/index.html#sections\" class=\"yfm-anchor\" aria-hidden=\"true\"><span class=\"visually-hidden\" data-no-index=\"true\">Sections</span></a>Sections</h2>\n<ul>\n<li><a href=\"docs/ru/refill/openapi/Binds/index.html\">Binds</a></li>\n<li><a href=\"docs/ru/refill/openapi/Merchants/index.html\">Merchants</a></li>\n<li><a href=\"docs/ru/refill/openapi/Payments/index.html\">Payments</a></li>\n<li><a href=\"docs/ru/refill/openapi/Refunds/index.html\">Refunds</a></li>\n</ul>\n<h2 id=\"specification\"><a href=\"docs/ru/refill/openapi/index.html#specification\" class=\"yfm-anchor\" aria-hidden=\"true\"><span class=\"visually-hidden\" data-no-index=\"true\">Specification</span></a>Specification</h2>\n<details class=\"yfm-cut\"><summary class=\"yfm-cut-title\">Open API</summary><div class=\"yfm-cut-content\">\n    <div class=\"yfm-clipboard\">\n        <pre><code class=\"hljs text\">{\n    \"openapi\": \"3.0.1\",\n    \"x-stoplight\": {\n        \"id\": \"syoj9479hp2rs\"\n    },\n    \"info\": {\n        \"title\": \"WalletOne.Refill.Partner.Api\",\n        \"version\": \"3.0.0\",\n        \"description\": \"**Общее описание**\\r\\n\\r\\nДанный документ представляет собой описание протокола, предназначенного для интеграции партнёра с системой Refill Service.\\r\\nОбщее описание проекта:\\r\\n\\r\\nRefill service является компонентом, взаимодействия внешних и внутренних партнёрских приложений с сервисами для проведения платежей, через сторонних агентов\\r\\n\\r\\nОсновные функции данного компонента:\\r\\n\\r\\n- унификация различных агентских протоколов, в рамках единого партнёрсокго протокола\\r\\n- проведения операций списания денежных средств с платёжных инструментов, путём интеграционного взаимодействия с платёжными агентами.\\r\\n- взаимодействие с другими компонентами ГК Wallet One для осуществление процесса проведения платежей\\r\\n- формирования реестров. для отражения данных операций в виде банковских транзакций.\\r\\n\\r\\n**Авторизация запросов**\\r\\n\\r\\nАвторизация платежа осуществляется при помощи параметра ApiKey\\r\\n\\r\\n**Обработка ошибок**\\r\\n\\r\\nОшибки возвращаются в HTTP-статусе кодом 4xx и 5xx, согласно RFC 2616. В ответе может содержаться объект detail, содержащий дополнительную информацию об ошибке.\\r\\nПример структуры ошибки:\\r\\n\\r\\n```json\\r\\n{\\r\\n    \\\"title\\\": \\\"refill partner api error\\\",\\r\\n    \\\"status\\\": 409,\\r\\n    \\\"detail\\\": \\\"error Response status code does not indicate success: 409 (Conflict)., content: {\\\\\\\"title\\\\\\\":\\\\\\\"refill api error\\\\\\\",\\\\\\\"status\\\\\\\":409,\\\\\\\"detail\\\\\\\":\\\\\\\"payment duplicate paymentId: 12c726dc-d99b-4e63-875a-9578ac4549ea, partnerId: 60d06446-41fa-43b9-aa70-cd20ccf158e5, partnerPaymentId: 1124124124124124124124111121231231112111311111111111111111121512151511111141111111111111111\\\\\\\",\\\\\\\"instance\\\\\\\":\\\\\\\"POST /api/payments\\\\\\\",\\\\\\\"error\\\\\\\":\\\\\\\"payment_duplicate\\\\\\\",\\\\\\\"paymentId\\\\\\\":\\\\\\\"12c726dc-d99b-4e63-875a-9578ac4549ea\\\\\\\",\\\\\\\"partnerId\\\\\\\":\\\\\\\"60d06446-41fa-43b9-aa70-cd20ccf158e5\\\\\\\",\\\\\\\"partnerPaymentId\\\\\\\":\\\\\\\"1124124124124124124124111121231231112111311111111111111111121512151511111141111111111111111\\\\\\\"}\\\",\\r\\n    \\\"instance\\\": \\\"POST /api/payments\\\"\\r\\n}\\r\\n```\\r\\n\\r\\n\",\n        \"contact\": {\n            \"name\": \"\"\n        }\n    },\n    \"paths\": {\n        \"/api/binds\": {\n            \"post\": {\n                \"tags\": [\n                    \"Binds\"\n                ],\n                \"summary\": \"Создать привязку.\",\n                \"requestBody\": {\n                    \"content\": {\n bject\",\n                                                \"properties\": {\n                                                    \"pan\": {\n                                                        \"minLength\": 1,\n                                                        \"type\": \"string\",\n                                                        \"default\": \"4111111111111111\"\n                                                    },\n                                                    \"cvv\": {\n                                                        \"minLength\": 1,\n                                                        \"type\": \"string\",\n                                                        \"default\": \"123\"\n                                                    },\n                                                    \"holder\": {\n                                                        \"minLength\": 1,\n                                                        \"type\": \"string\",\n                                                        \"default\": \"Тест\"\n                                                    },\n                                                    \"expireYear\": {\n                                                        \"type\": \"integer\",\n                                                        \"format\": \"int32\",\n                                                        \"default\": 25\n                                                    },\n                                                    \"expireMonth\": {\n                                                        \"type\": \"integer\",\n                                                        \"format\": \"int32\",\n                                                        \"default\": 12\n                                                    }\n                                                },\n                                                \"additionalProperties\": false,\n                                                \"x-stoplight\": {\n                                                    \"id\": \"9fy7zlmj4j3l6\"\n                                                }\n                                            },\n                                            \"phone\": {\n                                                \"type\": \"string\",\n                                                \"description\": \"Телефон в формете +7xxxxxxxxxx\",\n                                                \"default\": \"+70000000000\",\n                                                \"nullable\": true\n                                            },\n                                            \"login\": {\n                                                \"type\": \"string\",\n                                                \"description\": \"Логин\",\n                                                \"default\": \"any login\",\n                                                \"nullable\": true\n                                            },\n                                            \"token\": {\n                                                \"type\": \"string\",\n                                                \"description\": \"Токен\",\n                                                \"default\": \"any token\",\n                                                \"nullable\": true\n                                            }\n                                        },\n                                        \"additionalProperties\": false,\n                                        \"x-stoplight\": {\n                                            \"id\": \"f21n73k61ul9y\"\n                                        }\n                                    },\n                                    \"redirect\": {\n                                        \"required\": [\n                                            \"failUrl\",\n                                            \"successUrl\"\n                                        ],\n                                        \"type\": \"object\",\n                                        \"properties\": {\n                                            \"successUrl\": {\n                                                \"minLength\": 1,\n                                                \"type\": \"string\",\n                                                \"description\": \"Перенаправления в случае успеха\",\n                                                \"default\": \"http://localhost/success\"\n                                            },\n                                            \"failUrl\": {\n                                                \"minLength\": 1,\n                                                \"type\": \"string\",\n                                                \"description\": \"Перенаправления в случае ошибки\",\n                                                \"default\": \"http://localhost/fail\"\n                                            }\n                                        },\n                                        \"additionalProperties\": false,\n                                        \"x-stoplight\": {\n                                            \"id\": \"ddyl3xrk9povy\"\n                                        }\n                                    },\n                                    \"description\": {\n                                        \"type\": \"string\",\n                                        \"description\": \"Описание привязки.\",\n                                        \"default\": \"тестовая привязка\",\n                                        \"nullable\": true\n                                    }\n                                },\n                                \"additionalProperties\": false,\n                                \"x-stoplight\": {\n                                    \"id\": \"l2ii1kkhso1kr\"\n                                }\n                            }\n                        }\n                    }\n                },\n                \"responses\": {\n                    \"200\": {\n                        \"description\": \"```json\\r\\n{\\r\\n  \\\"partnerBindId\\\": \\\"12312312311211\\\",\\r\\n  \\\"bindId\\\": \\\"5bc6a992-8e8d-4ac0-be10-ea55338e9328\\\",\\r\\n  \\\"channelBindId\\\": \\\"03be6fb5-4a06-7513-ad09-3711021127c4\\\",\\r\\n  \\\"confirmation\\\": {\\r\\n    \\\"confirmType\\\": \\\"qr\\\",\\r\\n    \\\"actions\\\": [\\r\\n      {\\r\\n        \\\"url\\\": \\\"https://sub.nspk.ru/210ea006fe994e37ae8e0cf6aa2225e9\\\",\\r\\n        \\\"method\\\": \\\"GET\\\"\\r\\n      }\\r\\n    ]\\r\\n  },\\r\\n  \\\"channelBindProperties\\\": {}\\r\\n}\\r\\n```\",\n                        \"content\": {\n                            \"application/json\": {\n                                \"schema\": {\n                                    \"required\": [\n                                        \"bindId\",\n                                        \"channelBindId\",\n                                        \"channelBindProperties\",\n                                        \"confirmation\",\n                                        \"partnerBindId\"\n                                    ],\n                                    \"type\": \"object\",\n                                    \"properties\": {\n                                        \"partnerBindId\": {\n                                            \"minLength\": 1,\n                                            \"type\": \"string\",\n                                            \"description\": \"Идентификатор привязки на стороне партнера.\"\n                                        },\n                                        \"bindId\": {\n                                            \"type\": \"string\",\n                                            \"description\": \"Идентификатор привязки в refill-service.\",\n                                            \"format\": \"uuid\"\n                                        },\n                                        \"channelBindId\": {\n                                            \"type\": \"string\",\n                                            \"description\": \"Идентификатор привязки на стороне агентского канала.\",\n                                            \"nullable\": true\n                                        },\n                                        \"confirmation\": {\n                                            \"required\": [\n                                                \"confirmType\"\n                                            ],\n                                            \"type\": \"object\",\n                                            \"properties\": {\n                                                \"confirmType\": {\n                                                    \"minLength\": 1,\n                                                    \"type\": \"string\",\n                                                    \"description\": \"Тип подверждения.\"\n                                                },\n                                                \"actions\": {\n                                                    \"type\": \"array\",\n                                                    \"items\": {\n                                                        \"required\": [\n                                                            \"method\",\n                                                            \"url\"\n                                                        ],\n                                                        \"type\": \"object\",\n                                                        \"properties\": {\n                                                            \"url\": {\n                                                                \"minLength\": 1,\n                                                                \"type\": \"string\",\n                                                                \"description\": \"Http aдрес.\"\n                                                            },\n                                                            \"method\": {\n                                                                \"type\": \"string\",\n                                                                \"description\": \"Http метод POST|GET\",\n                                                                \"nullable\": true\n                                                            },\n                                                            \"params\": {\n                                                                \"type\": \"object\",\n                                                                \"additionalProperties\": {\n                                                                    \"type\": \"string\"\n                                                                },\n                                                                \"description\": \"Параметры вызова метода.\",\n                                                                \"nullable\": true\n                                                            }\n                                                        },\n                                                        \"additionalProperties\": false,\n                                                        \"x-stoplight\": {\n                                                            \"id\": \"4zm1ul92wed84\"\n                                                        }\n                                                    },\n                                                    \"description\": \"Действия для подтверждения.\",\n                                                    \"nullable\": true\n                                                }\n                                            },\n                                            \"additionalProperties\": false,\n                                            \"x-stoplight\": {\n                                                \"id\": \"undm64tyev4de\"\n                                            }\n                                        },\n                                        \"channelBindProperties\": {\n                                            \"type\": \"object\",\n                                            \"additionalProperties\": {\n                                                \"type\": \"string\"\n                                            },\n                                            \"description\": \"Дополнительные данные привязки на стороне агентского канала.\",\n                                            \"nullable\": true\n                                        }\n                                    },\n                                    \"additionalProperties\": false,\n                                    \"x-stoplight\": {\n                                        \"id\": \"k1bpyt34a9eyp\"\n                                    }\n                                }\n                            }\n                        }\n                    },\n                    \"400\": {\n                        \"description\": \"Bad Request\",\n                        \"content\": {\n                            \"application/json\": {\n                                \"schema\": {\n                                    \"type\": \"object\",\n                                    \"properties\": {\n                                        \"type\": {\n                                            \"type\": \"string\",\n                                            \"nullable\": true\n                                        },\n                                        \"title\": {\n                                            \"type\": \"string\",\n                                            \"nullable\": true\n                                        },\n                                        \"status\": {\n                                            \"type\": \"integer\",\n                                            \"format\": \"int32\",\n                                            \"nullable\": true\n                                        },\n                                        \"detail\": {\n                                            \"type\": \"string\",\n                                            \"nullable\": true\n                                        },\n                                        \"instance\": {\n                                            \"type\": \"string\",\n                                            \"nullable\": true\n                                        }\n                                    },\n                                    \"additionalProperties\": {},\n                                    \"x-stoplight\": {\n                                        \"id\": \"qx3fnsuayrkmx\"\n                                    }\n                                }\n                            }\n                        }\n                    },\n                    \"409\": {\n                        \"description\": \"Conflict\",\n                        \"content\": {\n                            \"application/json\": {\n                                \"schema\": {\n                                    \"type\": \"object\",\n                                    \"properties\": {\n                                        \"type\": {\n                                            \"type\": \"string\",\n                                            \"nullable\": true\n                                        },\n                                        \"title\": {\n                                            \"type\": \"string\",\n                                            \"nullable\": true\n                                        },\n                                        \"status\": {\n                                            \"type\": \"integer\",\n                                            \"format\": \"int32\",\n                                            \"nullable\": true\n                                        },\n                                        \"detail\": {\n                                            \"type\": \"string\",\n                                            \"nullable\": true\n                                        },\n                                        \"instance\": {\n                                            \"type\": \"string\",\n                                            \"nullable\": true\n                                        }\n                                    },\n                                    \"additionalProperties\": {},\n                                    \"x-stoplight\": {\n                                        \"id\": \"qx3fnsuayrkmx\"\n                                    }\n                                }\n                            }\n                        }\n                    }\n                },\n                \"x-stoplight\": {\n                    \"id\": \"d9h60gc6fme0k\"\n                },\n                \"description\": \"Метод позволяет создать реккурентную привязку, без оплаты, по которой, в последующем можно\\r\\nпроизводить оплату.\\r\\n\\r\\nРекуррентные операции позволяют интернет-магазину производить списание средств с банковских карт своих плательщиков без повторного запроса ввода реквизитов карты, и подтверждения.\\r\\n\\r\\nДля возможности проведения рекуррентного платежа необходимо вначале сохранить и привязать платежный инструмент, это происходит в момент оплаты при передаче соответствующих параметров, либо в рамках отдельного запроса.\\r\\nПо факту исполнения привязки, в ответе, будет передана инструкция по редиректу пользователя, для выполннеен ,\n                                        \"detail\": {\n                                            \"type\": \"string\",\n                                            \"nullable\": true\n                                        },\n                                        \"instance\": {\n                                            \"type\": \"string\",\n                                            \"nullable\": true\n                                        }\n                                    },\n                                    \"additionalProperties\": {},\n                                    \"x-stoplight\": {\n                                        \"id\": \"qx3fnsuayrkmx\"\n                                    }\n                                }\n                            }\n                        }\n                    }\n                },\n                \"x-stoplight\": {\n                    \"id\": \"rs8vzplwrudm4\"\n                },\n                \"description\": \"Метод осуществляет проведение агентского платежа.\\r\\n\\r\\nПроцесс провдения одностадийного платежа состоит из следующих шагов:\\r\\n\\r\\n1. Сформировать запрос на оплату\\r\\n2. Обработать ответ на запрос, выполнить необходимые действия для подтверждения платежа\\r\\n3. Обработать каллбек, о статусе операции, либо переопросить статус\\r\\n\\r\\n**Структура запроса отличиается от выбора платёжного инструмента:**\\r\\n\\r\\nСпособ оплаты paymentTool | Значение параметра auth  | Описание\\r\\n---------|----------|---------\\r\\n card | card/token | Транслируется номер банковской карты, CVC, срок действия карты. При оплате с последующей привязкой платёжного инструмента используется параметр token, в формате: token:\\\"partnerBindId:string\\\" \\r\\n mobile | phone | Транслируется номер телефона\\r\\n c2b_sbp | -/token | Для способа оплаты СБП не требуется передача платёжного инструмента, поэтому транслируется пустой объект \\\"auth\\\": {} При оплате с последующей привязкой платёжного инструмента используется параметр token, в формате: token:\\\"partnerBindId:string\\\"\\r\\n sberpay | phone | Транслируется номер телефона в качестве логина\\r\\n yoo_money | phone | Для этого способа олаты используется номер телефона в качестве логина\\r\\n tinkoff_invoicing| phone | Для этого способа олаты используется номер телефона в качестве логина\\r\\n\\r\\n\\r\\n**Двустадийная оплата**\\r\\n\\r\\nПред-авторизация платежа позволяет интернет магазину самому принимать решение о списание денежных средств с платежного инструмента пользователя, что позволяет избежать дополнительных расходов в случае отказа от услуги или невозможности ее предоставления по каким либо причинам. Другими словами в момент оплаты счета средства на карте пользователя не списываются, а холдируются.\\r\\n\\r\\nДанный сценарии не сильно отличается от сценариев оплаты платёжным инструментом описанных, выше:\\r\\n\\r\\nВ запросе **/api/payments** необходимо передать параметр **WithHold** со значением **true**. При успешном выполнении операции денежные средства будут захолдированы на платёжном инструменте клиента.\\r\\n\\r\\nПосле успешного выполнения операции **/api/payments**, в зависимости от условия выполнения заказа, необходимо:\\r\\n\\r\\n1. либо выполнить метод **/api/payments/{partnerPaymentId}/accept**, в данном случае операция примет конечный успешный статус, произойдёт списание с платёжного инструмента.\\r\\n2. либо метод метод **/api/payments/{partnerPaymentId}/reject**, в данном случае будет произведено расхолдирование денежных средств на платёжном инструменте\\r\\n\\r\\n\\r\\n**Обработка каллбека**\\r\\n\\r\\nПо факту успешного выполнения операции будет сформирован ассинхронный каллбек на CallbackUrl, установленный в рамках партнёра.\\r\\n\\r\\n\\r\\nВ поле type транслируется одно из значений - **\\\"payment\\\", \\\"refund\\\", \\\"bind\\\"**\\r\\nВ зависимости от этого значения структура каллбека будет отличаться:\\r\\n\\r\\nСтруктура каллбека с типом **payment**\\r\\n\\r\\n```json\\r\\n\\\"type\\\": \\\"payment\\\",\\r\\n  \\\"payment\\\": {\\r\\n    \\\"paymentId\\\": \\\"string\\\",\\r\\n    \\\"partnerPaymentId\\\": \\\"string\\\",\\r\\n    \\\"paymentState\\\": \\\"string\\\",\\r\\n    \\\"stateDescription\\\": \\\"string\\\",\\r\\n    \\\"paid\\\": 0\\r\\n  }\\r\\n```\\r\\n\\r\\nСтруктура каллбека с типом **refund**\\r\\n\\r\\n```json\\r\\n \\\"refund\\\": {\\r\\n    \\\"refundId\\\": \\\"string\\\",\\r\\n    \\\"partnerRefundId\\\": \\\"string\\\",\\r\\n    \\\"paymentId\\\": \\\"string\\\",\\r\\n    \\\"partnerPaymentId\\\": \\\"string\\\",\\r\\n    \\\"refundNumber\\\": 0,\\r\\n    \\\"refundState\\\": \\\"string\\\",\\r\\n    \\\"stateDescription\\\": \\\"string\\\",\\r\\n    \\\"refunded\\\": 0\\r\\n  }\\r\\n```\\r\\n\\r\\n  Структура каллбека для запросов *Bind*:\\r\\n\\r\\n```json\\r\\n    \\\"bind\\\": {\\r\\n    \\\"bindId\\\": \\\"string\\\",\\r\\n    \\\"partnerBindId\\\": \\\"string\\\",\\r\\n    \\\"isActive\\\": true\\r\\n  }\\r\\n}\\r\\n```\\r\\n\\r\\n**Пример скрипта Python, формирующего запрос, и направляющего на страницу с вводом 3DS кода:**\\r\\n```python\\r\\nimport requests\\r\\nimport uuid\\r\\nimport webbrowser\\r\\nfrom urllib.parse import urlencode\\r\\n\\r\\n# Функция для отправки POST-запроса и обработки ответа\\r\\ndef create_payment_request():\\r\\n    # URL для отправки запроса\\r\\n    url = \\\"http://10.203.148.11:5012/api/payments\\\"\\r\\n    \\r\\n    # Заголовки запроса\\r\\n    headers = {\\r\\n        \\\"Content-Type\\\": \\\"application/json\\\",\\r\\n        \\\"Accept\\\": \\\"application/json\\\",\\r\\n        \\\"ApiKey\\\": \\\"testpartner.3YrQlwYnTcZUljVIi9FsxjuJiocj4Fyf\\\"\\r\\n    }\\r\\n    \\r\\n    # Генерация уникального GUID для partnerPaymentId\\r\\n    partner_payment_id = str(uuid.uuid4())\\r\\n    \\r\\n    # Тело запроса\\r\\n    payload = {\\r\\n        \\\"amount\\\": {\\r\\n            \\\"currency\\\": 643,\\r\\n            \\\"value\\\": 10\\r\\n        },\\r\\n ns[0].get(\\\"method\\\")\\r\\n            \\r\\n            print(f\\\"Redirect URL: {redirect_url}\\\")\\r\\n            print(f\\\"Redirect Method: {redirect_method}\\\")\\r\\n            \\r\\n            # Формирование HTML-формы для редиректа\\r\\n            html_form = f\\\"\\\"\\\"\\r\\n            &lt;!DOCTYPE html&gt;\\r\\n            &lt;html lang=\\\"en\\\"&gt;\\r\\n            &lt;head&gt;\\r\\n                &lt;meta charset=\\\"UTF-8\\\"&gt;\\r\\n                &lt;meta name=\\\"viewport\\\" content=\\\"width=device-width, initial-scale=1.0\\\"&gt;\\r\\n                &lt;title&gt;3DS Redirect&lt;/title&gt;\\r\\n                &lt;script&gt;\\r\\n                    window.onload = function() {{\\r\\n                        document.getElementById('redirectForm').submit();\\r\\n                    }};\\r\\n                &lt;/script&gt;\\r\\n            &lt;/head&gt;\\r\\n            &lt;body&gt;\\r\\n                &lt;h1&gt;Redirecting to 3DS verification...&lt;/h1&gt;\\r\\n                &lt;form id=\\\"redirectForm\\\" action=\\\"{redirect_url}\\\" method=\\\"{redirect_method}\\\"&gt;\\r\\n                    &lt;input type=\\\"hidden\\\" name=\\\"channelPaymentId\\\" value=\\\"{channel_payment_id}\\\" /&gt;\\r\\n                &lt;/form&gt;\\r\\n            &lt;/body&gt;\\r\\n            &lt;/html&gt;\\r\\n            \\\"\\\"\\\"\\r\\n            \\r\\n            # Сохранение HTML-формы во временный файл\\r\\n            with open(\\\"redirect.html\\\", \\\"w\\\", encoding=\\\"utf-8\\\") as file:\\r\\n                file.write(html_form)\\r\\n            \\r\\n            # Открытие файла в браузере\\r\\n            webbrowser.open(\\\"redirect.html\\\")\\r\\n        else:\\r\\n            print(\\\"No redirect information found in the response.\\\")\\r\\n    else:\\r\\n        print(f\\\"Error: Unable to process request. Status code: {response.status_code}\\\")\\r\\n        print(response.text)\\r\\n\\r\\n# Вызов функции\\r\\ncreate_payment_request()\\r\\n```\\r\\n**Пример реализации скрипта на Python, обрабатывающего полученный каллбек:**\\r\\n\\r\\n```python\\r\\nfrom flask import Flask, request, jsonify\\r\\nimport logging\\r\\nimport sys\\r\\nimport json\\r\\n\\r\\napp = Flask(name)\\r\\n\\r\\nlogging.basicConfig(\\r\\n    level=logging.INFO,\\r\\n    format='%(asctime)s - %(levelname)s - %(message)s',\\r\\n    stream=sys.stdout\\r\\n)\\r\\nlogger = logging.getLogger(name)\\r\\n\\r\\n@app.route('/webhook', methods=['POST'])\\r\\ndef handle_webhook():\\r\\n    try:\\r\\n        data = request.get_json()\\r\\n        if not data:\\r\\n            logger.error(\\\"No JSON data received\\\")\\r\\n            return jsonify({\\\"error\\\": \\\"No JSON data provided\\\"}), 400\\r\\n\\r\\n        logger.info(f\\\"Received webhook request: {json.dumps(data, indent=2)}\\\")\\r\\n        \\r\\n        event_type = data.get(\\\"type\\\", \\\"unknown\\\")\\r\\n        payment_id = data.get(\\\"payment\\\", {}).get(\\\"paymentId\\\", \\\"unknown\\\")\\r\\n        refund_id = data.get(\\\"refund\\\", {}).get(\\\"refundId\\\", \\\"unknown\\\")\\r\\n        bind_id = data.get(\\\"bind\\\", {}).get(\\\"bindId\\\", \\\"unknown\\\")\\r\\n\\r\\n        logger.info(f\\\"Webhook triggered: type={event_type}, paymentId={payment_id}, refundId={refund_id}, bindId={bind_id}\\\")\\r\\n        \\r\\n        return jsonify({\\\"status\\\": \\\"success\\\"}), 200\\r\\n    except Exception as e:\\r\\n        logger.error(f\\\"Error processing webhook: {str(e)}\\\")\\r\\n        return jsonify({\\\"error\\\": \\\"Internal server error\\\"}), 500\\r\\n\\r\\nif name == 'main':\\r\\n    app.run(host='0.0.0.0', port=5000, debug=False)\\r\\n```\\r\\n\\r\\n\"\n            }\n        },\n        \"/api/payments/{partnerPaymentId}\": {\n            \"get\": {\n                \"tags\": [\n                    \"Payments\"\n                ],\n                \"summary\": \"Получить платеж.\",\n                \"parameters\": [\n
