                <script type="application/javascript">
                   window.STATIC_CONTENT = false
                   window.__DATA__ = {"data":{"meta":{"metadata":[{"name":"generator","content":"Diplodoc Platform v4.57.7"}]},"assets":[],"headings":[{"title":"Обработка объекта PaymentStatus","href":"docs/ru/x-plat/making-payment.html#obrabotka-obuekta-paymentstatus","level":2},{"title":"Двухфазное проведение платежа","href":"docs/ru/x-plat/making-payment.html#dvuhfaznoe-provedenie-platezha","level":2,"items":[{"title":"Общая схема проведения платежа","href":"docs/ru/x-plat/making-payment.html#obshaya-shema-provedeniya-platezha","level":3},{"title":"Первая фаза. Проверка возможности проведения платежа","href":"docs/ru/x-plat/making-payment.html#pervaya-faza-proverka-vozmozhnosti-provedeniya-platezha","level":3},{"title":"Вторая фаза. Проведение платежа","href":"docs/ru/x-plat/making-payment.html#vtoraya-faza-provedenie-platezha","level":3},{"title":"Схема проведения второй фазы двухфазного платежа:","href":"docs/ru/x-plat/making-payment.html#shema-provedeniya-vtoroj-fazy-dvuhfaznogo-platezha","level":3}]},{"title":"Однофазное проведение платежа","href":"docs/ru/x-plat/making-payment.html#odnofaznoe-provedenie-platezha","level":2},{"title":"Общая схема проведения однофазного платежа","href":"docs/ru/x-plat/making-payment.html#obshaya-shema-provedeniya-odnofaznogo-platezha","level":2,"items":[{"title":"Отправка запроса","href":"docs/ru/x-plat/making-payment.html#otpravka-zaprosa","level":3}]},{"title":"Комбинирование методов проведения платежа","href":"docs/ru/x-plat/making-payment.html#kombinirovanie-metodov-provedeniya-platezha","level":2}],"title":"Проведение платежей","includes":[],"html":"<h2 id=\"obrabotka-obuekta-paymentstatus\"><a href=\"docs/ru/x-plat/making-payment.html#obrabotka-obuekta-paymentstatus\" class=\"yfm-anchor\" aria-hidden=\"true\"><span class=\"visually-hidden\" data-no-index=\"true\">Обработка объекта PaymentStatus</span></a>Обработка объекта PaymentStatus</h2>\n<p>Все ответы на запросы по проведению платежей содержат объект PaymentStatus, который содержит информацию о текущем состоянии платежа на сервере X-plat. Именно поэтому понимание обработки этого объекта XML-клиентом является важным для понимания всего процесса проведения платежа.<br />\nНиже представлена схема обработки объекта PaymentStatus:<br />\n<img src=\"docs/ru/x-plat/img-2.jpeg\" alt=\"img-2.jpeg\" /></p>\n<h2 id=\"dvuhfaznoe-provedenie-platezha\"><a href=\"docs/ru/x-plat/making-payment.html#dvuhfaznoe-provedenie-platezha\" class=\"yfm-anchor\" aria-hidden=\"true\"><span class=\"visually-hidden\" data-no-index=\"true\">Двухфазное проведение платежа</span></a>Двухфазное проведение платежа</h2>\n<p>Двухфазная обработка платежа состоит из двух фаз. На первой фазе проверяется возможность проведения платежа. Если она прошла успешно (платеж корректен и может быть проведен), то выполняется вторая фаза, после которой платеж непосредственно выполняется.</p>\n<p>При выполнении первой фазы, на балансе агента блокируются средства, необходимые для выполнения платежа. Если первая фаза прошла неуспешно, то средства возвращаются агенту. После успешного проведения второй фазы, средства списываются окончательно. При неуспешном выполнении второй фазы, средства возвращаются агенту.</p>\n<h3 id=\"obshaya-shema-provedeniya-platezha\"><a href=\"docs/ru/x-plat/making-payment.html#obshaya-shema-provedeniya-platezha\" class=\"yfm-anchor\" aria-hidden=\"true\"><span class=\"visually-hidden\" data-no-index=\"true\">Общая схема проведения платежа</span></a>Общая схема проведения платежа</h3>\n<p><img src=\"docs/ru/x-plat/img-3.jpeg\" alt=\"img-3.jpeg\" /></p>\n<h3 id=\"pervaya-faza-proverka-vozmozhnosti-provedeniya-platezha\"><a href=\"docs/ru/x-plat/making-payment.html#pervaya-faza-proverka-vozmozhnosti-provedeniya-platezha\" class=\"yfm-anchor\" aria-hidden=\"true\"><span class=\"visually-hidden\" data-no-index=\"true\">Первая фаза. Проверка возможности проведения платежа</span></a>Первая фаза. Проверка возможности проведения платежа</h3>\n<p>Формируется запрос для отсылки команды checkCommand с описанием проверяемого платежа. После этого запрос посылается на XML-шлюз. В случае получения не финального состояния платежа, необходимо через некоторый промежуток запросить состояние зарегистрированного платежа и повторять это до тех пор, пока состояние платежа не будет финальным. Затем полученный ответ обрабатывается XML-клиентом.</p>\n\n    <div class=\"yfm-clipboard\">\n        <pre><code class=\"hljs\">Пример запроса для проведения первой фазы:\n&lt;?xml version=\"1.0\" encoding=\"utf-8\"?&gt;\n&lt;request xmlns=http://xs2.x-plat.ru/Request.xsd\n    guid=\"c17d8aae-ba95-46eb-911d-0b7d649c9a6b\" &gt;\n    &lt;header&gt;\n        &lt;point&gt;3392&lt;/point&gt;\n        &lt;login&gt;login&lt;/login&gt;\n        &lt;password&gt;fEqNCco3Yq9h5ZUg1D3CZJT41Bs=&lt;/password&gt;\n        &lt;signature\ntype=\"sha512_hex\"&gt;C2600AF711FED04C73BF1..155B4ED3DDB741EC38&lt;/signature&gt;\n    &lt;/header&gt;\n    &lt;check timeout=\"100\"&gt;\n        &lt;payment id=\"6437282\" provider=\"bee\" amount=\"1.00\"&gt;\n            &lt;field name=\"phone\"&gt;9035174909&lt;/field&gt;\n        &lt;/payment&gt;\n    &lt;/check&gt;\n&lt;/request&gt;\n</code></pre>\n\n        <button class=\"yfm-clipboard-button\">\n            <svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"27\">\n                <path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"></path>\n                <path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\">\n                    <animate id=\"visibileAnimation-27\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin></animate>\n                    <animate id=\"hideAnimation-27\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-27.end+1\" fill=\"freeze\"></animate>\n                </path>\n            </svg>\n        </button>\n    </div>\n<p>Пример успешного ответа (состояние конечное):</p>\n\n    <div class=\"yfm-clipboard\">\n        <pre><code class=\"hljs\">&lt;?xml version=\"1.0\" encoding=\"utf-8\"?&gt;\n&lt;response xmlns=\"http://xs2.x-plat.ru/Response.xsd\"\n    guid=\"59863b6f-3e5-4812-b9f9-edff35e8dd78\"&gt;\n    &lt;result code=\"Success\" fatal=\"false\" /&gt;\n    &lt;payment id=\"290361\"&gt;\n        &lt;result code=\"Success\" fatal=\"true\" /&gt;\n        &lt;pt_id&gt;83401874&lt;/pt_id&gt;\n        &lt;post_date&gt;2008-09-16T00:27:18.95&lt;/post_date&gt;\n        &lt;state code=\"PsChecked\" type=\"FinalFatal\" date=\"2008-09-\n16T00:27:19.95\" /&gt;\n    &lt;/payment&gt;\n&lt;signature&gt;117851312A8871F2C08AEB7AF1...9C3E1A5155F5E9CEC3E1&lt;/signature&gt;\n&lt;/response&gt;\n</code></pre>\n\n        <button class=\"yfm-clipboard-button\">\n            <svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"31\">\n                <path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"></path>\n                <path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\">\n                    <animate id=\"visibileAnimation-31\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin></animate>\n                    <animate id=\"hideAnimation-31\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-31.end+1\" fill=\"freeze\"></animate>\n                </path>\n            </svg>\n        </button>\n    </div>\n<p>Схема проведения первой фазы двухфазного платежа:<br />\n<img src=\"docs/ru/x-plat/img-4.jpeg\" alt=\"img-4.jpeg\" /></p>\n<h3 id=\"vtoraya-faza-provedenie-platezha\"><a href=\"docs/ru/x-plat/making-payment.html#vtoraya-faza-provedenie-platezha\" class=\"yfm-anchor\" aria-hidden=\"true\"><span class=\"visually-hidden\" data-no-index=\"true\">Вторая фаза. Проведение платежа</span></a>Вторая фаза. Проведение платежа</h3>\n<p>Если первая фаза прошла удачно (состояние платежа PsChecked), то для подтверждения проведения платежа необходимо выполнить вторую фазу.<br />\nДля этого формируется запрос для отсылки команды payCommand с описанием зарегистрированного платежа. После этого запрос посылается на XML-шлюз. В случае получения не финального состояния платежа, необходимо через некоторый промежуток запросить состояние зарегистрированного платежа и повторять это до тех пор, пока состояние платежа не будет финальным. Затем полученный ответ обрабатывается XML-клиентом.</p>\n\n    <div class=\"yfm-clipboard\">\n        <pre><code class=\"hljs\">Пример запроса для проведения второй фазы:\n&lt;?xml version=\"1.0\" encoding=\"utf-8\"?&gt;\n&lt;request xmlns=http://xs2.x-plat.ru/Request.xsd\n            guid=\"c17d8aae-ba95-46eb-911d-0b7d649c9a6b\" &gt;\n    &lt;header&gt;\n        &lt;point&gt;3392&lt;/point&gt;\n        &lt;login&gt;login&lt;/login&gt;\n        &lt;password&gt;fEqNCco3Yq9h5ZUg1D3CZJT41Bs=&lt;/password&gt;\n        &lt;signature\ntype=\"sha512_hex\"&gt;C2600AF711FED04C73BF1...155B4ED3DDB741EC38&lt;/signature&gt;\n    &lt;/header&gt;\n    &lt;pay timeout=\"100\"&gt;\n        &lt;payment id=\"290361\" /&gt;\n    &lt;/pay&gt;\n&lt;/request&gt;\n</code></pre>\n\n        <button class=\"yfm-clipboard-button\">\n            <svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"41\">\n                <path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"></path>\n                <path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\">\n                    <animate id=\"visibileAnimation-41\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin></animate>\n                    <animate id=\"hideAnimation-41\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-41.end+1\" fill=\"freeze\"></animate>\n                </path>\n            </svg>\n        </button>\n    </div>\n<p>Пример успешного ответа (состояние конечное):</p>\n\n    <div class=\"yfm-clipboard\">\n        <pre><code class=\"hljs\">&lt;?xml version=\"1.0\" encoding=\"utf-8\"?&gt;\n&lt;response xmlns=\"http://xs2.x-plat.ru/Response.xsd\"\n            guid=\"59863b6f-3e5-4812-b9f9-edff35e8dd78\"&gt;\n    &lt;result code=\"Success\" fatal=\"false\" /&gt;\n    &lt;payment id=\"290361\"&gt;\n        &lt;result code=\"Success\" fatal=\"true\" /&gt;\n        &lt;pt_id&gt;83401874&lt;/pt_id&gt;\n        &lt;post_date&gt;2008-09-16T00:27:18.95&lt;/post_date&gt;\n        &lt;state code=\"PsOk\" type=\"FinalFatal\" date=\"2008-09-16T00:27:20.95\"\n/&gt;\n    &lt;/payment&gt;\n&lt;signature&gt;117851312A8871F2C08AEB7AF1...9C3E1A5155F5E9CEC3E1&lt;/signature&gt;\n&lt;/response&gt;\n</code></pre>\n\n        <button class=\"yfm-clipboard-button\">\n            <svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"45\">\n                <path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"></path>\n                <path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\">\n                    <animate id=\"visibileAnimation-45\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin></animate>\n                    <animate id=\"hideAnimation-45\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-45.end+1\" fill=\"freeze\"></animate>\n                </path>\n            </svg>\n        </button>\n    </div>\n<h3 id=\"shema-provedeniya-vtoroj-fazy-dvuhfaznogo-platezha\"><a href=\"docs/ru/x-plat/making-payment.html#shema-provedeniya-vtoroj-fazy-dvuhfaznogo-platezha\" class=\"yfm-anchor\" aria-hidden=\"true\"><span class=\"visually-hidden\" data-no-index=\"true\">Схема проведения второй фазы двухфазного платежа:</span></a>Схема проведения второй фазы двухфазного платежа:</h3>\n<p><img src=\"docs/ru/x-plat/img-5.jpeg\" alt=\"img-5.jpeg\" /></p>\n<h1>Обработка ответа и ошибок</h1>\n<p>Все используемые для двухфазного проведения платежа команды (check, pay, status) возвращают один тип ответа, который содержит объект PaymentStatus.<br />\nВ случае возвращения ошибки обработки запроса (тег response.result), необходимо разрешить возникшую проблему. После разрешения проблем можно повторить запрос снова.<br />\nВ случае возвращения ошибки обработки платежа, действовать в соответствии с типом ошибки.</p>\n<h2 id=\"odnofaznoe-provedenie-platezha\"><a href=\"docs/ru/x-plat/making-payment.html#odnofaznoe-provedenie-platezha\" class=\"yfm-anchor\" aria-hidden=\"true\"><span class=\"visually-hidden\" data-no-index=\"true\">Однофазное проведение платежа</span></a>Однофазное проведение платежа</h2>\n<p>Однофазное выполнение платежа проходит в одну фазу. В отличие от двухфазного проведения платежа, от XML-клиента не требуется подтверждения платежа. После того, как возможность оплаты будет проверена проводящим сервером X-plat, платеж автоматически будет послан на отправку.</p>\n<p>При однофазном проведении платежа средства, необходимые на проведение платежа, блокируются на счете агента. Если проведение платежа завершилось ошибкой, то средства возвращаются на счет агента. При успешном проведении платежа средства списываются окончательно.</p>\n<h2 id=\"obshaya-shema-provedeniya-odnofaznogo-platezha\"><a href=\"docs/ru/x-plat/making-payment.html#obshaya-shema-provedeniya-odnofaznogo-platezha\" class=\"yfm-anchor\" aria-hidden=\"true\"><span class=\"visually-hidden\" data-no-index=\"true\">Общая схема проведения однофазного платежа</span></a>Общая схема проведения однофазного платежа</h2>\n<p><img src=\"docs/ru/x-plat/img-6.jpeg\" alt=\"img-6.jpeg\" /></p>\n<h3 id=\"otpravka-zaprosa\"><a href=\"docs/ru/x-plat/making-payment.html#otpravka-zaprosa\" class=\"yfm-anchor\" aria-hidden=\"true\"><span class=\"visually-hidden\" data-no-index=\"true\">Отправка запроса</span></a>Отправка запроса</h3>\n<p>Формируется запрос для отсылки команды cashinCommand с описанием платежа на оплату. После этого запрос посылается на XML-шлюз. В случае получения не финального состояния платежа, необходимо через некоторый промежуток времени запросить состояние зарегистрированного платежа и повторять это до тех пор, пока состояние платежа не будет финальным. Затем полученный ответ обрабатывается XML-клиентом.<br />\nВ случае возвращения ошибки обработки запроса (тег response.result), необходимо разрешить возникшую проблему. После разрешения проблем можно повторить запрос снова.<br />\nВ случае возвращения ошибки обработки платежа, действовать в соответствии с типом ошибки.</p>\n<p>В случае возвращения неуспешного финального состояния платежа, платеж можно попытаться перепровести с новым идентификатором со стороны клиента, если тип состояния был FinalNotFatal (означает, что платеж не удалось провести, но при повторной посылке он может и провестись).</p>\n\n    <div class=\"yfm-clipboard\">\n        <pre><code class=\"hljs\">Пример запроса для однофазного проведения платежа:\n&lt;?xml version=\"1.0\" encoding=\"utf-8\"?&gt;\n&lt;request xmlns=http://xs2.x-plat.ru/Request.xsd\n            guid=\"c17d8aae-ba95-46eb-911d-0b7d649c9a6b\" &gt;\n    &lt;header&gt;\n        &lt;point&gt;3392&lt;/point&gt;\n        &lt;login&gt;login&lt;/login&gt;\n        &lt;password&gt;fEqNCco3Yq9h5ZUg1D3CZJT4lBs=&lt;/password&gt;\n        &lt;signature\ntype=\"sha512_hex\"&gt;C2600AF711FED04C73BF1E9FE..4ED3DDB741EC38&lt;/signature&gt;\n    &lt;/header&gt;\n    &lt;cashin&gt;\n        &lt;payment id=\"6437282\" provider=\"bee\" amount=\"1.00\"&gt;\n            &lt;field name=\"phone\"&gt;9035174909&lt;/field&gt;\n        &lt;/payment&gt;\n    &lt;/cashin&gt;\n&lt;/request&gt;\n</code></pre>\n\n        <button class=\"yfm-clipboard-button\">\n            <svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"82\">\n                <path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"></path>\n                <path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\">\n                    <animate id=\"visibileAnimation-82\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin></animate>\n                    <animate id=\"hideAnimation-82\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-82.end+1\" fill=\"freeze\"></animate>\n                </path>\n            </svg>\n        </button>\n    </div>\n<p>Пример успешного ответа (состояние не конечное):</p>\n\n    <div class=\"yfm-clipboard\">\n        <pre><code class=\"hljs\">&lt;?xml version=\"1.0\" encoding=\"utf-8\"?&gt;\n&lt;response xmlns=\"http://xs2.x-plat.ru/Response.xsd\"\n    guid=\"59863b6f-3e5-4812-b9f9-edff35e8dd78\"&gt;\n    &lt;result code=\"Success\" fatal=\"false\" /&gt;\n    &lt;payment id=\"290361\"&gt;\n        &lt;result code=\"Success\" fatal=\"true\" /&gt;\n        &lt;pt_id&gt;83401874&lt;/pt_id&gt;\n        &lt;post_date&gt;2008-09-16T00:27:18.95&lt;/post_date&gt;\n        &lt;state code=\"PsChecked\" type=\"NotFinal\" date=\"2008-09-\n16T00:27:19.95\" /&gt;\n    &lt;/payment&gt;\n&lt;signature&gt;117851312A8871F2C08AEB7AF14A..3E1A5155F5E9CEC3E1&lt;/signature&gt;\n&lt;/response&gt;\n</code></pre>\n\n        <button class=\"yfm-clipboard-button\">\n            <svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"86\">\n                <path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"></path>\n                <path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\">\n                    <animate id=\"visibileAnimation-86\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin></animate>\n                    <animate id=\"hideAnimation-86\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-86.end+1\" fill=\"freeze\"></animate>\n                </path>\n            </svg>\n        </button>\n    </div>\n<h2 id=\"kombinirovanie-metodov-provedeniya-platezha\"><a href=\"docs/ru/x-plat/making-payment.html#kombinirovanie-metodov-provedeniya-platezha\" class=\"yfm-anchor\" aria-hidden=\"true\"><span class=\"visually-hidden\" data-no-index=\"true\">Комбинирование методов проведения платежа</span></a>Комбинирование методов проведения платежа</h2>\n<p>Если сумма платежа заранее неизвестна, но есть необходимость выполнить проверку платежа перед его проведением и избежать холдирования большого объема денежных средств на счете агента, возможно комбинирование двух методов Check и Cashin.<br />\nАлгоритм комбинирования следующий:</p>\n<ul>\n<li>формируется запрос для отсылки команды checkCommand с описанием проверяемого платежа на минимально возможную сумму по текущему провайдеру. После этого запрос посылается на XML-шлюз. В случае получения не финального состояния платежа, необходимо через некоторый промежуток запросить состояние зарегистрированного платежа и повторять это до тех пор, пока состояние платежа не будет финальным;</li>\n<li>при получении успешного финального состояния платежа «PsChecked» формируется запрос для отсылки команды cashinCommand с описанием платежа (с новым номером транзакции на стороне XML-клиента) на полную сумму. После этого запрос посылается на XML-шлюз.</li>\n</ul>\n<p>CheckCommand и cashinCommand отличаются друг от друга суммой платежа и номером транзакции. Вызов cashin с тем же номером транзакции, что и check, вернет текущее состояние платежа в системе. Так как данный сценарий не предполагает отправку команды рау, то созданная при check транзакция переведется в финальное ошибочное состояние и захолдированные денежные средства вернутся агенту.</p>\n","leading":false},"router":{"pathname":"docs/ru/x-plat/making-payment","depth":4},"lang":"ru","langs":["ru"]};
