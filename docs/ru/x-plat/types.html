                <script type="application/javascript">
                   window.STATIC_CONTENT = false
                   window.__DATA__ = {"data":{"meta":{"metadata":[{"name":"generator","content":"Diplodoc Platform v4.57.7"}],"style":["_bundle/latex-extension.css"],"script":["_bundle/latex-extension.js"]},"assets":[],"headings":[{"title":"Запрос к XML-шлюзу","href":"docs/ru/x-plat/types.html#zapros-k-xml-shlyuzu","level":2,"items":[{"title":"signType","href":"docs/ru/x-plat/types.html#signtype","level":3},{"title":"authInfo","href":"docs/ru/x-plat/types.html#authinfo","level":3},{"title":"receipt","href":"docs/ru/x-plat/types.html#receipt","level":3},{"title":"field","href":"docs/ru/x-plat/types.html#field","level":3},{"title":"pointType","href":"docs/ru/x-plat/types.html#pointtype","level":3},{"title":"Location","href":"docs/ru/x-plat/types.html#location","level":3},{"title":"pointInformation","href":"docs/ru/x-plat/types.html#pointinformation","level":3},{"title":"paymentInfo","href":"docs/ru/x-plat/types.html#paymentinfo","level":3},{"title":"registeredPaymentInfo","href":"docs/ru/x-plat/types.html#registeredpaymentinfo","level":3},{"title":"checkCommand","href":"docs/ru/x-plat/types.html#checkcommand","level":3},{"title":"payCommand","href":"docs/ru/x-plat/types.html#paycommand","level":3},{"title":"cashinCommand","href":"docs/ru/x-plat/types.html#cashincommand","level":3},{"title":"statusCommand","href":"docs/ru/x-plat/types.html#statuscommand","level":3},{"title":"balanceCommand","href":"docs/ru/x-plat/types.html#balancecommand","level":3},{"title":"provlistCommand","href":"docs/ru/x-plat/types.html#provlistcommand","level":3},{"title":"pointsCommand","href":"docs/ru/x-plat/types.html#pointscommand","level":3},{"title":"request","href":"docs/ru/x-plat/types.html#request","level":3}]},{"title":"Ответ XML-шлюза","href":"docs/ru/x-plat/types.html#otvet-xml-shlyuza","level":2,"items":[{"title":"requestResultCode","href":"docs/ru/x-plat/types.html#requestresultcode","level":3},{"title":"paymentResultCode","href":"docs/ru/x-plat/types.html#paymentresultcode","level":3},{"title":"paymentStateCode","href":"docs/ru/x-plat/types.html#paymentstatecode","level":3},{"title":"paymentStateType","href":"docs/ru/x-plat/types.html#paymentstatetype","level":3},{"title":"paymentParameter","href":"docs/ru/x-plat/types.html#paymentparameter","level":3},{"title":"paymentStatus","href":"docs/ru/x-plat/types.html#paymentstatus","level":3},{"title":"paymentStatusList","href":"docs/ru/x-plat/types.html#paymentstatuslist","level":3},{"title":"requestResult","href":"docs/ru/x-plat/types.html#requestresult","level":3},{"title":"response","href":"docs/ru/x-plat/types.html#response","level":3}]}],"title":"Описание типов, используемых в XML-шлюзе","includes":[],"html":"<p>Документами, которые определяют операции, параметры операций и типы параметров являются:</p>\n<ul>\n<li>Request.xsd - описание формата запроса к XML-шлюзу</li>\n<li>Response.xsd - описание формата ответа от XML-шлюза</li>\n</ul>\n<p>На основании этих документов представлена нижеследующая информация.</p>\n<h2 id=\"zapros-k-xml-shlyuzu\"><a href=\"docs/ru/x-plat/types.html#zapros-k-xml-shlyuzu\" class=\"yfm-anchor\" aria-hidden=\"true\"><span class=\"visually-hidden\" data-no-index=\"true\">Запрос к XML-шлюзу</span></a>Запрос к XML-шлюзу</h2>\n<p>Все запросы к XML-шлюзу следует отправлять на https://xs2.x-plat.ru/<br />\nФормат запроса описывается с помощью XSD-схемы Request.xsd. Найти схему можно по следующему адресу: https://xs2.x-plat.ru/Request.xsd</p>\n<h3 id=\"signtype\"><a href=\"docs/ru/x-plat/types.html#signtype\" class=\"yfm-anchor\" aria-hidden=\"true\"><span class=\"visually-hidden\" data-no-index=\"true\">signType</span></a>signType</h3>\n<p>Является инструкцией, которая указывает на то, каким способом формируется и передается подпись сообщения.<br />\nСостоит из:</p>\n<ul>\n<li>xml_gate_auth</li>\n</ul>\n<p>Является перечислением, которое указывает на то, какой тип подписи используется клиентом для аутентификации.<br />\nВозможные значения перечисления:</p>\n<table>\n<thead>\n<tr>\n<th style=\"text-align:left\">Значение</th>\n<th style=\"text-align:left\">Описание</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td style=\"text-align:left\">rsa_sha512</td>\n<td style=\"text-align:left\">Аутентификация происходит по электронно-цифровой подписи на базе RSA ключа <br /> (4096 байт) с использованием hash-функции SHA512.</td>\n</tr>\n<tr>\n<td style=\"text-align:left\">sha512</td>\n<td style=\"text-align:left\">Аутентификация происходит по hash, где в качестве hash-функции будет <br /> использоваться алгоритм SHA512.</td>\n</tr>\n</tbody>\n</table>\n<ul>\n<li>контейнера [base64[hex]</li>\n</ul>\n<p>Является перечислением, которое указывает на то, какой способ передачи байт-массива используется клиентом.<br />\nВозможные значения перечисления:</p>\n<table>\n<thead>\n<tr>\n<th style=\"text-align:left\">Значение</th>\n<th style=\"text-align:left\">Описание</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td style=\"text-align:left\">base64</td>\n<td style=\"text-align:left\">Информация представлена в виде 64-разрядного кода, на базе алгоритма Base64.</td>\n</tr>\n<tr>\n<td style=\"text-align:left\">hex</td>\n<td style=\"text-align:left\">Информация представлена в шестнадцатеричном виде.</td>\n</tr>\n</tbody>\n</table>\n<ul>\n<li>направления байт-массива<br />\nrev - указывает на обратный порядок байт-массива полученной подписи. В случае отсутствия направление будет прямым.</li>\n</ul>\n<p>Пример:<br />\nзапрос подписан RSA ключом (4096 байт) с использованием hash-функции SHA512 и передан в hex-представлении:<br />\n4aec...3d3e3<br />\nзапрос подписан RSA ключом (4096 байт) с использованием hash-функции SHA512 и передан в hex-представлении в обратном порядке:<br />\n5aad...3cb8</p>\n<h3 id=\"authinfo\"><a href=\"docs/ru/x-plat/types.html#authinfo\" class=\"yfm-anchor\" aria-hidden=\"true\"><span class=\"visually-hidden\" data-no-index=\"true\">authInfo</span></a>authInfo</h3>\n<p>Содержит информацию для аутентификации и авторизации пользователя:</p>\n<table>\n<thead>\n<tr>\n<th style=\"text-align:left\">Параметр</th>\n<th style=\"text-align:left\">Тип</th>\n<th style=\"text-align:left\">Описание</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td style=\"text-align:left\">authInfo.point</td>\n<td style=\"text-align:left\">int</td>\n<td style=\"text-align:left\">Точка приема.</td>\n</tr>\n<tr>\n<td style=\"text-align:left\">authInfo.login</td>\n<td style=\"text-align:left\">string</td>\n<td style=\"text-align:left\">Логин оператора на указанной точке приема.</td>\n</tr>\n<tr>\n<td style=\"text-align:left\">authInfo.password</td>\n<td style=\"text-align:left\">string</td>\n<td style=\"text-align:left\">SHA1-отпечаток от пароля оператора на указанной</td>\n</tr>\n</tbody>\n</table>\n<table>\n<thead>\n<tr>\n<th style=\"text-align:left\"></th>\n<th style=\"text-align:left\"></th>\n<th style=\"text-align:left\">точке приема.</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td style=\"text-align:left\">authInfo.signature.type</td>\n<td style=\"text-align:left\">signType</td>\n<td style=\"text-align:left\">Тип подписи, используемый XML-клиентом.</td>\n</tr>\n<tr>\n<td style=\"text-align:left\">authInfo.signature</td>\n<td style=\"text-align:left\">string</td>\n<td style=\"text-align:left\">Содержимое подписи в Base64 Encoding.</td>\n</tr>\n<tr>\n<td style=\"text-align:left\">authInfo.disposablecode</td>\n<td style=\"text-align:left\">int</td>\n<td style=\"text-align:left\">Код подтверждения. Необязательное поле, <br /> передается при необходимости.</td>\n</tr>\n</tbody>\n</table>\n<p>Пример:</p>\n\n    <div class=\"yfm-clipboard\">\n        <pre><code class=\"hljs\">&lt;header&gt;\n    &lt;point&gt;3392&lt;/point&gt;\n    &lt;login&gt;login&lt;/login&gt;\n    &lt;password&gt;fEqNCco3Yq9h5ZUglD3CZJT4lBs=&lt;/password&gt;\n    &lt;signature\ntype=\"sha512_hex\"&gt;C2600AF711FED04A6...F843155B4ED3DDB741EC38&lt;/signature&gt;\n&lt;/header&gt;\n</code></pre>\n\n        <button class=\"yfm-clipboard-button\">\n            <svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"229\">\n                <path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"></path>\n                <path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\">\n                    <animate id=\"visibileAnimation-229\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin></animate>\n                    <animate id=\"hideAnimation-229\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-229.end+1\" fill=\"freeze\"></animate>\n                </path>\n            </svg>\n        </button>\n    </div>\n<h3 id=\"receipt\"><a href=\"docs/ru/x-plat/types.html#receipt\" class=\"yfm-anchor\" aria-hidden=\"true\"><span class=\"visually-hidden\" data-no-index=\"true\">receipt</span></a>receipt</h3>\n<p>Описывает информацию в квитанции:</p>\n<table>\n<thead>\n<tr>\n<th style=\"text-align:left\">Параметр</th>\n<th style=\"text-align:left\">ТипI</th>\n<th style=\"text-align:left\">Описание</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td style=\"text-align:left\">receipt.date</td>\n<td style=\"text-align:left\">dateTime</td>\n<td style=\"text-align:left\">Дата приема денежных средств от плательщика. Если не указана, <br /> считается, что она равна дате регистрации платежа в процессинге.</td>\n</tr>\n<tr>\n<td style=\"text-align:left\">receipt.point</td>\n<td style=\"text-align:left\">string</td>\n<td style=\"text-align:left\">Название точки, с которой пришел платеж. Используется в связке <br /> с предварительной регистрацией таких имен через метод Points.</td>\n</tr>\n<tr>\n<td style=\"text-align:left\">receipt.number</td>\n<td style=\"text-align:left\">long</td>\n<td style=\"text-align:left\">Номер платежа на квитанции. Если не указан, считается, что он <br /> равен идентификатору платежа id в payment.</td>\n</tr>\n</tbody>\n</table>\n<p>Пример:<br />\n</p>\n<h3 id=\"field\"><a href=\"docs/ru/x-plat/types.html#field\" class=\"yfm-anchor\" aria-hidden=\"true\"><span class=\"visually-hidden\" data-no-index=\"true\">field</span></a>field</h3>\n<p>Содержит информацию об одном платежном поле платежа:</p>\n<table>\n<thead>\n<tr>\n<th style=\"text-align:left\">Параметр</th>\n<th style=\"text-align:left\">Тип</th>\n<th style=\"text-align:left\">Описание</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td style=\"text-align:left\">field</td>\n<td style=\"text-align:left\">string</td>\n<td style=\"text-align:left\">Значение платежного поля.</td>\n</tr>\n<tr>\n<td style=\"text-align:left\">field.name</td>\n<td style=\"text-align:left\">string</td>\n<td style=\"text-align:left\">Идентификатор платежного поля.</td>\n</tr>\n</tbody>\n</table>\n<p>Пример:<br />\n<span class=\"yfm-latex\" data-content=\"%3C\" data-options=\"%7B%22displayMode%22%3Afalse%7D\"></span> field name=\"phone\" <span class=\"yfm-latex\" data-content=\"%3E9035174909%3C%2F\" data-options=\"%7B%22displayMode%22%3Afalse%7D\"></span> field <span class=\"yfm-latex\" data-content=\"%3E\" data-options=\"%7B%22displayMode%22%3Afalse%7D\"></span></p>\n<h3 id=\"pointtype\"><a href=\"docs/ru/x-plat/types.html#pointtype\" class=\"yfm-anchor\" aria-hidden=\"true\"><span class=\"visually-hidden\" data-no-index=\"true\">pointType</span></a>pointType</h3>\n<p>Является перечислением, которое указывает на то, какой тип точки используется клиентом.<br />\nВозможные значения перечисления pointType:</p>\n<table>\n<thead>\n<tr>\n<th style=\"text-align:left\">Значение</th>\n<th style=\"text-align:left\">Описание</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td style=\"text-align:left\">Cashin</td>\n<td style=\"text-align:left\">Терминал самообслуживания</td>\n</tr>\n<tr>\n<td style=\"text-align:left\">Client</td>\n<td style=\"text-align:left\">Точка с кассиром (представителем агента)</td>\n</tr>\n<tr>\n<td style=\"text-align:left\">InternetCashin</td>\n<td style=\"text-align:left\">Терминал самообслуживания с удаленным доступом клиента.</td>\n</tr>\n</tbody>\n</table>\n<h3 id=\"location\"><a href=\"docs/ru/x-plat/types.html#location\" class=\"yfm-anchor\" aria-hidden=\"true\"><span class=\"visually-hidden\" data-no-index=\"true\">Location</span></a>Location</h3>\n<p>Содержит информацию о местоположении точки приема платежей агента:</p>\n<table>\n<thead>\n<tr>\n<th style=\"text-align:left\">Параметр</th>\n<th style=\"text-align:left\">ТипI</th>\n<th style=\"text-align:left\">Описание</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td style=\"text-align:left\">location.locality</td>\n<td style=\"text-align:left\">string</td>\n<td style=\"text-align:left\">КЛАДР-код.</td>\n</tr>\n<tr>\n<td style=\"text-align:left\">location.type</td>\n<td style=\"text-align:left\">location.Type</td>\n<td style=\"text-align:left\">Тип расположения, перечисление (см. «Приложение 1»).</td>\n</tr>\n<tr>\n<td style=\"text-align:left\">location.street</td>\n<td style=\"text-align:left\">string</td>\n<td style=\"text-align:left\">Название улицы.</td>\n</tr>\n</tbody>\n</table>\n<table>\n<thead>\n<tr>\n<th style=\"text-align:left\">location.building</th>\n<th style=\"text-align:left\">string</th>\n<th style=\"text-align:left\">Номер строения.</th>\n</tr>\n</thead>\n</table>\n<p>Пример:<br />\n</p>\n<h3 id=\"pointinformation\"><a href=\"docs/ru/x-plat/types.html#pointinformation\" class=\"yfm-anchor\" aria-hidden=\"true\"><span class=\"visually-hidden\" data-no-index=\"true\">pointInformation</span></a>pointInformation</h3>\n<p>Содержит информацию о точке приема платежей агента:</p>\n<table>\n<thead>\n<tr>\n<th style=\"text-align:left\">Параметр</th>\n<th style=\"text-align:left\">Тип</th>\n<th style=\"text-align:left\">Описание</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td style=\"text-align:left\">pointsCommand.name</td>\n<td style=\"text-align:left\">string</td>\n<td style=\"text-align:left\">Название регистрируемой точки</td>\n</tr>\n<tr>\n<td style=\"text-align:left\">pointsCommand.type</td>\n<td style=\"text-align:left\">pointType</td>\n<td style=\"text-align:left\">Тип регистрируемой точки</td>\n</tr>\n<tr>\n<td style=\"text-align:left\">pointsCommand.location</td>\n<td style=\"text-align:left\">Location</td>\n<td style=\"text-align:left\">Местоположение регистрируемой точки</td>\n</tr>\n</tbody>\n</table>\n<p>Пример:<br />\n<br />\n<br />\n<span class=\"yfm-latex\" data-content=\"%3C%2F\" data-options=\"%7B%22displayMode%22%3Afalse%7D\"></span> register <span class=\"yfm-latex\" data-content=\"%3E\" data-options=\"%7B%22displayMode%22%3Afalse%7D\"></span></p>\n<h3 id=\"paymentinfo\"><a href=\"docs/ru/x-plat/types.html#paymentinfo\" class=\"yfm-anchor\" aria-hidden=\"true\"><span class=\"visually-hidden\" data-no-index=\"true\">paymentInfo</span></a>paymentInfo</h3>\n<p>Содержит информацию о платеже, посылаемом на обработку XML-шлюзу.</p>\n<table>\n<thead>\n<tr>\n<th style=\"text-align:left\">Параметр</th>\n<th style=\"text-align:left\">Тип</th>\n<th style=\"text-align:left\">Описание</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td style=\"text-align:left\">paymentInfo.id</td>\n<td style=\"text-align:left\">long</td>\n<td style=\"text-align:left\">Уникальный идентификатор платежа на стороне XML- <br /> клиента.</td>\n</tr>\n<tr>\n<td style=\"text-align:left\">paymentInfo.provider</td>\n<td style=\"text-align:left\">char(4)</td>\n<td style=\"text-align:left\">Идентификатор провайдера (до 4 символов).</td>\n</tr>\n<tr>\n<td style=\"text-align:left\">paymentInfo.amount</td>\n<td style=\"text-align:left\">decimal</td>\n<td style=\"text-align:left\">Сумма к зачислению.</td>\n</tr>\n<tr>\n<td style=\"text-align:left\">paymentInfo.user_amount</td>\n<td style=\"text-align:left\">decimal</td>\n<td style=\"text-align:left\">Сумма с клиента (сумма к зачислению + комиссия). Поле <br /> необязательное.</td>\n</tr>\n<tr>\n<td style=\"text-align:left\">paymentInfo.receipt</td>\n<td style=\"text-align:left\">receipt</td>\n<td style=\"text-align:left\">Информация о чеке, выданном на платеж. Поле <br /> необязательное.</td>\n</tr>\n<tr>\n<td style=\"text-align:left\">paymentInfo.field</td>\n<td style=\"text-align:left\">field</td>\n<td style=\"text-align:left\">Список платежных полей платежа. Каждое платежное <br /> поле представляет собой название и значение платежного <br /> поля.</td>\n</tr>\n</tbody>\n</table>\n<p>Пример платежа с одним платежным полем:</p>\n\n    <div class=\"yfm-clipboard\">\n        <pre><code class=\"hljs\">&lt;payment id=\"6437282\" provider=\"bee\" amount=\"1.00\"&gt;\n    &lt;field name=\"phone\"&gt;9035174909&lt;/field&gt;\n&lt;/payment&gt;\n</code></pre>\n\n        <button class=\"yfm-clipboard-button\">\n            <svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"606\">\n                <path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"></path>\n                <path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\">\n                    <animate id=\"visibileAnimation-606\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin></animate>\n                    <animate id=\"hideAnimation-606\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-606.end+1\" fill=\"freeze\"></animate>\n                </path>\n            </svg>\n        </button>\n    </div>\n<p>Пример платежа с двумя платежными полями, суммой с клиента и информацией по чеку:</p>\n\n    <div class=\"yfm-clipboard\">\n        <pre><code class=\"hljs\">&lt;payment id=\"4354\" provider=\"test\" amount=\"15.00\" user_amount=\"20.00\"&gt;\n    &lt;receipt date=\"2016-01-01T11:57:58\" point=\"PointName\" number=\"5\"/&gt;\n    &lt;field name=\"firstfield\"&gt;983513424722&lt;/field&gt;\n    &lt;field name=\"secondfield\"&gt;12&lt;/field&gt;\n&lt;/payment&gt;\n</code></pre>\n\n        <button class=\"yfm-clipboard-button\">\n            <svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"610\">\n                <path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"></path>\n                <path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\">\n                    <animate id=\"visibileAnimation-610\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin></animate>\n                    <animate id=\"hideAnimation-610\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-610.end+1\" fill=\"freeze\"></animate>\n                </path>\n            </svg>\n        </button>\n    </div>\n<h3 id=\"registeredpaymentinfo\"><a href=\"docs/ru/x-plat/types.html#registeredpaymentinfo\" class=\"yfm-anchor\" aria-hidden=\"true\"><span class=\"visually-hidden\" data-no-index=\"true\">registeredPaymentInfo</span></a>registeredPaymentInfo</h3>\n<p>Содержит информацию о платеже, который уже был зарегистрирован в системе X-plat.</p>\n<table>\n<thead>\n<tr>\n<th style=\"text-align:left\">Параметр</th>\n<th style=\"text-align:left\">Тип</th>\n<th style=\"text-align:left\">Описание</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td style=\"text-align:left\">registeredPaymentInfo.id</td>\n<td style=\"text-align:left\">Long</td>\n<td style=\"text-align:left\">Уникальный идентификатор платежа на стороне <br /> ХМL-клиента.</td>\n</tr>\n</tbody>\n</table>\n<p>Пример:<br />\n</p>\n<h3 id=\"checkcommand\"><a href=\"docs/ru/x-plat/types.html#checkcommand\" class=\"yfm-anchor\" aria-hidden=\"true\"><span class=\"visually-hidden\" data-no-index=\"true\">checkCommand</span></a>checkCommand</h3>\n<p>Описывает команду на проверку возможности оплаты указанного платежа.</p>\n<table>\n<thead>\n<tr>\n<th style=\"text-align:left\">Параметр</th>\n<th style=\"text-align:left\">Тип</th>\n<th style=\"text-align:left\">Описание</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td style=\"text-align:left\">checkCommand.timeout</td>\n<td style=\"text-align:left\">int</td>\n<td style=\"text-align:left\">Максимальное время ожидания прекращения <br /> обработки платежа проводящим сервером X-plat. Не <br /> указывается, если надо получить ответ сразу.</td>\n</tr>\n<tr>\n<td style=\"text-align:left\">checkCommand.payment</td>\n<td style=\"text-align:left\">paymentInfo</td>\n<td style=\"text-align:left\">Описание платежа, возможность проведения <br /> которого необходимо проверить.</td>\n</tr>\n</tbody>\n</table>\n<p>Пример асинхронного запроса на проверку:</p>\n\n    <div class=\"yfm-clipboard\">\n        <pre><code class=\"hljs\">&lt;check&gt;\n    &lt;payment id=\"6437282\" provider=\"bee\" amount=\"1.00\"&gt;\n        &lt;field name=\"phone\"&gt;9035174909&lt;/field&gt;\n    &lt;/payment&gt;\n&lt;/check&gt;\n</code></pre>\n\n        <button class=\"yfm-clipboard-button\">\n            <svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"696\">\n                <path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"></path>\n                <path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\">\n                    <animate id=\"visibileAnimation-696\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin></animate>\n                    <animate id=\"hideAnimation-696\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-696.end+1\" fill=\"freeze\"></animate>\n                </path>\n            </svg>\n        </button>\n    </div>\n<p>Пример синхронного запроса на проверку:</p>\n\n    <div class=\"yfm-clipboard\">\n        <pre><code class=\"hljs\">&lt;check timeout=\"100\"&gt;\n    &lt;payment id=\"6437282\" provider=\"bee\" amount=\"1.00\"&gt;\n        &lt;field name=\"phone\"&gt;9035174909&lt;/field&gt;\n    &lt;/payment&gt;\n&lt;/check&gt;\n</code></pre>\n\n        <button class=\"yfm-clipboard-button\">\n            <svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"700\">\n                <path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"></path>\n                <path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\">\n                    <animate id=\"visibileAnimation-700\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin></animate>\n                    <animate id=\"hideAnimation-700\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-700.end+1\" fill=\"freeze\"></animate>\n                </path>\n            </svg>\n        </button>\n    </div>\n<h3 id=\"paycommand\"><a href=\"docs/ru/x-plat/types.html#paycommand\" class=\"yfm-anchor\" aria-hidden=\"true\"><span class=\"visually-hidden\" data-no-index=\"true\">payCommand</span></a>payCommand</h3>\n<p>Описывает команду на проведение платежа, возможность проведения которого была проверена с помощью команды checkCommand.</p>\n<table>\n<thead>\n<tr>\n<th style=\"text-align:left\">Параметр</th>\n<th style=\"text-align:left\">Тип</th>\n<th style=\"text-align:left\">Описание</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td style=\"text-align:left\">payCommand.timeout</td>\n<td style=\"text-align:left\">Int</td>\n<td style=\"text-align:left\">Максимальное время ожидания прекращения <br /> обработки платежа проводящим сервером X-plat.</td>\n</tr>\n<tr>\n<td style=\"text-align:left\">payCommand.payment</td>\n<td style=\"text-align:left\">registeredPaymentInfo</td>\n<td style=\"text-align:left\">Описание платежа, который необходимо <br /> провести.</td>\n</tr>\n</tbody>\n</table>\n<p>Пример асинхронного запроса:</p>\n\n    <div class=\"yfm-clipboard\">\n        <pre><code class=\"hljs\">&lt;pay&gt;\n    &lt;payment id=\"6437282\" /&gt;\n&lt;/pay&gt;\n</code></pre>\n\n        <button class=\"yfm-clipboard-button\">\n            <svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"749\">\n                <path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"></path>\n                <path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\">\n                    <animate id=\"visibileAnimation-749\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin></animate>\n                    <animate id=\"hideAnimation-749\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-749.end+1\" fill=\"freeze\"></animate>\n                </path>\n            </svg>\n        </button>\n    </div>\n<p>Пример синхронного запроса:</p>\n\n    <div class=\"yfm-clipboard\">\n        <pre><code class=\"hljs\">&lt;pay timeout=\"1000\"&gt;\n    &lt;payment id=\"6437282\" /&gt;\n&lt;/pay&gt;\n</code></pre>\n\n        <button class=\"yfm-clipboard-button\">\n            <svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"753\">\n                <path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"></path>\n                <path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\">\n                    <animate id=\"visibileAnimation-753\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin></animate>\n                    <animate id=\"hideAnimation-753\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-753.end+1\" fill=\"freeze\"></animate>\n                </path>\n            </svg>\n        </button>\n    </div>\n<h3 id=\"cashincommand\"><a href=\"docs/ru/x-plat/types.html#cashincommand\" class=\"yfm-anchor\" aria-hidden=\"true\"><span class=\"visually-hidden\" data-no-index=\"true\">cashinCommand</span></a>cashinCommand</h3>\n<p>Описывает команду однофазного проведения платежа.</p>\n<table>\n<thead>\n<tr>\n<th style=\"text-align:left\">Параметр</th>\n<th style=\"text-align:left\">Тип</th>\n<th style=\"text-align:left\">Описание</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td style=\"text-align:left\">cashinCommand.payment</td>\n<td style=\"text-align:left\">paymentInfo</td>\n<td style=\"text-align:left\">Описание платежа, который был послан на <br /> однофазное проведение.</td>\n</tr>\n</tbody>\n</table>\n<p>Пример:<br />\n</p>\n\n    <div class=\"yfm-clipboard\">\n        <pre><code class=\"hljs\">    &lt;payment id=\"6437282\" provider=\"bee\" amount=\"1.00\"&gt;\n        &lt;field name=\"phone\"&gt;9035174909&lt;/field&gt;\n    &lt;/payment&gt;\n&lt;/cashin&gt;\n</code></pre>\n\n        <button class=\"yfm-clipboard-button\">\n            <svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"791\">\n                <path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"></path>\n                <path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\">\n                    <animate id=\"visibileAnimation-791\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin></animate>\n                    <animate id=\"hideAnimation-791\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-791.end+1\" fill=\"freeze\"></animate>\n                </path>\n            </svg>\n        </button>\n    </div>\n<h3 id=\"statuscommand\"><a href=\"docs/ru/x-plat/types.html#statuscommand\" class=\"yfm-anchor\" aria-hidden=\"true\"><span class=\"visually-hidden\" data-no-index=\"true\">statusCommand</span></a>statusCommand</h3>\n<p>Описывает команду запроса текущего статуса зарегистрированного платежа.</p>\n<table>\n<thead>\n<tr>\n<th style=\"text-align:left\">Параметр</th>\n<th style=\"text-align:left\">Тип</th>\n<th style=\"text-align:left\">Описание</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td style=\"text-align:left\">statusCommand.payment</td>\n<td style=\"text-align:left\">registeredPaymentInfo</td>\n<td style=\"text-align:left\">Описание зарегистрированного платежа, <br /> статус которого необходимо запросить.</td>\n</tr>\n</tbody>\n</table>\n<p>Пример:</p>\n\n    <div class=\"yfm-clipboard\">\n        <pre><code class=\"hljs\">&lt;status&gt;\n    &lt;payment id=\"6437282\" /&gt;\n&lt;/status&gt;\n</code></pre>\n\n        <button class=\"yfm-clipboard-button\">\n            <svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"829\">\n                <path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"></path>\n                <path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\">\n                    <animate id=\"visibileAnimation-829\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin></animate>\n                    <animate id=\"hideAnimation-829\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-829.end+1\" fill=\"freeze\"></animate>\n                </path>\n            </svg>\n        </button>\n    </div>\n<h3 id=\"balancecommand\"><a href=\"docs/ru/x-plat/types.html#balancecommand\" class=\"yfm-anchor\" aria-hidden=\"true\"><span class=\"visually-hidden\" data-no-index=\"true\">balanceCommand</span></a>balanceCommand</h3>\n<p>Описывает команду запроса баланса агента.<br />\nПример:<br />\n<span class=\"yfm-latex\" data-content=\"%3C\" data-options=\"%7B%22displayMode%22%3Afalse%7D\"></span> balance /&gt;</p>\n<h3 id=\"provlistcommand\"><a href=\"docs/ru/x-plat/types.html#provlistcommand\" class=\"yfm-anchor\" aria-hidden=\"true\"><span class=\"visually-hidden\" data-no-index=\"true\">provlistCommand</span></a>provlistCommand</h3>\n<p>Описывает команду запроса списка доступных провайдеров.<br />\nПример:<br />\n</p>\n<h3 id=\"pointscommand\"><a href=\"docs/ru/x-plat/types.html#pointscommand\" class=\"yfm-anchor\" aria-hidden=\"true\"><span class=\"visually-hidden\" data-no-index=\"true\">pointsCommand</span></a>pointsCommand</h3>\n<p>Описывает команду регистрации точки приема платежей.</p>\n<table>\n<thead>\n<tr>\n<th style=\"text-align:left\">Параметр</th>\n<th style=\"text-align:left\">Тип</th>\n<th style=\"text-align:left\">Описание</th>\n<th style=\"text-align:left\"></th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td style=\"text-align:left\">pointsCommand.register</td>\n<td style=\"text-align:left\">pointInformation</td>\n<td style=\"text-align:left\">Описание <br /> создать.</td>\n<td style=\"text-align:left\">необходимо</td>\n</tr>\n</tbody>\n</table>\n<p>Пример:</p>\n\n    <div class=\"yfm-clipboard\">\n        <pre><code class=\"hljs\">&lt;points&gt;\n    &lt;register name=\"PointName\" type=\"Cashin\"&gt;\n        &lt;location locality=\"7700000000000\" type=\"002001\"\nstreet=\"StreetName\" building=\"la\" /&gt;\n    &lt;/register&gt;\n&lt;/points&gt;\n</code></pre>\n\n        <button class=\"yfm-clipboard-button\">\n            <svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"885\">\n                <path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"></path>\n                <path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\">\n                    <animate id=\"visibileAnimation-885\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin></animate>\n                    <animate id=\"hideAnimation-885\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-885.end+1\" fill=\"freeze\"></animate>\n                </path>\n            </svg>\n        </button>\n    </div>\n<h3 id=\"request\"><a href=\"docs/ru/x-plat/types.html#request\" class=\"yfm-anchor\" aria-hidden=\"true\"><span class=\"visually-hidden\" data-no-index=\"true\">request</span></a>request</h3>\n<p>Описывает запрос к XML-шлюзу.</p>\n<table>\n<thead>\n<tr>\n<th style=\"text-align:left\">Параметр</th>\n<th style=\"text-align:left\">Тип</th>\n<th style=\"text-align:left\">Описание</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td style=\"text-align:left\">request.guid</td>\n<td style=\"text-align:left\">Guid</td>\n<td style=\"text-align:left\">GUID запроса</td>\n</tr>\n<tr>\n<td style=\"text-align:left\">request.header</td>\n<td style=\"text-align:left\">authInfo</td>\n<td style=\"text-align:left\">Информация для аутентификации запроса</td>\n</tr>\n<tr>\n<td style=\"text-align:left\">request.check или <br /> request.pay или <br /> request.cashin или <br /> request.status или</td>\n<td style=\"text-align:left\">checkCommand <br /> payCommand <br /> cashinCommand <br /> statusCommand</td>\n<td style=\"text-align:left\">Одна из возможных команд к XML-шлюзу.</td>\n</tr>\n</tbody>\n</table>\n<table>\n<thead>\n<tr>\n<th style=\"text-align:left\">request.balance или <br /> request.provlist или <br /> request.points</th>\n<th style=\"text-align:left\">balanceCommand <br /> provlistCommand <br /> pointsCommand</th>\n<th style=\"text-align:left\"></th>\n</tr>\n</thead>\n</table>\n<h2 id=\"otvet-xml-shlyuza\"><a href=\"docs/ru/x-plat/types.html#otvet-xml-shlyuza\" class=\"yfm-anchor\" aria-hidden=\"true\"><span class=\"visually-hidden\" data-no-index=\"true\">Ответ XML-шлюза</span></a>Ответ XML-шлюза</h2>\n<p>Формат ответа от XML-шлюза описывается с помощью XSD-схемы Response.xsd. Найти схему можно по адресу: https://xs2.x-plat.ru/Response.xsd</p>\n<h3 id=\"requestresultcode\"><a href=\"docs/ru/x-plat/types.html#requestresultcode\" class=\"yfm-anchor\" aria-hidden=\"true\"><span class=\"visually-hidden\" data-no-index=\"true\">requestResultCode</span></a>requestResultCode</h3>\n<p>Является перечислением, которое указывает результат обработки запроса XML-шлюзом. Возможные значения перечисления:</p>\n<table>\n<thead>\n<tr>\n<th style=\"text-align:center\">Значение</th>\n<th style=\"text-align:center\">Описание</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td style=\"text-align:center\">Success</td>\n<td style=\"text-align:center\">Запрос был успешно обработан XML-шлюзом.</td>\n</tr>\n<tr>\n<td style=\"text-align:center\">NotPostRequest</td>\n<td style=\"text-align:center\">Был выполнен не POST-запрос, XML-шлюз проигнорировал его.</td>\n</tr>\n<tr>\n<td style=\"text-align:center\">XmIParseError</td>\n<td style=\"text-align:center\">Ошибка при получении XML-документа из POST-содержимого. Текст ошибки содержится в поле Description.</td>\n</tr>\n<tr>\n<td style=\"text-align:center\">XmISchemaError</td>\n<td style=\"text-align:center\">Ошибка в схеме XML-документа. Текст ошибки содержится в поле Description.</td>\n</tr>\n<tr>\n<td style=\"text-align:center\">AuthError</td>\n<td style=\"text-align:center\">Ошибка аутентификации оператора. Неправильно указана тройка point, login, password.</td>\n</tr>\n<tr>\n<td style=\"text-align:center\">UserLock</td>\n<td style=\"text-align:center\">Оператор заблокирован.</td>\n</tr>\n<tr>\n<td style=\"text-align:center\">EdsError</td>\n<td style=\"text-align:center\">Ошибка ЭЦП.</td>\n</tr>\n<tr>\n<td style=\"text-align:center\">Denied</td>\n<td style=\"text-align:center\">Вызов данного метода для авторизованного пользователя недоступен.</td>\n</tr>\n<tr>\n<td style=\"text-align:center\">DisposableCode</td>\n<td style=\"text-align:center\">Для успешной обработки запроса необходимо вызвать его с указанием кода подтверждения.</td>\n</tr>\n<tr>\n<td style=\"text-align:center\">InternalError</td>\n<td style=\"text-align:center\">Внутренняя ошибка XML-шлюза. Необходимо обратиться на integration@x-plat.ru за разъяснением.</td>\n</tr>\n</tbody>\n</table>\n<h3 id=\"paymentresultcode\"><a href=\"docs/ru/x-plat/types.html#paymentresultcode\" class=\"yfm-anchor\" aria-hidden=\"true\"><span class=\"visually-hidden\" data-no-index=\"true\">paymentResultCode</span></a>paymentResultCode</h3>\n<p>Является перечислением, которое указывает результат обработки платежа XML-шлюзом. Возможные значения перечисления:</p>\n<table>\n<thead>\n<tr>\n<th style=\"text-align:center\">Код ошибки</th>\n<th style=\"text-align:center\"></th>\n<th style=\"text-align:center\"></th>\n<th style=\"text-align:center\"><img src=\"docs/ru/x-plat/img-0.jpeg\" alt=\"img-0.jpeg\" /></th>\n<th style=\"text-align:center\"></th>\n<th style=\"text-align:center\">Описание</th>\n<th style=\"text-align:center\">Состояние <br /> платежа в <br /> системе</th>\n<th style=\"text-align:center\">Действие</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td style=\"text-align:center\">Success</td>\n<td style=\"text-align:center\"><span class=\"yfm-latex\" data-content=\"%2B\" data-options=\"%7B%22displayMode%22%3Afalse%7D\"></span></td>\n<td style=\"text-align:center\"><span class=\"yfm-latex\" data-content=\"%2B\" data-options=\"%7B%22displayMode%22%3Afalse%7D\"></span></td>\n<td style=\"text-align:center\"><span class=\"yfm-latex\" data-content=\"%2B\" data-options=\"%7B%22displayMode%22%3Afalse%7D\"></span></td>\n<td style=\"text-align:center\"><span class=\"yfm-latex\" data-content=\"%2B\" data-options=\"%7B%22displayMode%22%3Afalse%7D\"></span></td>\n<td style=\"text-align:center\">Платеж успешно обработан и добавлен в процессинг</td>\n<td style=\"text-align:center\">Платеж принят системой к обработке</td>\n<td style=\"text-align:center\">Переходить к анализу PaymentState</td>\n</tr>\n<tr>\n<td style=\"text-align:center\">ProviderNotExistsOr Lock</td>\n<td style=\"text-align:center\"><span class=\"yfm-latex\" data-content=\"%2B\" data-options=\"%7B%22displayMode%22%3Afalse%7D\"></span></td>\n<td style=\"text-align:center\"></td>\n<td style=\"text-align:center\"><span class=\"yfm-latex\" data-content=\"%2B\" data-options=\"%7B%22displayMode%22%3Afalse%7D\"></span></td>\n<td style=\"text-align:center\"></td>\n<td style=\"text-align:center\">Провайдер не существует или недоступен агенту</td>\n<td style=\"text-align:center\">Платеж не принят системой</td>\n<td style=\"text-align:center\">Обратиться к менеджеру за уточнением с указанием передаваемого идентификатора провайдера</td>\n</tr>\n<tr>\n<td style=\"text-align:center\">AmountMinError</td>\n<td style=\"text-align:center\"><span class=\"yfm-latex\" data-content=\"%2B\" data-options=\"%7B%22displayMode%22%3Afalse%7D\"></span></td>\n<td style=\"text-align:center\"></td>\n<td style=\"text-align:center\"><span class=\"yfm-latex\" data-content=\"%2B\" data-options=\"%7B%22displayMode%22%3Afalse%7D\"></span></td>\n<td style=\"text-align:center\"></td>\n<td style=\"text-align:center\">Указанная сумма платежа не попадает в допустимый диапазон</td>\n<td style=\"text-align:center\">Платеж не принят системой</td>\n<td style=\"text-align:center\">Обновить описание поставщика услуг (метод Provlist)</td>\n</tr>\n</tbody>\n</table>\n<table>\n<thead>\n<tr>\n<th style=\"text-align:center\">DealerBalanceLimit</th>\n<th style=\"text-align:center\"><span class=\"yfm-latex\" data-content=\"%2B\" data-options=\"%7B%22displayMode%22%3Afalse%7D\"></span></th>\n<th style=\"text-align:center\"><span class=\"yfm-latex\" data-content=\"%2B\" data-options=\"%7B%22displayMode%22%3Afalse%7D\"></span></th>\n<th style=\"text-align:center\"><span class=\"yfm-latex\" data-content=\"%2B\" data-options=\"%7B%22displayMode%22%3Afalse%7D\"></span></th>\n<th style=\"text-align:center\"></th>\n<th style=\"text-align:center\">У агента недостаточно средств для проведения платежа</th>\n<th style=\"text-align:center\">Платеж не может быть проведен в сторону провайдера</th>\n<th style=\"text-align:center\">Необходимо убедиться, что достаточно средств для проведения платежа. В противном случае обратиться к менеджеру</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td style=\"text-align:center\">FieldsError</td>\n<td style=\"text-align:center\"><span class=\"yfm-latex\" data-content=\"%2B\" data-options=\"%7B%22displayMode%22%3Afalse%7D\"></span></td>\n<td style=\"text-align:center\"></td>\n<td style=\"text-align:center\"><span class=\"yfm-latex\" data-content=\"%2B\" data-options=\"%7B%22displayMode%22%3Afalse%7D\"></span></td>\n<td style=\"text-align:center\"></td>\n<td style=\"text-align:center\">Неверно указаны платежные поля</td>\n<td style=\"text-align:center\">Платеж не принят системой</td>\n<td style=\"text-align:center\">Обновить описание поставщика услуг (метод Provlist)</td>\n</tr>\n<tr>\n<td style=\"text-align:center\">RequiredFieldsError</td>\n<td style=\"text-align:center\"><span class=\"yfm-latex\" data-content=\"%2B\" data-options=\"%7B%22displayMode%22%3Afalse%7D\"></span></td>\n<td style=\"text-align:center\"></td>\n<td style=\"text-align:center\"><span class=\"yfm-latex\" data-content=\"%2B\" data-options=\"%7B%22displayMode%22%3Afalse%7D\"></span></td>\n<td style=\"text-align:center\"></td>\n<td style=\"text-align:center\">Указаны не все обязательные платежные поля</td>\n<td style=\"text-align:center\">Платеж не принят системой</td>\n<td style=\"text-align:center\">Обновить описание поставщика услуг (метод Provlist)</td>\n</tr>\n<tr>\n<td style=\"text-align:center\">PaymentNotFound</td>\n<td style=\"text-align:center\"></td>\n<td style=\"text-align:center\"><span class=\"yfm-latex\" data-content=\"%2B\" data-options=\"%7B%22displayMode%22%3Afalse%7D\"></span></td>\n<td style=\"text-align:center\"></td>\n<td style=\"text-align:center\"><span class=\"yfm-latex\" data-content=\"%2B\" data-options=\"%7B%22displayMode%22%3Afalse%7D\"></span></td>\n<td style=\"text-align:center\">На момент обработки запроса сервису не удалось запросить статус платежа</td>\n<td style=\"text-align:center\">Неизвестно, так как во время обработки запроса и формирования ответа платеж может быть вставлен другим запросом</td>\n<td style=\"text-align:center\">Убедиться, что по команде Check или Cashin ранее был получен ответ, который был успешно обработан. Если это так, то требуется повторить запрос и при повторе ошибки обратиться в службу технической поддержки (support@x-plat.ru) для уточнения состояния по платежу и причины ошибки</td>\n</tr>\n<tr>\n<td style=\"text-align:center\">PaymentNotCheck</td>\n<td style=\"text-align:center\"></td>\n<td style=\"text-align:center\"><span class=\"yfm-latex\" data-content=\"%2B\" data-options=\"%7B%22displayMode%22%3Afalse%7D\"></span></td>\n<td style=\"text-align:center\"></td>\n<td style=\"text-align:center\"></td>\n<td style=\"text-align:center\">Для данного платежа невозможна оплата. Не выполнен шаг проверки, либо проверка завершилась неудачно</td>\n<td style=\"text-align:center\">Платеж был принят системой, но на момент обработки запроса первая фаза, возможно, не была завершена</td>\n<td style=\"text-align:center\">Убедиться в том, что первая фаза была отработана корректно. Если это так, то требуется повторить запрос и при повторе ошибки обратиться в службу технической поддержки (support@x-plat.ru) для уточнения состояния по платежу и причины ошибки</td>\n</tr>\n</tbody>\n</table>\n<table>\n<thead>\n<tr>\n<th style=\"text-align:center\">PointNotFound</th>\n<th style=\"text-align:center\"><span class=\"yfm-latex\" data-content=\"%2B\" data-options=\"%7B%22displayMode%22%3Afalse%7D\"></span></th>\n<th style=\"text-align:center\"></th>\n<th style=\"text-align:center\"><span class=\"yfm-latex\" data-content=\"%2B\" data-options=\"%7B%22displayMode%22%3Afalse%7D\"></span></th>\n<th style=\"text-align:center\"></th>\n<th style=\"text-align:center\">В теге receipt указана точка, которую сервису не удалось сопоставить с текущим пользователем</th>\n<th style=\"text-align:center\">Платеж не принят системой</th>\n<th style=\"text-align:center\">Убедиться, что указанная точка была зарегистрирована ранее с использованием метода Points. Если это так, то необходимо обратиться в службу технической поддержки (support@x-plat.ru) для уточнения состояния указанной точки</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td style=\"text-align:center\">InternalError</td>\n<td style=\"text-align:center\"><span class=\"yfm-latex\" data-content=\"%2B\" data-options=\"%7B%22displayMode%22%3Afalse%7D\"></span></td>\n<td style=\"text-align:center\"><span class=\"yfm-latex\" data-content=\"%2B\" data-options=\"%7B%22displayMode%22%3Afalse%7D\"></span></td>\n<td style=\"text-align:center\"><span class=\"yfm-latex\" data-content=\"%2B\" data-options=\"%7B%22displayMode%22%3Afalse%7D\"></span></td>\n<td style=\"text-align:center\"><span class=\"yfm-latex\" data-content=\"%2B\" data-options=\"%7B%22displayMode%22%3Afalse%7D\"></span></td>\n<td style=\"text-align:center\">Прочая <br /> внутренняя <br /> ошибка на <br /> стороне XML- <br /> сервиса</td>\n<td style=\"text-align:center\">Неизвестно (может быть как принят так и не принят системой)</td>\n<td style=\"text-align:center\">Необходимо обратиться на integration@x-plat.ru за разъяснением</td>\n</tr>\n</tbody>\n</table>\n<h3 id=\"paymentstatecode\"><a href=\"docs/ru/x-plat/types.html#paymentstatecode\" class=\"yfm-anchor\" aria-hidden=\"true\"><span class=\"visually-hidden\" data-no-index=\"true\">paymentStateCode</span></a>paymentStateCode</h3>\n<p>Является перечислением, которое указывает текущее состояние платежа на сервере X-plat. Возможные значения перечисления:</p>\n<table>\n<thead>\n<tr>\n<th style=\"text-align:left\">Значение</th>\n<th style=\"text-align:left\">Финальное</th>\n<th style=\"text-align:left\">Описание</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td style=\"text-align:left\">ServerOk</td>\n<td style=\"text-align:left\">Нет</td>\n<td style=\"text-align:left\">Платеж принят к обработке сервером X-plat.</td>\n</tr>\n<tr>\n<td style=\"text-align:left\">PsChecking</td>\n<td style=\"text-align:left\">Нет</td>\n<td style=\"text-align:left\">Проверяется возможность оплаты платежа.</td>\n</tr>\n<tr>\n<td style=\"text-align:left\">PsCheckError</td>\n<td style=\"text-align:left\">Да</td>\n<td style=\"text-align:left\">Ошибка при проверке возможности проведения платежа.</td>\n</tr>\n<tr>\n<td style=\"text-align:left\">PsChecked</td>\n<td style=\"text-align:left\">Да</td>\n<td style=\"text-align:left\">Платеж проверен, возможна оплата.</td>\n</tr>\n<tr>\n<td style=\"text-align:left\">PsPaying</td>\n<td style=\"text-align:left\">Нет</td>\n<td style=\"text-align:left\">Платеж посылается на оплату.</td>\n</tr>\n<tr>\n<td style=\"text-align:left\">PsStatus</td>\n<td style=\"text-align:left\">Нет</td>\n<td style=\"text-align:left\">Запрос статуса по платежу от внешнего платежного сервиса</td>\n</tr>\n<tr>\n<td style=\"text-align:left\">PsPayError</td>\n<td style=\"text-align:left\">Да</td>\n<td style=\"text-align:left\">Платеж не прошел оплату.</td>\n</tr>\n<tr>\n<td style=\"text-align:left\">PsOk</td>\n<td style=\"text-align:left\">Да</td>\n<td style=\"text-align:left\">Платеж прошел оплату.</td>\n</tr>\n<tr>\n<td style=\"text-align:left\">Canceled</td>\n<td style=\"text-align:left\">Да</td>\n<td style=\"text-align:left\">Проведение платежа отменено</td>\n</tr>\n</tbody>\n</table>\n<h3 id=\"paymentstatetype\"><a href=\"docs/ru/x-plat/types.html#paymentstatetype\" class=\"yfm-anchor\" aria-hidden=\"true\"><span class=\"visually-hidden\" data-no-index=\"true\">paymentStateType</span></a>paymentStateType</h3>\n<p>Является перечислением, которое указывает тип состояния платежа.<br />\nВозможные значения:</p>\n<table>\n<thead>\n<tr>\n<th style=\"text-align:left\">Значение</th>\n<th style=\"text-align:left\">Описание</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td style=\"text-align:left\">NotFinal</td>\n<td style=\"text-align:left\">Состояние не финальное - обработка платежа продолжается.</td>\n</tr>\n<tr>\n<td style=\"text-align:left\">FinalFatal</td>\n<td style=\"text-align:left\">Состояние финальное. Повторять платеж не имеет смысл, т.к. это <br /> приведет к такому же результату. <br /> Например, ошибка типа - «указанный номер не существует»</td>\n</tr>\n</tbody>\n</table>\n<h3 id=\"paymentparameter\"><a href=\"docs/ru/x-plat/types.html#paymentparameter\" class=\"yfm-anchor\" aria-hidden=\"true\"><span class=\"visually-hidden\" data-no-index=\"true\">paymentParameter</span></a>paymentParameter</h3>\n<p>Описывает список выходных параметров платежа.</p>\n<table>\n<thead>\n<tr>\n<th style=\"text-align:left\">Параметр</th>\n<th style=\"text-align:left\">Тип</th>\n<th style=\"text-align:left\">Описание</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td style=\"text-align:left\">paymentParameter</td>\n<td style=\"text-align:left\">string</td>\n<td style=\"text-align:left\">Словесное описание результата обработки платежа.</td>\n</tr>\n<tr>\n<td style=\"text-align:left\">paymentParameter.name</td>\n<td style=\"text-align:left\">string</td>\n<td style=\"text-align:left\">Название возвращаемого провайдером параметра</td>\n</tr>\n</tbody>\n</table>\n<p>Пример:</p>\n<p>167304946-ntUW<br />\npaymentResult<br />\nОписывает результат обработки платежа XML-шлюзом.</p>\n<table>\n<thead>\n<tr>\n<th style=\"text-align:left\">Параметр</th>\n<th style=\"text-align:left\">Тип</th>\n<th style=\"text-align:left\">Описание</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td style=\"text-align:left\">paymentResult</td>\n<td style=\"text-align:left\">string</td>\n<td style=\"text-align:left\">Словесное описание результата обработки <br /> платежа. Может быть пустым.</td>\n</tr>\n<tr>\n<td style=\"text-align:left\">paymentResult.code</td>\n<td style=\"text-align:left\">paymentResultCode</td>\n<td style=\"text-align:left\">Код результата обработки платежа.</td>\n</tr>\n<tr>\n<td style=\"text-align:left\">paymentResult.fatal</td>\n<td style=\"text-align:left\">Boolean</td>\n<td style=\"text-align:left\">Не использовать при обработке ответа. <br /> Ориентироваться на значение атрибута code.</td>\n</tr>\n</tbody>\n</table>\n<p>Пример:<br />\n<br />\npaymentState<br />\nОписывает состояние, в котором находится платеж на сервере X-plat.</p>\n<table>\n<thead>\n<tr>\n<th style=\"text-align:left\">Параметр</th>\n<th style=\"text-align:left\">Тип</th>\n<th style=\"text-align:left\">Описание</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td style=\"text-align:left\">paymentState</td>\n<td style=\"text-align:left\">string</td>\n<td style=\"text-align:left\">Словесное описание состояния платежа. Содержит <br /> подробное описание ошибки, если оно есть.</td>\n</tr>\n<tr>\n<td style=\"text-align:left\">paymentState.code</td>\n<td style=\"text-align:left\">paymentStateCode</td>\n<td style=\"text-align:left\">Текущее состояние платежа.</td>\n</tr>\n<tr>\n<td style=\"text-align:left\">paymentState.type</td>\n<td style=\"text-align:left\">paymentStateType</td>\n<td style=\"text-align:left\">Тип состояния платежа.</td>\n</tr>\n<tr>\n<td style=\"text-align:left\">paymentState.date</td>\n<td style=\"text-align:left\">DateTime</td>\n<td style=\"text-align:left\">Время обновления состояния платежа.</td>\n</tr>\n</tbody>\n</table>\n<p>Пример без описания состояния:<br />\n<br />\nПример с описанием состояния:<br />\nПроверка на сервере провайдера продолжается</p>\n<h3 id=\"paymentstatus\"><a href=\"docs/ru/x-plat/types.html#paymentstatus\" class=\"yfm-anchor\" aria-hidden=\"true\"><span class=\"visually-hidden\" data-no-index=\"true\">paymentStatus</span></a>paymentStatus</h3>\n<p>Описывает результат обработки платежа XML-шлюзом.</p>\n<table>\n<thead>\n<tr>\n<th style=\"text-align:left\">Параметр</th>\n<th style=\"text-align:left\">Тип</th>\n<th style=\"text-align:left\">Описание</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td style=\"text-align:left\">paymentStatus.result</td>\n<td style=\"text-align:left\">paymentResult</td>\n<td style=\"text-align:left\">Результат обработки платежа.</td>\n</tr>\n<tr>\n<td style=\"text-align:left\">paymentStatus.id</td>\n<td style=\"text-align:left\">Long</td>\n<td style=\"text-align:left\">Идентификатор платежа со стороны XML- <br /> клиента.</td>\n</tr>\n<tr>\n<td style=\"text-align:left\">paymentStatus.pt_id</td>\n<td style=\"text-align:left\">Int</td>\n<td style=\"text-align:left\">Идентификатор платежа со стороны X-plat.</td>\n</tr>\n<tr>\n<td style=\"text-align:left\">paymentStatus.post_date</td>\n<td style=\"text-align:left\">DateTime</td>\n<td style=\"text-align:left\">Время регистрации платежа на сервере X-plat.</td>\n</tr>\n<tr>\n<td style=\"text-align:left\">paymentStatus.state</td>\n<td style=\"text-align:left\">paymentState</td>\n<td style=\"text-align:left\">Текущее состояние платежа.</td>\n</tr>\n<tr>\n<td style=\"text-align:left\">paymentStatus.parameters</td>\n<td style=\"text-align:left\">paymentParameter</td>\n<td style=\"text-align:left\">Выходные параметры по платежу. Может <br /> отсутствовать.</td>\n</tr>\n</tbody>\n</table>\n<p>Пример:</p>\n\n    <div class=\"yfm-clipboard\">\n        <pre><code class=\"hljs\">&lt;payment id=\"290361\"&gt;\n    &lt;result code=\"Success\" fatal=\"true\" /&gt;\n    &lt;pt_id&gt;83401874&lt;/pt_id&gt;\n    &lt;post_date&gt;2008-09-16T00:27:18.95&lt;/post_date&gt;\n    &lt;state code=\"PsChecked\" type=\"FinalFatal\" date=\"2009-03-\n23T09:55:57.723\" /&gt;\n&lt;/payment&gt;\n</code></pre>\n\n        <button class=\"yfm-clipboard-button\">\n            <svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"1791\">\n                <path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"></path>\n                <path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\">\n                    <animate id=\"visibileAnimation-1791\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin></animate>\n                    <animate id=\"hideAnimation-1791\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-1791.end+1\" fill=\"freeze\"></animate>\n                </path>\n            </svg>\n        </button>\n    </div>\n<p>Пример с параметрами:</p>\n\n    <div class=\"yfm-clipboard\">\n        <pre><code class=\"hljs\">&lt;payment id=\"290361\"&gt;\n    &lt;result code=\"Success\" fatal=\"true\" /&gt;\n    &lt;pt_id&gt;83401874&lt;/pt_id&gt;\n    &lt;post_date&gt;2008-09-16T00:27:18.95&lt;/post_date&gt;\n    &lt;state code=\"PsChecked\" type=\"FinalFatal\" date=\"2009-03-\n23T09:55:57.723\" /&gt;\n    &lt;parameters&gt;\n        &lt;parameter name=\"ProviderPaymentId\"&gt;167304946-ntUW&lt;/parameter&gt;\n    &lt;/parameters&gt;\n&lt;/payment&gt;\n</code></pre>\n\n        <button class=\"yfm-clipboard-button\">\n            <svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"1795\">\n                <path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"></path>\n                <path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\">\n                    <animate id=\"visibileAnimation-1795\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin></animate>\n                    <animate id=\"hideAnimation-1795\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-1795.end+1\" fill=\"freeze\"></animate>\n                </path>\n            </svg>\n        </button>\n    </div>\n<h3 id=\"paymentstatuslist\"><a href=\"docs/ru/x-plat/types.html#paymentstatuslist\" class=\"yfm-anchor\" aria-hidden=\"true\"><span class=\"visually-hidden\" data-no-index=\"true\">paymentStatusList</span></a>paymentStatusList</h3>\n<p>Представляет собой список объектов paymentStatus.</p>\n<h3 id=\"requestresult\"><a href=\"docs/ru/x-plat/types.html#requestresult\" class=\"yfm-anchor\" aria-hidden=\"true\"><span class=\"visually-hidden\" data-no-index=\"true\">requestResult</span></a>requestResult</h3>\n<p>Описывает результат обработки запроса XML-шлюзом.</p>\n<table>\n<thead>\n<tr>\n<th style=\"text-align:left\">Параметр</th>\n<th style=\"text-align:left\">Тип</th>\n<th style=\"text-align:left\">Описание</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td style=\"text-align:left\">requestResult</td>\n<td style=\"text-align:left\">String</td>\n<td style=\"text-align:left\">Словесное описание результата обработки запроса <br /> ХML-шлюзом.</td>\n</tr>\n<tr>\n<td style=\"text-align:left\">requestResult.code</td>\n<td style=\"text-align:left\">requestResultCode</td>\n<td style=\"text-align:left\">Код результата обработки запроса XML-шлюзом.</td>\n</tr>\n<tr>\n<td style=\"text-align:left\">requestResult.fatal</td>\n<td style=\"text-align:left\">Boolean</td>\n<td style=\"text-align:left\">Указывает на то, фатальная ли ошибка. Если да, то <br /> необходимо прекратить работу с XML-шлюзом.</td>\n</tr>\n</tbody>\n</table>\n<h3 id=\"response\"><a href=\"docs/ru/x-plat/types.html#response\" class=\"yfm-anchor\" aria-hidden=\"true\"><span class=\"visually-hidden\" data-no-index=\"true\">response</span></a>response</h3>\n<p>Описывает ответ XML-шлюза.</p>\n<table>\n<thead>\n<tr>\n<th style=\"text-align:left\">Параметр</th>\n<th style=\"text-align:left\">Тип</th>\n<th style=\"text-align:left\">Описание</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td style=\"text-align:left\">response.guid</td>\n<td style=\"text-align:left\">Guid</td>\n<td style=\"text-align:left\">GUID запроса, на который пришел этот ответ.</td>\n</tr>\n<tr>\n<td style=\"text-align:left\">response.result</td>\n<td style=\"text-align:left\">requestResult</td>\n<td style=\"text-align:left\">Результат обработки запроса.</td>\n</tr>\n<tr>\n<td style=\"text-align:left\">response.payment</td>\n<td style=\"text-align:left\">paymentStatus</td>\n<td style=\"text-align:left\">Результат выполнения команды. Присутствует, если <br /> код результата обработки запроса равен Success.</td>\n</tr>\n<tr>\n<td style=\"text-align:left\">response.signature</td>\n<td style=\"text-align:left\">String</td>\n<td style=\"text-align:left\">Подпись сообщения в Base64 Encoding.</td>\n</tr>\n</tbody>\n</table>\n<p>Для сообщения ответа дополнительно формируется подпись, соответствующая rsa_sha512 или sha512, которая затем включается в само сообщение.<br />\nСтрока подписи ответа формируется путем конкатенации следующих параметров:<br />\n«Строка для подписи» + «GUID ответа»<br />\n«Строка для подписи» - все, что внутри тега «response». Сначала значения атрибутов, затем рекурсивно значение подэлементов и, если их нет, то значение элемента (значение между тегами). Если в рекурсивном поиске встретится элемент state, то значение его атрибута date в строку для подписи не включается.</p>\n<p>Для следующего ответа:</p>\n\n    <div class=\"yfm-clipboard\">\n        <pre><code class=\"hljs\">&lt;?xml version=\"1.0\" encoding=\"utf-8\"?&gt;\n&lt;response quid=\"10a17dc3-1f64-43c6-9fc2-1faa0c5487a8\"\nxmlns=\"http://xs2.x-plat.ru/Response.xsd\"&gt;\n    &lt;result code=\"Success\" fatal=\"false\" /&gt;\n    &lt;payment id=\"100000\"&gt;\n        &lt;result code=\"Success\" fatal=\"false\" /&gt;\n        &lt;pt_id&gt;395046716&lt;/pt_id&gt;\n        &lt;post_date&gt;2016-09-09T13:22:55&lt;/post_date&gt;\n        &lt;state code=\"PsChecked\" type=\"FinalFatal\" date=\"2016-09-\n09T13:22:55\" /&gt;\n</code></pre>\n\n        <button class=\"yfm-clipboard-button\">\n            <svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"1931\">\n                <path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"></path>\n                <path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\">\n                    <animate id=\"visibileAnimation-1931\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin></animate>\n                    <animate id=\"hideAnimation-1931\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-1931.end+1\" fill=\"freeze\"></animate>\n                </path>\n            </svg>\n        </button>\n    </div>\n\n    <div class=\"yfm-clipboard\">\n        <pre><code class=\"hljs\">&lt;/payment&gt;\n&lt;signature&gt;117851312A8871F2C08AEB7AF14AC3D4C020F55B2B515AA3E4CF09540C3\nF709A1EB555D8D47E7558075F5D21E8DF7FC3080240E29ABD9C3E1A5155F5E9CEC3E1&lt;\n/signature&gt;\n&lt;/response&gt;\n</code></pre>\n\n        <button class=\"yfm-clipboard-button\">\n            <svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"1932\">\n                <path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"></path>\n                <path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\">\n                    <animate id=\"visibileAnimation-1932\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin></animate>\n                    <animate id=\"hideAnimation-1932\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-1932.end+1\" fill=\"freeze\"></animate>\n                </path>\n            </svg>\n        </button>\n    </div>\n<p>строка для подписи будет выглядеть следующим образом:<br />\n«Successfalse100000Successfalse3950467162016-09-09T13:22:55PsCheckedFinalFatal10a17dc3-1f64-<span class=\"yfm-latex\" data-content=\"43%20%5Cmathrm%7Bc%7D%206-9%20%5Cmathrm%7Bfc%7D%202-1\" data-options=\"%7B%22displayMode%22%3Afalse%7D\"></span> faa0c5487a8».</p>\n","leading":false},"router":{"pathname":"docs/ru/x-plat/types","depth":4},"lang":"ru","langs":["ru"]};
