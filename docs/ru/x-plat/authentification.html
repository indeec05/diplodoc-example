                <script type="application/javascript">
                   window.STATIC_CONTENT = false
                   window.__DATA__ = {"data":{"meta":{"metadata":[{"name":"generator","content":"Diplodoc Platform v4.57.7"}],"style":["_bundle/latex-extension.css"],"script":["_bundle/latex-extension.js"]},"assets":[],"headings":[{"title":"Подпись сообщения","href":"docs/ru/x-plat/authentification.html#podpis-soobsheniya","level":2,"items":[{"title":"Формирование строки для подписи","href":"docs/ru/x-plat/authentification.html#formirovanie-stroki-dlya-podpisi","level":3,"items":[{"title":"Название метода","href":"docs/ru/x-plat/authentification.html#nazvanie-metoda","level":4},{"title":"Строка для подписи от параметров","href":"docs/ru/x-plat/authentification.html#stroka-dlya-podpisi-ot-parametrov","level":4}]},{"title":"Формирование строки подписи для объекта PaymentInfo","href":"docs/ru/x-plat/authentification.html#formirovanie-stroki-podpisi-dlya-obuekta-paymentinfo","level":3,"items":[{"title":"Формирование строки подписи для объекта RegisteredPaymentInfo","href":"docs/ru/x-plat/authentification.html#formirovanie-stroki-podpisi-dlya-obuekta-registeredpaymentinfo","level":4}]},{"title":"Подпись с помощью алгоритма с открытым ключом","href":"docs/ru/x-plat/authentification.html#podpis-s-pomoshyu-algoritma-s-otkrytym-klyuchom","level":3},{"title":"Подпись с помощью hash-функции","href":"docs/ru/x-plat/authentification.html#podpis-s-pomoshyu-hash-funkcii","level":3}]},{"title":"Создание закрытых ключей","href":"docs/ru/x-plat/authentification.html#sozdanie-zakrytyh-klyuchej","level":2}],"title":"Аутентификация на XML-шлюзе","includes":[],"html":"<p>Аутентификация производится исходя из информации, представленной в теге header.<br />\nСначала проверяется существование оператора с указанным логином на указанной точке приема, затем, если оператор был найден, происходит сверка SHA1-отпечатка пароля. На этом этапе XMLшлюз может вернуть следующую ошибку:</p>\n<ul>\n<li>AuthError - ошибка аутентификации, т.е. неверно указана тройка point, login, password. После этого выбирается информация об агенте, которому принадлежит точка приема, и об операторе. Исходя из этой информации, проверяется следующее: не заблокирован ли агент, не заблокирован ли пользователь, разрешена ли работа с XML-шлюзом. На этом этапе XML-шлюз может вернуть следующие ошибки:</li>\n<li>DealerLock - агент, которому принадлежит указанная точка приема, заблокирован.</li>\n<li>UserLock - указанный оператор заблокирован.</li>\n<li>XmlLock - указанному оператору запрещена работа с XML-шлюзом.</li>\n</ul>\n<p>После этого выбирается открытый ключ и тип подписи оператора. На основе этой информации проверяется, что XML-клиент использует правильный тип подписи, а так же то, что сообщение верно подписано. На этом этапе XML-шлюз может вернуть следующие ошибки:</p>\n<ul>\n<li>SignTypeError - XML-клиентом используется неправильный тип подписи сообщения.</li>\n<li>OpenKeyError - ошибка при получении открытого ключа оператора.</li>\n<li>EdsError - неверная подпись.</li>\n</ul>\n<p>После успешного прохождения этих операций, считается, что сообщение прошло аутентификацию.</p>\n<p>Общая схема проверки изображена на следующей диаграмме:</p>\n<p><img src=\"docs/ru/x-plat/img-1.jpeg\" alt=\"img-1.jpeg\" /></p>\n<h2 id=\"podpis-soobsheniya\"><a href=\"docs/ru/x-plat/authentification.html#podpis-soobsheniya\" class=\"yfm-anchor\" aria-hidden=\"true\"><span class=\"visually-hidden\" data-no-index=\"true\">Подпись сообщения</span></a>Подпись сообщения</h2>\n<p>Для сообщения дополнительно формируется подпись, соответствующая rsa_sha512 или sha512, которая затем включается в само сообщение (тег request.header.signature).<br />\nВ общем случае этот процесс формирования подписи состоит из двух частей: формирование строки для подписи и непосредственно подпись полученной строки.</p>\n<h3 id=\"formirovanie-stroki-dlya-podpisi\"><a href=\"docs/ru/x-plat/authentification.html#formirovanie-stroki-dlya-podpisi\" class=\"yfm-anchor\" aria-hidden=\"true\"><span class=\"visually-hidden\" data-no-index=\"true\">Формирование строки для подписи</span></a>Формирование строки для подписи</h3>\n<p>Строка подписи формируется путем конкатенации следующих параметров: «Название метода» + «Строка для подписи от параметров» + «GUID запроса».<br />\nПримечание:<br />\nВсе буквы в GUID запроса при подписи переводятся в нижний регистр, то есть вместо A, B, C, D, Е и F используются a, b, c, d, е и f.</p>\n<h4 id=\"nazvanie-metoda\"><a href=\"docs/ru/x-plat/authentification.html#nazvanie-metoda\" class=\"yfm-anchor\" aria-hidden=\"true\"><span class=\"visually-hidden\" data-no-index=\"true\">Название метода</span></a>Название метода</h4>\n<p>Название метода зависит от вызываемого метода, а так же от параметра async (если он есть).</p>\n<table>\n<thead>\n<tr>\n<th style=\"text-align:left\">Метод XML-шлюза</th>\n<th style=\"text-align:left\">Название метода</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td style=\"text-align:left\">checkCommand</td>\n<td style=\"text-align:left\">Check</td>\n</tr>\n<tr>\n<td style=\"text-align:left\">payCommand</td>\n<td style=\"text-align:left\">Pay</td>\n</tr>\n<tr>\n<td style=\"text-align:left\">cashinCommand</td>\n<td style=\"text-align:left\">Cashin</td>\n</tr>\n<tr>\n<td style=\"text-align:left\">statusCommand</td>\n<td style=\"text-align:left\">Status</td>\n</tr>\n<tr>\n<td style=\"text-align:left\">balanceCommand</td>\n<td style=\"text-align:left\">Balance</td>\n</tr>\n<tr>\n<td style=\"text-align:left\">provlistCommand</td>\n<td style=\"text-align:left\">Provlist</td>\n</tr>\n<tr>\n<td style=\"text-align:left\">pointsCommand</td>\n<td style=\"text-align:left\">Points</td>\n</tr>\n</tbody>\n</table>\n<h4 id=\"stroka-dlya-podpisi-ot-parametrov\"><a href=\"docs/ru/x-plat/authentification.html#stroka-dlya-podpisi-ot-parametrov\" class=\"yfm-anchor\" aria-hidden=\"true\"><span class=\"visually-hidden\" data-no-index=\"true\">Строка для подписи от параметров</span></a>Строка для подписи от параметров</h4>\n<p>Для команды Check и Cashin формируется строка подписи от параметра paymentInfo. O том, как это сделать, написано в разделе «Формирование строки подписи для объекта PaymentInfo».<br />\nДля команд Pay и Status формируется строка подписи от параметра registeredPaymentInfo. O том, как это сделать, написано в разделе «Формирование строки подписи для объекта RegisteredPaymentInfo».</p>\n<h3 id=\"formirovanie-stroki-podpisi-dlya-obuekta-paymentinfo\"><a href=\"docs/ru/x-plat/authentification.html#formirovanie-stroki-podpisi-dlya-obuekta-paymentinfo\" class=\"yfm-anchor\" aria-hidden=\"true\"><span class=\"visually-hidden\" data-no-index=\"true\">Формирование строки подписи для объекта PaymentInfo</span></a>Формирование строки подписи для объекта PaymentInfo</h3>\n<p>Строка для подписи элемента paymentInfo формируется путем склеивания значения всех свойств, приведенных к строке, в следующем порядке: PaymentId + Provider + Amount + UserAmount (если передается) + Field1.Name + Field1.Value <span class=\"yfm-latex\" data-content=\"%2B%5Cldots%2B\" data-options=\"%7B%22displayMode%22%3Afalse%7D\"></span> FieldN.Name + FieldN.Value.<br />\nОбратите внимание, что строковое представление суммы платежа выглядит, как дробное число с 2 знаками после разделителя, где в качестве разделителя используется точка. Т.е., например, для суммы 5.5 строковое представление будет иметь следующий вид - «5.50», для суммы 95.34 «95.34», для 90 - «90.00».</p>\n\n    <div class=\"yfm-clipboard\">\n        <pre><code class=\"hljs\">Пример:\n&lt;payment id=\"127823\" provider=\"mega\" amount=\"5.50\"&gt;\n    &lt;field name=\"phone\"&gt;9225498599&lt;/field&gt;\n&lt;/payment&gt;\n</code></pre>\n\n        <button class=\"yfm-clipboard-button\">\n            <svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"154\">\n                <path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"></path>\n                <path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\">\n                    <animate id=\"visibileAnimation-154\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin></animate>\n                    <animate id=\"hideAnimation-154\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-154.end+1\" fill=\"freeze\"></animate>\n                </path>\n            </svg>\n        </button>\n    </div>\n<p>Строка для подписи: «127823mega5.50phone9225498599».</p>\n<h4 id=\"formirovanie-stroki-podpisi-dlya-obuekta-registeredpaymentinfo\"><a href=\"docs/ru/x-plat/authentification.html#formirovanie-stroki-podpisi-dlya-obuekta-registeredpaymentinfo\" class=\"yfm-anchor\" aria-hidden=\"true\"><span class=\"visually-hidden\" data-no-index=\"true\">Формирование строки подписи для объекта RegisteredPaymentInfo</span></a>Формирование строки подписи для объекта RegisteredPaymentInfo</h4>\n<p>Строка для подписи элемента registeredPaymentInfo формируется путем склеивания значения всех свойств, приведенных к строке, в следующем порядке: PaymentId + «0».</p>\n<p>Пример:<br />\n<br />\nСтрока для подписи: «1278230».</p>\n<h3 id=\"podpis-s-pomoshyu-algoritma-s-otkrytym-klyuchom\"><a href=\"docs/ru/x-plat/authentification.html#podpis-s-pomoshyu-algoritma-s-otkrytym-klyuchom\" class=\"yfm-anchor\" aria-hidden=\"true\"><span class=\"visually-hidden\" data-no-index=\"true\">Подпись с помощью алгоритма с открытым ключом</span></a>Подпись с помощью алгоритма с открытым ключом</h3>\n<p>В тег signature помещается электронно-цифровая подпись результата выполнения hash-функции от строки в кодировке WIN-1251, подписанная с помощью закрытого ключа.</p>\n<h3 id=\"podpis-s-pomoshyu-hash-funkcii\"><a href=\"docs/ru/x-plat/authentification.html#podpis-s-pomoshyu-hash-funkcii\" class=\"yfm-anchor\" aria-hidden=\"true\"><span class=\"visually-hidden\" data-no-index=\"true\">Подпись с помощью hash-функции</span></a>Подпись с помощью hash-функции</h3>\n<p>В тег signature помещается результат выполнения hash-функции от строки в кодировке WIN-1251, получаемой в результате конкатенации строки для подписи с секретной фразой оператора.</p>\n<h2 id=\"sozdanie-zakrytyh-klyuchej\"><a href=\"docs/ru/x-plat/authentification.html#sozdanie-zakrytyh-klyuchej\" class=\"yfm-anchor\" aria-hidden=\"true\"><span class=\"visually-hidden\" data-no-index=\"true\">Создание закрытых ключей</span></a>Создание закрытых ключей</h2>\n<p>Для получения аутентификационных данных, используемых в заголовке запроса (точка, логин, пароль), необходимо воспользоваться приложением Point Manager https://www.x-plat.ru/soft/point/. При помощи данного приложения необходимо создать точку нужного типа, затем пользователя с предпочтительным способом аутентификации.</p>\n<p>Если выбран тип с использованием hash-функции, то приложением будет предложено задать секретную фразу, которая в автоматическом режиме будет отправлена на сервер. Эту фразу необходимо использовать для формирования подписи сообщения.</p>\n<p>В случае если выбран тип с использованием алгоритма с открытым ключом, приложение сгенерирует пару ключей. При этом публичный ключ в автоматическом режиме загрузится на сервер, а приватный необходимо использовать для формирования подписи запроса. Данный тип аутентификации является наиболее предпочтительным и криптостойким.</p>\n","leading":false},"router":{"pathname":"docs/ru/x-plat/authentification","depth":4},"lang":"ru","langs":["ru"]};
