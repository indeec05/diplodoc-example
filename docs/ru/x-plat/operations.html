                <script type="application/javascript">
                   window.STATIC_CONTENT = false
                   window.__DATA__ = {"data":{"meta":{"metadata":[{"name":"generator","content":"Diplodoc Platform v4.57.7"}]},"assets":[],"headings":[{"title":"Запрос баланса","href":"docs/ru/x-plat/operations.html#zapros-balansa","level":2,"items":[{"title":"Формат запроса","href":"docs/ru/x-plat/operations.html#format-zaprosa","level":3},{"title":"Формат ответа","href":"docs/ru/x-plat/operations.html#format-otveta","level":3}]},{"title":"Получение списка провайдеров","href":"docs/ru/x-plat/operations.html#poluchenie-spiska-provajderov","level":2,"items":[{"title":"Формат запроса","href":"docs/ru/x-plat/operations.html#format-zaprosa1","level":3},{"title":"Формат ответа","href":"docs/ru/x-plat/operations.html#format-otveta1","level":3}]},{"title":"Регистрация ТПП.","href":"docs/ru/x-plat/operations.html#registraciya-tpp","level":2,"items":[{"title":"Формат запроса","href":"docs/ru/x-plat/operations.html#format-zaprosa2","level":3},{"title":"Формат ответа","href":"docs/ru/x-plat/operations.html#format-otveta2","level":3}]}],"title":"Операции поддерживаемые XML-шлюзом","includes":[],"html":"<p>XML-шлюз поддерживает следующие операции:</p>\n<table>\n<thead>\n<tr>\n<th style=\"text-align:center\">Операция</th>\n<th style=\"text-align:center\">Назначение</th>\n<th style=\"text-align:center\">Параметры</th>\n<th style=\"text-align:center\">Возвращаемое значение</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td style=\"text-align:center\">checkCommand</td>\n<td style=\"text-align:center\">Проверка возможности проведения платежа. При этом платеж регистрируется в системе X-plat.</td>\n<td style=\"text-align:center\">Описание платежа в виде XML-объекта PaymentInfo.</td>\n<td style=\"text-align:center\">Ответ шлюза, содержащий объект PaymentStatus в виде XML.</td>\n</tr>\n<tr>\n<td style=\"text-align:center\">payCommand</td>\n<td style=\"text-align:center\">Проведение зарегистрированного платежа в системе X-plat.</td>\n<td style=\"text-align:center\">Описание платежа в виде XML-объекта RegisteredPaymentInfo.</td>\n<td style=\"text-align:center\">Ответ шлюза, содержащий объект PaymentStatus в виде XML.</td>\n</tr>\n<tr>\n<td style=\"text-align:center\">cashinCommand</td>\n<td style=\"text-align:center\">Однофазное проведение платежа в системе X-plat.</td>\n<td style=\"text-align:center\">Описание платежа в виде XML объекта PaymentInfo</td>\n<td style=\"text-align:center\">Ответ шлюза, содержащий объект PaymentStatus в виде XML</td>\n</tr>\n<tr>\n<td style=\"text-align:center\">statusCommand</td>\n<td style=\"text-align:center\">Получение текущего статуса по платежу, зарегистрированного в системе X-plat.</td>\n<td style=\"text-align:center\">Описание платежа в виде XML-объекта RegisteredPaymentInfo.</td>\n<td style=\"text-align:center\">Ответ шлюза, содержащий объект PaymentStatus в виде XML.</td>\n</tr>\n<tr>\n<td style=\"text-align:center\">balanceCommand</td>\n<td style=\"text-align:center\">Получение баланса агента.</td>\n<td style=\"text-align:center\">Отсутствуют.</td>\n<td style=\"text-align:center\">Ответ шлюза, содержащий объект BalanceResult в виде XML.</td>\n</tr>\n<tr>\n<td style=\"text-align:center\">provlistCommand</td>\n<td style=\"text-align:center\">Получение информации о доступных операторах.</td>\n<td style=\"text-align:center\">Нужно ли получение картинок.</td>\n<td style=\"text-align:center\">Ответ шлюза, содержащий объект ProvlistResult в виде XML.</td>\n</tr>\n<tr>\n<td style=\"text-align:center\">pointsCommand</td>\n<td style=\"text-align:center\">Регистрация точек приема платежей</td>\n<td style=\"text-align:center\">Описание платежа в виде XML-объекта pointInformation</td>\n<td style=\"text-align:center\">Ответ шлюза, содержащий объект PointsResult в виде XML.</td>\n</tr>\n</tbody>\n</table>\n<h2 id=\"zapros-balansa\"><a href=\"docs/ru/x-plat/operations.html#zapros-balansa\" class=\"yfm-anchor\" aria-hidden=\"true\"><span class=\"visually-hidden\" data-no-index=\"true\">Запрос баланса</span></a>Запрос баланса</h2>\n<p>Для получения текущего баланса агента, а так же размера доступного овердрафта, используется метод balanceCommand. Доступные средства, которые можно израсходовать, получаются путем складывания значения баланса и овердрафта.</p>\n<h3 id=\"format-zaprosa\"><a href=\"docs/ru/x-plat/operations.html#format-zaprosa\" class=\"yfm-anchor\" aria-hidden=\"true\"><span class=\"visually-hidden\" data-no-index=\"true\">Формат запроса</span></a>Формат запроса</h3>\n<p>Стандартный запрос к XML-шлюзу, содержащий команду balanceCommand.<br />\nПример:</p>\n\n    <div class=\"yfm-clipboard\">\n        <pre><code class=\"hljs\">&lt;?xml version=\"1.0\" encoding=\"utf-8\"?&gt;\n&lt;request xmlns=\"http://xs2.x-plat.ru/Request.xsd\"\n            guid=\"c17d8aae-ba95-46eb-911d-0b7d649c9a6b\"&gt;\n    &lt;header&gt;\n        &lt;point&gt;3312&lt;/point&gt;\n        &lt;login&gt;login&lt;/login&gt;\n        &lt;password&gt;fEqNCco3Yq9h5ZUg1D3CZJT4lBs=&lt;/password&gt;\n        &lt;signature\ntype=\"sha512_base64\"&gt;wmAK9xH+0Exzvx6f6mGBQyv...bTtPdt0HsOA==&lt;/signature&gt;\n    &lt;/header&gt;\n    &lt;balance /&gt;\n&lt;/request&gt;\n</code></pre>\n\n        <button class=\"yfm-clipboard-button\">\n            <svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"133\">\n                <path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"></path>\n                <path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\">\n                    <animate id=\"visibileAnimation-133\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin></animate>\n                    <animate id=\"hideAnimation-133\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-133.end+1\" fill=\"freeze\"></animate>\n                </path>\n            </svg>\n        </button>\n    </div>\n<p>Подписываемая строка для сообщения формируется путем склеивания строки «Balance» и значения атрибута GUID корневого тега request.<br />\nДля примера, приведенного выше, подписываемая строка будет следующей:<br />\n«Balancec17d8aae-ba95-46eb-911d-0b7d649c9a6b»</p>\n<h3 id=\"format-otveta\"><a href=\"docs/ru/x-plat/operations.html#format-otveta\" class=\"yfm-anchor\" aria-hidden=\"true\"><span class=\"visually-hidden\" data-no-index=\"true\">Формат ответа</span></a>Формат ответа</h3>\n<p>Ответ от XML-шлюза приходит в стандартном виде и содержит объект balanceResult в виде XML.</p>\n\n    <div class=\"yfm-clipboard\">\n        <pre><code class=\"hljs\">Пример успешного ответа:\n&lt;?xml version=\"1.0\" encoding=\"utf-8\"?&gt;\n&lt;response xmlns=\"http://xs2.x-plat.ru/Response.xsd\"\n            guid=\"c17d8aae-ba95-46eb-911d-0b7d649c9a6b\" &gt;\n    &lt;result code=\"Success\" fatal=\"false\" /&gt;\n    &lt;balance over=\"0\" currency_id=\"643\"&gt;1749.5&lt;/balance&gt;\n&lt;signature&gt;g0S8Omi2D8g6pdoSd8t8Lbg4o8ykf/XvvfI5zrhFveK4LU1uaW+ryGnFH8N\nDCEZmNsV/mOmo3Ker7B+eYiO4Jw==&lt;/signature&gt;\n&lt;/response&gt;\n</code></pre>\n\n        <button class=\"yfm-clipboard-button\">\n            <svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"143\">\n                <path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"></path>\n                <path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\">\n                    <animate id=\"visibileAnimation-143\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin></animate>\n                    <animate id=\"hideAnimation-143\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-143.end+1\" fill=\"freeze\"></animate>\n                </path>\n            </svg>\n        </button>\n    </div>\n<h2 id=\"poluchenie-spiska-provajderov\"><a href=\"docs/ru/x-plat/operations.html#poluchenie-spiska-provajderov\" class=\"yfm-anchor\" aria-hidden=\"true\"><span class=\"visually-hidden\" data-no-index=\"true\">Получение списка провайдеров</span></a>Получение списка провайдеров</h2>\n<p>Для получения списка провайдеров, которые доступны агенту, используется метод provlistCommand. Ответом на данную команду является список провайдеров, разделенный на группы.<br />\nМетод имеет необязательный параметр logos (атрибут принимает значения «normal» или «small»), который может быть опущен. Если он указан, сервис пытается найти логотипы для групп и провайдеров нужного типа и отдать их в ответе.</p>\n<h3 id=\"format-zaprosa1\"><a href=\"docs/ru/x-plat/operations.html#format-zaprosa1\" class=\"yfm-anchor\" aria-hidden=\"true\"><span class=\"visually-hidden\" data-no-index=\"true\">Формат запроса</span></a>Формат запроса</h3>\n<p>Стандартный запрос к XML-шлюзу, содержащий команду provlistCommand.</p>\n\n    <div class=\"yfm-clipboard\">\n        <pre><code class=\"hljs\">Пример запроса к XML-шлюзу:\n&lt;?xml version=\"1.0\" encoding=\"UTF-8\" standalone=\"no\"?&gt;\n&lt;request xmlns=\"http://xs2.x-plat.ru/Request.xsd\"\n            guid=\"99ce944a-5660-45a2-a6c5-9138e5ea64a8\"&gt;\n    &lt;header&gt;\n        &lt;point&gt;1577&lt;/point&gt;\n        &lt;login&gt;test&lt;/login&gt;\n        &lt;password&gt;4Hu11QbikToDFCa5Xs8q+f3UlIY=&lt;/password&gt;\n        &lt;signature\ntype=\"sha512_hex\"&gt;C2600AF711FED04C73BF1E9F__B4ED3DDB741EC38&lt;/signature&gt;\n    &lt;/header&gt;\n    &lt; provlist logos=\"normal\"/&gt;\n&lt;/request&gt;\n</code></pre>\n\n        <button class=\"yfm-clipboard-button\">\n            <svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"156\">\n                <path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"></path>\n                <path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\">\n                    <animate id=\"visibileAnimation-156\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin></animate>\n                    <animate id=\"hideAnimation-156\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-156.end+1\" fill=\"freeze\"></animate>\n                </path>\n            </svg>\n        </button>\n    </div>\n<p>Строка для подписи формируется как название метода \"Provlist\", значение атрибута logos, если он передается, и значения атрибута GUID корневого тега request.<br />\nДля примера, приведенного выше, подписываемая строка будет следующей:<br />\n«Provlistnormal99ce944a-5660-45a2-a6c5-9138e5ea64a8»</p>\n<h3 id=\"format-otveta1\"><a href=\"docs/ru/x-plat/operations.html#format-otveta1\" class=\"yfm-anchor\" aria-hidden=\"true\"><span class=\"visually-hidden\" data-no-index=\"true\">Формат ответа</span></a>Формат ответа</h3>\n<p>Ответ от XML-шлюза приходит в стандартном виде и содержит объект provlistResult в виде XML.</p>\n\n    <div class=\"yfm-clipboard\">\n        <pre><code class=\"hljs\">Пример удачного ответа на запрос:\n&lt;?xml version=\"1.0\" encoding=\"utf-8\"?&gt;\n&lt;response guid=\"99ce944a-5660-45a2-a6c5-9138e5ea64c1\"\n            xmlns=\"http://xs2.x-plat.ru/Response.xsd\"&gt;\n    &lt;result code=\"Success\" fatal=\"false\" /&gt;\n    &lt;provlist&gt;\n        &lt;group id=\"1\" title=\"Сотовая связь\"&gt;\n            &lt;logo url=\"http://services.x-plat.ru/logos/group/1\"\nhash=\"3af1a2a3243814c4b154270c9be5feaf\" /&gt;\n        &lt;/group&gt;\n        &lt;group id=\"4\" title=\"Прочие услуги\"&gt;\n            &lt;logo url=\"http://services.x-plat.ru/logos/group/4\"\nhash=\"4722c93af7b078c1d87af901040afeb1\" /&gt;\n        &lt;/group&gt;\n        &lt;group id=\"5\" title=\"Платежные системы\"&gt;\n            &lt;logo url=\"http://services.x-plat.ru/logos/group/5\"\nhash=\"02c896a58e4d3235bb758263da73fe94\" /&gt;\n        &lt;/group&gt;\n</code></pre>\n\n        <button class=\"yfm-clipboard-button\">\n            <svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"166\">\n                <path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"></path>\n                <path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\">\n                    <animate id=\"visibileAnimation-166\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin></animate>\n                    <animate id=\"hideAnimation-166\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-166.end+1\" fill=\"freeze\"></animate>\n                </path>\n            </svg>\n        </button>\n    </div>\n\n    <div class=\"yfm-clipboard\">\n        <pre><code class=\"hljs\">    &lt;group id=\"33\" title=\"Банки\"&gt;\n        &lt;logo url=\"http://services.x-plat.ru/logos/group/33\"\nhash=\"cef05bd5c6e57bd86bad64c8d59bd5a2\" /&gt;\n    &lt;/group&gt;\n    &lt;provider id=\"mts\" title=\"MTC\" group=\"1\" currency=\"643\" min=\"1.00\"\nmax=\"15000.00\"&gt;\n        &lt;logo url=\"http://services.x-plat.ru/logos/logo/mts?type=normal\"\nhash=\"8f9eb8418b97ae57d9e015996c2d3bc5\" /&gt;\n        &lt;number id=\"phone\" title=\"Номер телефона\" min=\"10\" max=\"10\"\nregex=\"\" format=\"8 (000) 000-0000;0;.\" /&gt;\n    &lt;/provider&gt;\n    &lt;provider id=\"hkp\" title=\"Погашение кредита любого банка\"\ngroup=\"33\" currency=\"643\" min=\"50.00\" max=\"14999.99\"&gt;\n        &lt;logo url=\"http://services.x-plat.ru/logos/logo/hkp?type=normal\"\nhash=\"e5250aa92aa2c9cf9bc802e9531971f5\" /&gt;\n        &lt;number id=\"phone\" title=\"Мобильный телефон\" min=\"10\" max=\"10\"\nformat=\"8 (000) 000-0000;0;.\" /&gt;\n        &lt;text id=\"lname\" title=\"Фамилия\" min=\"2\" max=\"30\" /&gt;\n        &lt;text id=\"fname\" title=\"Имя\" min=\"2\" max=\"30\" /&gt;\n        &lt;text id=\"mname\" title=\"Отчество\" min=\"1\" max=\"30\" /&gt;\n        &lt;number id=\"bik\" title=\"БИК\" min=\"9\" max=\"9\" /&gt;\n        &lt;number id=\"account\" title=\"Номер счета\" min=\"20\" max=\"20\"\nregex=\"^\\d{20}$\" /&gt;\n        &lt;text id=\"additional\" title=\"Номер договора\\карты\n(дополнительно)\" optional=\"true\" min=\"0\" max=\"200\" /&gt;\n        &lt;number id=\"passport\" title=\"Серия и номер паспорта\" min=\"10\"\nmax=\"255\" regex=\"\" /&gt;\n    &lt;/provider&gt;\n    &lt;provider id=\"tur\" title=\"iTour\" group=\"4\" currency=\"643\"\nmin=\"1.00\" max=\"15000.00\" schema=\"itur\" tags=\"default:check\"&gt;\n        &lt;logo url=\"http://services.x-plat.ru/logos/logo/tur?type=normal\"\nhash=\"854a32dcae45accf2671d5355866c784\"/&gt;\n        &lt;number id=\"dogovor\" title=\"Номер договора\" min=\"1\" max=\"50\" /&gt;\n        &lt;text id=\"dogovor_surname\" title=\"Фамилия туриста\" min=\"1\"\nmax=\"255\" /&gt;\n    &lt;/provider&gt;\n    &lt;/provlist&gt;\n&lt;signature&gt;117851312A8871F2C08AEB_ABD9C3E1A5155F5E9CEC3E1&lt;/signature&gt;\n&lt;/response&gt;\n</code></pre>\n\n        <button class=\"yfm-clipboard-button\">\n            <svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"167\">\n                <path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"></path>\n                <path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\">\n                    <animate id=\"visibileAnimation-167\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin></animate>\n                    <animate id=\"hideAnimation-167\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-167.end+1\" fill=\"freeze\"></animate>\n                </path>\n            </svg>\n        </button>\n    </div>\n<p>Внутри provlist могут быть теги group и provider, оба эти тега имеют следующие параметры:</p>\n<ul>\n<li>id - идентификатор объекта, уникальный в рамках типа (у группы может быть идентификатор такой же как и у провайдера, но у двух групп/провайдеров не может быть одного и того же идентификатора)</li>\n<li>title - название объекта для отображения на клиенте</li>\n<li>group - идентификатор группы или групп, в которую\\ые вложен объект. У элементов group может отсутствовать. Список групп перечисляется через пробел.</li>\n<li>logo - описание логотипа, если он есть для данной группы\\провайдера. Логотип содержит следующие поля:</li>\n<li>url - откуда можно загрузить сам логотип</li>\n<li>hash - hash файла с логотипом (по нему можно проверять, стоит ли обновлять логотип)</li>\n</ul>\n<p>Пример вложенности групп и провайдеров:</p>\n\n    <div class=\"yfm-clipboard\">\n        <pre><code class=\"hljs\">&lt;provlist&gt;\n    &lt;group id=\"1\" title=\"Сотовая связь\" /&gt;\n    &lt;group id=\"3\" title=\"Интернет\" /&gt;\n    &lt;group id=\"24\" title=\"Дальсвязь\" group=\"1\" /&gt;\n    &lt;provider id=\"mts\" title=\"MTC\" group=\"1\" ...\n    &lt;provider id=\"bee\" title=\"Билайн\" groups=\"1 3\" ...\n    &lt;provider id=\"d001\" title=\"Дальсвязь Центр\" group=\"24\" ...\n    &lt;provider id=\"d002\" title=\"Дальсвязь Восток\" group=\"24\" ...\n    &lt;provider id=\"d003\" title=\"Дальсвязь Запад\" group=\"24\" ...\n&lt;/provlist&gt;\n</code></pre>\n\n        <button class=\"yfm-clipboard-button\">\n            <svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"206\">\n                <path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"></path>\n                <path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\">\n                    <animate id=\"visibileAnimation-206\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin></animate>\n                    <animate id=\"hideAnimation-206\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-206.end+1\" fill=\"freeze\"></animate>\n                </path>\n            </svg>\n        </button>\n    </div>\n<p>На клиенте должно отображаться следующим образом:</p>\n\n    <div class=\"yfm-clipboard\">\n        <pre><code class=\"hljs\">- g.Сотовая связь\n-- g.Дальсвязь\n---- p. Дальсвязь Центр\n---- p. Дальсвязь Восток\n---- p. Дальсвязь Запад\n-- p.MTC\n-- p.Билайн\n- g.Интернет\n-- p.Билайн\n</code></pre>\n\n        <button class=\"yfm-clipboard-button\">\n            <svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"210\">\n                <path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"></path>\n                <path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\">\n                    <animate id=\"visibileAnimation-210\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin></animate>\n                    <animate id=\"hideAnimation-210\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-210.end+1\" fill=\"freeze\"></animate>\n                </path>\n            </svg>\n        </button>\n    </div>\n<p>У объекта provider так же есть дополнительные свойства:</p>\n<ul>\n<li>currency - идентификатор валюты провайдера;</li>\n<li>min - минимальная сумма платежа по провайдеру;</li>\n<li>max - максимальная сумма платежа по провайдеру;</li>\n<li>schema - указывает на то, по какой схеме необходимо принимать платежи в пользу данного провайдера. По умолчанию (если в ответе нет этого атрибута) считается, что провайдер работает по схеме default. В противном случае указывается название схемы, по которой работает провайдер. Если клиент не поддерживает работу по указанной схеме, ему рекомендуется игнорировать данного провайдера. Схем может быть перечислено несколько (разделяются через пробел) в порядке приоритета использования, если клиент не поддерживает первую, он должен проверить вторую и так далее;</li>\n<li>tags - специальные флаги, которые могут быть у провайдера. На данный момент подразумевается использование двух:</li>\n<li>default:check - для default-схемы необходимо сделать онлайн проверку;</li>\n<li>default:online - для default-схемы необходимо сделать онлайн оплату.</li>\n<li>limit - лимиты, установленные для этого провайдера. Может содержать атрибуты. Если их нет, то по этому провайдеру нет установленных лимитов:</li>\n<li>max_amount_of_payment - максимальная сумма платежа, после которой он попадет в ручную проверку;</li>\n<li>provider_daily_limit - максимальная сумма платежей в сутки по провайдеру;</li>\n<li>masterkey_daily_limit - максимальная сумма платежей в сутки по ключевому полю (телефон, номер счета и т.д.).<br />\nКроме этого внутри тега provider идут теги, описывающие платежные поля провайдера. На данный момент поддерживается три типа:</li>\n<li>number - платежное поле, для ввода которого необходимо отобразить цифровую клавиатуру;</li>\n<li>text - платежное поле, для ввода которого необходимо отобразить полную клавиатуру;</li>\n<li>list - платежное поле, значение которого выбирается из определенного списка.</li>\n</ul>\n<p>Все три типа поля имеют следующие свойства:</p>\n<ul>\n<li>id - идентификатор платежного поля, используется как значение name платежного поля платежа при отправке;</li>\n<li>title - название платежного поля для отображения на клиенте;</li>\n<li>optional - указывает на необязательность поля. Если не передается, считается что поле обязательное, т.е. значение этого поля false.<br />\nДальше каждый тип платежного поля имеет дополнительные свойства</li>\n<li>number и text:</li>\n<li>min - минимальная длина платежного поля;</li>\n<li>max - максимальная длина платежного поля;</li>\n<li>regex - проверочное регулярное выражение для значения платежного поля. Может отсутствовать, в таком случае не передается;</li>\n<li>format - формат для отображения, используется текущий;</li>\n<li>list - внутри перечисляется список возможных значений в тегах item, каждый их которых содержит:</li>\n<li>key - значение платежного поля, которое надо передавать в value при отправке платежа;</li>\n<li>text() - название выбора платежного поля для отображения на клиенте.</li>\n</ul>\n<h2 id=\"registraciya-tpp\"><a href=\"docs/ru/x-plat/operations.html#registraciya-tpp\" class=\"yfm-anchor\" aria-hidden=\"true\"><span class=\"visually-hidden\" data-no-index=\"true\">Регистрация ТПП.</span></a>Регистрация ТПП.</h2>\n<p>Для регистрации новых ТПП используется метод pointsCommand.<br />\nМетод содержит тег register с обязательными параметрами: name (название ТПП, должно быть уникальным для каждой точки, которая регистрируется методом Points), type (тип регистрируемой ТПП), в который вложен тег location с обязательными параметрами locality (КЛАДР код из официального справочника), type (тип расположения, полный список возможных значений которых см. в приложении 1), street (название улицы), building (номер строения).<br />\nТип регистрируемой ТПП type может принимать значения:</p>\n<ul>\n<li>Cashin - Терминал самообслуживания. Клиент имеет непосредственный доступ к ТПП.</li>\n<li>Client - ТПП с кассиром (представителем агента). Работа с программным обеспечением производит сотрудник, а не непосредственно клиент.</li>\n<li>InternetCashin - Терминал самообслуживания с удаленным доступом клиента. Интернеткошелек, интернет-банкинг. У ТПП нет фактического адреса расположения, вместо него используется некий юридический.</li>\n</ul>\n<h3 id=\"format-zaprosa2\"><a href=\"docs/ru/x-plat/operations.html#format-zaprosa2\" class=\"yfm-anchor\" aria-hidden=\"true\"><span class=\"visually-hidden\" data-no-index=\"true\">Формат запроса</span></a>Формат запроса</h3>\n<p>Стандартный запрос к XML-шлюзу, содержащий команду pointsCommand.</p>\n\n    <div class=\"yfm-clipboard\">\n        <pre><code class=\"hljs\">Пример:\n&lt;?xml version=\"1.0\" encoding=\"utf-8\"?&gt;\n&lt;request xmlns=\"http://xs2.x-plat.ru/Request.xsd\"\n        guid=\"8e5f4f35-0cc9-4563-b928-7c4ac264cb4b\"&gt;\n    &lt;header&gt;\n    &lt;point&gt;45515&lt;/point&gt;\n    &lt;login&gt;gate&lt;/login&gt;\n    &lt;password&gt;fEqNCco3Yq9h5ZUglD3CZJT4lBs=&lt;/password&gt;\n    &lt;signature\ntype=\"sha512_base64\"&gt;wmAK9xH+0Exzvx6f6...CX4QxVbTtPdt0HsOA==&lt;/signature&gt;\n    &lt;/header&gt;\n    &lt;points&gt;\n    &lt;register name=\"PointName\" type=\"Cashin\"&gt;\n    &lt;location locality=\"5600000100000\" type=\"001\" street=\"Street\"\nbuilding=\"1a\" /&gt;\n    &lt;/register&gt;\n&lt;/points&gt;\n&lt;/request&gt;\n</code></pre>\n\n        <button class=\"yfm-clipboard-button\">\n            <svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"375\">\n                <path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"></path>\n                <path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\">\n                    <animate id=\"visibileAnimation-375\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin></animate>\n                    <animate id=\"hideAnimation-375\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-375.end+1\" fill=\"freeze\"></animate>\n                </path>\n            </svg>\n        </button>\n    </div>\n<p>Подписываемая строка для сообщения формируется путем склеивания строки «Points» и строка подписи для каждого тега register в той последовательности, в которой они идут.<br />\nСтрока для подписи тега register формируется путем склеивания значений атрибутов: name + type + location.locality + location.type + location.street + location.building.<br />\nДля примера, приведенного выше, подписываемая строка будет следующей:<br />\n«PointsPointNameCashin5600000100000001Street1a8e5f4f35-0cc9-4563-b928-7c4ac264cb4b»</p>\n<h3 id=\"format-otveta2\"><a href=\"docs/ru/x-plat/operations.html#format-otveta2\" class=\"yfm-anchor\" aria-hidden=\"true\"><span class=\"visually-hidden\" data-no-index=\"true\">Формат ответа</span></a>Формат ответа</h3>\n<p>Ответ от XML-шлюза приходит в стандартном виде и содержит объект pointsCommand в виде XML.</p>\n<p>Пример успешного ответа:</p>\n\n<p>&lt;response guid=\"8e5f4f35-0cc9-4563-b928-7c4ac264cb4b\"</p>\n\n    <div class=\"yfm-clipboard\">\n        <pre><code class=\"hljs\">        xmlns=\"http://xs2.x-plat.ru/Response.xsd\"&gt;\n    &lt;result code=\"Success\" fatal=\"false\" /&gt;\n    &lt;points&gt;\n        &lt;register name=\"PointName\" status=\"Registered\" /&gt;\n    &lt;/points&gt;\n&lt;signature&gt;g0S80mi2D8g6pdoSd8t8Lbg..sV/m0mo3Ker7B+eYiO4Jw==&lt;/signature&gt;\n&lt;/response&gt;\n</code></pre>\n\n        <button class=\"yfm-clipboard-button\">\n            <svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"392\">\n                <path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"></path>\n                <path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\">\n                    <animate id=\"visibileAnimation-392\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin></animate>\n                    <animate id=\"hideAnimation-392\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-392.end+1\" fill=\"freeze\"></animate>\n                </path>\n            </svg>\n        </button>\n    </div>\n<ul>\n<li>name - название регистрируемой ТПП;</li>\n<li>status - означает статус регистрации указанной ТПП:</li>\n<li>Registered - ТПП успешно зарегистрирована в системе, можно указывать ее в receipt;</li>\n<li>LocalityNotFound - не удалось зарегистрировать ТПП, т.к. по значению location.locality ничего не удалось найти;</li>\n<li>ManyLocalitiesFound - не удалось зарегистрировать ТПП, т.к. по значению location.locality нашлось более одного населенного пункта. В случае этого кода, в ответе так же будут присутствовать теги locality, что бы на стороне клиента можно было выбрать нужный населенный пункт;</li>\n<li>locality - присутствуют только в случае кода статуса ManyLocalitiesFound. Перечисляют найденные населенные пункты по location.locality из запроса, среди которых сервис не смог выбрать однозначное соответствие:</li>\n<li>code - если послать этот код в качестве location.locality, будет выбран именно этот населенный пункт;</li>\n<li>region - название региона для населенного пункта;</li>\n<li>name - название самого населенного пункта.</li>\n</ul>\n","leading":false},"router":{"pathname":"docs/ru/x-plat/operations","depth":4},"lang":"ru","langs":["ru"]};
