                <script type="application/javascript">
                   window.STATIC_CONTENT = false
                   window.__DATA__ = {"data":{"meta":{"metadata":[{"name":"generator","content":"Diplodoc Platform v4.57.7"}]},"assets":[],"headings":[{"title":"Назначение документа","href":"docs/ru/x-plat/intro.html#naznachenie-dokumenta","level":2},{"title":"Словарь терминов","href":"docs/ru/x-plat/intro.html#slovar-terminov","level":2}],"title":"Введение","includes":[],"html":"<h2 id=\"naznachenie-dokumenta\"><a href=\"docs/ru/x-plat/intro.html#naznachenie-dokumenta\" class=\"yfm-anchor\" aria-hidden=\"true\"><span class=\"visually-hidden\" data-no-index=\"true\">Назначение документа</span></a>Назначение документа</h2>\n<p>Данный документ описывает регламент технического взаимодействия XML-шлюза платежного сервиса X-plat с XML-клиентом агента по протоколу HTTPS.<br />\nДокумент предназначен для разработчиков XML-клиентов.</p>\n<h2 id=\"slovar-terminov\"><a href=\"docs/ru/x-plat/intro.html#slovar-terminov\" class=\"yfm-anchor\" aria-hidden=\"true\"><span class=\"visually-hidden\" data-no-index=\"true\">Словарь терминов</span></a>Словарь терминов</h2>\n<table>\n<thead>\n<tr>\n<th style=\"text-align:center\">Термин</th>\n<th style=\"text-align:center\">Определение</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td style=\"text-align:center\">Агент</td>\n<td style=\"text-align:center\">Организация, осуществляющая прием и проведение платежей на основании агентского договора с системой X-plat либо лицо, ответственное за работу пунктов приема платежей (осуществляет установку и активацию программы-клиента, создание точек, добавление операторов и т.д.).</td>\n</tr>\n<tr>\n<td style=\"text-align:center\">Точка или пункт приема платежей (ТПП)</td>\n<td style=\"text-align:center\">Терминал самообслуживания, рабочее место (компьютер + программа) или терминал с удаленным доступом клиента на базе собственного ПО агента, который не имеет фактического адреса, с которых осуществляется проведение платежей.</td>\n</tr>\n<tr>\n<td style=\"text-align:center\">Оператор</td>\n<td style=\"text-align:center\">Пользователь автоматизированного рабочего места, программы, который производит отправку платежей.</td>\n</tr>\n<tr>\n<td style=\"text-align:center\">Поставщик услуг (Провайдер)</td>\n<td style=\"text-align:center\">Коммерческая организация или индивидуальный предприниматель, предоставляющие потребителям услуги, продающие товары от собственного имени, а также благотворительная организация, созданная для осуществления благотворительной деятельности, в пользу которого оператор осуществляет зачисление средств (проводит платеж).</td>\n</tr>\n<tr>\n<td style=\"text-align:center\">Система</td>\n<td style=\"text-align:center\">Автоматизированная учетная система процессинга X-plat, предназначенная для обеспечения дистанционной оплаты потребителем услуг поставщика.</td>\n</tr>\n<tr>\n<td style=\"text-align:center\">Плательщик</td>\n<td style=\"text-align:center\">Как правило, физическое лицо, желающее оплатить услуги предоставляемые провайдером (провайдерами) через систему.</td>\n</tr>\n<tr>\n<td style=\"text-align:center\">Платежная информация</td>\n<td style=\"text-align:center\">Данные необходимые для зачисления денежных средств на лицевой счет плательщика в учетной системе провайдера (сумма, провайдер, номер телефона/договора и т.п.), вводится оператором, предоставляется плательщиком.</td>\n</tr>\n<tr>\n<td style=\"text-align:center\">XML-клиент (Клиент)</td>\n<td style=\"text-align:center\">Программное обеспечение на стороне агента, работающее с системой X-plat через XML-шлюз.</td>\n</tr>\n<tr>\n<td style=\"text-align:center\">Платеж</td>\n<td style=\"text-align:center\">Денежные средства, принимаемые агентом от плательщиков в счет оплаты услуг в пользу поставщиков услуг.</td>\n</tr>\n<tr>\n<td style=\"text-align:center\">Квитанция</td>\n<td style=\"text-align:center\">Фискальный документ, являющийся подтверждением приема платежа и состоящий из определенного набора платежных реквизитов.</td>\n</tr>\n</tbody>\n</table>\n","leading":false},"router":{"pathname":"docs/ru/x-plat/intro","depth":4},"lang":"ru","langs":["ru"]};
