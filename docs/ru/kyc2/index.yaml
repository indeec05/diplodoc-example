    textContent:
      title: 'Обзор'
      text: "<p>KYC (<b>K</b>now <b>Y</b>our <b>C</b>ustomer) - решение для проверки и получения данных физических и юридических лиц в системах ответчиках и в сервисах самого KYC. Оно предназначено для использования в следующих процессах:</p><ul><li>проведения идентификации в соответствии со 115 ФЗ;</li><li>антифрод и aml-процедурах;</li><li>подтсановки данных по одному реквизиту;</li></ul><p>и так далее. Важно понимать, что под термином <code>данные</code> часто скрываются персональные данные в интерпретации 152 ФЗ, поэтому их обработка и хранение накладвыает ряд ограничений.</p><h3>Функционал системы</h3><p>Решение следующим набором возможностей:</p><ul><li>поддержка множества способов проверок:<ul><li>проверка во внешних системах-ответчиках (СМЭВ, МТС)</li><li>проверка по загруженным спискам в синхронном и асинхронном режимах</li></ul></li><li>возможность группировать способы для осуществленяи проверки в рамках одного вызова сервиса</li><li>ввод данных пользователей на страницах решения (<em>в разработке</em>)</li></ul><h3>Предоставление доступа</h3><p>Для предоставления доступа к решению необходимо направить запрос на <a href=\"mailto:\">access@w1.money</a> с указанием следующих реквизитов:</p><ul><li>решение, которому необходим доступ</li><li>список способов проверок, которые планируется использовать</li><li>тестовая или промышленная среда</li></ul><p>После предоставления доступа в системе необходимо авторизоваться. Подробнее об этом будет на странице Авторизации.</p>"
