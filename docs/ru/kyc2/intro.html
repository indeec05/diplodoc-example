                   window.STATIC_CONTENT = false
                   window.__DATA__ = {"data":{"meta":{"metadata":[{"name":"generator","content":"Diplodoc Platform v4.57.7"}]},"assets":[],"headings":[],"title":"Обзор","includes":[],"html":"<p>KYC (<strong>K</strong>now <strong>Y</strong>our <strong>C</strong>ustomer) - решение для проверки и получения данных физических и юридических лиц в системах ответчиках и в сервисах самого KYC. Оно предназначено для использования в следующих процессах:</p>\n<ul>\n<li>проведения идентификации в соответствии со 115 ФЗ;</li>\n<li>антифрод и aml-процедурах;</li>\n<li>подстановки данных по одному реквизиту;</li>\n</ul>\n<p>и так далее. Важно понимать, что под термином <code>данные</code> часто скрываются персональные данные в интерпретации 152 ФЗ, поэтому их обработка и хранение накладвыает ряд ограничений.</p>\n<h3 id=\"funkcional-sistemy\"><a href=\"docs/ru/kyc2/intro.html#funkcional-sistemy\" class=\"yfm-anchor\" aria-hidden=\"true\"><span class=\"visually-hidden\" data-no-index=\"true\">Функционал системы</span></a>Функционал системы</h3>\n<p>Решение следующим набором возможностей:</p>\n<ul>\n<li>поддержка множества способов проверок:\n<ul>\n<li>проверка во внешних системах-ответчиках (СМЭВ, МТС)</li>\n<li>проверка по загруженным спискам в синхронном и асинхронном режимах</li>\n</ul>\n</li>\n<li>возможность группировать способы для осуществленяи проверки в рамках одного вызова сервиса</li>\n<li>ввод данных пользователем на страницах KYC2 (<em>в разработке</em>)</li>\n</ul>\n<h3 id=\"predostavlenie-dostupa\"><a href=\"docs/ru/kyc2/intro.html#predostavlenie-dostupa\" class=\"yfm-anchor\" aria-hidden=\"true\"><span class=\"visually-hidden\" data-no-index=\"true\">Предоставление доступа</span></a>Предоставление доступа</h3>\n<p>Для предоставления доступа к решению необходимо направить запрос на <a href=\"mailto:\" target=\"_blank\" rel=\"noreferrer noopener\">access@w1.money</a> с указанием следующих реквизитов:</p>\n<ul>\n<li>решение, которому необходим доступ</li>\n<li>список способов проверок, которые планируется использовать</li>\n<li>тестовая или промышленная среда</li>\n</ul>\n<p>После предоставления доступа в системе необходимо авторизоваться. Подробнее об этом будет на странице Авторизации.</p>\n","leading":false},"router":{"pathname":"docs/ru/kyc2/intro","depth":4},"lang":"ru","langs":["ru"]};
