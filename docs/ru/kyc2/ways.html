                <script type="application/javascript">
                   window.STATIC_CONTENT = false
                   window.__DATA__ = {"data":{"meta":{"metadata":[{"name":"generator","content":"Diplodoc Platform v4.57.7"}]},"assets":[],"headings":[{"title":"Проверка по стоп-базам","href":"docs/ru/kyc2/ways.html#proverka-po-stop-bazam","level":2,"items":[{"title":"Синхронная проверка","href":"docs/ru/kyc2/ways.html#sinhronnaya-proverka","level":3},{"title":"Асинхронная проверка","href":"docs/ru/kyc2/ways.html#asinhronnaya-proverka","level":3}]},{"title":"Методы идентификации","href":"docs/ru/kyc2/ways.html#metody-identifikacii","level":2},{"title":"Ввод данных пользователем на страницах KYC2","href":"docs/ru/kyc2/ways.html#vvod-dannyh-polzovatelem-na-stranicah-kyc2","level":2}],"title":"Способы проверки","includes":[],"html":"<p>KYC2 предоставляет различные способы проверки для различных сцеариев использования. На данный момент доступно два вида:</p>\n<ol>\n<li>проверка по стоп-базам</li>\n<li>проверка с помощью методов идентификации</li>\n<li>ввод данных пользователем на страницах KYC2</li>\n</ol>\n<p>Ниже рассмотрим каждый способ и его сецнарии отдельно:</p>\n<h2 id=\"proverka-po-stop-bazam\"><a href=\"docs/ru/kyc2/ways.html#proverka-po-stop-bazam\" class=\"yfm-anchor\" aria-hidden=\"true\"><span class=\"visually-hidden\" data-no-index=\"true\">Проверка по стоп-базам</span></a>Проверка по стоп-базам</h2>\n<h3 id=\"sinhronnaya-proverka\"><a href=\"docs/ru/kyc2/ways.html#sinhronnaya-proverka\" class=\"yfm-anchor\" aria-hidden=\"true\"><span class=\"visually-hidden\" data-no-index=\"true\">Синхронная проверка</span></a>Синхронная проверка</h3>\n<p>Этот способ предназначен для синхронной проверки данных участников операции в момент ее выполнения. Реализуют его методы контроллера <a href=\"docs/ru/kyc2/openapi/CheckByStopBases/\"><code>CheckByStopBases</code></a>. Так как для проверки по стоп-базам не требуется обращения к внешним источникам и актуальные списки загружаются напрямую в сервис, методы отрабатывают очень быстро.</p>\n<p>Пример вызова:</p>\n<p><img src=\"https://plantuml.w1.money/png/LOqn2i9044NxFSMGLaB0qYAWbXO6OsEvXYc2HjVT2PXEOcFX8VG6GOWM0Rt2x8tS5IsiPlZlpPzXHbiDYQnGWpIWX9AQyYnNSaCGkBn0jwGLOH5u0VVqhqmMu_w7hAfC21N6pkZr1i1NVlADMtkm9sxShC45B-wuiRKz2W3V5SRkpEl9D9r395KU6TggS2aDXXft9HhogaOgzGOy6paqGrEkINnJld3B3tlapfvjxVlXzyY1EpTl\" alt=\"ways\" title=\"ways\" /></p>\n<h3 id=\"asinhronnaya-proverka\"><a href=\"docs/ru/kyc2/ways.html#asinhronnaya-proverka\" class=\"yfm-anchor\" aria-hidden=\"true\"><span class=\"visually-hidden\" data-no-index=\"true\">Асинхронная проверка</span></a>Асинхронная проверка</h3>\n<p>Этот способ подходит для случаев, когда проверка может выполняться какое-то время или по какой-то иной причине такой способ интеграции удобен. Однако, так как такой способ предполагает проверку лишь по одному справочнику за раз, удобнее использовать проверку с помощью <code>метода идентификации</code>.</p>\n<p>Пример вызова:</p>\n<p><img src=\"https://plantuml.w1.money/png/TOzFIq915CNtyoa6j_PGNBeGIIIYHQ9jMaxFeHxlZzFCFF0HGJuX20ANxQAFy92UMf9-XNE_KOmL9D7odlixzvpRDbPecyOHOqfe6_Y14edbFP59pONXQa-kTCTMwaH43eXbOlaWCrR65OVAiTs3Jyux3QU7cS-OybfoRAlL9iSpJMXA3oXfGZdcMDCC9UKSMwnHK8uI2yOvTmUzLfZvpjKx7Ppncb11pTYHyYw4aPwMrwaqTiTgQLETy4QzFWgPCtejrUHuGa4ppF6EWjC46opnYW8VA0uuDbXWjPlVNEgVpAFkVv6r6oST2YCxLz8FW-Io_xKu7jx-hlD3zQL98yk-LRoWn9AcMDCZvUvbrsMBakvGq3rMM37MbiamZQDF\" alt=\"ways\" title=\"ways\" /></p>\n<h2 id=\"metody-identifikacii\"><a href=\"docs/ru/kyc2/ways.html#metody-identifikacii\" class=\"yfm-anchor\" aria-hidden=\"true\"><span class=\"visually-hidden\" data-no-index=\"true\">Методы идентификации</span></a>Методы идентификации</h2>\n<p>Методы идентификации - основной способ проверки в сервисе, так как они предоставляют возможность вызывать сервис-провайдеров, а так же комбинировать проверки по разным источникам, что существенно упрощает интеграцию.</p>\n<p>Для получения доступного списка методов необходимо использовать метод <a href=\"docs/ru/kyc2/openapi/IdentificationMethods/apiidentification-methods-get.html\"><code>GET/api/identification-methods</code></a>. Не все методы доступны всем партнерам, поэтому, если нужного вам нет в списке, запросите его, как описано в <a href=\"docs/ru/kyc2/ru/kyc2/intro.html\">{#T}</a>. Доступные методы перечислены в разделе <a href=\"docs/ru/kyc2/methods\">Методы идентификации</a></p>\n<p>Непосредственная проверка в сервисе выполняется на основе заявки на идентификацию. Чтобы ее создать, потребуется заполнить соответствующий набор документов. Для разных методов он может отличаться. Подробнее требуемый список смотрите на странице описания самого метода.</p>\n<p>Пример вызова:</p>\n<p><img src=\"https://plantuml.w1.money/png/XL3DIiD06BplKtpqMaB1Om-zI17nOB5UFAx92ejj4fCD64He_RjKxKbyZL9QA6sJliAtR-Hi0c8HCOUmkz_CV3CZVHCbr9EvIaYc58jO9aRxEfQXeKRtrgWab0FgvwbHmuQ3g5kp1pgvE3nmxzUvBqJiTJ1lDjlyoJCxvJclUKPSkD-A5xpamZxmoZxXXebzmVbTo84X_h1Ztl3AWPV4Epi2UC6b7OCmWz06SXjoJxosZxojjUn443uizRnEt2RxXka8XC9E2Amvu0ktVSTBEyAAqfc1sAj3s6Sd271z4IeC26R4jsO7gP26UgVzSsh9MBTqe4AZhxGlZOv2Br4tcKfDshhClI3oio6cdWxIIY5H9aj2sgUSrOpZG8X15CKmMKNTsgaxJc2qH0-5YuTofdKL9OB0Fpf3GVEgyryUZxh_MBpxmyZzJxEfaIPBgoQSlIy0\" alt=\"ways\" title=\"ways\" /></p>\n<h2 id=\"vvod-dannyh-polzovatelem-na-stranicah-kyc2\"><a href=\"docs/ru/kyc2/ways.html#vvod-dannyh-polzovatelem-na-stranicah-kyc2\" class=\"yfm-anchor\" aria-hidden=\"true\"><span class=\"visually-hidden\" data-no-index=\"true\">Ввод данных пользователем на страницах KYC2</span></a>Ввод данных пользователем на страницах KYC2</h2>\n<p>Этот способ является надстройкой над <code>методами идентификации</code> и преданзначен для случая, когда партнер или вызывающая система не хочет брать на себя ответственность за передачу персональных данных или просто не обладает такой возможностью. Тогда, с помощью метода <a href=\"docs/ru/kyc2/openapi/GeneratePageUrl/apigenerate-identification-url-post.html\"><code>POST /api/generate-identification-url</code></a> можно сгенерировать страницу, на которую перенаправить пользователя для ввода своих данных.</p>\n<p>Пример вызова:</p>\n<p><img src=\"https://plantuml.w1.money/png/PL71IiD05BplLpoybb3mc4CfI97YmMBru759rXAQ9kjc0mqYb29UAlReqLy8eS7GclONPlz8DgrYzRA7D_Dcvirs4ysLJYSXuvwE5Gru9XJnX2IJNEd02oIFD9tqfbgeY8Sqp18j9YUM8gRwY7HnUtPgv-FCOqmw7J7LhPQBD-HcYG9hv8JQFXLMA56REIhpXCeYvXcLUMMCYAokqnbdNglbqk1oU4rjBeFsI4H2SIsSm1UH3ku2Z-iWZfnKXSsM4ZfL4Ka-4ZSg_54Yn-cGT0dlACtCsYB7pioGey36B56QEM67BJRc1H_Oea1kvYWjkC_xBMaLPPFC9HGeiCKAbLrV8KUDsYnGCXR6iIGKZTcdrIZCOc-0kl6lxD16i5usr1eLeMZw-rV0UUzm_v-pbRXFHQAJzeCuV4t_Y72rn_l-u-zs4irrcZ0H-MHZigw8_7GIVW40\" alt=\"ways\" title=\"ways\" /></p>\n","leading":false},"router":{"pathname":"docs/ru/kyc2/ways","depth":4},"lang":"ru","langs":["ru"]};
                </script>
