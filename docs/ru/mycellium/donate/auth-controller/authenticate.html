,"href":"docs/ru/mycellium/donate/auth-controller/authenticate.html#body5","level":3}]}],"title":"","includes":[],"html":"<div class=\"openapi\">\n<h1>GET bySignature</h1>\n<p>Метод для формирования Signature партнером, для перенаправления пользователя на платежные страницы для совершения доната.<br />\n(После формирования Signature и совершения доната пользователь возможен опрос статуса доната по callbackId, сгенерированному партнером, через метод <a href=\"https://w1.stoplight.io/docs/mycellium-api/04943a5985142-get-donate-callback-id\" target=\"_blank\" rel=\"noreferrer noopener\">GET Donation CallbackId</a>)</p>\n<p>Список параметров на подпись, передаваемых партнером:<br />\nsign=BASE64(SignatureMethod(UTF8(URL)))</p>\n<p>где:</p>\n<table>\n<thead>\n<tr>\n<th>BASE64</th>\n<th>Функция преобразования бинарных данных (массива байт) к BASE64 строке</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>SignatureMethod</td>\n<td>Криптографическая функция используемая для вычисления ЭЦП (метод подписи ключа Партнера SHA1withRSA)</td>\n</tr>\n<tr>\n<td>UTF8</td>\n<td>Функция, которая преобразовывает строку к кодировке UTF8 и возвращает массив байт</td>\n</tr>\n<tr>\n<td>URL</td>\n<td>Url-адрес, на который направляется запрос <code>*</code></td>\n</tr>\n</tbody>\n</table>\n<p><code>*</code> - Параметры, передаваемые в URL:</p>\n<table>\n<thead>\n<tr>\n<th style=\"text-align:right\">НАЗВАНИЕ ПАРАМЕТРА</th>\n<th style=\"text-align:center\">ТИП ДАННЫХ</th>\n<th style=\"text-align:left\">ОПИСАНИЕ</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td style=\"text-align:right\"><strong>externalUserId</strong></td>\n<td style=\"text-align:center\">String</td>\n<td style=\"text-align:left\">id донатера</td>\n</tr>\n<tr>\n<td style=\"text-align:right\"><strong>callbackId</strong></td>\n<td style=\"text-align:center\">String</td>\n<td style=\"text-align:left\">Номер операции, по которому возможен будет опрос статуса в gateway, по которому будет колбек в сторону партнера</td>\n</tr>\n<tr>\n<td style=\"te
