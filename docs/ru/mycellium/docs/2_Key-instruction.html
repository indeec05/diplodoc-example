                <script type="application/javascript">
                   window.STATIC_CONTENT = false
                   window.__DATA__ = {"data":{"meta":{"metadata":[{"name":"generator","content":"Diplodoc Platform v4.57.7"}],"stoplight-id":"eojwe8aw5hlzv"},"assets":[],"headings":[],"title":"Взаимодействие с партнерами","includes":[],"html":"<h6 id=\"istoriya-izmenenij-dokumenta\"><a href=\"docs/ru/mycellium/docs/2_Key-instruction.html#istoriya-izmenenij-dokumenta\" class=\"yfm-anchor\" aria-hidden=\"true\"><span class=\"visually-hidden\" data-no-index=\"true\">История изменений документа</span></a>История изменений документа</h6>\n<p>(версия 1.0)</p>\n<table>\n<thead>\n<tr>\n<th>Дата</th>\n<th>Версия документа</th>\n<th>Описание</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>17.06.2024</td>\n<td>1.0</td>\n<td>Создана страница</td>\n</tr>\n<tr>\n<td>12.03.2025</td>\n<td>1.1</td>\n<td>Актуализировано описание. Добавлены и расписаны более подробно некоторые пункты.</td>\n</tr>\n</tbody>\n</table>\n<h3 id=\"shema-po-generacii-i-obmenu-klyuchami-mezhdu-mycellium-i-partnerom\"><a href=\"docs/ru/mycellium/docs/2_Key-instruction.html#shema-po-generacii-i-obmenu-klyuchami-mezhdu-mycellium-i-partnerom\" class=\"yfm-anchor\" aria-hidden=\"true\"><span class=\"visually-hidden\" data-no-index=\"true\">Схема по генерации и обмену ключами между Mycellium и Партнером</span></a>Схема по генерации и обмену ключами между Mycellium и Партнером</h3>\n<p><img src=\"docs/ru/mycellium/assets/images/Cert.jpg\" alt=\"Cert.jpg\" /></p>\n<h3 id=\"poryadok-podklyucheniya-partnera-na-stendy-mycellium\"><a href=\"docs/ru/mycellium/docs/2_Key-instruction.html#poryadok-podklyucheniya-partnera-na-stendy-mycellium\" class=\"yfm-anchor\" aria-hidden=\"true\"><span class=\"visually-hidden\" data-no-index=\"true\">Порядок подключения партнера на стенды Mycellium</span></a>Порядок подключения партнера на стенды Mycellium</h3>\n<ol>\n<li>Подключение партнера на демо стенд. (На первичном этапе Mycellium передает все необходимые сгенерированные сертификаты Партнеру. Партнер использует их для подписывания запросов в API)</li>\n<li>Тестирование основных методов API.</li>\n<li>Генерация партнером сертификатов для демо стенда.</li>\n<li>Обмен публичными ключами.</li>\n<li>Замена сертификатов на демо среде.</li>\n<li>Тестирование основных методов API. Партнер использует закрытый ключ, сгенерированный на своей стороне.</li>\n<li>Генерация партнером сертификатов для прод стенда.</li>\n<li>Подключение партнера на прод стенд.</li>\n</ol>\n<h3 id=\"instrukciya-po-generacii-klyuchej\"><a href=\"docs/ru/mycellium/docs/2_Key-instruction.html#instrukciya-po-generacii-klyuchej\" class=\"yfm-anchor\" aria-hidden=\"true\"><span class=\"visually-hidden\" data-no-index=\"true\">Инструкция по генерации ключей</span></a>Инструкция по генерации ключей</h3>\n<ol>\n<li>Используя OpenSSL генерируете ваш приватный ключ (site-{partner}-demo.key) и запрос на выпуск сертификата (site-{partner}-demo.key.csr)</li>\n</ol>\n<p>Команда:</p>\n\n    <div class=\"yfm-clipboard\">\n        <pre><code class=\"hljs\">openssl req -new -sha256 -nodes -out site-{partner-name}-demo.key.csr -newkey rsa:2048 -keyout site-{partner-name}-demo.key -config config\n</code></pre>\n\n        <button class=\"yfm-clipboard-button\">\n            <svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"109\">\n                <path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"></path>\n                <path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\">\n                    <animate id=\"visibileAnimation-109\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin></animate>\n                    <animate id=\"hideAnimation-109\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-109.end+1\" fill=\"freeze\"></animate>\n                </path>\n            </svg>\n        </button>\n    </div>\n<p>Содержимое файла конфигурации config:</p>\n\n    <div class=\"yfm-clipboard\">\n        <pre><code class=\"hljs\">[req]\ndefault_bits = 2048\nprompt = no\ndefault_md = sha256\n#req_extensions = req_ext\ndistinguished_name = dn\n\n[ dn ]\nC=RU\nST=(Укажите краткое наименование города – например MSK)\nL=(Укажите полное наименование города – например Moscow)\nO=(Укажите наименование организации)\nOU= (Укажите департамент/отдел)\nemailAddress=(Укажите почтовый адрес – например key@partner.ru)\nCN = site-{partner}-demo\n</code></pre>\n\n        <button class=\"yfm-clipboard-button\">\n            <svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"113\">\n                <path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"></path>\n                <path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\">\n                    <animate id=\"visibileAnimation-113\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin></animate>\n                    <animate id=\"hideAnimation-113\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-113.end+1\" fill=\"freeze\"></animate>\n                </path>\n            </svg>\n        </button>\n    </div>\n<ol start=\"2\" style=\"--hier-list-start:1\">\n<li>Конвертируете ключ в формат PKCS#8 командой:</li>\n</ol>\n\n    <div class=\"yfm-clipboard\">\n        <pre><code class=\"hljs json\">openssl pkcs8 -topk8 -inform PEM -outform PEM -in ИМЯ_ФАЙЛА -out ИМЯ_ФАЙЛА -nocrypt\n</code></pre>\n\n        <button class=\"yfm-clipboard-button\">\n            <svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"121\">\n                <path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"></path>\n                <path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\">\n                    <animate id=\"visibileAnimation-121\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin></animate>\n                    <animate id=\"hideAnimation-121\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-121.end+1\" fill=\"freeze\"></animate>\n                </path>\n            </svg>\n        </button>\n    </div>\n<ol start=\"3\" style=\"--hier-list-start:2\">\n<li>\n<p>Созданный запрос на выпуск сертификата (csr файл с именем site-{partner}-prod.key.csr) передаете в Mycellium  на почту ithelpme@w1.money</p>\n</li>\n<li>\n<p>Mycellium  генерирует public сертификат (в формате p7b) на основе вашего csr, далее этим сертификатом проверяется подпись Партнера в Request в API.</p>\n</li>\n<li>\n<p>Mycellium  генерирует открытый и закрытый ключ на своей стороне для подписания Responce в API. Открытыую часть (public key в формате p7b) передает Партнеру. Партер использует данный ключ для проверки подписи Mycellium в поле \"ResponseSignature\" в Response API</p>\n</li>\n<li>\n<p>Cодержимое вашего приватного ключа из пункта 1 (site-{partner-name}-prod.key), используете для подписания запросов к API</p>\n</li>\n<li>\n<p>На API Mycellium нужно протестировать:</p>\n<ul>\n<li>Любой GET метод, например, <a href=\"https://w1.stoplight.io/docs/mycellium-api/branches/main/40rto1k6uoosg-get-user-balance\" target=\"_blank\" rel=\"noreferrer noopener\">Запрос баланса кошелька</a></li>\n<li>Любой POST метод, например, <a href=\"https://w1.stoplight.io/docs/mycellium-api/branches/main/xdqza2o2sm4wt-post-wallet\" target=\"_blank\" rel=\"noreferrer noopener\">Регистрацию кошелька</a></li>\n</ul>\n</li>\n</ol>\n","leading":false},"router":{"pathname":"docs/ru/mycellium/docs/2_Key-instruction","depth":5},"lang":"ru","langs":["ru"]};
