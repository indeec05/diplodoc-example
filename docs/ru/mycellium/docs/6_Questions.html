                <script type="application/javascript">
                   window.STATIC_CONTENT = false
                   window.__DATA__ = {"data":{"meta":{"metadata":[{"name":"generator","content":"Diplodoc Platform v4.57.7"}],"stoplight-id":"trfbh3idgh4qz","internal":true},"assets":[],"headings":[{"title":"KYC","href":"docs/ru/mycellium/docs/6_Questions.html#kyc","level":2,"items":[{"title":"Можно ли создать кошелек, минуя уровень ИД Аноним?","href":"docs/ru/mycellium/docs/6_Questions.html#mozhno-li-sozdat-koshelek,-minuya-uroven-id-anonim","level":3},{"title":"Можно ли \"понизить\" уровень ИД на кошельке пользователя?","href":"docs/ru/mycellium/docs/6_Questions.html#mozhno-li-ponizit-uroven-id-na-koshelke-polzovatelya","level":3},{"title":"Как понять, является ли актуальной текущая ИД у пользователя?","href":"docs/ru/mycellium/docs/6_Questions.html#kak-ponyat,-yavlyaetsya-li-aktualnoj-tekushaya-id-u-polzovatelya","level":3},{"title":"Что происходит, если пользователь меняет свои персональные данные и не проходит новую ИД с новыми персональными данными?","href":"docs/ru/mycellium/docs/6_Questions.html#chto-proishodit,-esli-polzovatel-menyaet-svoi-personalnye-dannye-i-ne-prohodit-novuyu-id-s-novymi-personalnymi-dannymi","level":3},{"title":"Как работает автоматическая проверка для пользователей, которым предстоит замена паспорта в 20/45 лет?","href":"docs/ru/mycellium/docs/6_Questions.html#kak-rabotaet-avtomaticheskaya-proverka-dlya-polzovatelej,-kotorym-predstoit-zamena-pasporta-v-20/45-let","level":3},{"title":"Что делать пользователю, если он столкнулся с трудностями в процессе прохождения идентификации?","href":"docs/ru/mycellium/docs/6_Questions.html#chto-delat-polzovatelyu,-esli-on-stolknulsya-s-trudnostyami-v-processe-prohozhdeniya-identifikacii","level":3}]}],"title":"Часто задаваемые вопросы","includes":[],"html":"<h2 id=\"kyc\"><a href=\"docs/ru/mycellium/docs/6_Questions.html#kyc\" class=\"yfm-anchor\" aria-hidden=\"true\"><span class=\"visually-hidden\" data-no-index=\"true\">KYC</span></a>KYC</h2>\n<p>KYC (Идентификация) - процесс подтверждения личности пользователя в банковской организации для расширения возможностей работы с кошельком и увеличения значений лимитов. Существует 2 уровня идентификации: упрощенная и полная идентификация. Изначально пользователю открывается анонимный кошелек. Упрощенная идентификация доступна через Госуслуги и ФНС, полную идентификацию можно пройти путем подачи заявки на видео звонок либо при личном посещении офиса банковской организации.</p>\n<h3 id=\"mozhno-li-sozdat-koshelek,-minuya-uroven-id-anonim\"><a href=\"docs/ru/mycellium/docs/6_Questions.html#mozhno-li-sozdat-koshelek,-minuya-uroven-id-anonim\" class=\"yfm-anchor\" aria-hidden=\"true\"><span class=\"visually-hidden\" data-no-index=\"true\">Можно ли создать кошелек, минуя уровень ИД Аноним?</span></a>Можно ли создать кошелек, минуя уровень ИД Аноним?</h3>\n<p>-Нет, кошелек создается через метод <strong>POST Wallet (POST /wallet)</strong> с уровнем ИД - Аноним</p>\n<h3 id=\"mozhno-li-ponizit-uroven-id-na-koshelke-polzovatelya\"><a href=\"docs/ru/mycellium/docs/6_Questions.html#mozhno-li-ponizit-uroven-id-na-koshelke-polzovatelya\" class=\"yfm-anchor\" aria-hidden=\"true\"><span class=\"visually-hidden\" data-no-index=\"true\">Можно ли \"понизить\" уровень ИД на кошельке пользователя?</span></a>Можно ли \"понизить\" уровень ИД на кошельке пользователя?</h3>\n<p>-Нет, кошелек с уровнем УПРИД не сможет стать анонимным. По аналогии, кошелек с уровнем ФУЛЛИД не сможет стать УПРИД или анонимным.</p>\n<h3 id=\"kak-ponyat,-yavlyaetsya-li-aktualnoj-tekushaya-id-u-polzovatelya\"><a href=\"docs/ru/mycellium/docs/6_Questions.html#kak-ponyat,-yavlyaetsya-li-aktualnoj-tekushaya-id-u-polzovatelya\" class=\"yfm-anchor\" aria-hidden=\"true\"><span class=\"visually-hidden\" data-no-index=\"true\">Как понять, является ли актуальной текущая ИД у пользователя?</span></a>Как понять, является ли актуальной текущая ИД у пользователя?</h3>\n<p>-Когда у пользователя ИД становится невалидной (не соответствует текущим персональным данным пользователя), на кошелек пользователя накладываются ограничения, текущей ИД присваивается статус \"EXPIRED\". Для снятия ограничений, пользователю необходимо пройти новую идентификацию с новыми персональными данными.<br />\nДля получения информации о текущем статусе ИД, необходимо ориентироваться на ответ системы в API, на поля kycRequestStateId и kycStatus:</p>\n<p><strong>GET /wallet/{walletNumber}/balance</strong></p>\n\n    <div class=\"yfm-clipboard\">\n        <pre><code class=\"hljs json\"><span class=\"hljs-punctuation\">{</span>\n    <span class=\"hljs-attr\">\"userBalance\"</span><span class=\"hljs-punctuation\">:</span> <span class=\"hljs-punctuation\">{</span>\n        <span class=\"hljs-attr\">\"currencyId\"</span><span class=\"hljs-punctuation\">:</span> <span class=\"hljs-number\">643</span><span class=\"hljs-punctuation\">,</span>\n        <span class=\"hljs-attr\">\"amount\"</span><span class=\"hljs-punctuation\">:</span> <span class=\"hljs-number\">0.00</span><span class=\"hljs-punctuation\">,</span>\n        <span class=\"hljs-attr\">\"overLimitAmount\"</span><span class=\"hljs-punctuation\">:</span> <span class=\"hljs-number\">0.00</span><span class=\"hljs-punctuation\">,</span>\n        <span class=\"hljs-attr\">\"overdraft\"</span><span class=\"hljs-punctuation\">:</span> <span class=\"hljs-number\">0.00</span><span class=\"hljs-punctuation\">,</span>\n        <span class=\"hljs-attr\">\"availableAmount\"</span><span class=\"hljs-punctuation\">:</span> <span class=\"hljs-number\">0.00</span><span class=\"hljs-punctuation\">,</span>\n        <span class=\"hljs-attr\">\"safeAmount\"</span><span class=\"hljs-punctuation\">:</span> <span class=\"hljs-number\">0.00</span><span class=\"hljs-punctuation\">,</span>\n        <span class=\"hljs-attr\">\"kycLevel\"</span><span class=\"hljs-punctuation\">:</span> <span class=\"hljs-number\">10</span><span class=\"hljs-punctuation\">,</span>\n        <span class=\"hljs-attr\">\"kycRequestStateId\"</span><span class=\"hljs-punctuation\">:</span> <span class=\"hljs-string\">\"EXPIRED\"</span>\n    <span class=\"hljs-punctuation\">}</span>\n<span class=\"hljs-punctuation\">}</span>\n</code></pre>\n\n        <button class=\"yfm-clipboard-button\">\n            <svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"27\">\n                <path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"></path>\n                <path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\">\n                    <animate id=\"visibileAnimation-27\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin></animate>\n                    <animate id=\"hideAnimation-27\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-27.end+1\" fill=\"freeze\"></animate>\n                </path>\n            </svg>\n        </button>\n    </div>\n<p><strong>GET  /users/external-users/{userExternalId}</strong></p>\n\n    <div class=\"yfm-clipboard\">\n        <pre><code class=\"hljs json\"><span class=\"hljs-punctuation\">{</span>\n    <span class=\"hljs-attr\">\"walletNumber\"</span><span class=\"hljs-punctuation\">:</span> <span class=\"hljs-number\">762368580099</span><span class=\"hljs-punctuation\">,</span>\n    <span class=\"hljs-attr\">\"externalUserId\"</span><span class=\"hljs-punctuation\">:</span> <span class=\"hljs-string\">\"bf08a486-c5fb-4b2e-91fe-b44e66c691ac\"</span><span class=\"hljs-punctuation\">,</span>\n    <span class=\"hljs-attr\">\"restrictionTypes\"</span><span class=\"hljs-punctuation\">:</span> <span class=\"hljs-punctuation\">[</span>\n        <span class=\"hljs-string\">\"IDENTIFICATION_OUTCOME\"</span>\n    <span class=\"hljs-punctuation\">]</span><span class=\"hljs-punctuation\">,</span>\n    <span class=\"hljs-attr\">\"kycStatus\"</span><span class=\"hljs-punctuation\">:</span> <span class=\"hljs-string\">\"EXPIRED\"</span><span class=\"hljs-punctuation\">,</span>\n    <span class=\"hljs-attr\">\"blocked\"</span><span class=\"hljs-punctuation\">:</span> <span class=\"hljs-literal\"><span class=\"hljs-keyword\">false</span></span>\n<span class=\"hljs-punctuation\">}</span>\n</code></pre>\n\n        <button class=\"yfm-clipboard-button\">\n            <svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"31\">\n                <path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"></path>\n                <path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\">\n                    <animate id=\"visibileAnimation-31\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin></animate>\n                    <animate id=\"hideAnimation-31\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-31.end+1\" fill=\"freeze\"></animate>\n                </path>\n            </svg>\n        </button>\n    </div>\n<p>Если статус \"<strong>EXPIRED</strong>\", пользователя необходимо отправить на новую ИД.</p>\n<h3 id=\"chto-proishodit,-esli-polzovatel-menyaet-svoi-personalnye-dannye-i-ne-prohodit-novuyu-id-s-novymi-personalnymi-dannymi\"><a href=\"docs/ru/mycellium/docs/6_Questions.html#chto-proishodit,-esli-polzovatel-menyaet-svoi-personalnye-dannye-i-ne-prohodit-novuyu-id-s-novymi-personalnymi-dannymi\" class=\"yfm-anchor\" aria-hidden=\"true\"><span class=\"visually-hidden\" data-no-index=\"true\">Что происходит, если пользователь меняет свои персональные данные и не проходит новую ИД с новыми персональными данными?</span></a>Что происходит, если пользователь меняет свои персональные данные и не проходит новую ИД с новыми персональными данными?</h3>\n<p>-Если пользователь вносит изменения в свои персональные данные (например, ФИО, серия и номер паспорта и т.д.), система автоматически накладывает ограничения на использования кошелька (текущей ИД присваивается статус \"EXPIRED\"). Для снятия ограничений пользователю необходимо пройти ИД с новыми персональными данными или связаться с <a href=\"mailto:support@w1.money\" target=\"_blank\" rel=\"noreferrer noopener\">support@w1.money</a></p>\n<h3 id=\"kak-rabotaet-avtomaticheskaya-proverka-dlya-polzovatelej,-kotorym-predstoit-zamena-pasporta-v-20/45-let\"><a href=\"docs/ru/mycellium/docs/6_Questions.html#kak-rabotaet-avtomaticheskaya-proverka-dlya-polzovatelej,-kotorym-predstoit-zamena-pasporta-v-20/45-let\" class=\"yfm-anchor\" aria-hidden=\"true\"><span class=\"visually-hidden\" data-no-index=\"true\">Как работает автоматическая проверка для пользователей, которым предстоит замена паспорта в 20/45 лет?</span></a>Как работает автоматическая проверка для пользователей, которым предстоит замена паспорта в 20/45 лет?</h3>\n<p>-Система автоматически отслеживает даты рождения пользователей и сроки действия их документов. Если пользователю исполняется 20 или 45 лет, система автоматически накладывает ограничения на использование кошелька (текущей ИД присваивается статус \"EXPIRED\"). Для снятия ограничений пользователю необходимо пройти ИД с новыми паспортными данными.</p>\n<h3 id=\"chto-delat-polzovatelyu,-esli-on-stolknulsya-s-trudnostyami-v-processe-prohozhdeniya-identifikacii\"><a href=\"docs/ru/mycellium/docs/6_Questions.html#chto-delat-polzovatelyu,-esli-on-stolknulsya-s-trudnostyami-v-processe-prohozhdeniya-identifikacii\" class=\"yfm-anchor\" aria-hidden=\"true\"><span class=\"visually-hidden\" data-no-index=\"true\">Что делать пользователю, если он столкнулся с трудностями в процессе прохождения идентификации?</span></a>Что делать пользователю, если он столкнулся с трудностями в процессе прохождения идентификации?</h3>\n<p>-Пользователь должен обратиться в службу поддержки <a href=\"mailto:support@w1.money\" target=\"_blank\" rel=\"noreferrer noopener\">support@w1.money</a> . Специалисты службы поддержки помогут решить возникшие проблемы и ответят на все интересующие вопросы.</p>\n","leading":false},"router":{"pathname":"docs/ru/mycellium/docs/6_Questions","depth":5},"lang":"ru","langs":["ru"]};
