                <script type="application/javascript">
                   window.STATIC_CONTENT = false
                   window.__DATA__ = {"data":{"meta":{"metadata":[{"name":"generator","content":"Diplodoc Platform v4.57.7"}],"stoplight-id":"x018xzwx0dlp3"},"assets":[],"headings":[{"title":"Request","href":"docs/ru/mycellium/docs/3_API.html#request","level":2,"items":[{"title":"Пример json request (метод RegisterUser):","href":"docs/ru/mycellium/docs/3_API.html#primer-json-request-metod-registeruser","level":3},{"title":"Пример формированиея подписи PHP 5.6:","href":"docs/ru/mycellium/docs/3_API.html#primer-formirovanieya-podpisi-php-56","level":3},{"title":"Пример составления запроса через openssl (метод GET User Balance):","href":"docs/ru/mycellium/docs/3_API.html#primer-sostavleniya-zaprosa-cherez-openssl-metod-get-user-balance","level":3}]},{"title":"Response","href":"docs/ru/mycellium/docs/3_API.html#response","level":2,"items":[{"title":"Пример Response:","href":"docs/ru/mycellium/docs/3_API.html#primer-response","level":3},{"title":"Проверка ResponseSignature при получении ответа от API","href":"docs/ru/mycellium/docs/3_API.html#proverka-responsesignature-pri-poluchenii-otveta-ot-api","level":3},{"title":"Пример кода реализации проверки ResponseSignature на Java:","href":"docs/ru/mycellium/docs/3_API.html#primer-koda-realizacii-proverki-responsesignature-na-java","level":3},{"title":"Проверка ResponseSignature с помощью OpenSSL:","href":"docs/ru/mycellium/docs/3_API.html#proverka-responsesignature-s-pomoshyu-openssl","level":3}]}],"title":"Работа с API","includes":[],"html":"<h1>Формирование запросов для API</h1>\n<h2 id=\"request\"><a href=\"docs/ru/mycellium/docs/3_API.html#request\" class=\"yfm-anchor\" aria-hidden=\"true\"><span class=\"visually-hidden\" data-no-index=\"true\">Request</span></a>Request</h2>\n<p>Каждый запрос к API проходит процесс аутентификации. Это осуществляется путём подписания данных, передаваемых в запросе, партнёром и последующей проверкой подписи на сервере.</p>\n<p>Для аутентификации необходимо передать три параметра в заголовке (Header) каждого запроса:</p>\n<ul>\n<li>PartnerId - уникальный идентификатор партнёра.</li>\n<li>Signature - запрос, подписанный асимметричным ключом, рассчитывается по формуле *</li>\n<li>Timestamp - время отправки запроса в формате (yyyy-MM-dd'T'HH:mm:ss), например, 2023-01-16T07:35:15. Время не должно быть старше 5 минут, иначе запрос не пройдет аутентификацию. Это время должно быть указано в UTC+0.</li>\n</ul>\n<p><code>*</code> - <code>Signature = BASE64(SignatureMethod(UTF8(URL + Timestamp + PartnerId + Request body)))</code></p>\n<p>Параметры:</p>\n<table>\n<thead>\n<tr>\n<th>Наименование</th>\n<th>Описание</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>BASE64</td>\n<td>Функция, преобразующая бинарные данные (массив байт) в строку BASE64.</td>\n</tr>\n<tr>\n<td>SignatureMethod</td>\n<td>Криптографическая функция, используемая для вычисления электронной цифровой подписи (метод подписи ключа партнёра SHA1withRSA).</td>\n</tr>\n<tr>\n<td>UTF8</td>\n<td>Функция, преобразующая строку в кодировку UTF8 и возвращающая массив байт.</td>\n</tr>\n<tr>\n<td>URL</td>\n<td>URL-адрес, на который направляется запрос, включая протокол, домен и параметры запроса. (Должен полностью совпадать с URL запроса)</td>\n</tr>\n<tr>\n<td>Timestamp</td>\n<td>Время отправки запроса. (Должно совпадать с аналогичным параметром в заголовке)</td>\n</tr>\n<tr>\n<td>partnerId</td>\n<td>Идентификатор партнёра. (Должен совпадать с аналогичным параметром в заголовке)</td>\n</tr>\n<tr>\n<td>Request body</td>\n<td>JSON-строка, представляющая тело запроса. Необходимо соблюдать алфавитный порядок полей для подписания. Должны отсутствовать пробелы и переносы строк. (Должна совпадать с телом запроса)</td>\n</tr>\n</tbody>\n</table>\n<blockquote>\n<p>Необходимо соблюдать алфавитный порядок полей в Request body для подписания, в body должны отсутствовать пробелы и переносы строк.</p>\n</blockquote>\n<h3 id=\"primer-json-request-metod-registeruser\"><a href=\"docs/ru/mycellium/docs/3_API.html#primer-json-request-metod-registeruser\" class=\"yfm-anchor\" aria-hidden=\"true\"><span class=\"visually-hidden\" data-no-index=\"true\">Пример json request (метод RegisterUser):</span></a>Пример json request (метод RegisterUser):</h3>\n\n    <div class=\"yfm-clipboard\">\n        <pre><code class=\"hljs json\">Request method<span class=\"hljs-punctuation\">:</span>\tPOST\nRequest URI<span class=\"hljs-punctuation\">:</span>\thttp<span class=\"hljs-punctuation\">:</span><span class=\"hljs-comment\">//10.10.10.10/wallet</span>\nProxy<span class=\"hljs-punctuation\">:</span>\t\t\t&lt;none&gt;\nRequest params<span class=\"hljs-punctuation\">:</span>\t&lt;none&gt;\nQuery params<span class=\"hljs-punctuation\">:</span>\t&lt;none&gt;\nForm params<span class=\"hljs-punctuation\">:</span>\t&lt;none&gt;\nPath params<span class=\"hljs-punctuation\">:</span>\t&lt;none&gt;\nHeaders<span class=\"hljs-punctuation\">:</span>\t\tAccept=application/json<span class=\"hljs-punctuation\">,</span> application/javascript<span class=\"hljs-punctuation\">,</span> text/javascript<span class=\"hljs-punctuation\">,</span> text/json\n\t\t\t\tpartnerId=<span class=\"hljs-number\">5</span>f7b2f86bed7df7e9b2bc500\n        Signature=HKdr7LY8GMPO+GbErGkNzLWF5LvrWBy0mm+zo+RnTBZUNNb+wiTLFXle6gTYHTeZ6AyWntRg6HUWzeJ8fKJsHV5v+ICY1J+<span class=\"hljs-number\">5</span>UeW\n\t\t\t\tTimestamp=<span class=\"hljs-number\">2023</span><span class=\"hljs-number\">-02</span><span class=\"hljs-number\">-07</span>T16<span class=\"hljs-punctuation\">:</span><span class=\"hljs-number\">54</span><span class=\"hljs-punctuation\">:</span><span class=\"hljs-number\">45</span>\n\t\t\t\tContent-Type=application/json\nCookies<span class=\"hljs-punctuation\">:</span>\t\t&lt;none&gt;\nMultiparts<span class=\"hljs-punctuation\">:</span>\t\t&lt;none&gt;\nBody<span class=\"hljs-punctuation\">:</span>\n<span class=\"hljs-punctuation\">{</span>\n    <span class=\"hljs-attr\">\"email\"</span><span class=\"hljs-punctuation\">:</span> <span class=\"hljs-string\">\"test@test.com\"</span><span class=\"hljs-punctuation\">,</span>\n    <span class=\"hljs-attr\">\"externalId\"</span><span class=\"hljs-punctuation\">:</span> <span class=\"hljs-string\">\"79281234567\"</span>\n<span class=\"hljs-punctuation\">}</span>\n</code></pre>\n\n        <button class=\"yfm-clipboard-button\">\n            <svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"113\">\n                <path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"></path>\n                <path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\">\n                    <animate id=\"visibileAnimation-113\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin></animate>\n                    <animate id=\"hideAnimation-113\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-113.end+1\" fill=\"freeze\"></animate>\n                </path>\n            </svg>\n        </button>\n    </div>\n<p>Request body из этого примера (т.е. строка для подписания):<br />\n<code>{\"email\":\"test@test.com\",\"externalId\":\"79281234567\"}</code></p>\n<h3 id=\"primer-formirovanieya-podpisi-php-56\"><a href=\"docs/ru/mycellium/docs/3_API.html#primer-formirovanieya-podpisi-php-56\" class=\"yfm-anchor\" aria-hidden=\"true\"><span class=\"visually-hidden\" data-no-index=\"true\">Пример формированиея подписи PHP 5.6:</span></a>Пример формированиея подписи PHP 5.6:</h3>\n\n    <div class=\"yfm-clipboard\">\n        <pre><code class=\"hljs json\">* @param string $url\n   *  Url<span class=\"hljs-punctuation\">,</span> участвующий в формировании подписи.\n   * @param string $timestamp\n   *  Время<span class=\"hljs-punctuation\">,</span> участвующее в формировании подписи.\n   * @param string $bodyString\n   *  Request body в виде строки<span class=\"hljs-punctuation\">,</span> участвующий в формировании подписи.\n   * $absolutePathToCertificate\n   *  Абсолютный путь к сертификату.\n   * @param string $encryptMethod\n   *  Метод шифрования<span class=\"hljs-punctuation\">,</span> SHA1withRSA.\n   * @return sign\n   */\n  public function getSign($url<span class=\"hljs-punctuation\">,</span> $timestamp<span class=\"hljs-punctuation\">,</span> $bodyString<span class=\"hljs-punctuation\">,</span> $encryptMethod) <span class=\"hljs-punctuation\">{</span>\n    \n<span class=\"hljs-comment\">//извлечение из сертификата приватного ключа</span>\n$certs = array();\n$text = file_get_contents($absolutePathToCertificate); \nopenssl_pkcs8_read($text<span class=\"hljs-punctuation\">,</span> $certs<span class=\"hljs-punctuation\">,</span> $certificatePassw);\n    \t$secretKey = openssl_get_privatekey($certs<span class=\"hljs-punctuation\">[</span>'pkey'<span class=\"hljs-punctuation\">]</span>);\t\n\n$sign;\n$stringForSign = $url + $timestamp + $bodyString;\n<span class=\"hljs-comment\">//формирование подписи через секретный ключ и подпись</span>\n    \topenssl_sign($stringForSign<span class=\"hljs-punctuation\">,</span> $sign<span class=\"hljs-punctuation\">,</span> $secretKey<span class=\"hljs-punctuation\">,</span> $encryptMethod);\n    \topenssl_free_key($secretKey);\n    \t$sign = base64_encode($sign);\n\n    return $sign;\n  <span class=\"hljs-punctuation\">}</span>\n</code></pre>\n\n        <button class=\"yfm-clipboard-button\">\n            <svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"120\">\n                <path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"></path>\n                <path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\">\n                    <animate id=\"visibileAnimation-120\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin></animate>\n                    <animate id=\"hideAnimation-120\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-120.end+1\" fill=\"freeze\"></animate>\n                </path>\n            </svg>\n        </button>\n    </div>\n<h3 id=\"primer-sostavleniya-zaprosa-cherez-openssl-metod-get-user-balance\"><a href=\"docs/ru/mycellium/docs/3_API.html#primer-sostavleniya-zaprosa-cherez-openssl-metod-get-user-balance\" class=\"yfm-anchor\" aria-hidden=\"true\"><span class=\"visually-hidden\" data-no-index=\"true\">Пример составления запроса через openssl (метод GET User Balance):</span></a>Пример составления запроса через openssl (метод GET User Balance):</h3>\n\n    <div class=\"yfm-clipboard\">\n        <pre><code class=\"hljs\">DATE=$(date -u +\"%FT%T\");\nWALLET='ПОДСТАВИТЬ_walletNumber';\nADDRESS='ПОДСТАВИТЬ_АДРЕС';\nPARTNER='ПОДСТАВИТЬ_partnerId';\nPRIVKEY='ПОДСТАВИТЬ_ПУТЬ_ДО_СЕРТИФИКАТА';\n\nSTRING_TO_SIGN=$(printf \"%s%s%s\" \"http://${ADDRESS}/wallet/${WALLET}/balance\" \"${DATE}\" \"${PARTNER}\")\n\nSIGNATURE=$(echo -n \"${STRING_TO_SIGN}\" | openssl dgst -sha1 -sign \"${PRIVKEY}\" | base64 | tr -d '\\n')\n\ncurl -v -H \"Signature: ${SIGNATURE}\" -H \"partnerId: ${PARTNER}\" -H \"Timestamp: ${DATE}\" -H \"Content-Type: application/json\" \"http://${ADDRESS}/wallet/${WALLET}/balance\"\n</code></pre>\n\n        <button class=\"yfm-clipboard-button\">\n            <svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"124\">\n                <path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"></path>\n                <path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\">\n                    <animate id=\"visibileAnimation-124\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin></animate>\n                    <animate id=\"hideAnimation-124\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-124.end+1\" fill=\"freeze\"></animate>\n                </path>\n            </svg>\n        </button>\n    </div>\n<h2 id=\"response\"><a href=\"docs/ru/mycellium/docs/3_API.html#response\" class=\"yfm-anchor\" aria-hidden=\"true\"><span class=\"visually-hidden\" data-no-index=\"true\">Response</span></a>Response</h2>\n<p>На каждый запрос API приходит ответ, который включает:</p>\n<ul>\n<li>Headers: IncomingSignature, ResponseSignature;</li>\n<li>код ответа;</li>\n<li>тело ответа.</li>\n</ul>\n<table>\n<thead>\n<tr>\n<th>Наименование</th>\n<th>Описание</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>IncomingSignature</td>\n<td>Подписанный запрос, который пришел в Header Signature.</td>\n</tr>\n<tr>\n<td>ResponseSignature</td>\n<td>Подписанный ответ (body response со стороны API подписывается private ключом и передается в Header. ResponseSignature необходим для верификации открытого body Response и его подписанного аналога, который содержится в Header).</td>\n</tr>\n</tbody>\n</table>\n<h3 id=\"primer-response\"><a href=\"docs/ru/mycellium/docs/3_API.html#primer-response\" class=\"yfm-anchor\" aria-hidden=\"true\"><span class=\"visually-hidden\" data-no-index=\"true\">Пример Response:</span></a>Пример Response:</h3>\n\n    <div class=\"yfm-clipboard\">\n        <pre><code class=\"hljs json\">HTTP/<span class=\"hljs-number\">1.1</span> <span class=\"hljs-number\">200</span> \nIncomingSignature<span class=\"hljs-punctuation\">:</span> RSyIKQnrfBSLUOjRWmb0jWfOF/of2ekJ8azwLgY6F0OG6LDfD6j4afPQN6DyYHNR3u06r9ZnaW1HTxWAhyQWCek+l0e/<span class=\"hljs-number\">8</span>fbd2pkJY23Ai96/U9ThafXg/RZsZbX594eHQJmPFCB1LjVnKmUevRnF+Mxw3E9pN+YdjdFiGjrQRoZjUj5NQsEGC ss=\"hljs-punctuation\">{</span>\n    <span class=\"hljs-attr\">\"registerUserResult\"</span><span class=\"hljs-punctuation\">:</span> <span class=\"hljs-punctuation\">{</span>\n        <span class=\"hljs-attr\">\"walletNumber\"</span><span class=\"hljs-punctuation\">:</span> <span class=\"hljs-number\">736346605141</span>\n    <span class=\"hljs-punctuation\">}</span>\n<span class=\"hljs-punctuation\">}</span>\n</code></pre>\n\n        <button class=\"yfm-clipboard-button\">\n            <svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"181\">\n                <path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"></path>\n                <path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\">\n                    <animate id=\"visibileAnimation-181\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin></animate>\n                    <animate id=\"hideAnimation-181\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-181.end+1\" fill=\"freeze\"></animate>\n                </path>\n            </svg>\n        </button>\n    </div>\n<h3 id=\"proverka-responsesignature-pri-poluchenii-otveta-ot-api\"><a href=\"docs/ru/mycellium/docs/3_API.html#proverka-responsesignature-pri-poluchenii-otveta-ot-api\" class=\"yfm-anchor\" aria-hidden=\"true\"><span class=\"visually-hidden\" data-no-index=\"true\">Проверка ResponseSignature при получении ответа от API</span></a>Проверка ResponseSignature при получении ответа от API</h3>\n<p>Для проверки и предотвращения подмены ответа от API в заголовке (header) ответа возвращается параметр ResponseSignature. Он формируется путём подписания тела ответа (response body) с использованием приватного ключа.</p>\n<p>Для верификации необходимо декодировать значение ResponseSignature из Base64 и проверить его с помощью алгоритма SHA1withRSA.</p>\n<blockquote>\n<p>Данные, передаваемые в метод verify, должны быть телом ответа, отсортированным по алфавиту, без пробелов и переносов строк, с учётом camelCase.</p>\n</blockquote>\n<p>Пример тела ответа (response body):<br />\n<code>{\"userBalance\":{\"amount\":1400.00,\"availableAmount\":1400.00,\"currencyId\":643,\"kycLevel\":5,\"kycRequestStateId\":\"ACCEPTED\",\"overLimitAmount\":0.00,\"overdraft\":0,\"safeAmount\":0.00}}</code></p>\n<h3 id=\"primer-koda-realizacii-proverki-responsesignature-na-java\"><a href=\"docs/ru/mycellium/docs/3_API.html#primer-koda-realizacii-proverki-responsesignature-na-java\" class=\"yfm-anchor\" aria-hidden=\"true\"><span class=\"visually-hidden\" data-no-index=\"true\">Пример кода реализации проверки ResponseSignature на Java:</span></a>Пример кода реализации проверки ResponseSignature на Java:</h3>\n\n    <div class=\"yfm-clipboard\">\n        <pre><code class=\"hljs java\"><span class=\"hljs-keyword\">public</span> <span class=\"hljs-keyword\">static</span> <span class=\"hljs-type\">boolean</span> <span class=\"hljs-title function_\">verifySign</span><span class=\"hljs-params\">(String publicKeyPath, String sign, <span class=\"hljs-type\">byte</span>[] data)</span> {\n        <span class=\"hljs-type\">byte</span>[] signature = Base64.getDecoder().decode(sign);\n        <span class=\"hljs-type\">PublicKey</span> <span class=\"hljs-variable\">publicKey</span> <span class=\"hljs-operator\">=</span> getPemPublicKeyFromP7b(getFileContent(publicKeyPath));\n        <span class=\"hljs-keyword\">try</span> {\n            <span class=\"hljs-type\">Signature</span> <span class=\"hljs-variable\">s</span> <span class=\"hljs-operator\">=</span> Signature.getInstance(<span class=\"hljs-string\">\"SHA1withRSA\"</span>);\n            s.initVerify(publicKey);\n            s.update(data);\n            <span class=\"hljs-keyword\">return</span> s.verify(signature);\n        } <span class=\"hljs-keyword\">catch</span> (Exception cause) {\n            <span class=\"hljs-keyword\">throw</span> <span class=\"hljs-keyword\">new</span> <span class=\"hljs-title class_\">IllegalStateException</span>(<span class=\"hljs-string\">\"Failed verify signature. \"</span> + cause.getMessage());\n        }\n    }\n</code></pre>\n\n        <button class=\"yfm-clipboard-button\">\n            <svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"202\">\n                <path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"></path>\n                <path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\">\n                    <animate id=\"visibileAnimation-202\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin></animate>\n                    <animate id=\"hideAnimation-202\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-202.end+1\" fill=\"freeze\"></animate>\n                </path>\n            </svg>\n        </button>\n    </div>\n<h3 id=\"proverka-responsesignature-s-pomoshyu-openssl\"><a href=\"docs/ru/mycellium/docs/3_API.html#proverka-responsesignature-s-pomoshyu-openssl\" class=\"yfm-anchor\" aria-hidden=\"true\"><span class=\"visually-hidden\" data-no-index=\"true\">Проверка ResponseSignature с помощью OpenSSL:</span></a>Проверка ResponseSignature с помощью OpenSSL:</h3>\n<ol>\n<li>Извлекаем ключ из полученного сертификата от Mycellium:</li>\n</ol>\n<p><code>openssl x509 -in publicCertificate.pem -noout -pubkey  &gt; pubkey.pem</code><br />\n2. Копируем подпись из header ResponseSignature в файл responseSignature.txt<br />\n3. Декодируем эту подпись из Base64 и кладем в файл<br />\n<code>base64 --decode responseSignature.txt &gt; responseSignatureDecodedBase64.txt</code><br />\n4. Json body из response cортируем, удаляем переносы строк и пробелы и кладем в файл responseBody.txt<br />\n5. Верифицируем Json body из response и подпись из header ResponseSignature<br />\n<code>openssl sha1 -verify pubkey.pem -signature responseSignatureDecodedBase64.txt responseBody.txt</code></p>\n","leading":false},"router":{"pathname":"docs/ru/mycellium/docs/3_API","depth":5},"lang":"ru","langs":["ru"]};
