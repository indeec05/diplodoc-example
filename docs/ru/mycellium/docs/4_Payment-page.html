                <script type="application/javascript">
                   window.STATIC_CONTENT = false
                   window.__DATA__ = {"data":{"meta":{"metadata":[{"name":"generator","content":"Diplodoc Platform v4.57.7"}],"stoplight-id":"7807ltfavdido"},"assets":[],"headings":[{"title":"Безопасность","href":"docs/ru/mycellium/docs/4_Payment-page.html#bezopasnost","level":2},{"title":"Request","href":"docs/ru/mycellium/docs/4_Payment-page.html#request","level":2,"items":[{"title":"Header:","href":"docs/ru/mycellium/docs/4_Payment-page.html#header","level":3},{"title":"Response 200:","href":"docs/ru/mycellium/docs/4_Payment-page.html#response-200","level":3},{"title":"Пример реализации на Node.js:","href":"docs/ru/mycellium/docs/4_Payment-page.html#primer-realizacii-na-nodejs","level":3},{"title":"Пример реализации на PHP 5.6:","href":"docs/ru/mycellium/docs/4_Payment-page.html#primer-realizacii-na-php-56","level":3}]}],"title":"Платежные страницы","includes":[],"html":"<h6 id=\"istoriya-izmenenij-dokumenta\"><a href=\"docs/ru/mycellium/docs/4_Payment-page.html#istoriya-izmenenij-dokumenta\" class=\"yfm-anchor\" aria-hidden=\"true\"><span class=\"visually-hidden\" data-no-index=\"true\">История изменений документа</span></a>История изменений документа</h6>\n<p>(версия 1.0)</p>\n<table>\n<thead>\n<tr>\n<th>Дата</th>\n<th>Версия документа</th>\n<th>Описание</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>03.07.2024</td>\n<td>1.0</td>\n<td>Создана страница</td>\n</tr>\n</tbody>\n</table>\n<p>Платежные страницы, предназначены для взаимодействия клиентов партнеров<br />\nMycellium с сервисами<br />\nMycellium:</p>\n<ul>\n<li>KYC идентификация (ФНС/Госуслуги);</li>\n<li>Подача заявок на полную идентификацию;</li>\n<li>Внесение средств на счет клиента;</li>\n<li>Вывод средств со счета клиента;</li>\n<li>Просмотр истории транзакций, связанных с аккаунтом клиента.</li>\n</ul>\n<p>Клиент может пополнять кошелек любым из доступных способов.<br />\n(Настройка, включение/отключение способов утверждается по договору с Партнером)</p>\n<p>Для обращения к платежным страницам используется метод \"<strong>GET /bySignature</strong>\".</p>\n<h2 id=\"bezopasnost\"><a href=\"docs/ru/mycellium/docs/4_Payment-page.html#bezopasnost\" class=\"yfm-anchor\" aria-hidden=\"true\"><span class=\"visually-hidden\" data-no-index=\"true\">Безопасность</span></a><strong>Безопасность</strong></h2>\n<p>Подлинность передаваемых данных обеспечивается использованием секретного ключа Партнера. Выработка, обмен, и прочие действия с ключевой информацией осуществляются в рамках Соглашения об Электронном документообороте.</p>\n<h4 id=\"get-/bysignature\"><a href=\"docs/ru/mycellium/docs/4_Payment-page.html#get-/bysignature\" class=\"yfm-anchor\" aria-hidden=\"true\"><span class=\"visually-hidden\" data-no-index=\"true\">GET /bySignature</span></a>GET /bySignature</h4>\n<p>Для перехода на платежные страницы необходимо перенаправить пользователя в<br />\nMycellium, сделав форму (или сгенерировать ссылку) на адрес https://partnername.w1.money/authorize/bySignature со следующими параметрами:</p>\n<blockquote>\n<p>Параметры необходимо передавать в алфавитном порядке.</p>\n</blockquote>\n<blockquote>\n<p>Все параметры необходимо экранировать, т.е. производить UrlEncode.</p>\n</blockquote>\n<p><strong>Параметры строки запроса:</strong></p>\n<table>\n<thead>\n<tr>\n<th><strong>Название параметра</strong></th>\n<th><strong>Тип данных</strong></th>\n<th><strong>Обязательность</strong></th>\n<th><strong>Описание</strong></th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td><strong>account</strong></td>\n<td>Long</td>\n<td>+</td>\n<td>id пользователя (12 цифр)</td>\n</tr>\n<tr>\n<td><strong>date</strong></td>\n<td>DateTime</td>\n<td>+</td>\n<td>Время создания запроса по UTC. (Может быть в пределах +- 10 минут)</td>\n</tr>\n<tr>\n<td><strong>esiaKycRedirectUrl</strong></td>\n<td>String</td>\n<td>-</td>\n<td>URL-ссылка для перенаправления пользователя после ИД через Госуслуги. Если параметр отсутствует, после ИД на Госуслугах пользователя возвращает на интерфейс платежных страниц</td>\n</tr>\n<tr>\n<td><strong>identType</strong></td>\n<td>String</td>\n<td>-</td>\n<td>Тип идентификации (описание возможных значений в справочнике)</td>\n</tr>\n<tr>\n<td><strong>isOperator</strong></td>\n<td>String</td>\n<td>-</td>\n<td>Роль инициатора (описание возможных значений в справочнике)</td>\n</tr>\n<tr>\n<td><strong>mobileSiteUrl</strong></td>\n<td>String</td>\n<td>-</td>\n<td>URL-ссылка</td>\n</tr>\n<tr>\n<td><strong>partnerId</strong></td>\n<td>String</td>\n<td>+</td>\n<td>Идентификатор партнера</td>\n</tr>\n<tr>\n<td><strong>redirectto</strong></td>\n<td>String</td>\n<td>+</td>\n<td>Адрес назначения для перенаправления</td>\n</tr>\n<tr>\n<td><strong>refillFailUrlMobile</strong></td>\n<td>String</td>\n<td>-</td>\n<td>Адрес назначения, в случаи ошибки</td>\n</tr>\n<tr>\n<td><strong>refillSuccessUrlMobile</strong></td>\n<td>String</td>\n<td>-</td>\n<td>Адрес назначения, в случаи успешной обработки</td>\n</tr>\n<tr>\n<td><strong>theme</strong></td>\n<td>String</td>\n<td>-</td>\n<td>Тема платежных страниц (Можно договорится о индивидуальных цветах на платежных страницах для партнера )</td>\n</tr>\n<tr>\n<td><strong>sign</strong></td>\n<td>String</td>\n<td>+</td>\n<td>Подпись,  формируется приватным ключом партнера*</td>\n</tr>\n<tr>\n<td><strong>transactionId</strong></td>\n<td>String</td>\n<td>-</td>\n<td>Номер транзакции</td>\n</tr>\n</tbody>\n</table>\n<h4 id=\"formirovanie-sign\"><a href=\"docs/ru/mycellium/docs/4_Payment-page.html#formirovanie-sign\" class=\"yfm-anchor\" aria-hidden=\"true\"><span class=\"visually-hidden\" data-no-index=\"true\">Формирование sign</span></a>Формирование sign</h4>\n<p>*<strong>sign=BASE64(SignatureMethod(UTF8(URL))), где:</strong></p>\n<table>\n<thead>\n<tr>\n<th><strong>Наименование</strong></th>\n<th><strong>Описание</strong></th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td><strong>BASE64</strong></td>\n<td>Функция преобразования бинарных данных (массива байт) к BASE64 строке</td>\n</tr>\n<tr>\n<td><strong>SignatureMethod</strong></td>\n<td>Криптографическая функция используемая для вычисления ЭЦП (метод подписи ключа Партнера SHA1withRSA)</td>\n</tr>\n<tr>\n<td><strong>UTF8</strong></td>\n<td>Функция, которая преобразовывает строку к кодировке UTF8 и возвращает массив байт</td>\n</tr>\n<tr>\n<td><strong>URL</strong></td>\n<td>Url-адрес, на который направляется запрос *</td>\n</tr>\n</tbody>\n</table>\n<p>*Параметры, передаваемые в <strong>URL</strong>:</p>\n<table>\n<thead>\n<tr>\n<th><strong>Название параметра</strong></th>\n<th><strong>Тип данных</strong></th>\n<th><strong>Описание</strong></th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td><strong>account</strong></td>\n<td>Long</td>\n<td>id пользователя (12 цифр)</td>\n</tr>\n<tr>\n<td><strong>date</strong></td>\n<td>DateTime</td>\n<td>Время создания запроса по UTC. Может быть в пределах +- 10 минут (Время создания запроса по UTC. Может быть в пределах +- 10 минут)</td>\n</tr>\n<tr>\n<td><strong>partnerId</strong></td>\n<td>String</td>\n<td>Идентификатор партнера</td>\n</tr>\n<tr>\n<td><strong>redirectto</strong></td>\n<td>String</td>\n<td>Адрес назначения для пользователя, кодированный в UrlEncode</td>\n</tr>\n</tbody>\n</table>\n<p>Возможные значения для <strong>redirectto</strong></p>\n<table>\n<thead>\n<tr>\n<th><strong>Значение</strong></th>\n<th><strong>Описание</strong></th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td><strong>/info/history</strong></td>\n<td>Страница истории операций пользователя</td>\n</tr>\n<tr>\n<td><strong>/Kyc</strong></td>\n<td>Страница заявки на идентификацию (УПРИД, Полная идентификация)</td>\n</tr>\n<tr>\n<td><strong>/refill</strong></td>\n<td>Страница ввода денежных средств</td>\n</tr>\n<tr>\n<td><strong>/refill?id=agentId</strong></td>\n<td>Страница ввода денежных средств с предустановленными agentId *</td>\n</tr>\n<tr>\n<td><strong>/withdraw</strong></td>\n<td>Страница вывода денежных средств</td>\n</tr>\n<tr>\n<td><strong>/withdraw?id=provairderId</strong></td>\n<td>Страница вывода денежных средств с предустановленными provairderId **</td>\n</tr>\n</tbody>\n</table>\n<p>*agentId - id агента в системе Mycellium</p>\n<p>**provairderId - id провайдера в системе Mycellium</p>\n<p>*Пример URL для подписи:</p>\n\n    <div class=\"yfm-clipboard\">\n        <pre><code class=\"hljs json\">https<span class=\"hljs-punctuation\">:</span><span class=\"hljs-comment\">//partnername.w1.money/api/bySignature?account=123456789012&amp;date=2022-12-14T15:02:45&amp;redirectto=%2Frefill&amp;refillSuccessUrlMobile=https:%2F%2Fwww.partnername.ru%2Fprivate%2Fwallet%2Frefill%2Fsuccess&amp;refillFailUrlMobile=https:%2F%2Fwww.partnername.ru%2Fprivate%2Fwallet&amp;mobileSiteUrl=https:%2F%2Fwww.partnername.ru%2Fprivate%2Fwallet</span>\n</code></pre>\n\n        <button class=\"yfm-clipboard-button\">\n            <svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"487\">\n                <path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"></path>\n                <path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\">\n                    <animate id=\"visibileAnimation-487\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin></animate>\n                    <animate id=\"hideAnimation-487\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-487.end+1\" fill=\"freeze\"></animate>\n                </path>\n            </svg>\n        </button>\n    </div>\n<blockquote>\n<p>Параметры необходимо передавать в алфавитном порядке.</p>\n</blockquote>\n<h1>Пример вызова GET /bySignature</h1>\n<h2 id=\"request\"><a href=\"docs/ru/mycellium/docs/4_Payment-page.html#request\" class=\"yfm-anchor\" aria-hidden=\"true\"><span class=\"visually-hidden\" data-no-index=\"true\">Request</span></a><strong>Request</strong></h2>\n<h3 id=\"he
