                   window.STATIC_CONTENT = false
                   window.__DATA__ = {"data":{"meta":{"metadata":[{"name":"generator","content":"Diplodoc Platform v4.57.7"}],"stoplight-id":"zwtkvwbpv18uw"},"assets":[],"headings":[{"title":"Кошелек","href":"docs/ru/mycellium/docs/1_Obshie-svedeniya.html#koshelek","level":2},{"title":"Пользователь","href":"docs/ru/mycellium/docs/1_Obshie-svedeniya.html#polzovatel","level":2},{"title":"Партнер","href":"docs/ru/mycellium/docs/1_Obshie-svedeniya.html#partner","level":2},{"title":"Идентификация","href":"docs/ru/mycellium/docs/1_Obshie-svedeniya.html#identifikaciya","level":2},{"title":"Лимит","href":"docs/ru/mycellium/docs/1_Obshie-svedeniya.html#limit","level":2},{"title":"Баланс","href":"docs/ru/mycellium/docs/1_Obshie-svedeniya.html#balans","level":2},{"title":"Платежные страницы","href":"docs/ru/mycellium/docs/1_Obshie-svedeniya.html#platezhnye-stranicy","level":2},{"title":"Пополнение кошелька","href":"docs/ru/mycellium/docs/1_Obshie-svedeniya.html#popolnenie-koshelka","level":2},{"title":"Вывод средств","href":"docs/ru/mycellium/docs/1_Obshie-svedeniya.html#vyvod-sredstv","level":2},{"title":"Агент","href":"docs/ru/mycellium/docs/1_Obshie-svedeniya.html#agent","level":2},{"title":"Провайдер","href":"docs/ru/mycellium/docs/1_Obshie-svedeniya.html#provajder","level":2},{"title":"Комиссии","href":"docs/ru/mycellium/docs/1_Obshie-svedeniya.html#komissii","level":2},{"title":"Мицелиум API","href":"docs/ru/mycellium/docs/1_Obshie-svedeniya.html#micelium-api","level":2},{"title":"Регистрация нового кошелька. RegisterUser","href":"docs/ru/mycellium/docs/1_Obshie-svedeniya.html#registraciya-novogo-koshelka-registeruser","level":2},{"title":"Баланс кошелька. GetUserBalance","href":"docs/ru/mycellium/docs/1_Obshie-svedeniya.html#balans-koshelka-getuserbalance","level":2},{"title":"Пополнение кошелька","href":"docs/ru/mycellium/docs/1_Obshie-svedeniya.html#popolnenie-koshelka1","level":2},{"title":"Покупки с кошелька. CreatePurchase","href":"docs/ru/mycellium/docs/1_Obshie-svedeniya.html#pokupki-s-koshelka-createpurchase","level":2},{"title":"Донаты","href":"docs/ru/mycellium/docs/1_Obshie-svedeniya.html#donaty","level":2},{"title":"Выплата на кошелек. CreatePayout","href":"docs/ru/mycellium/docs/1_Obshie-svedeniya.html#vyplata-na-koshelek-createpayout","level":2},{"title":"Вывод с кошелька","href":"docs/ru/mycellium/docs/1_Obshie-svedeniya.html#vyvod-s-koshelka","level":2},{"title":"Передача персональных данных","href":"docs/ru/mycellium/docs/1_Obshie-svedeniya.html#peredacha-personalnyh-dannyh","level":2}],"title":"Общие сведения","includes":[],"html":"<h1><strong>Термины и определения</strong></h1>\n<h2 id=\"koshelek\"><a href=\"docs/ru/mycellium/docs/1_Obshie-svedeniya.html#koshelek\" class=\"yfm-anchor\" aria-hidden=\"true\"><span class=\"visually-hidden\" data-no-index=\"true\">Кошелек</span></a>Кошелек</h2>\n<p><strong>Электронный кошелек</strong> - счет пользователя, открытый в банковской организации. Кошелек предназначен для совершения финансовых операций: пополнение счета, покупка, донаты, получение денежных средств и вывод.</p>\n<h2 id=\"polzovatel\"><a href=\"docs/ru/mycellium/docs/1_Obshie-svedeniya.html#polzovatel\" class=\"yfm-anchor\" aria-hidden=\"true\"><span class=\"visually-hidden\" data-no-index=\"true\">Пользователь</span></a>Пользователь</h2>\n<p><strong>Пользователь</strong> - владелец кошелька, являющийся пользователем в рамках системы Партнера.</p>\n<h2 id=\"partner\"><a href=\"docs/ru/mycellium/docs/1_Obshie-svedeniya.html#partner\" class=\"yfm-anchor\" aria-hidden=\"true\"><span class=\"visually-hidden\" data-no-index=\"true\">Партнер</span></a><strong>Партнер</strong></h2>\n<p><strong>Партнер</strong> - юридическое лицо, заключившее партнерское соглашение  с банковской организацией на эмиссию электронных кошельков для пользователей Партнера и управлению кошельками через интерфейсы Партнера.</p>\n<h2 id=\"identifikaciya\"><a href=\"docs/ru/mycellium/docs/1_Obshie-svedeniya.html#identifikaciya\" class=\"yfm-anchor\" aria-hidden=\"true\"><span class=\"visually-hidden\" data-no-index=\"true\">Идентификация</span></a><strong>Идентификация</strong></h2>\n<p><strong>Идентификация</strong> - процесс подтверждения личности пользователя в банковской организации для расширения возможностей работы с кошельком и увеличения значений лимитов. Существует 2 уровня идентификации: упрощенная и полная идентификация. Изначально пользователю открывается анонимный кошелек. Упрощенная идентификация доступна через Госуслуги и ФНС, полную идентификацию можно пройти путем подачи заявки на видео звонок либо при личном посещении офиса банковской организации.</p>\n<p>В зависимости от уровня ИД пользователю кошелька доступны след. возможности:</p>\n<table>\n<thead>\n<tr>\n<th>Уровень идентификации</th>\n<th>Пополнение кошелька</th>\n<th>Вывод с кошелька</th>\n<th>Покупки</th>\n<th>Выплаты</th>\n<th>Донаты (получение)</th>\n<th>Донаты (отправка)**</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>Неидентифицированный</td>\n<td>+</td>\n<td>-  *</td>\n<td>+</td>\n<td>+</td>\n<td>-</td>\n<td>+</td>\n</tr>\n<tr>\n<td>Упрощенно идентифицированный</td>\n<td>+</td>\n<td>+</td>\n<td>+</td>\n<td>+</td>\n<td>+</td>\n<td>+</td>\n</tr>\n<tr>\n<td>Идентифицированный</td>\n<td>+</td>\n<td>+</td>\n<td>+</td>\n<td>+</td>\n<td>+</td>\n<td>+</td>\n</tr>\n</tbody>\n</table>\n<p>*-  можно выводить на юридические лица суммы до 15 000 р. (в соответствии с лимитами). Запрещены выводы на счета физических лиц (банковские карты, другие кошельки и пр.)</p>\n<p>**- донат можно отправить путем пополнения кошелька получателя с идентифицированного метода платежа (карта, СБП, др кошельки и пр.)</p>\n<h2 id=\"limit\"><a href=\"docs/ru/mycellium/docs/1_Obshie-svedeniya.html#limit\" class=\"yfm-anchor\" aria-hidden=\"true\"><span class=\"visually-hidden\" data-no-index=\"true\">Лимит</span></a>Лимит</h2>\n<p><strong>Лимит</strong> - максимальные значения остатка денежных средств на электронном кошельке и суммы расходных операций в месяц. Лимиты регламентируются в соответствии с требованиями законодательства РФ.</p>\n<p><img src=\"docs/ru/mycellium/assets/images/limits.png\" alt=\"limits.png\" /></p>\n<h2 id=\"balans\"><a href=\"docs/ru/mycellium/docs/1_Obshie-svedeniya.html#balans\" class=\"yfm-anchor\" aria-hidden=\"true\"><span class=\"visually-hidden\" data-no-index=\"true\">Баланс</span></a><strong>Баланс</strong></h2>\n<p><strong>Баланс</strong> - суммарный показатель средств крашенного и не крашенного счетов одного конкретного кошелька. В рамках доступных средств на балансе можно совершать расходные операции - покупки и выводы.</p>\n<p><strong>Крашенный счет</strong> - счет пользователя с которого нельзя вывести деньги. Средства, вводимые в систему извне (пополнение кошелька) поступают только на данный счет. Средства, доступные на данном счете можно использовать только для покупки у Партнера.</p>\n<p><strong>Неокрашенный счет</strong> - счет пользователя, с которого возможно вывести деньги во внешнюю систему (на провайдера). Также используется для получения выплат от Партнера и получения донатов</p>\n<p><strong>Сверхлимитный счет</strong> - счет пользователя, на который зачисляется излишек поступивших денежных средств при достижении лимита по остатку. Денежные средства со сверхлимитного счета переходят на основной при освобождении лимита, например после расходной операции (покупка, вывод). Сверхлимитный счет может пополниться после следующих операций: пополнение кошелька, выплата, получение донатов.</p>\n<p>Структура пользовательского кошелька:<br />\nКаждый кошелек пользователя в системе имеет 4 счета:</p>\n<table>\n<thead>\n<tr>\n<th>Счет</th>\n<th>Описание</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>Неокрашеный счет</td>\n<td>Денежные средства доступные для вывода и покупок</td>\n</tr>\n<tr>\n<td>Крашеный счет</td>\n<td>Денежные средства доступные только для покупок в системе Партнера</td>\n</tr>\n<tr>\n<td>Счет сверхлимита неокрашеный</td>\n<td></td>\n</tr>\n<tr>\n<td>Оверпей (Overpay) неокрашеный</td>\n<td>Счет на который поступают денежные средства, не вошедшие в сумму лимита. Overpay счет для \"неокрашеного\" счета</td>\n</tr>\n<tr>\n<td>Счет сверхлимита крашеный</td>\n<td></td>\n</tr>\n<tr>\n<td>Оверпей (Overpay) крашеный</td>\n<td>Счет на который поступают денежные средства, не вошедшие в сумму лимита. Overpay счет для \"крашеного\" счета</td>\n</tr>\n</tbody>\n</table>\n<h2 id=\"platezhnye-stranicy\"><a href=\"docs/ru/mycellium/docs/1_Obshie-svedeniya.html#platezhnye-stranicy\" class=\"yfm-anchor\" aria-hidden=\"true\"><span class=\"visually-hidden\" data-no-index=\"true\">Платежные страницы</span></a>Платежные страницы</h2>\n<p><strong>Платежные страницы</strong> - интерфейс, доступный пользователям системы по специально генерируемой ссылке. На данных интерфейсах возможно осуществлять:</p>\n<ul>\n<li>пополнение кошелька</li>\n<li>вывод средств</li>\n<li>идентификация</li>\n<li>просмотр статуса кошелька и истории операций</li>\n</ul>\n<h2 id=\"popolnenie-koshelka\"><a href=\"docs/ru/mycellium/docs/1_Obshie-svedeniya.html#popolnenie-koshelka\" class=\"yfm-anchor\" aria-hidden=\"true\"><span class=\"visually-hidden\" data-no-index=\"true\">Пополнение кошелька</span></a><strong>Пополнение кошелька</strong></h2>\n<p><strong>Пополнение кошелька</strong> — увеличение баланса кошелька, инициируемое самим пользователем. Для осуществления операции пополнения пользователя необходимо переадресовать на соответствующий интерфейс Платежных страниц, где будет доступен выбор агента пополнения, поле ввода реквизитов, поле ввода суммы пополнения и кнопка подтверждения.</p>\n<h2 id=\"vyvod-sredstv\"><a href=\"docs/ru/mycellium/docs/1_Obshie-svedeniya.html#vyvod-sredstv\" class=\"yfm-anchor\" aria-hidden=\"true\"><span class=\"visually-hidden\" data-no-index=\"true\">Вывод средств</span></a>Вывод средств</h2>\n<p><strong>Вывод средств</strong> — уменьшение баланса кошелька, инициируемое самим пользователем по средству перевода денежных средств на указанные пользователям реквизиты выбранного провайдера. Для осуществления операции вывода пользователя необходимо переадресовать на соответствующий интерфейс Платежных страниц, где будет доступен выбор провайдера, поле ввода реквизитов, поле ввода суммы вывода и кнопка подтверждения. На операции вывода средств накладываются ограничения: лимиты.</p>\n<h2 id=\"agent\"><a href=\"docs/ru/mycellium/docs/1_Obshie-svedeniya.html#agent\" class=\"yfm-anchor\" aria-hidden=\"true\"><span class=\"visually-hidden\" data-no-index=\"true\">Агент</span></a>Агент</h2>\n<p><strong>Агент</strong> -  юридическое лицо, через которое происходит процесс пополнения баланса кошельков пользователей. Через агента денежные средства зачисляются на счет пользователя в РНКО.</p>\n<p>Пример: МТС, QIWI, Банковская карта, SberPay и т.д.</p>\n<p>Состав агентов (способов пополнения средств) на платежных страницах зависит от условий договорных отношений Партнера с Банковской организацией. При недоступности агентского шлюза (технического канала) агент может быть временно деактивирован с платежных страниц.</p>\n<p>Для платежных страниц возможно настраивать приоритизацию (очередность) показа агентов, а так же настроить агента по умолчанию (это тот агент, на страницу ввода реквизитов которого пользователь попадает по умолчанию. Выбрать другого агента можно по клику на кнопку “Другие”).</p>\n<h2 id=\"provajder\"><a href=\"docs/ru/mycellium/docs/1_Obshie-svedeniya.html#provajder\" class=\"yfm-anchor\" aria-hidden=\"true\"><span class=\"visually-hidden\" data-no-index=\"true\">Провайдер</span></a>Провайдер</h2>\n<p><strong>Провайдер</strong> - юридическое лицо, через которое происходит процесс вывода средств с  баланса кошельков пользователей. Через провайдера денежные средства перечисляются со счета пользователя в Банковской организации на указанные реквизиты.</p>\n<p>Пример: МТС, QIWI, Банковская карта, SberPay и т.д.</p>\n<p>Состав провайдеров (способов вывода средств) на платежных страницах зависит от условий договорных отношений Партнера с Банковской организацией. При недоступности технического канала провайдер может быть временно деактивирован с платежных страниц.</p>\n<h2 id=\"komissii\"><a href=\"docs/ru/mycellium/docs/1_Obshie-svedeniya.html#komissii\" class=\"yfm-anchor\" aria-hidden=\"true\"><span class=\"visually-hidden\" data-no-index=\"true\">Комиссии</span></a>Комиссии</h2>\n<p>На агентов и провайдеров можно настроить комиссии, которые будут учитываться отдельными проводками в транзакциях на пополнение и вывод денежных средств с кошельков.</p>\n<p>Типы комиссий:</p>\n<ul>\n<li>Верхняя с пользователя</li>\n<li>Нижняя с пользователя</li>\n<li>Комиссия агенту/провайдеру</li>\n<li>Комиссия с агента/провайдера</li>\n<li>Комиссия Партнеру</li>\n<li>Комиссия с Партнера</li>\n<li>Комиссия Банковской организации</li>\n</ul>\n<p>Возможные значения:</p>\n<ul>\n<li>Процент</li>\n<li>Фиксированная в рублях</li>\n<li>Минимальная в рублях</li>\n<li>Комбинированная (Процент + фикс + мин)</li>\n</ul>\n<h2 id=\"micelium-api\"><a href=\"docs/ru/mycellium/docs/1_Obshie-svedeniya.html#micelium-api\" class=\"yfm-anchor\" aria-hidden=\"true\"><span class=\"visually-hidden\" data-no-index=\"true\">Мицелиум API</span></a>Мицелиум API</h2>\n<p><strong><a href=\"https://w1.stoplight.io/docs/mycellium-api/branches/main/zga4nfu02mpxz-api\" target=\"_blank\" rel=\"noreferrer noopener\">Мицелиум API</a></strong> - протокол обмена данными, через который Партнер осуществляет эмиссию и взаимодействие с кошельками своих пользователей в системе.</p>\n<h1>Основные операции с кошельком пользователя</h1>\n<h2 id=\"registraciya-novogo-koshelka-registeruser\"><a href=\"docs/ru/mycellium/docs/1_Obshie-svedeniya.html#registraciya-novogo-koshelka-registeruser\" class=\"yfm-anchor\" aria-hidden=\"true\"><span class=\"visually-hidden\" data-no-index=\"true\">Регистрация нового кошелька. RegisterUser</span></a>Регистрация нового кошелька. <strong>RegisterUser</strong></h2>\n<p>Для создания нового кошелька необходимо использовать метод <strong><a href=\"https://w1.stoplight.io/docs/mycellium-api/branches/main/xdqza2o2sm4wt-post-wallet\" target=\"_blank\" rel=\"noreferrer noopener\">POST /wallet</a></strong> из Мицелиум API. В случае корректного запроса, моментально создается новый кошелек.</p>\n<p>Для регистрации кошелька Партнер предоставляет контактные данные пользователя (<strong>email</strong> или <strong>phone</strong>) и уникальный идентификатор из своей системы (<strong>externalId</strong>). В случае успешного запроса, Партнер получает номер кошелька пользователя (уникальный walletNumber) в системе Мицелиум. Партнер сохраняет на своей стороне полученный номер кошелька для дальнейших операций с ним.</p>\n<p>В случае если Кошелек с таким внешним идентификатором уже создавался ранее – вернется номер уже имеющегося Кошелька.</p>\n<p>В случае если в запросе не переданы значения <strong>email</strong> или <strong>phone</strong>, сервис вернет ошибку.</p>\n<p>После создания кошелька он сразу готов к работе с финансовыми операциями.</p>\n<h2 id=\"balans-koshelka-getuserbalance\"><a href=\"docs/ru/mycellium/docs/1_Obshie-svedeniya.html#balans-koshelka-getuserbalance\" class=\"yfm-anchor\" aria-hidden=\"true\"><span class=\"visually-hidden\" data-no-index=\"true\">Баланс кошелька. GetUserBalance</span></a>Баланс кошелька. <strong>GetUserBalance</strong></h2>\n<p>Для получения информации по балансу определенного кошелька  необходимо использовать метод  <strong><a href=\"https://w1.stoplight.io/docs/mycellium-api/branches/main/40rto1k6uoosg-get-user-balance\" target=\"_blank\" rel=\"noreferrer noopener\">GET /wallet/{walletNumber}/balance</a></strong> из Мицелиум API.</p>\n<p>Ответ сервиса позволит Партнеру узнать все о текущем балансе кошелька пользователя. В ответе будет информация:</p>\n<ul>\n<li>текущий остаток на кошельке (<strong>amount</strong>);</li>\n<li>сверхлимитная сумма на кошельке;</li>\n<li>cумма кредитного лимита доступного для расходования (<strong>overdraft)</strong>;</li>\n<li>итоговая сумма доступная для расходования = Amount + Overdraft;</li>\n<li>сумма средств, ограниченная для вывода во внешние системы;</li>\n<li>уровень идентификации пользователя;</li>\n<li>статус последнего запроса на идентификацию.</li>\n</ul>\n<h2 id=\"popolnenie-koshelka1\"><a href=\"docs/ru/mycellium/docs/1_Obshie-svedeniya.html#popolnenie-koshelka1\" class=\"yfm-anchor\" aria-hidden=\"true\"><span class=\"visually-hidden\" data-no-index=\"true\">Пополнение кошелька</span></a>Пополнение кошелька</h2>\n<p>Для пополнения кошелька нужно перенаправить пользователя в интерфейс Платежных страниц, где предоставлен выбор из доступных платежных инструментов.</p>\n<p><img src=\"docs/ru/mycellium/assets/images/refil.png\" alt=\"refil.png\" /></p>\n<h2 id=\"pokupki-s-koshelka-createpurchase\"><a href=\"docs/ru/mycellium/docs/1_Obshie-svedeniya.html#pokupki-s-koshelka-createpurchase\" class=\"yfm-anchor\" aria-hidden=\"true\"><span class=\"visually-hidden\" data-no-index=\"true\">Покупки с кошелька. CreatePurchase</span></a>Покупки с кошелька. <strong>CreatePurchase</strong></h2>\n<p>Для совершения покупки необходимо использовать метод <strong><a href=\"https://w1.stoplight.io/docs/mycellium-api/branches/main/687mq3aw50d7x-post-purchase\" target=\"_blank\" rel=\"noreferrer noopener\">POST /purchase</a></strong> из Мицелиум API.</p>\n<p>Для совершения покупки (товара, доступа, подписки, услуги) со своего кошелька, пользователь должен иметь средства на балансе.</p>\n<p>Процесс списания средств с баланса осуществляется со следующим приоритетом:</p>\n<ul>\n<li>Снятие суммы с \"крашеного\" счета кошелька пользователя.</li>\n<li>Если на “крашеном” счете не хватает средств, то снимается недостающая сумма с “неокрашеного” счета.</li>\n<li>Если после покупки на счете \"оверпей крашеный\" есть остаток, а сумма счетов (крашеного и неокрашеного) меньше лимита, то на \"крашеный\" счет со счета \"оверпей крашеный\" переводятся вся сумма счета, но не превышающая установленного лимита.</li>\n<li>Если после покупки на счете \"оверпей неокрашеный\" есть остаток, а сумма счетов (крашеного и неокрашеного) меньше лимита, то на \"неокрашеный\" счет со счета \"оверпей неокрашеный\" переводятся вся сумма счета но не превышающая установленного лимита.</li>\n</ul>\n<p>Результатом операции станет зачисления необходимой суммы с кошелька пользователя на кошелек Партнера.</p>\n<p>Сумма операции указывается в запросе на покупку по API.</p>\n<p>При совершении операций учитываются лимиты данного кошелька и его уровень идентификации.</p>\n<h2 id=\"donaty\"><a href=\"docs/ru/mycellium/docs/1_Obshie-svedeniya.html#donaty\" class=\"yfm-anchor\" aria-hidden=\"true\"><span class=\"visually-hidden\" data-no-index=\"true\">Донаты</span></a>Донаты</h2>\n<p>Определенный вид операций, подразумевающий безвозмездное пополнение кошелька другого пользователя.</p>\n<p>Донат возможен как операция пополнения кошелька, только в случае доната - денежные средства поступают не на кошелек пользователя, а на указанный кошелек получателя доната.</p>\n<p>Пополнение чужого кошелька можно осуществить только идентифицированным методом платежа (карта, СБП, другой кошелек и пр.).</p>\n<p>Для совершения операции необходимо чтобы пополняемый донатом кошелек прошел идентификацию.</p>\n<p>Так же возможен донат с баланса кошелька инициатора на кошелек получателя, в случае наличия идентификации на обоих кошельках.</p>\n<h2 id=\"vyplata-na-koshelek-createpayout\"><a href=\"docs/ru/mycellium/docs/1_Obshie-svedeniya.html#vyplata-na-koshelek-createpayout\" class=\"yfm-anchor\" aria-hidden=\"true\"><span class=\"visually-hidden\" data-no-index=\"true\">Выплата на кошелек. CreatePayout</span></a>Выплата на кошелек. <strong>CreatePayout</strong></h2>\n<p>Для совершения выплаты необходимо использовать метод <strong><a href=\"https://w1.stoplight.io/docs/mycellium-api/branches/main/xxe18pbnk81vt-post-payout\" target=\"_blank\" rel=\"noreferrer noopener\">POST /payout</a></strong>  из Мицелиум API.</p>\n<p>Для совершения выплаты на кошелек пользователя, на кошельке Партнера должна быть необходимая сумма для данной операции. Зачисление средств происходит путем трансфера денежных средств с кошелька Партнера на кошелек пользователя.</p>\n<h2 id=\"vyvod-s-koshelka\"><a href=\"docs/ru/mycellium/docs/1_Obshie-svedeniya.html#vyvod-s-koshelka\" class=\"yfm-anchor\" aria-hidden=\"true\"><span class=\"visually-hidden\" data-no-index=\"true\">Вывод с кошелька</span></a>Вывод с кошелька</h2>\n<p>Для осуществления операции по выводу денежных средств с кошелька, пользователь должен иметь необходимую сумму денежных средств на неокрашенном счете. Вывести денежные средства с крашенного счета - невозможно.</p>\n<p>Операция вывода средств происходит через интерфейс Платежных страниц. После переадресации на Платежные страницы пользователь выбирает удобный способ, указывает реквизиты, сумму и осуществляет вывод.</p>\n<p><img src=\"docs/ru/mycellium/assets/images/withdraw.png\" alt=\"withdraw.png\" /></p>\n<h2 id=\"peredacha-personalnyh-dannyh\"><a href=\"docs/ru/mycellium/docs/1_Obshie-svedeniya.html#peredacha-personalnyh-dannyh\" class=\"yfm-anchor\" aria-hidden=\"true\"><span class=\"visually-hidden\" data-no-index=\"true\">Передача персональных данных</span></a>Передача персональных данных</h2>\n<p>Сбор, проверка и дальнейшая обработка персональных данных клиентов Партнера происходит в соответствии с законодательством РФ.</p>\n<p>Банковская организация имеет опцию передачи персональных данных пользователей Партнеру если это не противоречит оферте с пользователями.</p>\n<p>Партнеру доступны синхронные и асинхронные запросы персональных данных по номеру кошелька.</p>\n<p>Вся информация, передаваемая Партнеру происходит по https протоколу с использованием  криптографических средств (АПКШ).</p>\n","leading":false},"router":{"pathname":"docs/ru/mycellium/docs/1_Obshie-svedeniya","depth":5},"lang":"ru","langs":["ru"]};
