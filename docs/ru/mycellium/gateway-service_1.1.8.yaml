    BindUserResponseDTO:
      type: object
      x-stoplight:
        id: u45ft8ftnbmaj
      properties:
        requestId:
          type: string
          description: |-
            Уникальный id запроса на привязку пользователя СМЗ к платформе.

            Отдается в ответе только если заявка на привязку пользователя в статусе created или processing.
        status:
          type: string
          enum:
            - CREATED
            - PROCESSING
            - FAILED
            - COMPLETED
            - USER_BLOCKED
            - USER_TERRORIST
            - USER_NOT_FOUND
          description: |-
            Статус последней заявки на привязку

            status | Описание
            ---------|---------
             CREATED | Возвращается после успешной передачи заявки в сторону Mycellium.
             PROCESSING | Заявка в работе на стороне ФНС / Ожидает подтверждения пользователем
             FAILED | Неуспешная привязка пользователя в рамках заявки
             COMPLETED | Успешная привязка пользователя в рамках заявки
             USER_BLOCKED | Пользователь заблокирован в системе Mycellium / финансовые ограничения на кошельке в Mycellium
             USER_TERRORIST | Пользователь включен в перечень террористов и экстремистов
             USER_NOT_FOUND | Пользователь не найден
        code:
          type: integer
          format: int32
          description: |-
            Код ответа (совпадает с http)

            code | Фатальность | Описание
            ---------|---------|---------
             201 | Нет | Заявка на привязку принята
             202 | Нет | Ранее созданная заявка находится в обработке
             400 | Да | ИНН пользователя в запросе отличается от ИНН в БД системы Mycellium
             400 | Да | Отсутствует/неправильный список разрешений (permissions в запросе)
             400 | Да | Привязка кошелька с ограничениями (блокировка кошелька)
             404 | Да | Идентификатор пользователя (walletNumber) не зарегистрирован в Системе
             409 | Нет | Кошелек уже привязан
             412 | Да | Данный пользователь с уровнем ИД Аноним
             500 | Да | Что-то пошло не так
