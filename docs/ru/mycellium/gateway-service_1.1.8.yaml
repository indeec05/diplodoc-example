            Значение | Пояснение
            ---------|---------
             null | Ограничения отсутствуют
             INCOME | Ограничения операций на ввод
             OUTCOME | Ограничения операций на вывод
             ADMIN_INCOME | Административные ограничения операций на ввод
             ADMIN_OUTCOME | Административные ограничения операций на вывод
             IDENTIFICATION_OUTCOME | Идентификация, ограничения операций на вывод
             IDENTIFICATION_INCONSISTENCY | Идентификация, нарушение при прохождении идентификации
          items:
            type: string
            enum:
              - INCOME
              - OUTCOME
              - ADMIN_INCOME
              - ADMIN_OUTCOME
              - IDENTIFICATION_OUTCOME
              - IDENTIFICATION_INCONSISTENCY
        kycStatus:
          type: string
          enum:
            - ACCEPTED
            - EXPIRED
            - NONE
          description: |-
            KYC Статус 

            (Статус текущей активной заявки)


            |                    Статус                    | Ручной УПРИД | ФНС/ЕСИА | Фулл ИД  |
            |:--------------------------------------------:|:------------:|:--------:|----------|
            | Отсутствует заявка на ИД                     | NONE         | *     | *     |
            | Создана новая заявка на ИД                 | NONE         | NONE     | NONE     |
            | Заявка в работе                              | NONE         | NONE     | NONE     |
            | Заявка одобрена                              | ACCEPTED     | ACCEPTED | ACCEPTED |
            | Заявка отклонена / Данные не прошли проверку | NONE         | NONE     | NONE     |
            | ИД сброшена / Персональные данные изменены   | EXPIRED      | EXPIRED  | EXPIRED  |


            `*` - не может быть такого кейса для данного уровня ИД. (чтобы кошелек стал УПРИД/ФУЛЛ должна быть хоть одна заявка на ИД)
