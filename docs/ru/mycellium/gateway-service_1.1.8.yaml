        '500':
          description: |
            Status code 500

            Возвращается, когда:
            - на счете партнера недостаточно средств для совершения операции Payout;
            - на основном счете кошелька пользователя недостаточно средств для списания комиссии;
            - лимит для кошелька пользователя за день исчерпан;
            - кошелек пользователя c ограничением ADMIN_INCOME;
            - запрос с невалидной комиссией;
            - комиссия превышает сумму выплаты / средств недостаточно для оплаты комиссии;
            - кошелек с указанным в запросе walletNumber не найден;
            - в запросе указан currencyId, отличный от 643;
            - пользователь заблокирован
          content:
