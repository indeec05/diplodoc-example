    CreateSmzPayoutResponseDTO:
      type: object
      x-stoplight:
        id: 4yhit2zjh7k33
      properties:
        operationUniqueId:
          type: string
          example: 75e853c3-1423-47ed-95f7-00e8c891d942
          description: |-
            Уникальный id запроса на передачу персональных данных для прохождения идентификации. 
            Является уникальным на стороне Партнера.
        status:
          type: string
          enum:
            - CREATED
            - FISCALIZATION
            - FAILED_FISCALIZATION
            - PROCESSING
            - FAILED
            - COMPLETED
            - NOT_FOUND
            - USER_BLOCKED
            - USER_TERRORIST
            - USER_NOT_FOUND
            - USER_NOT_BOUND
            - ID_NOT_UNIQUE
            - INSUFFICIENT_FUNDS
          description: |-
            Статус

            Справочник возможных значений:
            | status              | Описание                                                                                        | code |
            |---------------------|-------------------------------------------------------------------------------------------------|------|
            | CREATED             | Возвращается после успешной передачи заявки в сторону Mycellium.                                | 200  |
            | USER_BLOCKED        | Пользователь заблокирован в системе Mycellium / финансовые ограничения на кошельке в Mycellium. | 409  |
            | USER_TERRORIST      | Пользователь включен в перечень террористов и экстремистов.                                     | 409  |
            | USER_NOT_FOUND      | Пользователь не найден.                                                                         | 404  | 
            | USER_NOT_BOUND      | Пользователь не привязан к платформе.                                                           | 409  |
            | ID_NOT_UNIQUE       | Id операции не является уникальным и был использован ранее.                                     | 400  | 
            | FAILED              | Ошибка при валидации запроса.                                                                   | 400  |
            | INSUFFICIENT_FUNDS  | Недостаточно средств на кошельке партнера.                                                      | 409  | 
        code:
          type: integer
          format: int32
          description: |-
            Код ответа (совпадает с http статусом).

            Возможные значения:
            | code | Фатальность | Описание                                                                              |
            |------|-------------|---------------------------------------------------------------------------------------|
            | 200  | нет         | Статус по заявке передан в ответе.                                                    |
            | 400  | Да          | - Запрос не является валидным; - totalAmount не совпадает с суммой amount всех услуг. |
            | 404  | Да          | walletId (он же walletNumber) не найден.                                              |
            | 409  | Да          | Ошибка при проверке возможности payout на стороне Mycellium.                          |
            | 500  | Да          | Что-то пошло не так.                                                                  |
