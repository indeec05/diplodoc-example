openapi: 3.0.1
x-stoplight:
  id: zga4nfu02mpxz
info:
  title: API
  description: |-
    API (он же gateway-service).


    Используется партнерами W1 для следующих операций с кошельками:
    - регистрация новых кошельков;
    - получение информации по клиенту (баланс, статус и т.д.);
    - финансовые операции с кошельками пользователей системы;
    - аутентификация запросов партнера.
  version: 1.1.8
servers:
  - url: 'http://10.202.37.1:95'
    description: Generated server url
tags:
  - name: Actuator
    description: Monitor and interact
    externalDocs:
      description: Spring Boot Actuator Web API Documentation
      url: 'https://docs.spring.io/spring-boot/docs/current/actuator-api/html/'
paths:
  /wallet:
    post:
      tags:
        - Управление кошельками пользователей
      operationId: registerWallet
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterWalletDTO'
            examples:
              Регистрация по email:
                value:
                  email: test@test.com
                  externalId: 1ce83613-2e0c-4cee-8648-4d218c9ff185
              Регистрация по phone:
                value:
                  externalId: d98194d7-e465-44d9-8b29-d8ecbac0b76a
                  phone: '857522527202'
              Регистрация по email и phone:
                value:
                  email: test@test.com
                  externalId: ea022e25-cf7a-4787-9523-5687a5bdf8c5
                  phone: '893714065879'
              Некорректная регистрация без email и phone:
                value:
                  externalId: 6bee5e8b-1835-4953-b922-311c475fb781
              Невалидный email:
                value:
                  email: '@gmail.com'
                  externalId: e7adda3f-2e32-460b-8638-ef788d46ccff
              Невалидный phone:
                value:
                  externalId: 57f961ab-c76a-42e3-b40c-616955900e97
                  phone: '1234567890123'
        required: true
      responses:
        '200':
          description: |-
            В случае успешного запроса, партнер получает номер кошелька пользователя - walletNumber
            (уникальный в системе Mycellium). 
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/RegisterWalletResultDTO'
              examples:
                Успех:
                  value:
                    registerUserResult:
                      walletNumber: 739785354051
        '400':
          description: |-
            Status code 400

            Возвращается в случаях:
            - Не передаем поля phone и email;
            - Невалидный email в request;
            - Невалидный phone в request;
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ApiError'
              examples:
                'Ответ, если не передали поля phone и email в request':
                  value:
                    code: 5
                    description: One of two fields email or phone must be filled
                    fieldErrors: null
                'Ответ, если передали невалидный email':
                  value:
                    code: 5
                    description: Validation Failed
                    fieldErrors:
                      - objectName: registerWalletDTO
                        field: email
                        message: must be a well-formed email address
                'Ответ, если передали невалидный phone':
                  value:
                    code: 5
                    description: Validation Failed
                    fieldErrors:
                      - objectName: registerWalletDTO
                        field: phone
                        message: 'must match "^[0-9]{9,12}$"'
        '403':
          description: |-
            Status code 403

            (Ответ, когда request без заголовка PartnerId)
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ApiError'
      x-stoplight:
        id: xdqza2o2sm4wt
      description: |-
        Метод для создания нового Кошелька Пользователя Партнером. 

        Для регистрации Партнер передает контактные данные пользователя (email или phone) и уникальный идентификатор из своей системы (externalId). 


        Партнер сохраняет на своей стороне полученный номер кошельк (walletNumber), для дальнейших операций с ним.

        В случае если Кошелек с таким внешним идентификатором уже создавался ранее – вернется walletNumber уже созданного ранее кошелька.

        walletNumber - 12 значное число
      summary: POST Wallet
      x-internal: false
      parameters:
        - schema:
            type: string
          in: header
          name: partnerId
          description: Id партнера в системе Mycellium
          required: true
          example: 5f3e7c0d3ce95460554827cf
        - schema:
            type: string
          in: header
          name: Timestamp
          description: Временная метка формирования request
          required: true
          example: '2024-06-04T06:51:02'
        - schema:
            type: string
          in: header
          name: Signature
          description: Подпись
          required: true
          example: 
  '/users/{walletNumber}/update-contacts-info':
    put:
      tags:
        - Управление кошельками пользователей
      operationId: updateContactsInfo
      parameters:
        - name: walletNumber
          in: path
          required: true
          schema:
            type: string
        - schema:
            type: string
          in: header
          name: partnerId
          description: Id партнера в системе Mycellium
          required: true
          example: 5f3e7c0d3ce95460554827cf
        - schema:
            type: string
          in: header
          name: Timestamp
          description: Временная метка формирования request
          required: true
          example: '2024-06-04T06:51:02'
        - schema:
            type: string
          in: header
          name: Signature
          description: Подпись
          required: true
          example: 
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateWalletDTO'
            examples:
              Обновление телефона:
                value:
                  phone: '121539691566'
              Передаем невалидный email:
                value:
                  email: mail@mail@com
              Передаем невалидный phone:
                value:
                  phone: '12345678'
        required: true
      responses:
        '200':
          description: Status code 200
          content:
            '*/*':
              schema:
                type: object
              examples:
                Передаем не валидный email:
                  value:
                    code: 5
                    description: Validation Failed
                    fieldErrors:
                      - objectName: updateWalletDTO
                        field: email
                        message: must be a well-formed email address
                Передаем невалидный phone:
                  value:
                    code: 5
                    description: Validation Failed
                    fieldErrors:
                      - objectName: updateWalletDTO
                        field: phone
                        message: 'must match "^[0-9]{9,12}$"'
        '400':
          description: |-
            Status code 400

            Возвращается, когда:
            - Не передаем поля phone и email
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ApiError'
              examples:
                Не передаем поля phone и email:
                  value:
                    code: 5
                    description: 'At least one of email or phone must be provided for wallet account[777153066233]'
                    fieldErrors: null
        '403':
          description: |-
            Status code 403

            Возвращается, когда:
            - Не передаем PartnerId в заголовке
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ApiError'
        '500':
          description: |-
            Status code 500

            Возвращается, когда:
            - пытаемся отредактировать несуществующего пользователя
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/BindUserResponseDTO'
              examples:
                Редактирование несуществующего пользователя:
                  value:
                    timestamp: '2024-06-04T16:29:46.383+0000'
                    status: 500
                    error: Internal Server Error
                    message: 'User[404] not found'
                    path: /users/404/update-contacts-info
      x-stoplight:
        id: f44xapynaq1u1
      summary: PUT Wallet
      description: |-
        Обновление персональных данных владельца кошелька.

        Можно изменить email и/или phone пользователя.
