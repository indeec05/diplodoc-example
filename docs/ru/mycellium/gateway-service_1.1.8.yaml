                    fieldErrors: null
                Запрос с невалидной комиссией:
                  value:
                    code: 1
                    description: 'Payout commission not valid, operationId(672505b8964c093cfbb3fe42), payoutCommission(15157.00)'
                    fieldErrors: null
                Комиссия превышает сумму выплаты / средств недостаточно для оплаты комиссии:
                  value:
                    code: 1
                    description: 'Payout commission not valid, operationId(672505dbded6aa59563af00a), payoutCommission(15000.00)'
                    fieldErrors: null
                Кошелек с walletNumber=123456789 не найден:
                  value:
                    code: 1
                    description: 'Required dependency UserDTO[123456789] not found'
                    fieldErrors: null
                'В запросе указан currencyId, отличный от 643':
                  value:
                    timestamp: '2024-11-06T06:57:55.582+0000'
                    status: 500
                    error: Internal Server Error
                    message: Only 'ru' currency code is allowed
