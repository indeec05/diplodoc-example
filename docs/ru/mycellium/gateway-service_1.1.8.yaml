            На данный момент рассчитывается по формуле Amount + Overdraft
        safeAmount:
          type: number
          description: 'Сумма средств баланса, ограниченная для вывода во внешние системы'
        kycLevel:
          type: integer
          format: int32
          description: |-
            Уровень идентификации пользователя по данной валюте

            Значение | Пояснение
            ---------|---------
             0 | не идентифицирован (анонимный кошелек)
             5 | проведена упрощенная идентификация (ручной УПРИД / ФНС / ЕСИА)
             10 | проведена полная идентификация (ФУЛЛ/Full)
        kycRequestStateId:
          type: string
          enum:
            - ACCEPTED
            - CANCELED
            - ERROR
            - EXPIRED
            - PROCESSING
            - WAITING
          description: |-
            Статус активной заявки на ИД

            |                    Статус                    | Ручной УПРИД |  ФНС/ЕСИА  | Фулл ИД    |
            |:--------------------------------------------:|:-----------------------:|:----------:|------------|
            | Отсутствует заявка на ИД                     | WAITING                 | *          | *          |
            | Создана новая заявка на ИД **                | CREATED                 | CREATED    | CREATED    |
            | Заявка в работе                              | PROCESSING              | PROCESSING | PROCESSING |
            | Заявка одобрена                              | ACCEPTED                | ACCEPTED   | ACCEPTED   |
            | Заявка отклонена / Данные не прошли проверку | CANCELED                | ERROR      | CANCELED   |
            | ИД сброшена / Персональные данные изменены и не акутальны  | EXPIRED                 | EXPIRED    | EXPIRED    |

            `*` - не может быть такого кейса для данного уровня ИД. (чтобы кошелек стал УПРИД/ФУЛЛ должна быть хоть одна заявка на ИД)

            `**` - после создания новой заявки, она переходит автоматически в PROCESSING
