                <script type="application/javascript">
                   window.STATIC_CONTENT = false
                   window.__DATA__ = {"data":{"meta":{"metadata":[{"name":"generator","content":"Diplodoc Platform v4.57.7"}],"style":["_assets/cut-extension.css"],"script":["_assets/cut-extension.js"]},"assets":[],"headings":[{"title":"Sections","href":"docs/ru/mycellium/gateway/index.html#sections","level":2},{"title":"Specification","href":"docs/ru/mycellium/gateway/index.html#specification","level":2}],"title":"API","includes":[],"html":"<p><samp>version: 1.1.8</samp></p>\n<p>API (он же gateway-service).</p>\n<p>Используется партнерами W1 для следующих операций с кошельками:</p>\n<ul>\n<li>регистрация новых кошельков;</li>\n<li>получение информации по клиенту (баланс, статус и т.д.);</li>\n<li>финансовые операции с кошельками пользователей системы;</li>\n<li>аутентификация запросов партнера.</li>\n</ul>\n<h2 id=\"sections\"><a href=\"docs/ru/mycellium/gateway/index.html#sections\" class=\"yfm-anchor\" aria-hidden=\"true\"><span class=\"visually-hidden\" data-no-index=\"true\">Sections</span></a>Sections</h2>\n<ul>\n<li><a href=\"docs/ru/mycellium/gateway/Actuator/index.html\">Actuator</a></li>\n<li><a href=\"docs/ru/mycellium/gateway/Upravlenie-koshelkami-polzovatelej/index.html\">Управление кошельками пользователей</a></li>\n<li><a href=\"docs/ru/mycellium/gateway/Finansovye-operacii/index.html\">Финансовые операции</a></li>\n<li><a href=\"docs/ru/mycellium/gateway/Statistika-po-koshelku/index.html\">Статистика по кошельку</a></li>\n<li><a href=\"docs/ru/mycellium/gateway/Vzaimodejstvie-s-koshelkami-Samozanyatyh/index.html\">Взаимодействие с кошельками Самозанятых</a></li>\n<li><a href=\"docs/ru/mycellium/gateway/Donaty/index.html\">Донаты</a></li>\n<li><a href=\"docs/ru/mycellium/gateway/internal-controller/index.html\">internal-controller</a></li>\n</ul>\n<h2 id=\"specification\"><a href=\"docs/ru/mycellium/gateway/index.html#specification\" class=\"yfm-anchor\" aria-hidden=\"true\"><span class=\"visually-hidden\" data-no-index=\"true\">Specification</span></a>Specification</h2>\n<details class=\"yfm-cut\"><summary class=\"yfm-cut-title\">Open API</summary><div class=\"yfm-cut-content\">\n    <div class=\"yfm-clipboard\">\n        <pre><code class=\"hljs text\">{\n    \"openapi\": \"3.0.1\",\n    \"x-stoplight\": {\n        \"id\": \"zga4nfu02mpxz\"\n    },\n    \"info\": {\n        \"title\": \"API\",\n        \"description\": \"API (он же gateway-service).\\n\\n\\nИспользуется партнерами W1 для следующих операций с кошельками:\\n- регистрация новых кошельков;\\n- получение информации по клиенту (баланс, статус и т.д.);\\n- финансовые операции с кошельками пользователей системы;\\n- аутентификация запросов партнера.\",\n        \"version\": \"1.1.8\"\n    },\n    \"servers\": [\n        {\n            \"url\": \"http://10.202.37.1:95\",\n            \"description\": \"Generated server url\"\n        }\n    ],\n    \"tags\": [\n        {\n            \"name\": \"Actuator\",\n            \"description\": \"Monitor and interact\",\n            \"externalDocs\": {\n                \"description\": \"Spring Boot Actuator Web API Documentation\",\n                \"url\": \"https://docs.spring.io/spring-boot/docs/current/actuator-api/html/\"\n            }\n        }\n    ],\n    \"paths\": {\n        \"/wallet\": {\n            \"post\": {\n                \"tags\": [\n                    \"Управление кошельками пользователей\"\n                ],\n                \"operationId\": \"registerWallet\",\n                \"requestBody\": {\n                    \"content\": {\n                        \"application/json\": {\n                            \"schema\": {\n                                \"type\": \"object\",\n                                \"x-stoplight\": {\n                                    \"id\": \"m4bp1k4fb06of\"\n                                },\n                                \"properties\": {\n                                    \"externalId\": {\n                                        \"type\": \"string\",\n                                        \"description\": \"Уникальный id кошелька на стороне Партнера\"\n                                    },\n                                    \"email\": {\n                                        \"type\": \"string\",\n                                        \"description\": \"email пользователя\"\n                                    },\n                                    \"phone\": {\n                                        \"pattern\": \"^[0-9]{9,12}$\",\n                                        \"type\": \"string\",\n                                        \"description\": \"Номер телефона пользователя (без \\\"+\\\", в формате 79*********)\"\n                                    }\n                                }\n                            },\n                            \"examples\": {\n                                \"Регистрация по email\": {\n                                    \"value\": {\n                                        \"email\": \"test@test.com\",\n                                        \"externalId\": \"1ce83613-2e0c-4cee-8648-4d218c9ff185\"\n                                    }\n                                },\n                                \"Регистрация по phone\": {\n                                    \"value\": {\n                                        \"externalId\": \"d98194d7-e465-44d9-8b29-d8ecbac0b76a\",\n                                        \"phone\": \"857522527202\"\n                                    }\n                                },\n                                \"Регистрация по email и phone\": {\n                                    \"value\": {\n                                        \"email\": \"test@test.com\",\n                                        \"externalId\": \"ea022e25-cf7a-4787-9523-5687a5bdf8c5\",\n                                        \"phone\": \"893714065879\"\n                                    }\n                                },\n                                \"Некорректная регистрация без email и phone\": {\n                                    \"value\": {\n                                        \"externalId\": \"6bee5e8b-1835-4953-b922-311c475fb781\"\n                                    }\n                                },\n                                \"Невалидный email\": {\n                                    \"value\": {\n                                        \"email\": \"@gmail.com\",\n                                        \"externalId\": \"e7adda3f-2e32-460b-8638-ef788d46ccff\"\n                                    }\n                                },\n                                \"Невалидный phone\": {\n                                    \"value\": {\n                                        \"externalId\": \"57f961ab-c76a-42e3-b40c-616955900e97\",\n                                        \"phone\": \"1234567890123\"\n                                    }\n                                }\n                            }\n                        }\n                    },\n                    \"required\": true\n                },\n                \"responses\": {\n                    \"200\": {\n                        \"description\": \"В случае успешного запроса, партнер получает номер кошелька пользователя - walletNumber\\n(уникальный в системе Mycellium). \",\n                        \"content\": {\n                            \"*/*\": {\n                                \"schema\": {\n                                    \"type\": \"object\",\n                                    \"x-stoplight\": {\n                                        \"id\": \"91he2l89psm4f\"\n                                    },\n                                    \"properties\": {\n                                        \"registerUserResult\": {\n                                            \"type\": \"object\",\n                                            \"x-stoplight\": {\n bb8g10n6s07\"\n                                    },\n                                    \"properties\": {\n                                        \"code\": {\n                                            \"type\": \"integer\",\n                                            \"format\": \"int32\",\n                                            \"description\": \"Код ошибки\"\n                                        },\n                                        \"description\": {\n                                            \"type\": \"string\",\n                                            \"description\": \"Пояснение\"\n                                        },\n                                        \"fieldErrors\": {\n                                            \"type\": \"array\",\n                                            \"items\": {\n                                                \"type\": \"object\",\n                                                \"x-stoplight\": {\n                                                    \"id\": \"50bfnejxsv8lo\"\n                                                },\n                                                \"properties\": {\n                                                    \"objectName\": {\n                                                        \"type\": \"string\",\n                                                        \"description\": \"Объект\"\n                                                    },\n                                                    \"field\": {\n                                                        \"type\": \"string\",\n                                                        \"description\": \"Поле\"\n                                                    },\n                                                    \"message\": {\n                                                        \"type\": \"string\",\n                                                        \"description\": \"Сообщение\"\n                                                    }\n                                                },\n                                                \"description\": \"\",\n                                                \"title\": \"\"\n                                            }\n                                        }\n                                    }\n                                },\n                                \"examples\": {\n                                    \"Ответ, если не передали поля phone и email в request\": {\n                                        \"value\": {\n                                            \"code\": 5,\n                                            \"description\": \"One of two fields email or phone must be filled\",\n                                            \"fieldErrors\": null\n                                        }\n                                    },\n                                    \"Ответ, если передали невалидный email\": {\n                                        \"value\": {\n                                            \"code\": 5,\n                                            \"description\": \"Validation Failed\",\n                                            \"fieldErrors\": [\n                                                {\n                                                    \"objectName\": \"registerWalletDTO\",\n                                                    \"field\": \"email\",\n                                                    \"message\": \"must be a well-formed email address\"\n                                                }\n                                            ]\n                                        }\n                                    },\n                                    \"Ответ, если передали невалидный phone\": {\n                                        \"value\": {\n                                            \"code\": 5,\n                                            \"description\": \"Validation Failed\",\n                                            \"fieldErrors\": [\n                                                {\n                                                    \"objectName\": \"registerWalletDTO\",\n                                                    \"field\": \"phone\",\n                                                    \"message\": \"must match \\\"^[0-9]{9,12}$\\\"\"\n                                                }\n                                            ]\n                                        }\n                                    }\n                                }\n                            }\n                        }\n                    },\n                    \"403\": {\n                        \"description\": \"Status code 403\\n\\n(Ответ, когда request без заголовка PartnerId)\",\n                        \"content\": {\n                            \"*/*\": {\n                                \"schema\": {\n                                    \"type\": \"object\",\n                                    \"x-stoplight\": {\n                                        \"id\": \"mdbb8g10n6s07\"\n                                    },\n                                    \"properties\": {\n                                        \"code\": {\n                                            \"type\": \"integer\",\n                                            \"format\": \"int32\",\n                                            \"description\": \"Код ошибки\"\n                                        },\n                                        \"description\": {\n                                            \"type\": \"string\",\n                                            \"description\": \"Пояснение\"\n                                        },\n                                        \"fieldErrors\": {\n                                            \"type\": \"array\",\n                                            \"items\": {\n                                                \"type\": \"object\",\n                                                \"x-stoplight\": {\n                                                    \"id\": \"50bfnejxsv8lo\"\n                                                },\n                                                \"properties\": {\n                                                    \"objectName\": {\n                                                        \"type\": \"string\",\n                                                        \"description\": \"Объект\"\n                                                    },\n                                                    \"field\": {\n                                                        \"type\": \"string\",\n                                                        \"description\": \"Поле\"\n                                                    },\n                                                    \"message\": {\n                                                        \"type\": \"string\",\n                                                        \"description\": \"Сообщение\"\n                                                    }\n                                                },\n                                                \"description\": \"\",\n                                                \"title\": \"\"\n                                            }\n                                        }\n                                    }\n                                }\n                            }\n                        }\n                    }\n                },\n                \"x-stoplight\": {\n                    \"id\": \"xdqza2o2sm4wt\"\n                },\n                \"description\": \"Метод для создания нового Кошелька Пользователя Партнером. \\n\\nДля регистрации Партнер передает контактные данные пользователя (email или phone) и уникальный идентификатор из своей системы (externalId). \\n\\n\\nПартнер сохраняет на своей стороне полученный номер кошельк (walletNumber), для дальнейших операций с ним.\\n\\nВ случае если Кошелек с таким внешним идентификатором уже создавался ранее – вернется walletNumber уже созданного ранее кошелька.\\n\\nwalletNumber - 12 значное число\",\n                \"summary\": \"POST Wallet\",\n                \"x-internal\": false,\n                \"parameters\": [\n                    {\n                        \"schema\": {\n                            \"type\": \"string\"\n                        },\n                        \"in\": \"header\",\n                        \"name\": \"partnerId\",\n                        \"description\": \"Id партнера в системе Mycellium\",\n                        \"required\": true,\n                        \"example\": \"5f3e7c0d3ce95460554827cf\"\n                    },\n                    {\n                        \"schema\": {\n                            \"type\": \"string\"\n                        },\n                        \"in\": \"header\",\n                        \"name\": \"Timestamp\",\n                        \"description\": \"Временная метка формирования request\",\n                        \"required\": true,\n                        \"example\": \"2024-06-04T06:51:02\"\n                    },\n                    {\n                        \"schema\": {\n                            \"type\": \"string\"\n                        },\n                        \"in\": \"header\",\n                        \"name\": \"Signature\",\n                        \"description\": \"Подпись\",\n                        \"required\": true,\n                        \"example\": \"A9ThC1zz6opUq4705avgV0tf1IXwn2ap5lbb0E2Nke3IgKVp+A4aKwds/G7N8VsjXM2t7WSl7B5vFtH4sjnfJZK8l6JB3VyV9PrSAS6qC7/Jwl1JkZdRyf1UdxFGvzZnJijtd3B589kzjfZQqsqws96V9ABFFffmSNYt0ooWfguj0w1CoT3IKRIfAqUGETfMbGFl9ozUsTCfo3O43ZjjL8AgrJikOYSUg0D6gFwbojhqo9n0sPcdP1MeonWScoJsxeK+KXcWhWfmtop8G80wrrlIBkjiaAylhMec3uBdtE7+qaTEr1S6r+KjzvjsjtuvLyh5MtQRdCcuJHt7IABTgw==\"\n                    }\n                ]\n            }\n        },\n        \"/users/{walletNumber}/update-contacts-info\": {\n            \"put\": {\n                \"tags\": [\n                    \"Управление кошельками пользователей\"\n                ],\n                \"operationId\": \"updateContactsInfo\",\n                \"parameters\": [\n                    {\n                        \"name\": \"walletNumber\",\n                        \"in\": \"path\",\n                        \"required\": true,\n                        \"schema\": {\n                            \"type\": \"string\"\n                        }\n                    },\n                    {\n                        \"schema\": {\n                            \"type\": \"string\"\n                        },\n                        \"in\": \"header\",\n                        \"name\": \"partnerId\",\n                        \"description\": \"Id партнера в системе Mycellium\",\n                        \"required\": true,\n                        \"example\": \"5f3e7c0d3ce95460554827cf\"\n                    },\n                    {\n                        \"schema\": {\n                            \"type\": \"string\"\n                        },\n                        \"in\": \"header\",\n                        \"name\": \"Timestamp\",\n                        \"description\": \"Временная метка формирования request\",\n                        \"required\": true,\n                        \"example\": \"2024-06-04T06:51:02\"\n                    },\n                    {\n                        \"schema\": {\n                            \"type\": \"string\"\n                        },\n                        \"in\": \"header\",\n                        \"name\": \"Signature\",\n                        \"description\": \"Подпись\",\n                        \"required\": true,\n                        \"example\": \"A                },\n                                \"Передаем невалидный phone\": {\n                                    \"value\": {\n                                        \"phone\": \"12345678\"\n                                    }\n                                }\n                            }\n                        }\n                    },\n                    \"required\": true\n                },\n                \"responses\": {\n                    \"200\": {\n                        \"description\": \"Status code 200\",\n                        \"content\": {\n                            \"*/*\": {\n                                \"schema\": {\n                                    \"type\": \"object\"\n                                },\n                                \"examples\": {\n                                    \"Передаем не валидный email\": {\n                                        \"value\": {\n                                            \"code\": 5,\n                                            \"description\": \"Validation Failed\",\n                                            \"fieldErrors\": [\n                                                {\n                                                    \"objectName\": \"updateWalletDTO\",\n                                                    \"field\": \"email\",\n                                                    \"message\": \"must be a well-formed email address\"\n                                                }\n                                            ]\n                                        }\n                                    },\n                                    \"Передаем невалидный phone\": {\n                                        \"value\": {\n                                            \"code\": 5,\n                                            \"description\": \"Validation Failed\",\n                                            \"fieldErrors\": [\n                                                {\n                                                    \"objectName\": \"updateWalletDTO\",\n                                                    \"field\": \"phone\",\n                                                    \"message\": \"must match \\\"^[0-9]{9,12}$\\\"\"\n                                                }\n                                            ]\n                                        }\n                                    }\n                                }\n                            }\n                        }\n                    },\n                    \"400\": {\n                        \"description\": \"Status code 400\\n\\nВозвращается, когда:\\n- Не передаем поля phone и email\",\n                        \"content\": {\n                            \"*/*\": {\n                                \"schema\": {\n                                    \"type\": \"object\",\n                                    \"x-stoplight\": {\n                                        \"id\": \"mdbb8g10n6s07\"\n                                    },\n                                    \"properties\": {\n                                        \"code\": {\n                                            \"type\": \"integer\",\n                                            \"format\": \"int32\",\n                                            \"description\": \"Код ошибки\"\n                                        },\n                                        \"description\": {\n                                            \"type\": \"string\",\n                                            \"description\": \"Пояснение\"\n                                        },\n                                        \"fieldErrors\": {\n                                            \"type\": \"array\",\n                                            \"items\": {\n                                                \"type\": \"object\",\n                    }\n                            }\n                        }\n                    },\n                    \"403\": {\n                        \"description\": \"Status code 403\\n\\nВозвращается, когда:\\n- Не передаем PartnerId в заголовке\",\n                        \"content\": {\n                            \"*/*\": {\n                                \"schema\": {\n                                    \"type\": \"object\",\n                                    \"x-stoplight\": {\n                                        \"id\": \"mdbb8g10n6s07\"\n                                    },\n                                    \"properties\": {\n                                        \"code\": {\n                                            \"type\": \"integer\",\n                                            \"format\": \"int32\",\n                                            \"description\": \"Код ошибки\"\n                                        },\n                                        \"description\": {\n                                            \"type\": \"string\",\n                                            \"description\": \"Пояснение\"\n                                        },\n                                        \"fieldErrors\": {\n                                            \"type\": \"array\",\n                                            \"items\": {\n                                                \"type\": \"object\",\n                                                \"x-stoplight\": {\n                                                    \"id\": \"50bfnejxsv8lo\"\n                                                },\n                                                \"properties\": {\n                                                    \"objectName\": {\n                                                        \"type\": \"string\",\n                                                        \"description\": \"Объект\"\n
