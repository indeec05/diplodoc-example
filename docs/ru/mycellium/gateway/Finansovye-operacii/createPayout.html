я данной операции.</p>\n<p>Пояснение: Комиссия является расходной операцией и влияет на <a href=\"https://w1.stoplight.io/docs/mycellium-api/branches/main/01ulyh6dh0tva-obshhie-svedeniya#%D0%BB%D0%B8%D0%BC%D0%B8%D1%82\" target=\"_blank\" rel=\"noreferrer noopener\">лимит</a> кошелька Пользователя.</p>\n<p>Payout с комиссией не проходит, если сумма комиссии не укладывается в <a href=\"https://w1.stoplight.io/docs/mycellium-api/branches/main/01ulyh6dh0tva-obshhie-svedeniya#%D0%BB%D0%B8%D0%BC%D0%B8%D1%82\" target=\"_blank\" rel=\"noreferrer noopener\">лимит</a> кошелька за день/месяц (в ответ вернется 500 ошибка).</p>\n<p>Комиссия может быть больше payout, но не может быть больше основного счета Пользователя. Если комиссия больше основного счета - в ответ, так же, вернется 500 ошибка.</p>\n<h2 id=\"request\"><a href=\"docs/ru/mycellium/gateway/Finansovye-operacii/createPayout.html#request\" class=\"yfm-anchor\" aria-hidden=\"true\"><span class=\"visually-hidden\" data-no-index=\"true\">Request</span></a>Request</h2>\n<div class=\"openapi__requests\">\n<div class=\"openapi__request__wrapper\" style=\"--method:var(--dc-openapi-methods-post);margin-bottom:12px\">\n<div class=\"openapi__request\">\n<p class=\"openapi__method\">POST</p>\n\n    <div class=\"yfm-clipboard\">\n        <pre><code class=\"hljs text\">http://10.202.37.1:95/payout\n</code></pre>\n\n        <button class=\"yfm-clipboard-button\">\n            <svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"25\">\n                <path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"></path>\n                <path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\">\n                    <animate id=\"visibileAnimation-25\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freez роцент от суммы выплаты* <code>|</code><br />\n<code>|</code> <strong>FIXED</strong> <code>|</code>  Фиксированная сумма списания**<code>|</code><br />\n<code>|</code> <strong>PERCENT_MIN</strong> <code>|</code> Комиссия формируется из процента от суммы, если его значение превышает минимальное значение комиссии. Если полученная сумма не превышает указанное минимальное значение, то комиссией будет само минимальное значение.*** <code>|</code><br />\n<code>|</code> <strong>PERCENT_AND_FIXED</strong> <code>|</code>  Процент от суммы выплаты: фиксированная сумма процента \"<strong>value</strong>\" + фиксированная сумма списания \"<strong>fixValue</strong>\"*** <code>|</code></p>\n<p>*- В этом случае, нахождение параметра \"<strong>value</strong>\" внутри <strong>commission</strong> обязательное</p>\n<p>**- В этом случае, нахождение параметра \"<strong>fixValue</strong>\" внутри <strong>commission</strong> обязательное</p>\n<p>*** - В этом случае, нахождение параметров \"<strong>value</strong>\" и \"<strong>fixValue</strong>\" внутри <strong>commission</strong> обязательное</p>\n<p><em class=\"openapi-description-annotation\">Enum:</em> <code>PERCENT</code>, <code>FIXED</code>, <code>PERCENT_MIN</code>, <code>PERCENT_AND_FIXED</code></p>\n</td>\n</tr>\n<tr>\n<td class=\"openapi-table-parameter-name\">\n<p>value</p>\n</td>\n<td>\n<p><strong>Type:</strong> number&lt;float&gt;</p>\n<p>Значение комисии в процентах</p>\n<p><em class=\"openapi-description-annotation\">Example:</em> <code>19.05</code></p>\n</td>\n</tr>\n</tbody>\n</table>\n</div>\n<h2 id=\"responses\"><a href=\"docs/ru/mycellium/gateway/Finansovye-operacii/createPayout.html#responses\" class=\"yfm-anchor\" aria-hidden=\"true\"><span class=\"visually-hidden\" data-no-index=\"true\">Responses</span></a>Responses</h2>\n<div class=\"openapi__response__code__200\">\n<h2 id=\"200-ok\"><a href=\"docs/ru/mycellium/gateway/Finansovye-operacii/createPayout.html#200-ok\" class=\"yfm-anchor\" aria-hidden=\"true\"><span clas
