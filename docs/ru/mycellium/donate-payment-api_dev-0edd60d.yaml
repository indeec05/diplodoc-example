      x-stoplight:
        id: 6rr4jqogyk2zx
      summary: GET bySignature
      description: |-
        Метод для формирования Signature партнером, для перенаправления пользователя на платежные страницы для совершения доната.
        (После формирования Signature и совершения доната пользователь возможен опрос статуса доната по callbackId, сгенерированному партнером, через метод [GET Donation CallbackId](https://w1.stoplight.io/docs/mycellium-api/04943a5985142-get-donate-callback-id))

        Список параметров на подпись, передаваемых партнером:
        sign=BASE64(SignatureMethod(UTF8(URL)))


        где:


        BASE64 | Функция преобразования бинарных данных (массива байт) к BASE64 строке 
        ---------|----------
         SignatureMethod | Криптографическая функция используемая для вычисления ЭЦП (метод подписи ключа Партнера SHA1withRSA) 
         UTF8 | Функция, которая преобразовывает строку к кодировке UTF8 и возвращает массив байт 
         URL | Url-адрес, на который направляется запрос `*`

        `*` - Параметры, передаваемые в URL:


        |  НАЗВАНИЕ ПАРАМЕТРА | ТИП ДАННЫХ |                                                               ОПИСАНИЕ                                                              |
        |-------------------:|:----------:|:-----------------------------------------------------------------------------------------------------------------------------------|
        | **externalUserId**      | String     | id донатера                                                                                                                         |
        | **callbackId**          | String     | Номер операции, по которому возможен будет опрос статуса в gateway, по которому будет колбек в сторону партнера                     |
        | **contentId**           | String     | Id трансляции                                                                                                                       |
        | **date**                | DateTime   | Время создания запроса по UTC. Может быть в пределах +- 10 минут (Время создания запроса по UTC. Может быть в пределах +- 10 минут) |
        | **donateWalletNumber**  | Long       | Кошелек блогера (получателя доната)                                                                                                 |
        | **eventType**  | String       | Тип доната  `**`  (поле CASE-INSENSITIVE, т.е. не чувствительно к регистру)                                                                                           |
        | **nicknameUser**        | String     | Никнейм отправителя доната                                                                                                          |
        | **nicknameWalletOwner**        | String     | Никнейм блогера (получателя доната)                                                                                                         |
        | **partnerId**           | String     | Идентификатор партнера                                                                                                              |
        | **redirectto**          | String     | Адрес назначения для пользователя, кодированный в UrlEncode                                                                         |


        `**` - возможные значения **eventType**:

        - none
        - channel
        - stream
