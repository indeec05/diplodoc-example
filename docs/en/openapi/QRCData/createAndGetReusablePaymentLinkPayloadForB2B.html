ired\">*</span></p>\n</td>\n<td>\n<p><strong>Type:</strong> boolean</p>\n<p>Информация о взимании НДС. Допустимые значения:</p>\n<ul>\n<li>true – облагается НДС;</li>\n<li>false – не облагается НДС;</li>\n</ul>\n<p><em class=\"openapi-description-annotation\">Example:</em></p>\n<p><em class=\"openapi-description-annotation\">Enum:</em> <code>true</code>, <code>false</code></p>\n</td>\n</tr>\n<tr>\n<td class=\"openapi-table-parameter-name\">\n<p>amount</p>\n</td>\n<td>\n<p><strong>Type:</strong> string</p>\n<p>Сумма Операции СБП C2B в копейках. Целое, положительное число. Валюта Операции СБП - рубли РФ.</p>\n<p><em class=\"openapi-description-annotation\">Example:</em> <code>100000</code></p>\n<p><em class=\"openapi-description-annotation\">Min length:</em> <code>1</code></p>\n<p><em class=\"openapi-description-annotation\">Max length:</em> <code>12</code></p>\n</td>\n</tr>\n<tr>\n<td class=\"openapi-table-parameter-name\">\n<p>fraudScore</p>\n</td>\n<td>\n<p><strong>Type:</strong> string</p>\n<p>Индикатор Подозрительной Операции Агента ТСП</p>\n<p><em class=\"openapi-description-annotation\">Example:</em> <code>0000000000000000</code></p>\n<p><em class=\"openapi-description-annotation\">Min length:</em> <code>16</code></p>\n<p><em class=\"openapi-description-annotation\">Max length:</em> <code>16</code></p>\n</td>\n</tr>\n<tr>\n<td class=\"openapi-table-parameter-name\">\n<p>paymentPurpose</p>\n</td>\n<td>\n<p><strong>Type:</strong> string</p>\n<p>Назначение платежа</p>\n<p><em class=\"openapi-description-annotation\">Example:</em> <code>оплата по договору №123456789 от 01.09.2001</code></p>\n<p><em class=\"openapi-description-annotation\">Max length:</em> <code>210</code></p>\n</td>\n</tr>\n<tr>\n<td class=\"openapi-table-parameter-name\">\n<p>redirectUrl</p>\n</td>\n<td>\n<p><strong>Type:</strong> string</p>\n<p>Содержит ссылку для автоматического возврата Плательщика из приложения Банка в приложение или на сайт ТСП. Допускаются только символы в кодировке ASCII. Ф
