                <script type="application/javascript">
                   window.STATIC_CONTENT = false
                   window.__DATA__ = {"data":{"meta":{"metadata":[{"name":"generator","content":"Diplodoc Platform v4.57.7"}]},"assets":[],"headings":[{"title":"Endpoints","href":"docs/en/openapi/LegalEntity/index.html#endpoints","level":2}],"title":"LegalEntity","includes":[],"html":"<p>Методы API для регистрации в СБП Юридических лиц, Индивидуальных предпринимателей, самозанятых или Юридических лиц - нерезидентов. <span style=\"color:red\">Доступны только по сертификатам Агентов ТСП.</span></p>\n<p>Регистрация Юридических лиц (далее – ЮЛ), индивидуальных предпринимателей (далее - ИП), самозанятых или Юридических лиц-нерезидентов (далее ЮЛ-нерезидент) в ОПКЦ СБП состоит из двух последовательных запросов.</p>\n<ul>\n<li>Регистрация ЮЛ или ИП начинается с запроса метода \"Регистрация ЮЛ или ИП\". Регистрация самозанятого начинается с запроса метода \"Регистрация самозанятого\". Регистрация ЮЛ-нерезидента начинается с запроса метода \"Регистрация ЮЛ-нерезидента\". В испольуемых методах Агент ТСП передает информацию о ЮЛ,<br />\nИП, самозанятом или ЮЛ-нерезиденте соответственно. Если структура запроса корректная, ответ содержит Временный регистрационный номер в поле ticketId.</li>\n<li>Метод \"Запрос статуса регистрации ЮЛ, ИП, самозанятого или ЮЛ-нерезидента\" позволяет получить статус регистрации ЮЛ, ИП, самозанятого или ЮЛ-нерезидента по ранее выданному Временному<br />\nрегистрационному номеру. Ответ содержит статус регистрации ЮЛ, ИП, самозанятого и ЮЛ-нерезидента и информацию о ЮЛ и ИП, если структура запроса корректная и<br />\nданные ЮЛ или ИП, включая идентификатор ЮЛ или ИП, обновлены в ОПКЦ СБП к моменту получения запроса.<br />\nВ дальнейшем для зарегистрированного ЮЛ, ИП, самозанятого или ЮЛ-нерезидента можно получить его реквизиты, сделав запрос метода \"Запрос данных ЮЛ, ИП, самозанятого или ЮЛ-нерезидента\"<br />\nпо его идентификатору.</li>\n</ul>\n<h2 id=\"endpoints\"><a href=\"docs/en/openapi/LegalEntity/index.html#endpoints\" class=\"yfm-anchor\" aria-hidden=\"true\"><span class=\"visually-hidden\" data-no-index=\"true\">Endpoints</span></a>Endpoints</h2>\n<ul>\n<li><a href=\"docs/en/openapi/LegalEntity/createLegalEntity.html\">Регистрация ЮЛ или ИП</a></li>\n<li><a href=\"docs/en/openapi/LegalEntity/createSelfEmployee.html\">Регистрация самозанятого</a></li>\n<li><a href=\"docs/en/openapi/LegalEntity/createForeignLegalEntity.html\">Регистрация ЮЛ-нерезидента</a></li>\n<li><a href=\"docs/en/openapi/LegalEntity/getStatusLegalEntity.html\">Запрос статуса регистрации ЮЛ, ИП, самозанятого или ЮЛ-нерезидента (v1)</a></li>\n<li><a href=\"docs/en/openapi/LegalEntity/getStatusLegalEntityV2.html\">Запрос статуса регистрации ЮЛ, ИП, самозанятого или ЮЛ-нерезидента (v2)</a></li>\n<li><a href=\"docs/en/openapi/LegalEntity/updateLegalData.html\">Управление параметрами Клиента – ЮЛ, ИП или ЮЛ-нерезидента</a></li>\n<li><a href=\"docs/en/openapi/LegalEntity/getLegalDataV2.html\">Запрос данных ЮЛ, ИП, самозанятого или ЮЛ-нерезидента (расширенный)</a></li>\n<li><a href=\"docs/en/openapi/LegalEntity/getLegalData.html\">Запрос данных ЮЛ, ИП, самозанятого или ЮЛ-нерезидента</a></li>\n</ul>\n","leading":false},"router":{"pathname":"docs/en/openapi/LegalEntity/index","depth":5},"lang":"ru","langs":["ru"]};
