tr>\n<td class=\"openapi-table-parameter-name\">\n<p>mcc<span class=\"openapi__required\">*</span></p>\n</td>\n<td>\n<p><strong>Type:</strong> string</p>\n<p>MCC</p>\n<p><em class=\"openapi-description-annotation\">Example:</em> <code>4122</code></p>\n<p><em class=\"openapi-description-annotation\">Min length:</em> <code>4</code></p>\n<p><em class=\"openapi-description-annotation\">Max length:</em> <code>4</code></p>\n</td>\n</tr>\n<tr>\n<td class=\"openapi-table-parameter-name\">\n<p>memberId<span class=\"openapi__required\">*</span></p>\n</td>\n<td>\n<p><strong>Type:</strong> string</p>\n<p>Идентификатор Банка Получателя</p>\n<p><em class=\"openapi-description-annotation\">Example:</em> <code>100000000001</code></p>\n<p><em class=\"openapi-description-annotation\">Min length:</em> <code>12</code></p>\n<p><em class=\"openapi-description-annotation\">Max length:</em> <code>12</code></p>\n</td>\n</tr>\n<tr>\n<td class=\"openapi-table-parameter-name\">\n<p>merchantId<span class=\"openapi__required\">*</span></p>\n</td>\n<td>\n<p><strong>Type:</strong> string</p>\n<p>Идентификатор ТСП</p>\n<p><em class=\"openapi-description-annotation\">Example:</em> <code>MR1234567890</code></p>\n<p><em class=\"openapi-description-annotation\">Min length:</em> <code>12</code></p>\n<p><em class=\"openapi-description-annotation\">Max length:</em> <code>12</code></p>\n</td>\n</tr>\n<tr>\n<td class=\"openapi-table-parameter-name\">\n<p>qrcId<span class=\"openapi__required\">*</span></p>\n</td>\n<td>\n<p><strong>Type:</strong> string</p>\n<p>Идентификатор Платежной ссылки СБП</p>\n<p><em class=\"openapi-description-annotation\">Example:</em> <code>AR1000670LSS7DN18SJQDNP4B05KLJL2</code></p>\n<p><em class=\"openapi-description-annotation\">Min length:</em> <code>32</code></p>\n<p><em class=\"openapi-description-annotation\">Max length:</em> <code>32</code></p>\n</td>\n</tr>\n<tr>\n<td class=\"openapi-table-parameter-name\">\n<p>qrcType<span class=\"openapi__required\">*</span></p>\n</td>\n<td>\n<p><strong>Type:</strong> string</p>\n<p>Тип Функциональной ссылки СБП для B2B</p>\n<p><em class=\"openapi-description-annotation\">Example:</em> <code>02</code></p>\n</td>\n</tr>\n<tr>\n<td class=\"openapi-table-parameter-name\">\n<p>takeTax<span class=\"openapi__required\">*</span></p>\n</td>\n<td>\n<p><strong>Type:</strong> boolean</p>\n<p>Информация о взимании НДС. Допустимые значения:</p>\n<ul>\n<li>true – облагается НДС;</li>\n<li>false – не облагается НДС;</li>\n</ul>\n<p><em class=\"openapi-description-annotation\">Example:</em></p>\n<p><em class=\"openapi-description-annotation\">Enum:</em> <code>true</code>, <code>false</code></p>\n</td>\n</tr>\n<tr>\n<td class=\"openapi-table-parameter-name\">\n<p>amount</p>\n</td>\n<td>\n<p><strong>Type:</strong> string</p>\n<p>Сумма Операции СБП B2B в копейках. Целое, положительное число. Валюта Операции СБП - рубли РФ. Если поле отсутствует, то Плательщик должен указать сумму Операции СБП при составлении распоряжения на перевод по Операции СБП B2B для передачи значения Банком Плательщика в сообщении M05-pacs.008.001.07</p>\n<p><em class=\"openapi-description-annotation\">Example:</em> <code>100000</code></p>\n<p><em class=\"openapi-description-annotation\">Min length:</em> <code>1</code></p>\n<p><em class=\"openapi-description-annotation\">Max length:</em> <code>12</code></p>\n</td>\n</tr>\n<tr>\n<td class=\"openapi-table-parameter-name\">\n<p>fraudScore</p>\n</td>\n<td>\n<p><strong>Type:</strong> string</p>\n<p>Индикатор Подозрительной Операции Агента ТСП</p>\n<p><em class=\"openapi-description-annotation\">Example:</em> <code>0000000000000000</code></p>\n<p><em class=\"openapi-description-annotation\">Min length:</em> <code>16</code></p>\n<p><em class=\"openapi-description-annotation\">Max length:</em> <code>16</code></p>\n</td>\n</tr>\n<tr>\n<td class=\"openapi-table-parameter-name\">\n<p>paymentPurpose</p>\n</td>\n<td>\n<p><strong>Type:</strong> string</p>\n<p>Назначение платежа. Если поле отсутствует, то Плательщик должен указать назначение платежа при составлении распоряжения на перевод по Операции СБП B2B для передачи значения Банком Плательщика в сообщении M05-pacs.008.001.07</p>\n<p><em class=\"openapi-description-annotation\">Example:</em> <code>Оплата по договору №123456789 от 01.09.2001</code></p>\n<p><em class=\"openapi-description-annotation\">Max length:</em> <code>210</code></p>\n</td>\n</tr>\n<tr>\n<td class=\"openapi-table-parameter-name\">\n<p>redirectUrl</p>\n</td>\n<td>\n<p><strong>Type:</strong> string</p>\n<p>Содержит ссылку для автоматического возврата Плательщика из приложения Банка в приложение или на сайт ТСП. Обязателен, если значение параметра redirectUrl было указано при регистрации Функциональной ссылки СБП. Допускаются только символы в кодировке ASCII. Формат должен соответствовать спецификации RFC-3986.</p>\n<p><em class=\"openapi-description-annotation\">Example:</em> <code>https://exampletsp.io/qwertyui</code></p>\n<p><em class=\"openapi-description-annotation\">Max length:</em> <code>1024</code></p>\n</td>\n</tr>\n<tr>\n<td class=\"openapi-table-parameter-name\">\n<p>totalTaxAmount</p>\n</td>\n<td>\n<p><strong>Type:</strong> string</p>\n<p>Сумма НДС в копейках. Валюта НДС - рубли РФ.<br />\nЕсли поле \"totalTaxAmount\" отсутствует, а поле \"takeTax\"=true, то Плательщик должен указать сумму НДС по Операции СБП B2B при составлении распоряжения на перевод по Операции СБП B2B для передачи значения Банком Плательщика в сообщении M05-pacs.008.001.07</p>\n<p><em class=\"openapi-description-annotation\">Example:</em> <code>0</code></p>\n<p><em class=\"openapi-description-annotation\">Min length:</em> <code>1</code></p>\n<p><em class=\"openapi-description-annotation\">Max length:</em> <code>12</code></p>\n</td>\n</tr>\n<tr>\n<td class=\"openapi-table-parameter-name\">\n<p>uip</p>\n</td>\n<td>\n<p><strong>Type:</strong> string</p>\n<p>Уникальный Идентификатор Платежа, назначаемый Получателем</p>\n<p><em class=\"openapi-description-annotation\">Exam
